name: Deploy a producción

on:
  push:
    branches: [v2]
    paths-ignore:
      - 'android-nav/**'
      - 'remote-assist/**'
      - 'docs/**'
      - '*.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy en AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 18.217.231.167
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd /home/ubuntu/tuctucv2
            git pull origin v2
            sudo systemctl restart tuctuc
            sudo systemctl is-active tuctuc
