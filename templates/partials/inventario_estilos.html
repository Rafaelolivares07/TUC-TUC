  <style>

    .no-spinners::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    }

    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }

    .tab-btn {

      transition: background .2s, color .2s; white-space: nowrap;

    }

    .recosteo-alertas {

      display: flex;

      flex-wrap: wrap;

      justify-content: flex-end;

      align-items: center;

      gap: 4px;

      .recosteo-alertas { min-width: 0; width: 100%; justify-content: flex-start; padding-left: 28px; }

    }

    .toast {

      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);

      padding: 12px 24px; border-radius: 8px; color: white; font-weight: 600;

      z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none;

    }

    .toast.show { opacity: 1; }

    .toast-ok { background: #059669; }

    .toast-err { background: #dc2626; }
    .toast-warn { background: #d97706; }

    .ac-list {

      position: absolute; background: white; border: 1px solid #e5e7eb;

      border-radius: 8px; box-shadow: 0 4px 12px #0001;

      max-height: 220px; overflow-y: auto; z-index: 100; width: 100%;

    }

    .ac-item { padding: 8px 12px; cursor: pointer; font-size: .85rem; }

    .ac-item:hover, .ac-item.ac-focus { background: #eef2ff; color: #4338ca; }

    .overlay {

      position: fixed; inset: 0; background: #000a;

      z-index: 50; display: flex; align-items: flex-start; justify-content: center;

      padding: 40px 16px; overflow-y: auto;

    }

    .modal {

    }
