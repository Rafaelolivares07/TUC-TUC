<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu compra - {{ tienda.nombre }}</title>
    <script src="/static/js/tailwind.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-gray-900">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col bg-white">
        <header class="border-b border-gray-100 px-5 py-5">
            <div class="flex items-center gap-3">
                {% if tienda.imagen_header %}
                <img src="{{ tienda.imagen_header }}" class="h-12 w-12 rounded-xl object-cover" alt="">
                {% endif %}
                <div class="min-w-0">
                    <p class="truncate text-sm font-semibold text-gray-500">{{ tienda.nombre }}</p>
                    <h1 class="text-xl font-black">Tu compra en caja</h1>
                </div>
            </div>
            <div id="estado" class="mt-4 rounded-xl bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700">
                Conectando con la caja...
            </div>
        </header>

        <section id="compra-vivo" class="flex-1 px-5 py-4">
            <div id="items" class="space-y-3"></div>
            <div id="vacio" class="flex h-64 flex-col items-center justify-center text-center">
                <div class="mb-3 flex h-16 w-16 items-center justify-center rounded-2xl bg-gray-100 text-3xl">🛒</div>
                <p class="text-lg font-bold">Esperando productos</p>
                <p class="mt-1 text-sm text-gray-500">Los items apareceran aqui cuando el cajero los agregue.</p>
            </div>
        </section>

        <section id="ticket-final" class="hidden flex-1 px-5 py-5">
            <div id="ticket-card" class="rounded-3xl border border-gray-200 bg-white p-5 shadow-sm">
                <div class="border-b border-dashed border-gray-300 pb-4 text-center">
                    <p id="ticket-tienda" class="text-lg font-black">{{ tienda.nombre }}</p>
                    <p id="ticket-fecha" class="mt-1 text-xs font-semibold text-gray-500"></p>
                    <p id="ticket-pedido" class="mt-1 text-xs text-gray-400"></p>
                </div>
                <div id="ticket-items" class="space-y-3 border-b border-dashed border-gray-300 py-4"></div>
                <div id="ticket-resumen" class="space-y-2 pt-4"></div>
                <p class="pt-5 text-center text-sm font-bold text-gray-500">Gracias por tu compra</p>
            </div>

            <div class="mt-4 grid grid-cols-3 gap-2">
                <button onclick="descargarPDF()"
                        class="rounded-xl bg-blue-600 px-2 py-3 text-sm font-bold text-white">
                    PDF
                </button>
                <button onclick="guardarImagen()"
                        class="rounded-xl bg-gray-900 px-2 py-3 text-sm font-bold text-white">
                    Imagen
                </button>
                <button onclick="compartirTicketWA()"
                        class="rounded-xl bg-green-500 px-2 py-3 text-sm font-bold text-white">
                    WhatsApp
                </button>
            </div>
        </section>

        <footer id="total-bar" class="sticky bottom-0 border-t border-gray-100 bg-white px-5 py-4 shadow-[0_-10px_30px_rgba(15,23,42,0.06)]">
            <div id="iva" class="mb-1 hidden text-right text-xs font-semibold text-gray-500"></div>
            <div class="flex items-end justify-between">
                <span class="text-sm font-bold uppercase tracking-wide text-gray-500">Total</span>
                <span id="total" class="text-4xl font-black text-blue-700">$0</span>
            </div>
        </footer>
    </main>

    <script>
    const SLUG = '{{ slug }}';
    const TOKEN = '{{ token }}';
    const itemsEl = document.getElementById('items');
    const vacioEl = document.getElementById('vacio');
    const estadoEl = document.getElementById('estado');
    const totalEl = document.getElementById('total');
    const ivaEl = document.getElementById('iva');
    let reciboFinal = null;

    function money(value) {
        return `$${Number(value || 0).toLocaleString('es-CO')}`;
    }

    function render(data) {
        const items = data.items || [];
        totalEl.textContent = money(data.total);

        if (data.iva > 0) {
            ivaEl.textContent = `IVA incluido: ${money(Math.round(data.iva))}`;
            ivaEl.classList.remove('hidden');
        } else {
            ivaEl.classList.add('hidden');
        }

        if (data.estado === 'cobrada') {
            reciboFinal = data.recibo || {
                tienda: '{{ tienda.nombre }}',
                total: data.total,
                iva: data.iva,
                subtotal: Number(data.total || 0) - Number(data.iva || 0),
                items
            };
            renderTicket(reciboFinal);
        } else {
            estadoEl.textContent = 'Conectado. Revisa tus items antes de pagar.';
            estadoEl.className = 'mt-4 rounded-xl bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700';
            document.getElementById('compra-vivo').classList.remove('hidden');
            document.getElementById('ticket-final').classList.add('hidden');
            document.getElementById('total-bar').classList.remove('hidden');
        }

        vacioEl.classList.toggle('hidden', items.length > 0);
        itemsEl.innerHTML = items.map(item => `
            <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="font-bold leading-tight">${item.nombre}</p>
                        <p class="mt-1 text-sm text-gray-500">${item.cantidad} x ${money(item.precio)}</p>
                    </div>
                    <p class="shrink-0 text-lg font-black">${money(item.precio * item.cantidad)}</p>
                </div>
            </div>
        `).join('');
    }

    function renderTicket(r) {
        estadoEl.textContent = 'Venta registrada. Tu ticket esta listo.';
        estadoEl.className = 'mt-4 rounded-xl bg-green-50 px-4 py-3 text-sm font-semibold text-green-700';
        document.getElementById('compra-vivo').classList.add('hidden');
        document.getElementById('ticket-final').classList.remove('hidden');
        document.getElementById('total-bar').classList.add('hidden');

        const fecha = r.fecha
            ? new Date(r.fecha).toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})
            : new Date().toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
        document.getElementById('ticket-tienda').textContent = r.tienda || '{{ tienda.nombre }}';
        document.getElementById('ticket-fecha').textContent = fecha;
        document.getElementById('ticket-pedido').textContent = r.pedido_id ? `Pedido #${r.pedido_id}` : '';

        document.getElementById('ticket-items').innerHTML = (r.items || []).map(item => `
            <div class="flex items-start justify-between gap-3 text-sm">
                <div class="min-w-0">
                    <p class="font-bold">${item.nombre}</p>
                    <p class="text-gray-500">${item.cantidad} x ${money(item.precio)}</p>
                </div>
                <p class="shrink-0 font-black">${money(item.precio * item.cantidad)}</p>
            </div>
        `).join('');

        const pagos = r.pagos && r.pagos.length
            ? r.pagos.map(p => `${p.nombre}: ${money(p.monto)}`).join('<br>')
            : (r.metodo || 'Efectivo');
        document.getElementById('ticket-resumen').innerHTML = `
            ${r.iva > 0 ? `
            <div class="flex justify-between text-sm text-gray-500"><span>Subtotal</span><span>${money(r.subtotal)}</span></div>
            <div class="flex justify-between text-sm text-gray-500"><span>IVA incluido</span><span>${money(r.iva)}</span></div>` : ''}
            <div class="flex justify-between text-xl font-black"><span>Total</span><span>${money(r.total)}</span></div>
            <div class="pt-2 text-sm text-gray-500"><span class="font-bold text-gray-700">Pago:</span><br>${pagos}</div>
            ${r.cajero ? `<div class="text-xs text-gray-400">Cajero: ${r.cajero}</div>` : ''}
        `;
    }

    async function ticketCanvas() {
        return html2canvas(document.getElementById('ticket-card'), {
            backgroundColor: '#ffffff',
            scale: 2
        });
    }

    async function descargarPDF() {
        if (!reciboFinal) return;
        const canvas = await ticketCanvas();
        const img = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({orientation: 'portrait', unit: 'px', format: [canvas.width, canvas.height]});
        pdf.addImage(img, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save(`ticket-${SLUG}-${reciboFinal.pedido_id || Date.now()}.pdf`);
    }

    async function guardarImagen() {
        if (!reciboFinal) return;
        const canvas = await ticketCanvas();
        const link = document.createElement('a');
        link.download = `ticket-${SLUG}-${reciboFinal.pedido_id || Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function compartirTicketWA() {
        if (!reciboFinal) return;
        const lineas = (reciboFinal.items || []).map(i => `${i.cantidad}x ${i.nombre} - ${money(i.precio * i.cantidad)}`).join('\n');
        const pagos = reciboFinal.pagos && reciboFinal.pagos.length
            ? reciboFinal.pagos.map(p => `${p.nombre}: ${money(p.monto)}`).join(' + ')
            : (reciboFinal.metodo || 'Efectivo');
        const texto = `${reciboFinal.tienda || '{{ tienda.nombre }}'}\nTicket de compra\n\n${lineas}\n\nTotal: ${money(reciboFinal.total)}\nPago: ${pagos}\nGracias por tu compra`;
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

    async function poll() {
        try {
            const r = await fetch(`/api/caja/${SLUG}/sesion/${TOKEN}`, {cache: 'no-store'});
            const data = await r.json();
            if (!data.ok) throw new Error(data.error || 'Sesion no encontrada');
            render(data);
        } catch (e) {
            estadoEl.textContent = 'Esta sesion ya no esta disponible.';
            estadoEl.className = 'mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700';
        }
    }

    poll();
    setInterval(poll, 1500);
    </script>
</body>
</html>
