<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso a Tuc-Tuc</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #f8fafc; color: #0f172a; font: 1rem system-ui, sans-serif; }
    main { width: min(100%, 22rem); box-sizing: border-box; padding: 28px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 20px; }
    button { width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: #4338ca; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Acceso a Tuc-Tuc</h1>
    {% if token %}
    <p>Continúa para activar tu acceso en este navegador.</p>
    <form method="post" action="{{ url_for('vendedor.confirmar_invitacion') }}">
      <input type="hidden" name="invite" value="{{ token }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit">Continuar</button>
    </form>
    {% else %}
    <p>Este enlace ya se usó o no está disponible. Si necesitas recuperar tu acceso, pide un enlace nuevo.</p>
    {% endif %}
  </main>
</body>
</html>
