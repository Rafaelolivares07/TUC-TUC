<style>
:root{--bg:#f8f8f0;--ink:#16372c;--muted:#52665b;--line:#dce4d8;--lime:#d6f45f;--white:#fff;--forest:#123c2e;--heading:'Manrope',Arial,sans-serif;--body:'DM Sans',Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--heading)}:focus-visible{outline:3px solid #537715;outline-offset:4px}.wrap{width:min(1320px,calc(100% - 96px));margin-inline:auto}.head{position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line);background:var(--bg)}.head-inner{min-height:73px;display:flex;align-items:center;gap:35px}.logo{display:inline-flex;align-items:center;gap:10px;font:800 27px/.9 var(--heading);letter-spacing:-.08em;white-space:nowrap}.logo-mark{display:grid;flex:none;width:36px;height:36px;place-items:center;background:var(--ink);border-radius:12px;color:var(--lime)}.logo-mark svg{display:block;width:74%;height:auto}.loc{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font-weight:700;padding:8px 0;font-size:.9rem}.pin{display:inline-block;width:13px;height:13px;border:1.6px solid currentColor;border-radius:50% 50% 50% 1px;transform:rotate(-45deg);position:relative;margin-right:2px}.pin:after{content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:50%}.head nav{display:flex;gap:29px;align-items:center;margin-left:auto;font-weight:700;font-size:.9rem;white-space:nowrap}.head nav a:hover{text-decoration:underline;text-underline-offset:4px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:45px;padding:10px 18px;border:1px solid transparent;border-radius:11px;font-weight:700;white-space:nowrap;transition:background .18s,transform .18s}.btn:hover{transform:translateY(-2px)}.btn.dark{background:var(--ink);color:white}.btn.dark:hover{background:#235340}.btn.lime{background:var(--lime);color:#162e20}.btn.clear{border-color:#829587;background:transparent;color:inherit}.chev{display:inline-block;width:6px;height:6px;border-right:1.7px solid currentColor;border-bottom:1.7px solid currentColor;transform:rotate(45deg);margin:-3px 2px 0}
.hero{display:grid;grid-template-columns:1.02fr 1fr;gap:55px;align-items:center;padding-top:28px}.hero-copy{padding:36px 0 29px 0}.tagline{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:.92rem;font-weight:700;color:#365b44}.tagline .dot{width:10px;height:10px;border-radius:50%;background:#749e29}.hero h1{font-weight:800;font-size:clamp(3.35rem,5.35vw,5.35rem);line-height:.98;letter-spacing:-.092em;max-width:680px}.hero h1 em{color:#4c7329;font-style:normal}.hero-copy>p{max-width:450px;color:var(--muted);font-size:1.1rem;line-height:1.54;margin:21px 0 23px}.hero-media{position:relative;min-width:0;height:clamp(340px,31vw,478px);overflow:hidden;border-radius:24px;background:#496448}.hero-media img{object-position:center 52%}.hero-caption{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:8px;padding:10px 13px;background:#fffdf2;color:var(--ink);border-radius:100px;font-weight:700;font-size:.88rem}
.search{background:white;border:1px solid #cfdccf;border-radius:13px;display:flex;align-items:center;gap:12px;padding:6px;max-width:550px;box-shadow:0 8px 25px #193a2510}.search-icon{display:block;margin-left:10px;width:15px;height:15px;border:2px solid #37584b;border-radius:100%;position:relative;flex:none}.search-icon:after{content:"";width:7px;height:2px;position:absolute;bottom:-3px;right:-5px;transform:rotate(45deg);background:#37584b;border-radius:2px}.search input{width:100%;min-width:0;outline:none;border:0;padding:9px 0;background:none;color:var(--ink)}.search:focus-within{outline:2px solid #749e29;outline-offset:3px}.search .btn{min-height:43px}
.browse{margin-top:38px;padding-bottom:60px}.cats{display:flex;align-items:center;gap:9px;overflow-x:auto;scrollbar-width:thin;padding:3px 3px 6px;margin:-3px -3px 29px}.cat{padding:10px 16px;display:flex;align-items:center;gap:9px;min-height:45px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--ink);font-weight:700;white-space:nowrap}.cat:hover{background:#eaf1e3}.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}.cat .sig{font-size:1.06rem;line-height:1}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:19px}.section-head h2,.sell-copy h2,.delivery h2{font-size:clamp(2rem,3.3vw,3.6rem);font-weight:800;letter-spacing:-.075em;line-height:1.06}.section-head p{margin-top:6px;color:var(--muted)}.hint{padding:6px 11px;border:1px solid var(--line);border-radius:100px;color:var(--muted);font-size:.81rem;font-weight:700;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{position:relative;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #193a251a}.card button.open-card{display:block;width:100%;background:transparent;color:inherit;border:0;text-align:left;padding:0}.card-photo{display:block;position:relative;aspect-ratio:1.68;overflow:hidden;background:#bdbf85}.card-photo img,.item-photo img{position:absolute;width:200%;height:200%;max-width:none;object-fit:fill;left:var(--x);top:var(--y)}.c0{--x:0%;--y:0%}.c1{--x:-100%;--y:0%}.c2{--x:0%;--y:-100%}.c3{--x:-100%;--y:-100%}.card-info{display:block;padding:15px 16px 17px}.card-info small{display:block;color:var(--muted);font-size:.85rem}.card-info strong{display:block;font:800 1.08rem/1.28 var(--heading);margin:4px 0 11px;padding-right:0}.price{display:block;font-weight:800}.heart{position:absolute;top:10px;right:10px;z-index:1;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:1.35rem;line-height:1;padding:0}.heart[aria-pressed="true"]{color:#9a3439}.empty{grid-column:1/-1;padding:35px;border:1px dashed #adc0af;border-radius:14px;color:var(--muted)}
.sell{background:var(--forest);color:white;padding:62px 0 58px}.sell-copy{display:grid;grid-template-columns:1.08fr 1fr;gap:42px;align-items:end;margin-bottom:29px}.sell-copy h2{max-width:560px}.sell-copy p{max-width:550px;color:#d6e7d8;line-height:1.55}.sell-copy .lead{font-size:1.05rem}.sell-intro{display:flex;flex-direction:column;align-items:flex-start;gap:16px}.plan-label{display:block;font-size:.9rem;font-weight:700;margin-bottom:8px;color:#e2efdf}.segments{display:inline-flex;gap:4px;background:#275342;border:1px solid #456b5b;border-radius:12px;padding:4px}.segments button{background:transparent;border:0;border-radius:8px;padding:9px 13px;color:white;font-weight:700}.segments button[aria-pressed="true"]{background:#eef4e5;color:var(--ink)}.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:17px}.plan{padding:20px 16px;background:#214c3d;border:1px solid #527263;border-radius:15px;min-height:166px}.plan.special{background:#def68a;color:#17372b;border-color:#def68a}.plan h3{font-size:1rem}.plan .amount{font-size:1.32rem;font-weight:800;display:block;margin:8px 0}.plan .amount small{font-size:.84rem;font-weight:600}.plan p{font-size:.92rem;line-height:1.47;color:#e3efe4}.plan.special p{color:#284632}.delivery{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:30px;padding-top:45px;padding-bottom:49px}.delivery h2{font-size:clamp(2rem,3vw,3rem)}.delivery p{color:var(--muted);max-width:560px;line-height:1.55}.foot{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.9rem}.foot .wrap{display:flex;gap:14px;justify-content:space-between}
dialog{border:1px solid var(--line);border-radius:20px;padding:23px;color:var(--ink);width:min(480px,calc(100% - 28px));max-height:90vh;background:var(--bg);box-shadow:0 12px 80px #132c27aa}dialog::backdrop{background:#10291f99}dialog h2{font-size:1.65rem;letter-spacing:-.055em;padding-right:30px}dialog p{color:var(--muted);line-height:1.5;margin:10px 0 14px}dialog .close{position:absolute;top:13px;right:13px;background:white;color:var(--ink);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:1.35rem}dialog label{display:block;font-weight:700;margin-bottom:6px}dialog select{width:100%;padding:11px;border:1px solid #adbbad;border-radius:10px;margin-bottom:14px;background:white;color:var(--ink)}.item-photo{display:block;position:relative;aspect-ratio:1.76;overflow:hidden;border-radius:12px;margin:16px 0 13px}
@media(max-width:1024px){.wrap{width:calc(100% - 52px)}.head-inner{gap:22px}.head nav{gap:16px}.hero{gap:29px}.hero h1{font-size:clamp(3.05rem,6.5vw,4.9rem)}.hero-media{height:365px}.cards{gap:11px}.card-info{padding:13px}.plans{gap:9px}.plan{padding:15px 12px}}

@media(max-width:360px){.head-inner{gap:8px}.logo{font-size:20px}.logo-mark{width:30px;height:30px}.cat{padding-inline:12px}.search .btn{padding-inline:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
