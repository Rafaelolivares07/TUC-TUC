<div id="panel-vendedores" class="p-6 hidden bg-white rounded-2xl shadow-lg mb-6">
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-5">
        <div>
            <h2 class="font-bold text-gray-800 text-lg mb-1">Vendedores</h2>
            <p class="text-sm text-gray-500">Estas personas representan comercialmente este negocio y pueden usar el CRM de vendedores.</p>
        </div>
        <a href="/vendedor" target="_blank"
           class="inline-flex justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
            Abrir dashboard
        </a>
    </div>

    <div class="bg-gray-50 rounded-xl p-4 mb-5">
        <h3 class="font-semibold text-gray-700 mb-3 text-sm">Agregar vendedor</h3>
        <div class="flex flex-col sm:flex-row gap-3">
            <input id="vd-tel" type="tel" inputmode="numeric" placeholder="Telefono (10 digitos)"
                class="border rounded-lg px-3 py-2 text-sm flex-1" autocomplete="off"
                oninput="onVdTelInput(this.value)">
            <input id="vd-nombre" type="text" placeholder="Nombre (si es nuevo)"
                class="border rounded-lg px-3 py-2 text-sm flex-1" autocomplete="off">
            <button onclick="agregarVendedor()"
                class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-5 py-2 rounded-lg text-sm flex-shrink-0 transition">
                Agregar
            </button>
        </div>
        <div id="vd-autocomplete" class="hidden mt-2 bg-white border rounded-lg shadow-md max-h-40 overflow-y-auto text-sm"></div>
    </div>

    <div id="lista-vendedores">
        <p class="text-sm text-gray-400 py-4 text-center">Cargando...</p>
    </div>
</div>
