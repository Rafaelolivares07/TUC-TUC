<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Movimientos REG_CTAS — SAR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f4f7fb; font-size: 13px; }
  .panel-filtros { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px #0001; padding: 14px 20px; margin-bottom: 14px; }
  .panel-totales { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px #0001; padding: 12px 20px; margin-bottom: 14px; }
  .total-box { text-align: center; }
  .total-box .val      { font-size: 17px; font-weight: 700; color: #003f7f; }
  .total-box .val.deb  { color: #1a7f5a; }
  .total-box .val.cre  { color: #b91c1c; }
  .total-box .lbl { font-size: 11px; color: #888; text-transform: uppercase; }
  #tabla-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px #0001; overflow-x: auto; }
  #tabla-wrap table { font-size: 12px; }
  #tabla-wrap thead th { background: #003f7f; color: #fff; cursor: pointer; user-select: none; white-space: nowrap; }
  #tabla-wrap thead th:hover { background: #00539f; }
  #tabla-wrap thead th .sort-ico { opacity: .5; font-size: 10px; }
  #tabla-wrap thead th.sort-asc  .sort-ico::after { content: ' ▲'; opacity: 1; }
  #tabla-wrap thead th.sort-desc .sort-ico::after { content: ' ▼'; opacity: 1; }
  #tabla-wrap tbody tr:nth-child(even) { background: #f0f6ff; }
  #tabla-wrap tbody tr:hover { background: #d6eaff; }
  .num { text-align: right; }
  .fila-total td { font-weight: 700; background: #e8f0ff !important; border-top: 2px solid #003f7f; }
  .spinner-wrap { text-align: center; padding: 40px; color: #888; }
  .detalle-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .paginacion { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #f8faff; border-top: 1px solid #dee2ef; font-size: 13px; }
  .paginacion button { padding: 3px 10px; font-size: 12px; border: 1px solid #bcd; border-radius: 4px; background: #fff; cursor: pointer; }
  .paginacion button:hover:not(:disabled) { background: #e8f0ff; }
  .paginacion button:disabled { opacity: .4; cursor: default; }
  .paginacion .pag-info { color: #555; }
  #aviso-limite { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 6px 12px; font-size: 12px; display: none; }
</style>
</head>
<body>
<div class="container-fluid py-3">

  <div class="d-flex align-items-center gap-3 mb-3">
    <a href="/" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Menú</a>
    <h5 class="mb-0 fw-bold" style="color:#003f7f"><i class="bi bi-table me-2"></i>Movimientos REG_CTAS</h5>
    <span id="badge-fuente" class="badge" style="font-size:11px"></span>
  </div>

  <!-- Filtros -->
  <div class="panel-filtros">
    <div class="row g-2 align-items-end mb-2">
      <div class="col-auto">
        <label class="form-label mb-1 small fw-semibold">Cuenta <span class="fw-normal text-muted">(opcional)</span></label>
        <input type="text" id="f-cuenta" class="form-control form-control-sm" style="width:160px" placeholder="Ej: 1305">
      </div>
      <div class="col-auto">
        <label class="form-label mb-1 small fw-semibold">Tercero <span class="fw-normal text-muted">(código)</span></label>
        <input type="text" id="f-tercero" class="form-control form-control-sm" style="width:130px" placeholder="Código">
      </div>
      <div class="col-auto">
        <label class="form-label mb-1 small fw-semibold">Empresa</label>
        <select id="f-empresa" class="form-select form-select-sm" style="min-width:110px">
          <option value="">Todas</option>
          {% for emp in empresas %}<option value="{{ emp }}">{{ emp }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="row g-2 align-items-end">
      <div class="col-auto">
        <label class="form-label mb-1 small fw-semibold">Desde</label>
        <input type="date" id="f-desde" class="form-control form-control-sm" value="{{ desde }}">
      </div>
      <div class="col-auto">
        <label class="form-label mb-1 small fw-semibold">Hasta</label>
        <input type="date" id="f-hasta" class="form-control form-control-sm" value="{{ hasta }}">
      </div>
      <div class="col-auto">
        <button class="btn btn-primary btn-sm" style="min-width:120px" onclick="consultar()">
          <i class="bi bi-search me-1"></i>Consultar
        </button>
      </div>
      <div class="col-auto" id="btn-excel-wrap" style="display:none">
        <button class="btn btn-success btn-sm" onclick="exportarExcel()">
          <i class="bi bi-file-earmark-excel me-1"></i>Excel
        </button>
      </div>
      <div class="col-auto ms-auto">
        <small id="info-registros" class="text-muted"></small>
      </div>
    </div>
    <div id="aviso-limite" class="mt-2">
      <i class="bi bi-exclamation-triangle-fill text-warning me-1"></i>
      <span id="aviso-texto"></span> — use Excel para exportar todos los registros.
    </div>
  </div>

  <!-- Totales -->
  <div class="panel-totales" id="panel-totales" style="display:none">
    <div class="row g-3">
      <div class="col total-box">
        <div class="val" id="t-registros">—</div>
        <div class="lbl">Registros</div>
      </div>
      <div class="col total-box">
        <div class="val deb" id="t-deb">—</div>
        <div class="lbl">Total Débito</div>
      </div>
      <div class="col total-box">
        <div class="val cre" id="t-cre">—</div>
        <div class="lbl">Total Crédito</div>
      </div>
      <div class="col total-box">
        <div class="val" id="t-saldo">—</div>
        <div class="lbl">Saldo (Déb−Cré)</div>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div id="tabla-wrap">
    <div class="spinner-wrap" id="estado-inicial">
      <i class="bi bi-arrow-up-circle text-primary fs-4"></i>
      <div class="mt-2">Aplique filtros y pulse Consultar</div>
    </div>
    <div class="spinner-wrap d-none" id="spinner">
      <div class="spinner-border text-primary" role="status"></div>
      <div class="mt-2">Consultando…</div>
    </div>
    <div id="tabla-contenedor" class="d-none">
      <div style="max-height:58vh;overflow-y:auto">
        <table class="table table-bordered table-hover mb-0" id="tabla">
          <thead>
            <tr>
              <th onclick="ordenar(0)" data-col="0">#<span class="sort-ico"></span></th>
              <th onclick="ordenar(1)" data-col="1">FECHA<span class="sort-ico"></span></th>
              <th onclick="ordenar(2)" data-col="2">LAPSO<span class="sort-ico"></span></th>
              <th onclick="ordenar(3)" data-col="3">TIPO<span class="sort-ico"></span></th>
              <th onclick="ordenar(4)" data-col="4">DOCUMENTO<span class="sort-ico"></span></th>
              <th onclick="ordenar(5)" data-col="5">CUENTA<span class="sort-ico"></span></th>
              <th onclick="ordenar(6)" data-col="6">NIT<span class="sort-ico"></span></th>
              <th onclick="ordenar(7)" data-col="7">TERCERO<span class="sort-ico"></span></th>
              <th onclick="ordenar(8)" data-col="8" class="num">DÉBITO<span class="sort-ico"></span></th>
              <th onclick="ordenar(9)" data-col="9" class="num">CRÉDITO<span class="sort-ico"></span></th>
              <th>DETALLE</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot>
            <tr class="fila-total">
              <td colspan="8" class="text-end">TOTAL PÁGINA</td>
              <td class="num" id="ft-deb"></td>
              <td class="num" id="ft-cre"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="paginacion" id="paginacion">
        <button id="btn-prev" onclick="cambiarPagina(-1)" disabled>&#8592; Ant</button>
        <span class="pag-info" id="pag-info"></span>
        <button id="btn-next" onclick="cambiarPagina(1)">Sig &#8594;</button>
        <span class="ms-auto text-muted" id="pag-total-info"></span>
      </div>
    </div>
  </div>

</div>

<script>
const _conFuente = p => Object.assign({}, p, {fuente: localStorage.getItem('sar_fuente')||'local', cliente_id: localStorage.getItem('sar_cliente_id')||''});
let _rows = [], _sorted = [], _sortCol = 1, _sortAsc = true, _page = 0;
const PAGE_SIZE = 500;
const COLS = ['consecutivo','fecha','lapso','tipo','documento','cuenta','nit','tercero_nom','debito','credito','detalle'];
const fmt  = n => Number(n).toLocaleString('es-CO', {minimumFractionDigits:2, maximumFractionDigits:2});

function consultar() {
  const filtros = {
    cuenta:   document.getElementById('f-cuenta').value.trim(),
    tercero:  document.getElementById('f-tercero').value.trim(),
    empresa:  document.getElementById('f-empresa').value,
    desde:    document.getElementById('f-desde').value,
    hasta:    document.getElementById('f-hasta').value,
  };
  if (!filtros.desde || !filtros.hasta) { alert('Seleccione rango de fechas'); return; }

  document.getElementById('estado-inicial').classList.add('d-none');
  document.getElementById('spinner').classList.remove('d-none');
  document.getElementById('tabla-contenedor').classList.add('d-none');
  document.getElementById('panel-totales').style.display = 'none';
  document.getElementById('btn-excel-wrap').style.display = 'none';
  document.getElementById('info-registros').textContent = '';

  fetch('/api/reporte/reg_ctas', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(_conFuente(filtros))
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById('spinner').classList.add('d-none');
    if (!data.ok) { alert('Error: ' + data.error); document.getElementById('estado-inicial').classList.remove('d-none'); return; }
    _rows = data.rows;
    _page = 0;
    mostrarTotales(_rows);
    ordenarYRender();
    document.getElementById('btn-excel-wrap').style.display = '';
    document.getElementById('info-registros').textContent = data.total + ' registros · ' + data.elapsed + 's';
    const aviso = document.getElementById('aviso-limite');
    if (data.total > PAGE_SIZE) {
      document.getElementById('aviso-texto').textContent =
        `Se muestran ${PAGE_SIZE} filas por página de ${data.total} totales`;
      aviso.style.display = '';
    } else { aviso.style.display = 'none'; }
  })
  .catch(e => {
    document.getElementById('spinner').classList.add('d-none');
    document.getElementById('estado-inicial').classList.remove('d-none');
    alert('Error de conexión: ' + e);
  });
}

function mostrarTotales(rows) {
  const totDeb = rows.reduce((s, r) => s + r.debito, 0);
  const totCre = rows.reduce((s, r) => s + r.credito, 0);
  const saldo  = totDeb - totCre;
  document.getElementById('t-registros').textContent = rows.length;
  document.getElementById('t-deb').textContent       = '$ ' + fmt(totDeb);
  document.getElementById('t-cre').textContent       = '$ ' + fmt(totCre);
  document.getElementById('t-saldo').textContent     = '$ ' + fmt(saldo);
  document.getElementById('t-saldo').className       = 'val ' + (saldo >= 0 ? 'deb' : 'cre');
  document.getElementById('ft-deb').textContent      = fmt(totDeb);
  document.getElementById('ft-cre').textContent      = fmt(totCre);
  document.getElementById('panel-totales').style.display = '';
}

function ordenarYRender() {
  const field = COLS[_sortCol];
  _sorted = [..._rows].sort((a, b) => {
    let va = a[field] ?? '', vb = b[field] ?? '';
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    return _sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });
  renderPagina();
}

function renderPagina() {
  const totalPags = Math.max(1, Math.ceil(_sorted.length / PAGE_SIZE));
  if (_page >= totalPags) _page = totalPags - 1;
  const inicio = _page * PAGE_SIZE;
  const pagina = _sorted.slice(inicio, inicio + PAGE_SIZE);

  document.getElementById('tbody').innerHTML = pagina.map(r => {
    const tipTxt = r.tipo_nom ? `<br><small class="text-muted">${r.tipo_nom}</small>` : '';
    const terTxt = r.tercero_nom ? `<br><small class="text-muted">${r.tercero_nom}</small>` : '';
    const anul   = r.anulado ? ' <span class="badge bg-danger" style="font-size:9px">ANUL</span>' : '';
    return `<tr>
      <td class="text-muted" style="font-size:11px">${r.consecutivo}</td>
      <td>${r.fecha}</td>
      <td style="font-family:monospace">${r.lapso}</td>
      <td>${r.tipo}${tipTxt}</td>
      <td>${r.documento}${anul}</td>
      <td style="font-family:monospace">${r.cuenta}</td>
      <td class="text-muted" style="font-size:11px">${r.nit}</td>
      <td>${r.tercero}${terTxt}</td>
      <td class="num" style="color:#1a7f5a">${r.debito  ? fmt(r.debito)  : ''}</td>
      <td class="num" style="color:#b91c1c">${r.credito ? fmt(r.credito) : ''}</td>
      <td class="detalle-cell" title="${(r.detalle||'').replace(/"/g,'&quot;')}">${r.detalle}</td>
    </tr>`;
  }).join('');

  // totales de la página
  const totDeb = pagina.reduce((s,r)=>s+r.debito,0);
  const totCre = pagina.reduce((s,r)=>s+r.credito,0);
  document.getElementById('ft-deb').textContent = fmt(totDeb);
  document.getElementById('ft-cre').textContent = fmt(totCre);

  // controles paginación
  document.getElementById('pag-info').textContent = `Página ${_page+1} de ${totalPags}`;
  document.getElementById('pag-total-info').textContent =
    `filas ${inicio+1}–${Math.min(inicio+PAGE_SIZE, _sorted.length)} de ${_sorted.length}`;
  document.getElementById('btn-prev').disabled = _page === 0;
  document.getElementById('btn-next').disabled = _page >= totalPags - 1;
  document.getElementById('paginacion').style.display = totalPags <= 1 ? 'none' : '';

  document.querySelectorAll('#tabla thead th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (parseInt(th.dataset.col) === _sortCol)
      th.classList.add(_sortAsc ? 'sort-asc' : 'sort-desc');
  });
  document.getElementById('tabla-contenedor').classList.remove('d-none');
  document.getElementById('estado-inicial').classList.add('d-none');
}

function cambiarPagina(delta) {
  _page += delta;
  renderPagina();
  document.getElementById('tabla-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function ordenar(col) {
  if (_sortCol === col) _sortAsc = !_sortAsc; else { _sortCol = col; _sortAsc = true; }
  if (_rows.length) { _page = 0; ordenarYRender(); }
}

function exportarExcel() {
  fetch('/api/reporte/reg_ctas/excel', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      cuenta:   document.getElementById('f-cuenta').value.trim(),
      tercero:  document.getElementById('f-tercero').value.trim(),
      empresa:  document.getElementById('f-empresa').value,
      desde:    document.getElementById('f-desde').value,
      hasta:    document.getElementById('f-hasta').value,
    })
  }).then(r => r.blob()).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reg_ctas_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click(); URL.revokeObjectURL(url);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') consultar();
});

(function actualizarBadgeFuente() {
  const fuente  = localStorage.getItem('sar_fuente') || 'local';
  const cliente = (localStorage.getItem('sar_cliente_id') || '').trim();
  const ruta    = (localStorage.getItem('sar_ruta_bd')    || '').trim();
  const badge   = document.getElementById('badge-fuente');
  if (fuente === 'remoto') {
    badge.innerHTML = `REMOTO${cliente ? ' · <b>' + cliente + '</b>' : ''}${ruta ? '<br><small style="font-weight:400;opacity:.85">' + ruta + '</small>' : ''}`;
    badge.className = 'badge bg-warning text-dark';
  } else {
    badge.innerHTML = `LOCAL${ruta ? '<br><small style="font-weight:400;opacity:.85">' + ruta + '</small>' : ''}`;
    badge.className = 'badge bg-success';
  }
})();
</script>
</body>
</html>
