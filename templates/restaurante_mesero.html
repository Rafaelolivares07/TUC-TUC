<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ restaurante.nombre }} - Mesero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111827; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px; color: white; font-weight: 600;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast-ok { background: #059669; }
        .toast-err { background: #dc2626; }
    </style>
</head>
<body class="min-h-screen text-white">

<div id="toast" class="toast"></div>
<div class="max-w-lg mx-auto p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold">{{ restaurante.nombre }}</h1>
        <p class="text-gray-400 text-sm">Mesero</p>
    </div>

    <!-- ====== PASO 1: SELECCIONAR MESA ====== -->
    <div id="paso-mesa">
        <h2 class="text-lg font-bold mb-4 text-gray-300">Selecciona la mesa</h2>
        <div id="grid-mesas" class="grid grid-cols-4 gap-3 mb-6">
            <p class="text-gray-500 col-span-4 text-center py-8">Cargando...</p>
        </div>
    </div>

    <!-- ====== PASO 2: TIPO DE PEDIDO ====== -->
    <div id="paso-tipo" class="hidden">
        <div class="flex items-center justify-between mb-4">
            <button onclick="volverAPaso('mesa')" class="text-gray-400 hover:text-white text-sm">&larr; Cambiar mesa</button>
            <span id="label-mesa" class="text-amber-400 font-bold text-lg">Mesa X</span>
        </div>
        <h2 class="text-lg font-bold mb-4 text-gray-300">Tipo de pedido</h2>
        <div class="space-y-3" id="botones-tipo">
            <!-- Se llenan dinámicamente con precios -->
        </div>
    </div>

    <!-- ====== PASO 3: OPCIONES ====== -->
    <div id="paso-opciones" class="hidden">
        <div class="flex items-center justify-between mb-4">
            <button onclick="volverAPaso('tipo')" class="text-gray-400 hover:text-white text-sm">&larr; Cambiar tipo</button>
            <span id="label-mesa-tipo" class="text-amber-400 font-bold">Mesa X - Completo</span>
        </div>

        <!-- Sopa (completo) -->
        <div id="sec-sopa" class="mb-4 hidden">
            <h3 class="text-sm font-bold text-yellow-400 uppercase tracking-wide mb-2">Sopa / Caldo</h3>
            <div id="grid-sopas" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- Proteína (completo, bandeja) -->
        <div id="sec-proteina" class="mb-4 hidden">
            <h3 class="text-sm font-bold text-red-400 uppercase tracking-wide mb-2">Proteína</h3>
            <div id="grid-proteinas" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- Principio (completo, bandeja) -->
        <div id="sec-principio" class="mb-4 hidden">
            <h3 class="text-sm font-bold text-green-400 uppercase tracking-wide mb-2">Principio</h3>
            <div id="grid-principios" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- Notas -->
        <div class="mb-4">
            <input id="input-notas" type="text" placeholder="Notas (opcional)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm">
        </div>

        <!-- Precio y enviar -->
        <div class="bg-gray-800 rounded-xl p-4 flex items-center justify-between">
            <div>
                <span class="text-gray-400 text-sm">Total:</span>
                <span id="precio-total" class="text-2xl font-extrabold text-amber-400 ml-2">$0</span>
            </div>
            <button onclick="enviarPedido()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold text-lg">
                Enviar
            </button>
        </div>
    </div>

    <!-- ====== PEDIDOS ACTIVOS ====== -->
    <div class="mt-8 border-t border-gray-700 pt-6">
        <h2 class="text-lg font-bold text-gray-300 mb-4">Pedidos de hoy</h2>
        <div id="lista-pedidos" class="space-y-3">
            <p class="text-gray-500 text-center py-4">Cargando...</p>
        </div>
    </div>
</div>

<script>
const SLUG = '{{ restaurante.slug }}';
const BASE = `/api/restaurante/${SLUG}`;

let mesaSeleccionada = null;
let tipoSeleccionado = null;
let menuHoy = null;
let opcionesHoy = [];
let sopaSeleccionada = null;
let proteinaSeleccionada = null;
let principioSeleccionado = null;

function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${ok ? 'toast-ok' : 'toast-err'}`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== MESAS =====
async function cargarMesas() {
    const r = await fetch(`${BASE}/mesas`);
    const data = await r.json();
    if (!data.ok) return;
    const cont = document.getElementById('grid-mesas');
    if (data.mesas.length === 0) {
        cont.innerHTML = '<p class="text-gray-500 col-span-4 text-center py-8">No hay mesas configuradas</p>';
        return;
    }
    cont.innerHTML = data.mesas.map(m => `
        <button onclick="seleccionarMesa(${m.numero})"
            class="bg-gray-800 hover:bg-amber-600 border-2 border-gray-700 hover:border-amber-500 rounded-xl p-4 text-center transition">
            <span class="text-2xl font-bold">${m.numero}</span>
        </button>
    `).join('');
}

// ===== MENÚ DEL DÍA =====
async function cargarMenuHoy() {
    const r = await fetch(`${BASE}/menu-dia`);
    const data = await r.json();
    if (!data.ok || !data.menu) {
        toast('No hay menú configurado para hoy', false);
        return;
    }
    menuHoy = data.menu;
    opcionesHoy = data.opciones_activas || [];
}

function seleccionarMesa(num) {
    if (!menuHoy) {
        toast('No hay menú configurado para hoy', false);
        return;
    }
    mesaSeleccionada = num;
    document.getElementById('label-mesa').textContent = `Mesa ${num}`;
    mostrarPaso('tipo');

    // Generar botones de tipo con precios
    const cont = document.getElementById('botones-tipo');
    cont.innerHTML = `
        <button onclick="seleccionarTipo('completo')"
            class="w-full bg-green-800 hover:bg-green-700 border-2 border-green-600 rounded-xl p-5 text-left transition">
            <div class="flex justify-between items-center">
                <span class="text-xl font-bold">Completo</span>
                <span class="text-xl font-bold text-green-300">$${Number(menuHoy.precio_completo).toLocaleString()}</span>
            </div>
            <p class="text-green-400 text-sm mt-1">Sopa + Bandeja</p>
        </button>
        <button onclick="seleccionarTipo('bandeja')"
            class="w-full bg-blue-800 hover:bg-blue-700 border-2 border-blue-600 rounded-xl p-5 text-left transition">
            <div class="flex justify-between items-center">
                <span class="text-xl font-bold">Bandeja</span>
                <span class="text-xl font-bold text-blue-300">$${Number(menuHoy.precio_bandeja).toLocaleString()}</span>
            </div>
            <p class="text-blue-400 text-sm mt-1">Proteína + Principio</p>
        </button>
        <button onclick="seleccionarTipo('sopa')"
            class="w-full bg-yellow-800 hover:bg-yellow-700 border-2 border-yellow-600 rounded-xl p-5 text-left transition">
            <div class="flex justify-between items-center">
                <span class="text-xl font-bold">Sopa</span>
                <span class="text-xl font-bold text-yellow-300">$${Number(menuHoy.precio_sopa).toLocaleString()}</span>
            </div>
            <p class="text-yellow-400 text-sm mt-1">Solo sopa o caldo</p>
        </button>
    `;
}

function seleccionarTipo(tipo) {
    tipoSeleccionado = tipo;
    sopaSeleccionada = null;
    proteinaSeleccionada = null;
    principioSeleccionado = null;
    document.getElementById('input-notas').value = '';

    const tipoLabel = tipo === 'completo' ? 'Completo' : tipo === 'bandeja' ? 'Bandeja' : 'Sopa';
    document.getElementById('label-mesa-tipo').textContent = `Mesa ${mesaSeleccionada} - ${tipoLabel}`;

    const sopas = opcionesHoy.filter(o => o.tipo === 'sopa' && !o.agotado);
    const proteinas = opcionesHoy.filter(o => o.tipo === 'proteina' && !o.agotado);
    const principios = opcionesHoy.filter(o => o.tipo === 'principio' && !o.agotado);

    // Mostrar secciones según tipo
    const secSopa = document.getElementById('sec-sopa');
    const secProteina = document.getElementById('sec-proteina');
    const secPrincipio = document.getElementById('sec-principio');

    secSopa.classList.toggle('hidden', tipo === 'bandeja');
    secProteina.classList.toggle('hidden', tipo === 'sopa');
    secPrincipio.classList.toggle('hidden', tipo === 'sopa');

    if (tipo !== 'bandeja') renderOpciones('grid-sopas', sopas, 'sopa');
    if (tipo !== 'sopa') renderOpciones('grid-proteinas', proteinas, 'proteina');
    if (tipo !== 'sopa') renderOpciones('grid-principios', principios, 'principio');

    calcularPrecio();
    mostrarPaso('opciones');
}

function renderOpciones(containerId, items, categoria) {
    const cont = document.getElementById(containerId);
    if (items.length === 0) {
        cont.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-2 text-sm">No disponible</p>';
        return;
    }
    cont.innerHTML = items.map(i => `
        <button onclick="seleccionarOpcion('${categoria}', ${i.opcion_id}, this)"
            class="opcion-${categoria} bg-gray-800 hover:bg-gray-700 border-2 border-gray-700 rounded-lg p-3 text-left transition text-sm">
            <span class="font-semibold">${i.nombre}</span>
            ${i.recargo > 0 ? `<span class="text-amber-400 text-xs block">+$${Number(i.recargo).toLocaleString()}</span>` : ''}
        </button>
    `).join('');
}

function seleccionarOpcion(categoria, id, btn) {
    // Deseleccionar otros de la misma categoría
    document.querySelectorAll(`.opcion-${categoria}`).forEach(b => {
        b.classList.remove('border-amber-500', 'bg-amber-900');
        b.classList.add('border-gray-700', 'bg-gray-800');
    });
    btn.classList.remove('border-gray-700', 'bg-gray-800');
    btn.classList.add('border-amber-500', 'bg-amber-900');

    if (categoria === 'sopa') sopaSeleccionada = id;
    if (categoria === 'proteina') proteinaSeleccionada = id;
    if (categoria === 'principio') principioSeleccionado = id;

    calcularPrecio();
}

function calcularPrecio() {
    let precio = 0;
    if (tipoSeleccionado === 'completo') precio = menuHoy.precio_completo;
    else if (tipoSeleccionado === 'bandeja') precio = menuHoy.precio_bandeja;
    else precio = menuHoy.precio_sopa;

    // Sumar recargo proteína
    if (proteinaSeleccionada) {
        const prot = opcionesHoy.find(o => o.opcion_id === proteinaSeleccionada);
        if (prot && prot.recargo > 0) precio += prot.recargo;
    }

    document.getElementById('precio-total').textContent = `$${Number(precio).toLocaleString()}`;
}

// ===== ENVIAR PEDIDO =====
async function enviarPedido() {
    // Validar selecciones requeridas
    if (tipoSeleccionado === 'completo') {
        if (!sopaSeleccionada) return toast('Selecciona una sopa', false);
        if (!proteinaSeleccionada) return toast('Selecciona una proteína', false);
        if (!principioSeleccionado) return toast('Selecciona un principio', false);
    } else if (tipoSeleccionado === 'bandeja') {
        if (!proteinaSeleccionada) return toast('Selecciona una proteína', false);
        if (!principioSeleccionado) return toast('Selecciona un principio', false);
    } else {
        if (!sopaSeleccionada) return toast('Selecciona una sopa', false);
    }

    try {
        const r = await fetch(`${BASE}/pedido`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mesa_num: mesaSeleccionada,
                tipo: tipoSeleccionado,
                sopa_id: sopaSeleccionada,
                proteina_id: proteinaSeleccionada,
                principio_id: principioSeleccionado,
                notas: document.getElementById('input-notas').value.trim()
            })
        });
        const data = await r.json();
        if (data.ok) {
            toast('Pedido enviado a cocina');
            mostrarPaso('mesa');
            cargarPedidos();
        } else {
            toast(data.error, false);
        }
    } catch(e) { toast('Error de conexión', false); }
}

// ===== NAVEGACIÓN =====
function mostrarPaso(paso) {
    ['mesa', 'tipo', 'opciones'].forEach(p => {
        document.getElementById(`paso-${p}`).classList.toggle('hidden', p !== paso);
    });
}

function volverAPaso(paso) {
    mostrarPaso(paso);
}

// ===== PEDIDOS ACTIVOS =====
async function cargarPedidos() {
    try {
        const r = await fetch(`${BASE}/pedidos?estado=pendiente,listo`);
        const data = await r.json();
        if (!data.ok) return;

        const cont = document.getElementById('lista-pedidos');
        if (data.pedidos.length === 0) {
            cont.innerHTML = '<p class="text-gray-500 text-center py-4">Sin pedidos activos</p>';
            return;
        }

        cont.innerHTML = data.pedidos.map(p => {
            const esListo = p.estado === 'listo';
            const items = [p.sopa, p.proteina, p.principio].filter(Boolean).join(' + ');
            return `
                <div class="bg-gray-800 rounded-xl p-4 border-2 ${esListo ? 'border-green-500' : 'border-gray-700'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-lg">Mesa ${p.mesa_num}</span>
                            <span class="ml-2 text-xs px-2 py-1 rounded-full ${esListo ? 'bg-green-600' : 'bg-yellow-600'}">${esListo ? 'LISTO' : 'En cocina'}</span>
                            <span class="text-gray-500 text-xs ml-2">${p.created_at}</span>
                        </div>
                        <span class="font-bold text-amber-400">$${Number(p.precio).toLocaleString()}</span>
                    </div>
                    <p class="text-gray-400 text-sm mt-1">${p.tipo.charAt(0).toUpperCase() + p.tipo.slice(1)}: ${items}</p>
                    ${p.notas ? `<p class="text-gray-500 text-xs mt-1">${p.notas}</p>` : ''}
                    ${esListo ? `<button onclick="marcarEntregado(${p.id})" class="mt-2 bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold w-full">Entregado</button>` : ''}
                </div>
            `;
        }).join('');
    } catch(e) { console.error(e); }
}

async function marcarEntregado(id) {
    try {
        const r = await fetch(`${BASE}/pedido/${id}/entregado`, {method: 'POST'});
        const data = await r.json();
        if (data.ok) {
            toast('Pedido entregado');
            cargarPedidos();
        }
    } catch(e) { toast('Error', false); }
}

// ===== INIT =====
cargarMesas();
cargarMenuHoy();
cargarPedidos();
// Polling pedidos cada 10s
setInterval(cargarPedidos, 10000);
</script>
</body>
</html>
