<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Almuerzo del día</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; }
        .step { display: none; }
        .step.active { display: block; }
        .item-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
        .item-row .nombre { flex: 1; font-size: 0.9rem; color: #1e293b; }
        .badge-new { font-size: 0.65rem; background: #fef3c7; color: #92400e; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
        .badge-bd  { font-size: 0.65rem; background: #dcfce7; color: #166534; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
        .chk-menu  { width: 20px; height: 20px; accent-color: #6366f1; cursor: pointer; flex-shrink: 0; }
        .btn-star  { font-size: 1.3rem; line-height: 1; background: none; border: none; cursor: pointer; flex-shrink: 0; transition: transform .1s; }
        .btn-star:active { transform: scale(1.3); }
        .btn-star.starred { color: #f59e0b; }
        .btn-star:not(.starred) { color: #d1d5db; }
        .bloque-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
        .bloque-label { font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; }
        .lbl-sopa      { background: #fef9c3; color: #713f12; }
        .lbl-principio { background: #dcfce7; color: #14532d; }
        .lbl-proteina  { background: #fce7f3; color: #831843; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #c7d2fe; border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Modal identificación */
        #modal-id { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; align-items: flex-end; justify-content: center; }
        #modal-id.open { display: flex; }
        #modal-id-inner { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 20px 36px; width: 100%; max-width: 480px; }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-md mx-auto px-4 pt-6 pb-24">

    <!-- Header -->
    <div class="mb-5">
        <h1 class="text-2xl font-extrabold text-indigo-700 tracking-tight">🥗 Almuerzo del día</h1>
        <p class="text-sm text-gray-500 mt-1">Procesa el menú, elige y crea tu pedido</p>
    </div>

    <!-- STEP 1: restaurante + texto -->
    <div id="step-menu" class="step active">

        <!-- Restaurante -->
        <div class="bg-white rounded-2xl shadow-sm border p-4 mb-4">
            <p class="text-xs font-semibold text-gray-500 uppercase mb-2 tracking-wide">Restaurante</p>
            <select id="sel-restaurante" class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option value="">Cargando...</option>
            </select>
            <div class="mt-2">
                <button onclick="mostrarNuevoRestaurante()" id="btn-toggle-nuevo"
                        class="text-xs text-indigo-600 underline">+ Crear restaurante nuevo</button>
            </div>
            <div id="form-nuevo-rest" class="hidden mt-3 space-y-2">
                <input id="inp-rest-nombre" type="text" placeholder="Nombre del restaurante"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input id="inp-due-nombre" type="text" placeholder="Nombre del dueño (opcional)"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input id="inp-due-tel" type="tel" inputmode="numeric" placeholder="Celular del dueño (opcional)"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
        </div>

        <!-- Textarea menú -->
        <div class="bg-white rounded-2xl shadow-sm border p-4 mb-4">
            <p class="text-xs font-semibold text-gray-500 uppercase mb-2 tracking-wide">Pega el menú aquí</p>
            <textarea id="txt-menu" rows="7"
                      placeholder="Ej: Sopas: Sancocho de pollo, Ajiaco&#10;Principios: Frijoles, Arroz&#10;Proteínas: Pechuga asada, Carne a la plancha"
                      class="w-full border rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400 font-mono"></textarea>
        </div>

        <button onclick="procesarMenu()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold text-base shadow-sm">
            Procesar menú →
        </button>
    </div>

    <!-- STEP 2: seleccionar ítems -->
    <div id="step-items" class="step">
        <div class="flex items-center gap-3 mb-3">
            <button onclick="showStep('step-menu')" class="text-xs text-indigo-600 underline">← Volver</button>
            <span class="flex-1 text-xs text-gray-400 text-right">☑ en menú &nbsp;|&nbsp; ★ mi pedido</span>
        </div>

        <div id="bloques-container"></div>

        <div class="mt-4 bg-white rounded-2xl border p-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1 tracking-wide">Notas (opcional)</label>
            <input id="inp-notas" type="text" placeholder="Sin cilantro, sin picante..."
                   class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <button onclick="iniciarConfirmar()"
                class="mt-5 w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-2xl font-bold text-base shadow-sm">
            ¡Enviar pedido! 🚀
        </button>
    </div>

    <!-- STEP 3: resultado -->
    <div id="step-done" class="step text-center">
        <div class="bg-white rounded-2xl shadow-sm border p-8 mt-4">
            <div class="text-5xl mb-4">✅</div>
            <h2 class="text-xl font-extrabold text-gray-800 mb-2">¡Pedido creado!</h2>
            <p id="lbl-done-nombre" class="text-sm text-gray-500 mb-5"></p>
            <a id="link-cocina" href="#" target="_blank"
               class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold text-base mb-3">
                Ver en cocina
            </a>
            <a id="link-wa-cocina" href="#" target="_blank"
               class="block w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-bold text-base mb-3">
                Enviar enlace por WhatsApp
            </a>
            <button onclick="nuevoAlmuerzo()"
                    class="w-full border border-gray-300 text-gray-600 py-3 rounded-2xl text-sm font-semibold hover:bg-gray-50">
                Procesar otro menú
            </button>
        </div>
    </div>

</div>

<!-- Modal identificación (aparece solo al confirmar, si no hay usuario guardado) -->
<div id="modal-id">
    <div id="modal-id-inner">
        <h3 class="text-lg font-extrabold text-gray-800 mb-1">¿Cómo te llamas?</h3>
        <p class="text-sm text-gray-500 mb-4">Para identificar tu pedido en cocina.</p>
        <input id="modal-nombre" type="text" placeholder="Tu nombre" maxlength="80" autofocus
               class="border rounded-xl px-4 py-3 text-base w-full focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-3">
        <input id="modal-tel" type="tel" inputmode="numeric" placeholder="Tu celular (opcional)" maxlength="15"
               class="border rounded-xl px-4 py-3 text-base w-full focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-4">
        <button onclick="confirmarConIdentidad()"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-2xl font-bold text-base">
            ¡Listo, enviar pedido!
        </button>
        <button onclick="cerrarModal()" class="mt-3 w-full text-sm text-gray-400 underline">Cancelar</button>
    </div>
</div>

<script>
const API = '/api/almuerzo';

let state = {
    tercero_id:        null,
    nombre:            '',
    telefono:          '',
    restaurante_id:    null,
    restaurante_nuevo: null,
    bloques: { sopa: [], principio: [], proteina: [] },
};
let tempCounter = 0;

// ───── UTILS ─────
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function toast(msg, ok = true) {
    const t = document.createElement('div');
    Object.assign(t.style, {
        position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
        background: ok ? '#1e293b' : '#dc2626', color:'#fff',
        padding:'10px 20px', borderRadius:'999px', fontSize:'0.85rem',
        zIndex:'9999', whiteSpace:'nowrap'
    });
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2800);
}

function showStep(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ───── INIT ─────
async function init() {
    // 1. Sesión Flask (prioridad máxima — viene del servidor)
    {% if usuario_pre %}
    state.tercero_id = {{ usuario_pre.tercero_id }};
    state.nombre     = {{ usuario_pre.nombre | tojson }};
    state.telefono   = {{ usuario_pre.telefono | tojson }};
    lsSet('almuerzo_tid', state.tercero_id);
    lsSet('almuerzo_nom', state.nombre);
    lsSet('almuerzo_tel', state.telefono);
    {% else %}
    // 2. Sin sesión Flask → intentar localStorage
    const tid = lsGet('almuerzo_tid');
    const nom = lsGet('almuerzo_nom');
    const tel = lsGet('almuerzo_tel');
    if (tid && nom) {
        state.tercero_id = parseInt(tid);
        state.nombre     = nom;
        state.telefono   = tel || '';
    }
    {% endif %}
    await cargarRestaurantes();
}

// ───── RESTAURANTE ─────
async function cargarRestaurantes() {
    try {
        const r = await fetch(`${API}/restaurantes`);
        const data = await r.json();
        if (!data.ok) return;
        const sel = document.getElementById('sel-restaurante');
        sel.innerHTML = '<option value="">— Selecciona un restaurante —</option>';
        data.restaurantes.forEach(rest => {
            const opt = document.createElement('option');
            opt.value = rest.id;
            opt.textContent = rest.nombre;
            sel.appendChild(opt);
        });
        sel.onchange = () => {
            state.restaurante_id    = sel.value ? parseInt(sel.value) : null;
            state.restaurante_nuevo = null;
            document.getElementById('form-nuevo-rest').classList.add('hidden');
            document.getElementById('btn-toggle-nuevo').textContent = '+ Crear restaurante nuevo';
        };
    } catch(e) {}
}

function mostrarNuevoRestaurante() {
    const form = document.getElementById('form-nuevo-rest');
    const btn  = document.getElementById('btn-toggle-nuevo');
    if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.textContent = '× Cancelar nuevo restaurante';
        document.getElementById('sel-restaurante').value = '';
        state.restaurante_id = null;
    } else {
        form.classList.add('hidden');
        btn.textContent = '+ Crear restaurante nuevo';
        state.restaurante_nuevo = null;
    }
}

// ───── PROCESAR ─────
async function procesarMenu() {
    const texto = document.getElementById('txt-menu').value.trim();
    if (!texto) { toast('Pega el texto del menú', false); return; }

    const esNuevo = !document.getElementById('form-nuevo-rest').classList.contains('hidden');
    if (esNuevo) {
        const n = document.getElementById('inp-rest-nombre').value.trim();
        if (!n) { toast('Escribe el nombre del restaurante', false); return; }
        state.restaurante_nuevo = {
            nombre:          n,
            nombre_dueno:    document.getElementById('inp-due-nombre').value.trim(),
            telefono_dueno:  document.getElementById('inp-due-tel').value.replace(/\D/g,''),
        };
        state.restaurante_id = null;
    } else {
        if (!state.restaurante_id) { toast('Selecciona un restaurante', false); return; }
    }

    const btn = document.querySelector('#step-menu button[onclick="procesarMenu()"]');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Procesando...';

    try {
        const r = await fetch(`${API}/procesar`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ texto })
        });
        const data = await r.json();
        btn.disabled = false; btn.innerHTML = 'Procesar menú →';
        if (!data.ok) { toast(data.error, false); return; }
        state.bloques = data.bloques;
        renderBloques();
        showStep('step-items');
    } catch(e) {
        btn.disabled = false; btn.innerHTML = 'Procesar menú →';
        toast('Error de conexión', false);
    }
}

// ───── RENDER BLOQUES ─────
function renderBloques() {
    const contenedor = document.getElementById('bloques-container');
    contenedor.innerHTML = '';
    [
        { cat:'sopa',      label:'Caldos / Sopas',  cls:'lbl-sopa'      },
        { cat:'principio', label:'Principios',       cls:'lbl-principio' },
        { cat:'proteina',  label:'Proteínas',        cls:'lbl-proteina'  },
    ].forEach(({ cat, label, cls }) => {
        const header = document.createElement('div');
        header.className = 'bloque-header';
        header.innerHTML = `
            <span class="bloque-label ${cls}">${label}</span>
            <button onclick="agregarItem('${cat}')" class="text-xs text-indigo-600 font-semibold border border-indigo-200 px-3 py-1 rounded-full hover:bg-indigo-50">+ Agregar</button>
        `;
        contenedor.appendChild(header);
        const lista = document.createElement('div');
        lista.id = `lista-${cat}`;
        contenedor.appendChild(lista);
        (state.bloques[cat] || []).forEach(item => renderItem(lista, item));
    });
}

function renderItem(lista, item) {
    if (!item.temp_id) item.temp_id = item.opcion_id ? `bd_${item.opcion_id}` : `new_${tempCounter++}`;
    item.en_menu   = item.en_menu   !== undefined ? item.en_menu   : true;
    item.mi_pedido = item.mi_pedido !== undefined ? item.mi_pedido : false;

    const badge = item.en_bd ? '<span class="badge-bd">BD</span>' : '<span class="badge-new">nuevo</span>';
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = `row-${item.temp_id}`;
    row.innerHTML = `
        <input type="checkbox" class="chk-menu" ${item.en_menu ? 'checked' : ''}
               onchange="toggleMenu('${item.temp_id}', this.checked)">
        <span class="nombre">${item.nombre}${badge}</span>
        <button class="btn-star ${item.mi_pedido ? 'starred' : ''}"
                onclick="togglePedido('${item.temp_id}')">★</button>
    `;
    lista.appendChild(row);
}

function toggleMenu(tid, val) {
    const item = encontrarItem(tid);
    if (item) item.en_menu = val;
}

function togglePedido(tid) {
    const item = encontrarItem(tid);
    if (!item) return;
    if (!item.mi_pedido) {
        // Deseleccionar el anterior de la misma categoría
        (state.bloques[item.tipo] || []).forEach(i => {
            i.mi_pedido = false;
            const btn = document.querySelector(`#row-${i.temp_id} .btn-star`);
            if (btn) btn.classList.remove('starred');
        });
        item.mi_pedido = true;
        document.querySelector(`#row-${tid} .btn-star`)?.classList.add('starred');
    } else {
        item.mi_pedido = false;
        document.querySelector(`#row-${tid} .btn-star`)?.classList.remove('starred');
    }
}

function encontrarItem(tid) {
    for (const cat of ['sopa','principio','proteina']) {
        const f = (state.bloques[cat] || []).find(i => String(i.temp_id) === String(tid));
        if (f) return f;
    }
    return null;
}

function agregarItem(cat) {
    const nombre = prompt(`Agregar ítem (${cat}):`);
    if (!nombre?.trim()) return;
    const item = { nombre: nombre.trim(), tipo: cat, en_bd: false, opcion_id: null,
                   temp_id: `new_${tempCounter++}`, en_menu: true, mi_pedido: false };
    if (!state.bloques[cat]) state.bloques[cat] = [];
    state.bloques[cat].push(item);
    renderItem(document.getElementById(`lista-${cat}`), item);
}

// ───── CONFIRMAR ─────
function iniciarConfirmar() {
    const items_menu = [...state.bloques.sopa, ...state.bloques.principio, ...state.bloques.proteina]
        .filter(i => i.en_menu);
    if (!items_menu.length) { toast('Marca al menos un ítem', false); return; }

    if (state.tercero_id && state.nombre) {
        // Ya identificado → enviar directo
        enviarPedido();
    } else {
        // Preguntar nombre al final
        document.getElementById('modal-id').classList.add('open');
        setTimeout(() => document.getElementById('modal-nombre').focus(), 100);
    }
}

function cerrarModal() {
    document.getElementById('modal-id').classList.remove('open');
}

async function confirmarConIdentidad() {
    const nombre = document.getElementById('modal-nombre').value.trim();
    const tel    = document.getElementById('modal-tel').value.replace(/\D/g,'') || '';
    if (!nombre) { toast('Escribe tu nombre', false); return; }

    const btn = document.querySelector('#modal-id-inner button[onclick="confirmarConIdentidad()"]');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creando...';

    try {
        const r = await fetch(`${API}/tercero`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nombre, telefono: tel })
        });
        const data = await r.json();
        btn.disabled = false; btn.innerHTML = '¡Listo, enviar pedido!';
        if (!data.ok) { toast(data.error, false); return; }

        state.tercero_id = data.tercero_id;
        state.nombre     = data.nombre;
        state.telefono   = data.telefono || '';
        lsSet('almuerzo_tid', state.tercero_id);
        lsSet('almuerzo_nom', state.nombre);
        lsSet('almuerzo_tel', state.telefono);

        cerrarModal();
        await enviarPedido();
    } catch(e) {
        btn.disabled = false; btn.innerHTML = '¡Listo, enviar pedido!';
        toast('Error de conexión', false);
    }
}

async function enviarPedido() {
    const todos = [...state.bloques.sopa, ...state.bloques.principio, ...state.bloques.proteina];
    const payload = {
        tercero_id:        state.tercero_id,
        restaurante_id:    state.restaurante_nuevo ? null : state.restaurante_id,
        restaurante_nuevo: state.restaurante_nuevo || null,
        items:             todos,
        notas:             document.getElementById('inp-notas').value.trim() || null,
    };

    const btn = document.querySelector('#step-items button[onclick="iniciarConfirmar()"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...'; }

    try {
        const r = await fetch(`${API}/confirmar`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await r.json();
        if (btn) { btn.disabled = false; btn.innerHTML = '¡Enviar pedido! 🚀'; }
        if (!data.ok) { toast(data.error, false); return; }

        const url = window.location.origin + data.cocina_url;
        document.getElementById('link-cocina').href = url;
        document.getElementById('link-wa-cocina').href =
            `https://wa.me/?text=${encodeURIComponent(`¡Hola! Te hice el pedido de hoy por acá: ${url}`)}`;
        document.getElementById('lbl-done-nombre').textContent =
            `Pedido de ${state.nombre} — el restaurante ya lo ve en cocina.`;
        showStep('step-done');
    } catch(e) {
        if (btn) { btn.disabled = false; btn.innerHTML = '¡Enviar pedido! 🚀'; }
        toast('Error de conexión', false);
    }
}

function nuevoAlmuerzo() {
    state.bloques = { sopa: [], principio: [], proteina: [] };
    state.restaurante_nuevo = null;
    document.getElementById('txt-menu').value = '';
    document.getElementById('inp-notas').value = '';
    showStep('step-menu');
}

init();
</script>
</body>
</html>
