<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Caja — {{ tienda.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px; color: white; font-weight: 600;
            z-index: 9999; opacity: 0; transition: opacity 0.3s; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
        .toast-ok { background: #059669; }
        .toast-err { background: #dc2626; }
        #lista-productos { max-height: 55vh; overflow-y: auto; }
        #carrito-items { max-height: 40vh; overflow-y: auto; }
        .prod-btn { transition: transform 0.1s; }
        .prod-btn:active { transform: scale(0.95); }
        @media (min-width: 768px) {
            #layout { display: grid; grid-template-columns: 1fr 380px; gap: 1rem; }
            #lista-productos { max-height: 75vh; }
            #carrito-items { max-height: 50vh; }
        }

        /* ── Ticket de impresión ── */
        #ticket-print { display: none; }
        @media print {
            body > *:not(#ticket-print) { display: none !important; }
            #ticket-print {
                display: block !important;
                font-family: 'Courier New', monospace;
                font-size: 13px;
                width: 280px;
                margin: 0 auto;
                padding: 8px;
                color: #000;
            }
            #ticket-print .sep { border-top: 1px dashed #000; margin: 6px 0; }
            #ticket-print .linea { display: flex; justify-content: space-between; }
            #ticket-print .total-line { font-size: 16px; font-weight: bold; }
            #ticket-print .centro { text-align: center; }
        }
    </style>
</head>
<body class="min-h-screen">

<div id="toast" class="toast"></div>

<!-- ── Ticket oculto para imprimir ──────────────────────────────────────── -->
<div id="ticket-print"></div>

<!-- ── PANTALLA LOGIN PIN ─────────────────────────────────────────────── -->
<div id="pantalla-pin" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm text-center">
        {% if tienda.imagen_header %}
        <img src="{{ tienda.imagen_header }}" class="h-16 w-auto mx-auto mb-4 rounded-xl object-cover" alt="">
        {% endif %}
        <h1 class="text-2xl font-bold text-gray-800 mb-1">{{ tienda.nombre }}</h1>
        <p class="text-gray-500 mb-6">Caja — Ingresa tu PIN</p>
        <div class="flex gap-3 justify-center mb-6">
            <input id="pin-input" type="password" inputmode="numeric" maxlength="10"
                   placeholder="••••"
                   class="w-full text-center text-2xl tracking-widest border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-blue-500"
                   onkeydown="if(event.key==='Enter') verificarPin()">
        </div>
        <button onclick="verificarPin()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-lg">
            Entrar
        </button>
        <p id="pin-error" class="text-red-500 text-sm mt-3 hidden"></p>
    </div>
</div>

<!-- ── PANTALLA CAJA ──────────────────────────────────────────────────── -->
<div id="pantalla-caja" class="hidden p-3">

    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
            <h1 class="font-bold text-gray-800 text-lg">{{ tienda.nombre }}</h1>
            <span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">Caja</span>
            <span id="badge-cajero" class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full hidden"></span>
        </div>
        <button onclick="cerrarSesionCaja()" class="text-xs text-gray-400 hover:text-gray-600">Salir</button>
    </div>

    <div id="layout">
        <!-- ── Panel izquierdo: catálogo ── -->
        <div>
            <!-- Búsqueda -->
            <div class="relative mb-3">
                <input id="busqueda" type="search" placeholder="Buscar por nombre o código de barras…"
                       class="w-full border border-gray-200 rounded-xl pl-4 pr-10 py-2.5 text-sm focus:outline-none focus:border-blue-400"
                       oninput="filtrarProductos(this.value)">
                <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
            </div>

            <!-- Filtro categorías -->
            <div id="categorias" class="flex gap-2 overflow-x-auto pb-1 mb-2 text-sm"></div>

            <!-- Grid productos -->
            <div id="lista-productos" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>

        <!-- ── Panel derecho: carrito ── -->
        <div class="mt-4 md:mt-0">
            <div class="bg-white rounded-2xl shadow p-4 sticky top-3">
                <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
                    🛒 Carrito
                    <span id="carrito-count" class="bg-blue-600 text-white text-xs font-bold rounded-full px-2 py-0.5">0</span>
                </h2>

                <!-- Cliente (opcional) -->
                <div class="mb-3 space-y-2">
                    <input id="nombre-cliente" type="text" placeholder="Nombre cliente (opcional)"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                    <input id="tel-cliente" type="tel" placeholder="Teléfono (opcional)"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                </div>

                <!-- Items carrito -->
                <div id="carrito-items" class="space-y-2 mb-3"></div>

                <!-- Total -->
                <div class="border-t pt-3 mb-3">
                    <p id="iva-display" class="text-xs text-gray-400 text-right mb-1 hidden"></p>
                    <div class="flex justify-between items-center text-lg font-bold">
                        <span>Total</span>
                        <span id="total-display" class="text-blue-700">$0</span>
                    </div>
                </div>

                <!-- Métodos de pago -->
                <div class="mb-3">
                    <p class="text-xs text-gray-500 font-semibold mb-1">Métodos de pago</p>
                    <div id="metodos-pago-inputs" class="space-y-1.5"></div>
                    <p id="pago-alerta" class="hidden text-xs text-red-500 font-semibold mt-1"></p>
                </div>

                <!-- Cobrar -->
                <button onclick="cobrar()" id="btn-cobrar"
                        class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-40 text-white font-bold py-3 rounded-xl text-base"
                        disabled>
                    Cobrar
                </button>

                <button onclick="abrirPantallaCliente()"
                        class="w-full mt-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-100 font-bold py-2.5 rounded-xl text-sm">
                    Pantalla cliente
                </button>

                <!-- Vaciar -->
                <button onclick="vaciarCarrito()"
                        class="w-full mt-2 text-xs text-gray-400 hover:text-red-500">
                    Vaciar carrito
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ── Modal recibo ─────────────────────────────────────────────────── -->
<div id="modal-cliente" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6" onclick="event.stopPropagation()">
        <div class="flex items-start justify-between gap-3 mb-4">
            <div>
                <h2 class="font-bold text-xl text-gray-800">Pantalla cliente</h2>
                <p class="text-sm text-gray-500 mt-1">Muestra este QR para que el cliente vea su compra en el celular.</p>
            </div>
            <button onclick="cerrarPantallaCliente()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <div id="qr-cliente" class="flex justify-center bg-gray-50 rounded-2xl p-4 mb-4"></div>
        <input id="link-cliente" readonly
               class="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-600 mb-3">
        <div class="grid grid-cols-2 gap-2">
            <button onclick="copiarLinkCliente()"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm">
                Copiar link
            </button>
            <a id="wa-cliente" target="_blank"
               class="text-center bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 rounded-xl text-sm">
                WhatsApp
            </a>
        </div>
    </div>
</div>

<div id="modal-recibo" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
        <div class="text-center mb-4">
            <div class="text-4xl mb-2">✅</div>
            <h2 class="font-bold text-xl mb-1">Venta registrada</h2>
            <p id="recibo-total" class="text-3xl font-black text-green-600 mb-1"></p>
            <p id="recibo-metodo" class="text-sm text-gray-500"></p>
            <p id="recibo-cajero" class="text-xs text-gray-400 mt-0.5"></p>
        </div>

        <!-- Detalle items -->
        <div id="recibo-items" class="border rounded-xl p-3 mb-4 space-y-1 max-h-48 overflow-y-auto text-sm"></div>

        <!-- Botones -->
        <div class="space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="imprimirTicket()"
                        class="flex items-center justify-center gap-1.5 border border-gray-300 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-50 text-sm">
                    🖨️ Imprimir
                </button>
                <button id="btn-wa-recibo" onclick="compartirWhatsApp()"
                        class="flex items-center justify-center gap-1.5 bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 rounded-xl text-sm">
                    📲 WhatsApp
                </button>
            </div>
            <button onclick="nuevaVenta()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-lg">
                Nueva venta
            </button>
        </div>
    </div>
</div>

<script>
const SLUG = '{{ slug }}';
const TIENDA_NOMBRE = '{{ tienda.nombre }}';
const TERCERO_ID = {{ tienda.tercero_id | tojson }};
const MODO_ADMIN = {{ (modo_admin|default(false)) | tojson }};
let productos = [];
let carrito = [];
let categoriaActiva = '';
let metodosDisponibles = [];  // [{id, nombre, codigo}]
let autenticado = false;
let cajeroId = null;
let cajeroNombre = '';
let cajeroTerceroId = null;
let clienteToken = null;
let clienteUpdateKey = '';
let clienteUrl = '';
let clienteQrGenerado = false;
// Datos del último recibo (para ticket e imprimir)
let ultimoRecibo = null;

async function iniciarCajaAdmin() {
    autenticado = true;
    cajeroId = null;
    cajeroNombre = 'Administrador';
    cajeroTerceroId = null;
    const badge = document.getElementById('badge-cajero');
    badge.textContent = 'Administrador';
    badge.classList.remove('hidden');
    document.getElementById('pantalla-pin').classList.add('hidden');
    document.getElementById('pantalla-caja').classList.remove('hidden');
    cargarMetodosPago();
    cargarProductos();
}

if (MODO_ADMIN) {
    iniciarCajaAdmin();
}

// ── PIN ──────────────────────────────────────────────────────────────────────

async function verificarPin() {
    const pin = document.getElementById('pin-input').value.trim();
    if (!pin) return;
    try {
        const r = await fetch(`/api/tienda/${SLUG}/verificar-pin-caja`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pin})
        });
        const d = await r.json();
        if (d.ok) {
            autenticado = true;
            cajeroId = d.id_cajero;
            cajeroNombre = d.nombre_cajero;
            cajeroTerceroId = d.tercero_id || null;
            // Mostrar badge de cajero
            const badge = document.getElementById('badge-cajero');
            badge.textContent = `👤 ${cajeroNombre}`;
            badge.classList.remove('hidden');
            document.getElementById('pantalla-pin').classList.add('hidden');
            document.getElementById('pantalla-caja').classList.remove('hidden');
            cargarMetodosPago();
            cargarProductos();
        } else {
            document.getElementById('pin-error').textContent = d.error;
            document.getElementById('pin-error').classList.remove('hidden');
        }
    } catch {
        document.getElementById('pin-error').textContent = 'Error de conexión';
        document.getElementById('pin-error').classList.remove('hidden');
    }
}

document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') verificarPin();
});

function cerrarSesionCaja() {
    autenticado = false;
    cajeroId = null;
    cajeroNombre = '';
    cajeroTerceroId = null;
    clienteToken = null;
    clienteUpdateKey = '';
    clienteUrl = '';
    clienteQrGenerado = false;
    carrito = [];
    document.getElementById('badge-cajero').classList.add('hidden');
    document.getElementById('pantalla-caja').classList.add('hidden');
    document.getElementById('pantalla-pin').classList.remove('hidden');
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-error').classList.add('hidden');
}

// ── Productos ────────────────────────────────────────────────────────────────

function resumenCarrito(estado = 'activa', recibo = null) {
    const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
    const iva = carrito.reduce((s, i) => {
        if (!i.iva_pct) return s;
        return s + (i.precio * i.cantidad * i.iva_pct / (100 + i.iva_pct));
    }, 0);
    return {
        estado,
        total,
        iva: Math.round(iva),
        items: carrito.map(i => ({
            producto_id: i.producto_id,
            nombre: i.nombre,
            precio: i.precio,
            cantidad: i.cantidad,
            iva_pct: i.iva_pct || 0
        })),
        recibo
    };
}

async function abrirPantallaCliente() {
    try {
        if (!clienteToken) {
            const r = await fetch(`/api/tienda/${SLUG}/caja/sesion`, {method: 'POST'});
            const d = await r.json();
            if (!d.ok) throw new Error(d.error || 'No se pudo crear la sesion');
            clienteToken = d.token;
            clienteUpdateKey = d.update_key || '';
            clienteUrl = new URL(d.url, location.origin).href;
            clienteQrGenerado = false;
            await publicarPantallaCliente();
        }

        document.getElementById('link-cliente').value = clienteUrl;
        document.getElementById('wa-cliente').href = `https://wa.me/?text=${encodeURIComponent('Puedes ver tu compra aqui: ' + clienteUrl)}`;
        const qr = document.getElementById('qr-cliente');
        if (!clienteQrGenerado) {
            qr.innerHTML = '';
            new QRCode(qr, {text: clienteUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
            clienteQrGenerado = true;
        }
        document.getElementById('modal-cliente').classList.remove('hidden');
    } catch (e) {
        toast(e.message || 'Error al crear pantalla cliente', true);
    }
}

function cerrarPantallaCliente() {
    document.getElementById('modal-cliente').classList.add('hidden');
}

async function copiarLinkCliente() {
    if (!clienteUrl) return;
    await navigator.clipboard.writeText(clienteUrl);
    toast('Link copiado');
}

async function publicarPantallaCliente(estado = 'activa', recibo = null) {
    if (!clienteToken) return;
    try {
        await fetch(`/api/tienda/${SLUG}/caja/sesion/${clienteToken}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Caja-Session-Key': clienteUpdateKey},
            body: JSON.stringify(resumenCarrito(estado, recibo))
        });
    } catch (e) {
        console.warn('No se pudo actualizar pantalla cliente', e);
    }
}

async function cargarProductos() {
    try {
        const r = await fetch(`/api/tienda/${SLUG}/productos`);
        const d = await r.json();
        if (d.ok) {
            productos = d.productos.filter(p => p.disponible);
            renderCategorias();
            renderProductos(productos);
        }
    } catch {
        toast('Error al cargar productos', true);
    }
}

function renderCategorias() {
    const cats = ['Todos', ...new Set(productos.map(p => p.categoria).filter(Boolean))];
    const cont = document.getElementById('categorias');
    cont.innerHTML = cats.map(c => `
        <button onclick="filtrarCategoria('${c}')"
                class="categoria-btn shrink-0 px-3 py-1 rounded-full border text-xs font-semibold
                       ${c === 'Todos' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200'}"
                data-cat="${c}">${c}</button>
    `).join('');
}

function filtrarCategoria(cat) {
    categoriaActiva = cat === 'Todos' ? '' : cat;
    document.querySelectorAll('.categoria-btn').forEach(b => {
        const activo = b.dataset.cat === cat;
        b.className = `categoria-btn shrink-0 px-3 py-1 rounded-full border text-xs font-semibold ${activo ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200'}`;
    });
    const q = document.getElementById('busqueda').value;
    filtrarProductos(q);
}

function filtrarProductos(q) {
    let lista = productos;
    if (categoriaActiva) lista = lista.filter(p => p.categoria === categoriaActiva);
    if (q && q.length >= 1) {
        const ql = q.toLowerCase();
        lista = lista.filter(p =>
            p.nombre.toLowerCase().includes(ql) ||
            (p.codigo_barra && p.codigo_barra.includes(q))
        );
    }
    renderProductos(lista);
}

function renderProductos(lista) {
    const cont = document.getElementById('lista-productos');
    if (!lista.length) {
        cont.innerHTML = '<p class="col-span-full text-center text-gray-400 py-8 text-sm">Sin resultados</p>';
        return;
    }
    cont.innerHTML = lista.map(p => `
        <button onclick="agregarAlCarrito(${p.id})"
                class="prod-btn bg-white rounded-xl shadow-sm p-3 text-left hover:shadow-md active:bg-blue-50">
            ${p.imagen ? `<img src="${p.imagen}" class="w-full h-24 object-cover rounded-lg mb-2" alt="">` : '<div class="w-full h-16 bg-gray-100 rounded-lg mb-2 flex items-center justify-center text-2xl">🛍️</div>'}
            <p class="font-semibold text-gray-800 text-sm leading-tight">${p.nombre}</p>
            ${p.categoria ? `<p class="text-xs text-gray-400 mt-0.5">${p.categoria}</p>` : ''}
            <p class="font-bold text-blue-700 mt-1">$${p.precio.toLocaleString('es-CO')}</p>
        </button>
    `).join('');
}

// ── Carrito ──────────────────────────────────────────────────────────────────

function agregarAlCarrito(productoId) {
    const prod = productos.find(p => p.id === productoId);
    if (!prod) return;
    const existente = carrito.find(i => i.producto_id === productoId);
    if (existente) {
        existente.cantidad++;
    } else {
        carrito.push({producto_id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1, iva_pct: prod.iva_pct || 0});
    }
    renderCarrito();
    toast(`${prod.nombre} agregado`);
}

function cambiarCantidad(productoId, delta) {
    const idx = carrito.findIndex(i => i.producto_id === productoId);
    if (idx === -1) return;
    carrito[idx].cantidad += delta;
    if (carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
    renderCarrito();
}

function vaciarCarrito() {
    carrito = [];
    renderCarrito();
}

function renderCarrito() {
    const cont = document.getElementById('carrito-items');
    const count = carrito.reduce((s, i) => s + i.cantidad, 0);
    document.getElementById('carrito-count').textContent = count;

    if (!carrito.length) {
        cont.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Carrito vacío</p>';
        document.getElementById('total-display').textContent = '$0';
        const ivaElEmpty = document.getElementById('iva-display');
        if (ivaElEmpty) ivaElEmpty.classList.add('hidden');
        document.getElementById('btn-cobrar').disabled = true;
        publicarPantallaCliente();
        return;
    }

    cont.innerHTML = carrito.map(i => `
        <div class="flex items-center gap-2">
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-700 truncate">${i.nombre}</p>
                <p class="text-xs text-gray-400">$${(i.precio * i.cantidad).toLocaleString('es-CO')}</p>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="cambiarCantidad(${i.producto_id}, -1)"
                        class="w-7 h-7 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-red-100 hover:text-red-600 text-lg leading-none">−</button>
                <span class="w-6 text-center text-sm font-bold">${i.cantidad}</span>
                <button onclick="cambiarCantidad(${i.producto_id}, 1)"
                        class="w-7 h-7 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-green-100 hover:text-green-600 text-lg leading-none">+</button>
            </div>
        </div>
    `).join('');

    const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
    const ivaTotal = carrito.reduce((s, i) => {
        if (!i.iva_pct) return s;
        return s + (i.precio * i.cantidad * i.iva_pct / (100 + i.iva_pct));
    }, 0);
    document.getElementById('total-display').textContent = `$${total.toLocaleString('es-CO')}`;
    const ivaEl = document.getElementById('iva-display');
    if (ivaEl) {
        if (ivaTotal > 0) {
            ivaEl.textContent = `IVA incluido: $${Math.round(ivaTotal).toLocaleString('es-CO')}`;
            ivaEl.classList.remove('hidden');
        } else {
            ivaEl.classList.add('hidden');
        }
    }
    validarPagos();  // delegar al validador de pagos
    publicarPantallaCliente();
}

// ── Métodos de pago ───────────────────────────────────────────────────────────

async function cargarMetodosPago() {
    try {
        const r = await fetch(`/api/negocio/${TERCERO_ID}/config/publica`);
        const d = await r.json();
        if (d.ok && d.metodos_pago && d.metodos_pago.length) {
            metodosDisponibles = d.metodos_pago;
        } else {
            metodosDisponibles = [{nombre: 'Efectivo', codigo: 'efectivo', icono: '💵'}];
        }
        renderMetodosPago();
    } catch(e) {
        metodosDisponibles = [{nombre: 'Efectivo', codigo: 'efectivo', icono: '💵'}];
        renderMetodosPago();
    }
}

function renderMetodosPago() {
    const cont = document.getElementById('metodos-pago-inputs');
    cont.innerHTML = metodosDisponibles.map(m => `
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-600 w-28 flex-shrink-0">${m.nombre}</span>
            <input type="number" min="0" step="100" value="0" placeholder="$0"
                   id="mp-${m.codigo}"
                   class="border rounded-lg px-2 py-1 text-sm w-full text-right"
                   oninput="validarPagos()">
        </div>
    `).join('');
}

function getPagos() {
    return metodosDisponibles
        .map(m => ({codigo: m.codigo, nombre: m.nombre, monto: parseFloat(document.getElementById(`mp-${m.codigo}`)?.value || 0)}))
        .filter(p => p.monto > 0);
}

function validarPagos() {
    const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
    const sumPagos = metodosDisponibles.reduce((s, m) => {
        return s + (parseFloat(document.getElementById(`mp-${m.codigo}`)?.value || 0));
    }, 0);
    const alerta = document.getElementById('pago-alerta');
    const btn = document.getElementById('btn-cobrar');
    if (total === 0) { alerta.classList.add('hidden'); btn.disabled = true; return; }
    if (sumPagos === 0) {
        alerta.textContent = 'Ingresa el monto pagado';
        alerta.classList.remove('hidden');
        btn.disabled = true;
    } else if (Math.round(sumPagos) !== Math.round(total)) {
        const diff = Math.round(total - sumPagos);
        alerta.textContent = diff > 0 ? `Faltan $${Math.abs(diff).toLocaleString('es-CO')}` : `Sobran $${Math.abs(diff).toLocaleString('es-CO')}`;
        alerta.classList.remove('hidden');
        btn.disabled = true;
    } else {
        alerta.classList.add('hidden');
        btn.disabled = false;
    }
}

function limpiarPagos() {
    metodosDisponibles.forEach(m => {
        const inp = document.getElementById(`mp-${m.codigo}`);
        if (inp) inp.value = '0';
    });
    document.getElementById('pago-alerta').classList.add('hidden');
}

// ── Cobrar ───────────────────────────────────────────────────────────────────

async function cobrar() {
    if (!carrito.length) return;
    const btn = document.getElementById('btn-cobrar');
    btn.disabled = true;
    btn.textContent = 'Procesando…';

    const nombre = document.getElementById('nombre-cliente').value.trim();
    const telefono = document.getElementById('tel-cliente').value.trim();

    const pagos = getPagos();
    const payload = {
        items: carrito.map(i => ({producto_id: i.producto_id, cantidad: i.cantidad})),
        tipo_entrega: 'caja',
        pagos,
        metodo_pago: pagos.length ? pagos[0].codigo : 'efectivo',
        nombre_cliente: nombre || 'Venta en caja',
        telefono_cliente: telefono || '',
        id_cajero: cajeroId,
        nombre_cajero: cajeroNombre,
        id_tercero_cajero: cajeroTerceroId
    };

    try {
        const r = await fetch(`/api/tienda/${SLUG}/pedido`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const d = await r.json();
        if (d.ok) {
            const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
            const iva = carrito.reduce((s, i) => {
                if (!i.iva_pct) return s;
                return s + (i.precio * i.cantidad * i.iva_pct / (100 + i.iva_pct));
            }, 0);
            ultimoRecibo = {
                total,
                iva: Math.round(iva),
                subtotal: Math.round(total - iva),
                pagos,
                metodo: pagos.length ? pagos.map(p => p.nombre).join(' + ') : 'Efectivo',
                cliente: nombre,
                telefono,
                cajero: cajeroNombre,
                pedido_id: d.pedido_id || null,
                fecha: new Date().toISOString(),
                tienda: TIENDA_NOMBRE,
                items: carrito.map(i => ({...i}))
            };
            publicarPantallaCliente('cobrada', {...ultimoRecibo, telefono: ''});
            mostrarRecibo();
        } else {
            toast(d.error || 'Error al registrar venta', true);
            btn.disabled = false;
            btn.textContent = 'Cobrar';
        }
    } catch {
        toast('Error de conexión', true);
        btn.disabled = false;
        btn.textContent = 'Cobrar';
    }
}

function mostrarRecibo() {
    const r = ultimoRecibo;
    document.getElementById('recibo-total').textContent = `$${r.total.toLocaleString('es-CO')}`;
    const metodoTexto = r.pagos && r.pagos.length > 1
        ? r.pagos.map(p => `${p.nombre} $${p.monto.toLocaleString('es-CO')}`).join(' · ')
        : r.metodo;
    document.getElementById('recibo-metodo').textContent = metodoTexto;
    document.getElementById('recibo-cajero').textContent = r.cajero ? `Cajero: ${r.cajero}` : '';

    // Detalle de items
    const itemsEl = document.getElementById('recibo-items');
    const ivaLines = r.iva > 0 ? `
        <div class="flex justify-between text-gray-500 text-sm">
            <span>Subtotal</span>
            <span>$${r.subtotal.toLocaleString('es-CO')}</span>
        </div>
        <div class="flex justify-between text-gray-500 text-sm">
            <span>IVA incluido</span>
            <span>$${r.iva.toLocaleString('es-CO')}</span>
        </div>` : '';
    itemsEl.innerHTML = r.items.map(i => `
        <div class="flex justify-between text-gray-700">
            <span>${i.cantidad}x ${i.nombre}${i.iva_pct > 0 ? ` <span class="text-xs text-gray-400">(+IVA ${i.iva_pct}%)</span>` : ''}</span>
            <span class="font-semibold">$${(i.precio * i.cantidad).toLocaleString('es-CO')}</span>
        </div>
    `).join('') + `
        <div class="border-t mt-2 pt-2"></div>
        ${ivaLines}
        <div class="flex justify-between font-bold text-gray-900">
            <span>Total</span>
            <span>$${r.total.toLocaleString('es-CO')}</span>
        </div>`;

    // Mostrar botón WA solo si hay teléfono
    document.getElementById('btn-wa-recibo').style.display = r.telefono ? '' : 'none';

    document.getElementById('modal-recibo').classList.remove('hidden');
}

// ── Ticket impresión ─────────────────────────────────────────────────────────

function imprimirTicket() {
    const r = ultimoRecibo;
    if (!r) return;
    const ahora = new Date().toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});

    let lineasItems = r.items.map(i => {
        const total = `$${(i.precio * i.cantidad).toLocaleString('es-CO')}`;
        const desc = `${i.cantidad}x ${i.nombre}`;
        // Alinear precio a la derecha en 32 chars
        const spaces = Math.max(1, 32 - desc.length - total.length);
        return `<div class="linea"><span>${desc}</span><span>${total}</span></div>`;
    }).join('');

    document.getElementById('ticket-print').innerHTML = `
        <div class="centro"><strong>${TIENDA_NOMBRE}</strong></div>
        <div class="centro" style="font-size:11px;">${ahora}</div>
        ${r.cajero ? `<div class="centro" style="font-size:11px;">Cajero: ${r.cajero}</div>` : ''}
        ${r.cliente ? `<div class="centro" style="font-size:11px;">Cliente: ${r.cliente}</div>` : ''}
        <div class="sep"></div>
        ${lineasItems}
        <div class="sep"></div>
        ${r.iva > 0 ? `<div class="linea" style="font-size:11px;"><span>Subtotal</span><span>$${r.subtotal.toLocaleString('es-CO')}</span></div>
        <div class="linea" style="font-size:11px;"><span>IVA incluido</span><span>$${r.iva.toLocaleString('es-CO')}</span></div>` : ''}
        <div class="linea total-line"><span>TOTAL</span><span>$${r.total.toLocaleString('es-CO')}</span></div>
        <div style="font-size:11px;">${r.pagos && r.pagos.length > 1 ? r.pagos.map(p=>`${p.nombre}: $${p.monto.toLocaleString('es-CO')}`).join(' | ') : `Pago: ${r.metodo}`}</div>
        <div class="sep"></div>
        <div class="centro" style="font-size:11px; margin-top:8px;">¡Gracias por su compra!</div>
    `;
    window.print();
}

// ── WhatsApp ─────────────────────────────────────────────────────────────────

function compartirWhatsApp() {
    const r = ultimoRecibo;
    if (!r || !r.telefono) return;
    const lineas = r.items.map(i => `  ${i.cantidad}x ${i.nombre} — $${(i.precio * i.cantidad).toLocaleString('es-CO')}`).join('\n');
    const resumenIva = r.iva > 0
        ? `Subtotal: $${r.subtotal.toLocaleString('es-CO')}\nIVA incluido: $${r.iva.toLocaleString('es-CO')}\n`
        : '';
    const pagosTexto = r.pagos && r.pagos.length > 1
        ? r.pagos.map(p => `${p.nombre}: $${p.monto.toLocaleString('es-CO')}`).join(' + ')
        : r.metodo;
    const texto = `*${TIENDA_NOMBRE}* — Recibo de compra\n\n${lineas}\n\n${resumenIva}*Total: $${r.total.toLocaleString('es-CO')}*\nPago: ${pagosTexto}\n\n¡Gracias por su compra!`;
    // Limpiar teléfono: solo dígitos
    const tel = r.telefono.replace(/\D/g, '');
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, '_blank');
}

function nuevaVenta() {
    document.getElementById('modal-recibo').classList.add('hidden');
    carrito = [];
    ultimoRecibo = null;
    clienteToken = null;
    clienteUpdateKey = '';
    clienteUrl = '';
    clienteQrGenerado = false;
    document.getElementById('modal-cliente').classList.add('hidden');
    document.getElementById('nombre-cliente').value = '';
    document.getElementById('tel-cliente').value = '';
    renderCarrito();
    limpiarPagos();
    document.getElementById('btn-cobrar').textContent = 'Cobrar';
    cargarProductos(); // recargar stock actualizado
}

// ── Toast ────────────────────────────────────────────────────────────────────

function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${err ? 'toast-err' : 'toast-ok'}`;
    setTimeout(() => t.className = 'toast', 2500);
}
</script>
