<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuc Tuc Rockola · {{ sala_id | upper }}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ac1: #00d4ff;
  --ac1-dim: rgba(0,212,255,0.15);
  --ac1-bg: rgba(0,212,255,0.08);
  --ac2: #0066ff;
  --ac-grad: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
  --bg: #060c18;
  --surface: #0d1a2e;
  --surface2: #132440;
  --border: rgba(0,212,255,0.15);
  --text: #e2eeff;
  --muted: #4a6480;
  --muted2: #2a3d55;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0 0 60px;
}

@keyframes fadeUp    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes spin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes glow      { 0%,100%{box-shadow:0 0 24px var(--ac1-dim)} 50%{box-shadow:0 0 50px var(--ac1-dim),0 0 80px rgba(0,212,255,.08)} }
@keyframes wave      { 0%,100%{height:5px} 50%{height:20px} }
@keyframes pulse     { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.9)} }

/* ── ACTIVAR ── */
#pantalla-activar {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  animation: fadeUp .4s ease;
}
.activar-vinyl { margin-bottom: 28px; }
.activar-sala { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.activar-nombre { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.activar-nombre span { color: var(--ac1); }
.activar-sub { font-size: 13px; color: var(--muted); margin-bottom: 36px; }
.btn-activar {
  padding: 18px 56px;
  font-size: 18px;
  font-weight: 800;
  background: var(--ac-grad);
  color: #000;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  animation: glow 2.5s ease-in-out infinite;
  transition: transform .15s;
}
.btn-activar:active { transform: scale(.97); }

/* ── PRINCIPAL ── */
#pantalla-principal { display: none; }

.inner { max-width: 440px; margin: 0 auto; padding: 20px 16px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.header-back {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.sala-badge {
  font-size: 12px; font-weight: 700;
  letter-spacing: 2px;
  color: var(--ac1);
  background: var(--ac1-bg);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 8px;
}
.btn-share {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px; font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
}
.btn-share:hover { border-color: var(--ac1); color: var(--ac1); }

/* Now playing */
.now-playing {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 12px;
}
.np-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.np-info { flex: 1; overflow: hidden; }
.np-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.np-nombre { font-size: 17px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wave-viz { display: flex; align-items: center; gap: 3px; height: 26px; flex-shrink: 0; }
.wave-bar { width: 3px; border-radius: 2px; background: var(--ac1); }
audio { width: 100%; filter: invert(1) hue-rotate(180deg); opacity: .75; }

/* Upload */
.upload-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
}
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 12px;
  position: relative;
}
.drop-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0;
  cursor: pointer; width: 100%; height: 100%;
}
.drop-zone:hover, .drop-zone.over { border-color: var(--ac1); background: var(--ac1-bg); }
.drop-icon { font-size: 28px; margin-bottom: 6px; }
.drop-text { color: var(--muted); font-size: 13px; line-height: 1.5; }
.drop-text strong { color: var(--text); }
.drop-text.selected { color: var(--ac1); font-weight: 700; }
.progress-bg { background: var(--surface2); border-radius: 6px; height: 4px; overflow: hidden; margin-bottom: 10px; display: none; }
.progress-fill { height: 100%; background: var(--ac-grad); border-radius: 6px; width: 0%; transition: width .1s; }
.btn-upload {
  width: 100%; padding: 14px;
  background: var(--ac-grad);
  color: #000; border: none;
  border-radius: 12px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800; font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--ac1-dim);
  transition: opacity .2s;
}
.btn-upload:disabled { background: var(--surface2); color: var(--muted); box-shadow: none; cursor: default; }
.upload-status { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 16px; }
.upload-status.ok { color: #22c55e; font-weight: 600; }
.upload-status.error { color: #ef4444; }

/* Queue */
.queue-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
}
.queue-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.queue-list { list-style: none; }
.queue-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  background: var(--surface2);
  border-radius: 12px;
  margin-bottom: 6px;
  border-left: 3px solid transparent;
  transition: all .25s;
  cursor: grab;
}
.queue-item.playing {
  border-left-color: var(--ac1);
  background: var(--ac1-bg);
}
.queue-item .handle { color: var(--muted2); font-size: 15px; flex-shrink: 0; }
.queue-item .q-nombre { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-item.playing .q-nombre { color: var(--ac1); }
.queue-item .q-pos { font-size: 11px; color: var(--muted); flex-shrink: 0; font-weight: 600; }
.queue-empty { text-align: center; color: var(--muted2); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<!-- PANTALLA ACTIVAR -->
<div id="pantalla-activar">
  <div class="activar-vinyl">
    <svg width="80" height="80" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#0d1a2e" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="20" cy="20" r="13" fill="#090f1c"/>
      <circle cx="20" cy="20" r="8" fill="#0d1a2e" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3"/>
      <circle cx="20" cy="20" r="3" fill="#00d4ff"/>
      <circle cx="20" cy="20" r="1.2" fill="#060c18"/>
      <circle cx="20" cy="20" r="5" fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
      <circle cx="20" cy="20" r="11" fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
    </svg>
  </div>
  <div class="activar-sala">Sala sync</div>
  <div class="activar-nombre">Código <span>{{ sala_id | upper }}</span></div>
  <div class="activar-sub">Activa el audio para unirte</div>
  <button class="btn-activar" onclick="activar()">▶ Entrar a la sala</button>
</div>

<!-- PANTALLA PRINCIPAL -->
<div id="pantalla-principal">
  <div class="inner">

    <!-- Header -->
    <div class="header">
      <button class="header-back" onclick="window.location.href='/rockola/'">← Salir</button>
      <div class="sala-badge">{{ sala_id | upper }}</div>
      <button class="btn-share" onclick="compartir()">Compartir</button>
    </div>

    <!-- Now playing -->
    <div class="now-playing">
      <div class="np-top">
        <svg id="vinyl-spin" width="52" height="52" viewBox="0 0 40 40" style="flex-shrink:0">
          <circle cx="20" cy="20" r="19" fill="#0d1a2e" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4"/>
          <circle cx="20" cy="20" r="13" fill="#090f1c"/>
          <circle cx="20" cy="20" r="8" fill="#0d1a2e" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3"/>
          <circle cx="20" cy="20" r="3" fill="#00d4ff"/>
          <circle cx="20" cy="20" r="1.2" fill="#060c18"/>
          <circle cx="20" cy="20" r="5" fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
          <circle cx="20" cy="20" r="11" fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
        </svg>
        <div class="np-info">
          <div class="np-label">Sonando ahora</div>
          <div class="np-nombre" id="nombre-actual">Esperando canciones...</div>
        </div>
        <div class="wave-viz" id="wave-viz">
          <div class="wave-bar" style="height:5px;opacity:.3"></div>
          <div class="wave-bar" style="height:5px;opacity:.3"></div>
          <div class="wave-bar" style="height:5px;opacity:.3"></div>
          <div class="wave-bar" style="height:5px;opacity:.3"></div>
          <div class="wave-bar" style="height:5px;opacity:.3"></div>
        </div>
      </div>
      <audio id="player" controls></audio>
    </div>

    <!-- Upload -->
    <div class="upload-box">
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="archivo" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple onchange="archivosSeleccionados()">
        <div class="drop-icon">🎶</div>
        <div class="drop-text" id="drop-text">Toca para elegir <strong>canciones</strong></div>
      </div>
      <div class="progress-bg" id="prog-bg"><div class="progress-fill" id="prog-fill"></div></div>
      <button class="btn-upload" id="btn-subir" onclick="subir()" disabled>Selecciona canciones</button>
      <div class="upload-status" id="estado-subir"></div>
    </div>

    <!-- Queue -->
    <div class="queue-box">
      <div class="queue-label" id="queue-label">Cola</div>
      <ul class="queue-list" id="lista-cola">
        <li class="queue-empty">Sin canciones aún</li>
      </ul>
    </div>

  </div>
</div>

<script>
const SALA = '{{ sala_id }}';
const OWNER = localStorage.getItem('rockola_owner_' + SALA) || (() => {
  const id = Math.random().toString(36).slice(2, 8);
  localStorage.setItem('rockola_owner_' + SALA, id);
  return id;
})();

const player     = document.getElementById('player');
const nombreEl   = document.getElementById('nombre-actual');
const listaCola  = document.getElementById('lista-cola');
const estadoEl   = document.getElementById('estado-subir');
const btnSubir   = document.getElementById('btn-subir');
const progBg     = document.getElementById('prog-bg');
const progFill   = document.getElementById('prog-fill');
const vinylSpin  = document.getElementById('vinyl-spin');
const waveViz    = document.getElementById('wave-viz');
const queueLabel = document.getElementById('queue-label');

let reproduciendo   = false;
let cancionActual   = null;
let archivosValidos = [];
let aplicandoSync   = false;

/* ── Sortable ── */
Sortable.create(listaCola, {
  animation: 150,
  handle: '.handle',
  onEnd: () => {
    const orden = [...listaCola.querySelectorAll('.queue-item')].map(el => el.dataset.id);
    fetch(`/rockola/${SALA}/reordenar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orden, owner: OWNER, modo: 'sync' })
    });
  }
});

/* ── Activar ── */
function activar() {
  document.getElementById('pantalla-activar').style.display = 'none';
  document.getElementById('pantalla-principal').style.display = 'block';

  // Desbloquear contexto de audio con gesto de usuario
  player.play().catch(() => {});
  player.pause();

  player.addEventListener('pause', () => {
    if (aplicandoSync) return;
    fetch(`/rockola/${SALA}/sync_control`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado: 'pause', pos: player.currentTime, ts: Date.now() / 1000 })
    });
  });

  player.addEventListener('play', () => {
    if (aplicandoSync) return;
    fetch(`/rockola/${SALA}/sync_control`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado: 'play', pos: player.currentTime, ts: Date.now() / 1000 })
    });
  });

  setInterval(verificarCola, 2500);
  verificarCola();
}

/* ── Player ended ── */
player.addEventListener('ended', () => {
  const idTerminada = cancionActual;
  reproduciendo = false;
  cancionActual = null;
  setVinylSpinning(false);
  setWaveActive(false);
  fetch(`/rockola/${SALA}/siguiente`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: idTerminada })
  });
});

/* ── Verificar cola ── */
async function verificarCola() {
  try {
    const res  = await fetch(`/rockola/${SALA}/cola`);
    const data = await res.json();
    const cola = data.cola || [];

    renderCola(cola);

    if (cola.length > 0) {
      const c = cola[0];

      if (c.id !== cancionActual) {
        // Nueva canción detectada
        cancionActual = c.id;
        reproduciendo = true;
        nombreEl.textContent = c.nombre.replace(/\.[^.]+$/, '');
        player.src = `/rockola/${SALA}/archivo/${c.id}`;
        player.load();

        // Remover listener previo si existe
        if (player._canPlayHandler) {
          player.removeEventListener('canplay', player._canPlayHandler);
        }
        if (player._errorHandler) {
          player.removeEventListener('error', player._errorHandler);
        }

        player._canPlayHandler = function onCanPlay() {
          player.removeEventListener('canplay', player._canPlayHandler);
          player._canPlayHandler = null;

          const estado     = data.sync_estado || 'play';
          const syncPos    = data.sync_pos    || 0;
          const syncTs     = data.sync_ts     || 0;
          const now        = Date.now() / 1000;

          // Solo aplicar posición si el ts es reciente (< 10 min)
          // y hay una posición real guardada
          let posObjetivo = 0;
          if (syncTs > 0 && (now - syncTs) < 600) {
            posObjetivo = estado === 'play'
              ? syncPos + (now - syncTs)
              : syncPos;
            posObjetivo = Math.max(0, posObjetivo);
            // No saltar más allá de la duración menos 2s
            if (player.duration && posObjetivo > player.duration - 2) {
              posObjetivo = 0;
            }
          }

          aplicandoSync = true;
          player.currentTime = posObjetivo;
          if (estado !== 'pause') {
            player.play().catch(() => {});
            setVinylSpinning(true);
            setWaveActive(true);
          }
          setTimeout(() => { aplicandoSync = false; }, 400);
        };

        player._errorHandler = function onError() {
          player.removeEventListener('error', player._errorHandler);
          player._errorHandler = null;
          reproduciendo = false;
          cancionActual = null;
          fetch(`/rockola/${SALA}/siguiente`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: c.id })
          });
        };

        player.addEventListener('canplay', player._canPlayHandler);
        player.addEventListener('error', player._errorHandler);
      }

      // Sincronizar play/pause de usuarios en la sala
      if (reproduciendo) {
        const estado     = data.sync_estado || 'play';
        const syncPos    = data.sync_pos    || 0;
        const syncTs     = data.sync_ts     || 0;
        const now        = Date.now() / 1000;
        const posAjustada = estado === 'play'
          ? syncPos + (now - syncTs)
          : syncPos;

        aplicandoSync = true;
        if (estado === 'pause' && !player.paused) {
          player.pause();
          player.currentTime = syncPos;
          setVinylSpinning(false);
          setWaveActive(false);
        } else if (estado === 'play' && player.paused) {
          player.currentTime = Math.max(0, posAjustada);
          player.play().catch(() => {});
          setVinylSpinning(true);
          setWaveActive(true);
        }
        setTimeout(() => { aplicandoSync = false; }, 250);
      }
    }

    if (cola.length === 0 && !reproduciendo) {
      nombreEl.textContent = 'Esperando canciones...';
      setVinylSpinning(false);
      setWaveActive(false);
    }

  } catch(e) { /* sin conexión */ }
}

/* ── Upload ── */
function archivosSeleccionados() {
  archivosValidos = [...document.getElementById('archivo').files];
  if (archivosValidos.length === 0) { btnSubir.disabled = true; return; }
  const dt = document.getElementById('drop-text');
  dt.className = 'drop-text selected';
  dt.textContent = archivosValidos.length === 1
    ? archivosValidos[0].name.replace(/\.[^.]+$/, '')
    : `${archivosValidos.length} canciones seleccionadas`;
  btnSubir.textContent = archivosValidos.length === 1 ? '🎵 Poner en cola' : `🎵 Poner ${archivosValidos.length} en cola`;
  btnSubir.disabled = false;
  estadoEl.textContent = '';
  estadoEl.className = 'upload-status';
}

function subir() {
  if (archivosValidos.length === 0) return;
  btnSubir.disabled = true;
  progBg.style.display = 'block';

  const form = new FormData();
  form.append('owner', OWNER);
  archivosValidos.forEach(f => form.append('archivo', f));

  const xhr = new XMLHttpRequest();
  xhr.open('POST', `/rockola/${SALA}/subir`);
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) progFill.style.width = (e.loaded / e.total * 100) + '%';
  };
  xhr.onload = () => {
    progBg.style.display = 'none';
    progFill.style.width = '0%';
    try {
      const res = JSON.parse(xhr.responseText);
      if (res.ok) {
        estadoEl.textContent = res.agregadas.length === 1 ? '¡En cola! 🎉' : `¡${res.agregadas.length} canciones en cola! 🎉`;
        estadoEl.className = 'upload-status ok';
        document.getElementById('archivo').value = '';
        const dt = document.getElementById('drop-text');
        dt.className = 'drop-text';
        dt.innerHTML = 'Toca para elegir <strong>más canciones</strong>';
        archivosValidos = [];
        btnSubir.textContent = 'Selecciona canciones';
        btnSubir.disabled = true;
      } else {
        estadoEl.textContent = 'Error: ' + res.error;
        estadoEl.className = 'upload-status error';
        btnSubir.disabled = false;
      }
    } catch(e) {
      estadoEl.textContent = `Error ${xhr.status}`;
      estadoEl.className = 'upload-status error';
      btnSubir.disabled = false;
    }
  };
  xhr.onerror = () => {
    progBg.style.display = 'none';
    btnSubir.disabled = false;
    estadoEl.textContent = 'Error de conexión';
    estadoEl.className = 'upload-status error';
  };
  xhr.send(form);
}

/* ── Render queue ── */
function renderCola(cola) {
  queueLabel.textContent = `Cola · ${cola.length} canción${cola.length !== 1 ? 'es' : ''}`;
  if (cola.length === 0) {
    listaCola.innerHTML = '<li class="queue-empty">Sin canciones aún</li>';
    return;
  }
  listaCola.innerHTML = cola.map((c, i) => `
    <li class="queue-item ${i===0&&reproduciendo?'playing':''}" data-id="${c.id}">
      <span class="handle">⠿</span>
      <span class="q-nombre">${c.nombre.replace(/\.[^.]+$/, '')}</span>
      <span class="q-pos">${i===0&&reproduciendo?'▶ AHORA':'#'+(i+1)}</span>
    </li>
  `).join('');
}

/* ── Helpers ── */
function setVinylSpinning(on) {
  vinylSpin.style.animation = on ? 'spin 3s linear infinite' : 'none';
}
function setWaveActive(on) {
  const bars = waveViz.querySelectorAll('.wave-bar');
  const delays = [0, .15, .3, .15, 0];
  bars.forEach((b, i) => {
    if (on) {
      b.style.animation = `wave .9s ease-in-out ${delays[i]}s infinite`;
      b.style.opacity = '1';
    } else {
      b.style.animation = 'none';
      b.style.height = '5px';
      b.style.opacity = '.3';
    }
  });
}

function compartir() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'Tuc Tuc Rockola', text: `Únete a la sala ${SALA.toUpperCase()}`, url });
  } else {
    navigator.clipboard.writeText(url).then(() => alert('URL copiada ✓'));
  }
}
</script>
</body>
</html>
