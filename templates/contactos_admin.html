<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactos — TUC TUC</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<div class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="flex items-center gap-3 px-4 py-3">
    <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="flex-1">
      <h1 class="text-lg font-bold text-gray-900">Contactos</h1>
      <p class="text-xs text-gray-500">{{ nombre_admin }}</p>
    </div>
    <span id="contador" class="text-sm text-gray-400"></span>
  </div>
</div>

<!-- Botones importar -->
<div class="px-4 pt-4 flex flex-col gap-3">
  <!-- Opción 1: archivo VCF (todos de una vez) -->
  <label class="w-full h-14 bg-indigo-600 text-white font-semibold rounded-2xl flex items-center justify-center gap-2 text-base active:scale-95 transition-transform cursor-pointer">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
    </svg>
    Importar archivo de contactos (.vcf)
    <input type="file" accept=".vcf,.vcard" class="hidden" onchange="importarVcf(this)">
  </label>
  <p id="vcf_hint" class="text-xs text-gray-400 text-center -mt-1"></p>

  <!-- Opción 2: Telegram HTML export (contacts.html) -->
  <label class="w-full h-14 bg-sky-500 text-white font-semibold rounded-2xl flex items-center justify-center gap-2 text-base active:scale-95 transition-transform cursor-pointer">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.93 7.3l-1.68 7.92c-.12.56-.45.7-.91.43l-2.52-1.86-1.22 1.17c-.13.13-.25.25-.51.25l.18-2.57 4.65-4.2c.2-.18-.04-.28-.31-.1L8.31 14.9l-2.47-.77c-.54-.17-.55-.54.11-.8l9.63-3.71c.45-.17.84.1.71.78z"/>
    </svg>
    Importar desde Telegram (.html o .json)
    <input type="file" accept=".html,.json" class="hidden" onchange="importarTelegramAuto(this)">
  </label>
  <p class="text-xs text-gray-400 text-center -mt-1">Telegram Desktop → Ajustes → Avanzado → Exportar datos → solo Contactos → sube contacts.html</p>

  <!-- Opción 3: Web Contacts API (solo Android) -->
  <button id="btn_importar"
          onclick="importarContactos()"
          class="w-full h-14 bg-white border-2 border-indigo-200 text-indigo-700 font-semibold rounded-2xl flex items-center justify-center gap-2 text-base active:scale-95 transition-transform hidden">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    Seleccionar del celular (uno a uno)
  </button>
</div>

<!-- Formulario manual -->
<div id="form_manual" class="px-4 pt-3 hidden">
  <div class="bg-white rounded-2xl border border-gray-200 p-4 flex flex-col gap-3">
    <p class="text-sm font-medium text-gray-700">Agregar contacto manualmente</p>
    <input id="inp_nombre" type="text" placeholder="Nombre"
           class="w-full h-12 border border-gray-300 rounded-xl px-4 text-base" autocomplete="off">
    <input id="inp_tel" type="tel" placeholder="Teléfono"
           class="w-full h-12 border border-gray-300 rounded-xl px-4 text-base" autocomplete="off">
    <button onclick="agregarManual()"
            class="w-full h-12 bg-gray-800 text-white font-semibold rounded-xl text-base active:scale-95 transition-transform">
      Agregar
    </button>
  </div>
</div>

<!-- Lista -->
<div class="px-4 pt-4 pb-8">
  <div id="loading" class="text-center py-10 text-gray-400 text-sm">Cargando...</div>
  <div id="lista" class="flex flex-col gap-2"></div>
  <div id="vacio" class="hidden text-center py-12">
    <div class="text-5xl mb-3">📋</div>
    <p class="text-gray-500 text-sm">No hay contactos todavía.<br>Importa desde el celular.</p>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-5 py-3 rounded-2xl shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 max-w-xs text-center"></div>

<script>
function parseVcf(texto) {
  const contactos = [];
  const bloques = texto.split(/BEGIN:VCARD/i).filter(b => b.trim());
  bloques.forEach(bloque => {
    let nombre = '', telefono = '';
    bloque.split('\n').forEach(linea => {
      linea = linea.trim();
      if (/^FN[;:]/i.test(linea)) {
        nombre = linea.replace(/^FN[^:]*:/i, '').trim();
      } else if (/^N[;:]/i.test(linea) && !nombre) {
        const partes = linea.replace(/^N[^:]*:/i, '').split(';');
        nombre = [partes[1], partes[0]].filter(Boolean).join(' ').trim();
      } else if (/^TEL[;:]/i.test(linea) && !telefono) {
        telefono = linea.replace(/^TEL[^:]*:/i, '').replace(/\s+/g, '').trim();
      }
    });
    if (nombre || telefono) contactos.push({ nombre, telefono });
  });
  return contactos;
}

function parseTelegramJson(texto) {
  try {
    const data = JSON.parse(texto);
    // Telegram puede exportar en dos formatos:
    // 1. { contacts: { list: [...] } }
    // 2. { contacts: [...] }
    const lista_raw = data.contacts?.list || data.contacts || [];
    const contactos = [];
    lista_raw.forEach(c => {
      const nombre = [c.first_name || '', c.last_name || ''].join(' ').trim();
      const telefono = (c.phone_number || '').replace(/\s+/g, '');
      if (nombre || telefono) contactos.push({ nombre, telefono });
    });
    return contactos;
  } catch(e) {
    return null;
  }
}

function parseTelegramHtml(texto) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(texto, 'text/html');
  const contactos = [];
  doc.querySelectorAll('.entry.clearfix').forEach(entry => {
    const nombre = (entry.querySelector('.name.bold')?.textContent || '').trim();
    const telefono = (entry.querySelector('.details_entry.details')?.textContent || '').replace(/\s+/g, '').trim();
    if (nombre || telefono) contactos.push({ nombre, telefono });
  });
  return contactos;
}

async function importarTelegramAuto(input) {
  const archivo = input.files[0];
  if (!archivo) return;
  const texto = await archivo.text();
  let lista;
  if (archivo.name.endsWith('.html') || archivo.name.endsWith('.htm')) {
    lista = parseTelegramHtml(texto);
  } else {
    const parsed = parseTelegramJson(texto);
    if (parsed === null) { toast('Archivo inválido'); input.value = ''; return; }
    lista = parsed.map(c => ({ nombre: [c.first_name||'', c.last_name||''].join(' ').trim(), telefono: c.phone_number||'' }));
  }
  if (!lista.length) { toast('No se encontraron contactos'); input.value = ''; return; }
  toast(`Procesando ${lista.length} contactos de Telegram...`);
  try {
    const r = await fetch('/api/admin/contactos/importar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactos: lista })
    });
    const d = await r.json();
    input.value = '';
    if (d.ok) {
      const msg = d.omitidos ? `✓ ${d.insertados} nuevos de Telegram, ${d.omitidos} ya existían` : `✓ ${d.insertados} contacto(s) de Telegram importado(s)`;
      toast(msg); cargarContactos();
    } else toast('Error: ' + d.error);
  } catch(e) { toast('Error de red'); }
}

async function importarTelegram(input) {
  const archivo = input.files[0];
  if (!archivo) return;
  const texto = await archivo.text();
  const lista = parseTelegramJson(texto);
  if (lista === null) { toast('Archivo JSON inválido'); input.value = ''; return; }
  if (!lista.length) { toast('No se encontraron contactos en el archivo'); input.value = ''; return; }
  toast(`Procesando ${lista.length} contactos de Telegram...`);
  try {
    const r = await fetch('/api/admin/contactos/importar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactos: lista })
    });
    const d = await r.json();
    input.value = '';
    if (d.ok) {
      const msg = d.omitidos ? `✓ ${d.insertados} nuevos de Telegram, ${d.omitidos} ya existían` : `✓ ${d.insertados} contacto(s) de Telegram importado(s)`;
      toast(msg); cargarContactos();
    } else toast('Error: ' + d.error);
  } catch(e) { toast('Error de red'); }
}

async function importarVcf(input) {
  const archivo = input.files[0];
  if (!archivo) return;
  const texto = await archivo.text();
  const lista = parseVcf(texto);
  if (!lista.length) { toast('No se encontraron contactos en el archivo'); return; }
  toast(`Procesando ${lista.length} contactos...`);
  try {
    const r = await fetch('/api/admin/contactos/importar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactos: lista })
    });
    const d = await r.json();
    input.value = '';
    if (d.ok) { const msg = d.omitidos ? `✓ ${d.insertados} nuevos, ${d.omitidos} ya existían` : `✓ ${d.insertados} contacto(s) importado(s)`; toast(msg); cargarContactos(); }
    else toast('Error: ' + d.error);
  } catch(e) { toast('Error de red'); }
}

async function cargarContactos() {
  try {
    const r = await fetch('/api/admin/contactos');
    const d = await r.json();
    document.getElementById('loading').classList.add('hidden');
    if (d.ok) renderLista(d.contactos);
  } catch(e) {
    document.getElementById('loading').classList.add('hidden');
    toast('Error cargando contactos');
  }
}

function renderLista(contactos) {
  const lista = document.getElementById('lista');
  const vacio = document.getElementById('vacio');
  const contador = document.getElementById('contador');
  lista.innerHTML = '';
  if (!contactos.length) { vacio.classList.remove('hidden'); contador.textContent = ''; return; }
  contador.textContent = contactos.length + ' contacto' + (contactos.length !== 1 ? 's' : '');
  contactos.forEach(c => {
    const div = document.createElement('div');
    div.className = 'bg-white rounded-2xl border border-gray-100 flex items-center gap-3 px-4 py-3';
    div.innerHTML = `
      <div class="w-11 h-11 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-lg flex-shrink-0">
        ${(c.nombre || c.telefono || '?')[0].toUpperCase()}
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-gray-900 truncate">${c.nombre || '(sin nombre)'}</p>
        <p class="text-sm text-gray-500">${c.telefono || '(sin teléfono)'}</p>
      </div>
      <button onclick="eliminar(${c.id}, this)"
              class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-300 hover:text-red-500 hover:bg-red-50 transition-colors flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>`;
    lista.appendChild(div);
  });
}

async function importarContactos() {
  if (!('contacts' in navigator && 'ContactsManager' in window)) {
    document.getElementById('api_msg').classList.remove('hidden');
    document.getElementById('form_manual').classList.remove('hidden');
    return;
  }
  try {
    const results = await navigator.contacts.select(['name', 'tel'], { multiple: true });
    if (!results.length) { toast('No se seleccionaron contactos'); return; }
    const lista = [];
    results.forEach(c => {
      const nombre = (c.name && c.name[0]) ? c.name[0] : '';
      if (c.tel && c.tel.length) {
        c.tel.forEach(t => lista.push({ nombre, telefono: t.replace(/\s+/g, '') }));
      } else {
        lista.push({ nombre, telefono: '' });
      }
    });
    const btn = document.getElementById('btn_importar');
    btn.disabled = true;
    btn.textContent = 'Importando...';
    const r = await fetch('/api/admin/contactos/importar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactos: lista })
    });
    const d = await r.json();
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Importar contactos del celular`;
    if (d.ok) { const msg = d.omitidos ? `✓ ${d.insertados} nuevos, ${d.omitidos} ya existían` : `✓ ${d.insertados} contacto(s) importado(s)`; toast(msg); cargarContactos(); }
    else toast('Error: ' + d.error);
  } catch(e) {
    toast('Error al acceder a contactos: ' + e.message);
  }
}

async function agregarManual() {
  const nombre = document.getElementById('inp_nombre').value.trim();
  const telefono = document.getElementById('inp_tel').value.trim();
  if (!nombre && !telefono) { toast('Ingresa nombre o teléfono'); return; }
  try {
    const r = await fetch('/api/admin/contactos/importar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactos: [{ nombre, telefono }] })
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('inp_nombre').value = '';
      document.getElementById('inp_tel').value = '';
      toast('Contacto agregado');
      cargarContactos();
    } else toast('Error: ' + d.error);
  } catch(e) { toast('Error de red'); }
}

async function eliminar(id) {
  if (!confirm('¿Eliminar este contacto?')) return;
  try {
    const r = await fetch(`/api/admin/contactos/${id}`, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) { toast('Eliminado'); cargarContactos(); }
    else toast('Error: ' + d.error);
  } catch(e) { toast('Error de red'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const hint = document.getElementById('vcf_hint');
  if (esIOS) {
    hint.textContent = 'iPhone: ve a icloud.com/contacts → ⚙️ Seleccionar todo → Exportar vCard → sube el .vcf aquí';
  } else if ('contacts' in navigator && 'ContactsManager' in window) {
    hint.textContent = 'Android: exporta desde la app Contactos → .vcf, o usa el botón de abajo para seleccionar uno a uno';
    document.getElementById('btn_importar').classList.remove('hidden');
  } else {
    hint.textContent = 'Exporta tus contactos como .vcf desde la app de Contactos y súbelo aquí';
  }
  cargarContactos();
});
</script>
</body>
</html>
