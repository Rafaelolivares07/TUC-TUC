<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Propiedades — TUC TUC</title>
<script src="/static/js/tailwind.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#f3f4f6; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           padding:10px 20px; border-radius:8px; color:#fff; font-size:14px;
           z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; min-width:200px; text-align:center;}
  .toast.show { opacity:1; }
  .toast-ok  { background:#059669; }
  .toast-err { background:#dc2626; }
  .card-prop { transition:box-shadow .2s; }
  .card-prop:hover { box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .badge-venta { background:#dbeafe; color:#1d4ed8; }
  .badge-alquiler { background:#fef9c3; color:#92400e; }
  /* Imagen con fondo blur */
  .prop-img-wrap {
    position: relative; width: 100%; height: 100%;
    background: #e5e7eb; overflow: hidden;
  }
  .prop-img-wrap .img-bg-blur {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; filter: blur(14px) brightness(0.7);
    transform: scale(1.15); pointer-events: none;
  }
  .prop-img-wrap .img-principal {
    position: relative; width: 100%; height: 100%;
    object-fit: contain; z-index: 1;
  }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- HEADER -->
<div class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🏠</span>
      <div>
        <h1 class="font-bold text-gray-800 text-base leading-tight">Bolsa de Propiedades</h1>
        <p class="text-xs text-gray-500">TUC TUC</p>
      </div>
    </div>
    <a href="/mis-propiedades" class="bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl">
      Publicar mi propiedad
    </a>
  </div>
</div>

<!-- FILTROS -->
<div class="max-w-5xl mx-auto px-4 py-4">
  <div class="bg-white rounded-2xl shadow-sm p-4 flex flex-wrap gap-3 items-end">
    <div class="flex-1 min-w-[140px]">
      <label class="text-xs text-gray-500 font-medium block mb-1">Modalidad</label>
      <select id="fil-modalidad" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="">Todas</option>
        <option value="venta">Venta</option>
        <option value="alquiler">Alquiler</option>
      </select>
    </div>
    <div class="flex-1 min-w-[140px]">
      <label class="text-xs text-gray-500 font-medium block mb-1">Ciudad</label>
      <input id="fil-ciudad" type="text" placeholder="Medellín..."
             class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="flex-1 min-w-[120px]">
      <label class="text-xs text-gray-500 font-medium block mb-1">Precio máx.</label>
      <input id="fil-precio-max" type="number" placeholder="500000000"
             class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <button onclick="cargarPropiedades()" class="bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-semibold">
      Buscar
    </button>
  </div>
</div>

<!-- GRID PROPIEDADES -->
<div class="max-w-5xl mx-auto px-4 pb-10">
  <div id="grid-props" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center py-16 text-gray-400">
      <div class="text-5xl mb-3">🔍</div>
      <p>Cargando propiedades...</p>
    </div>
  </div>
</div>

<!-- MODAL: LEAD -->
<div id="modal-lead" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-6">
    <h2 class="font-bold text-gray-800 mb-4">Me interesa esta propiedad</h2>
    <div class="space-y-3">
      <input id="lead-nombre" type="text" placeholder="Tu nombre" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input id="lead-tel" type="tel" placeholder="Tu teléfono" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <textarea id="lead-msg" rows="2" placeholder="Mensaje (opcional)" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
      <div class="flex gap-3">
        <button onclick="cerrarLead()" class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium">Cancelar</button>
        <button onclick="enviarLead()" class="flex-1 bg-blue-700 text-white rounded-xl py-3 text-sm font-semibold">Enviar</button>
      </div>
    </div>
  </div>
</div>

<script>
let slugLead = null;

function toast(msg, tipo='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo === 'ok' ? 'toast-ok' : 'toast-err');
  setTimeout(() => t.className = 'toast', 3000);
}

function fmt(precio) {
  if (!precio) return 'Consultar';
  return '$' + Number(precio).toLocaleString('es-CO');
}

async function cargarPropiedades() {
  const params = new URLSearchParams();
  const m = document.getElementById('fil-modalidad').value;
  const c = document.getElementById('fil-ciudad').value;
  const pm = document.getElementById('fil-precio-max').value;
  if (m) params.set('modalidad', m);
  if (c) params.set('ciudad', c);
  if (pm) params.set('precio_max', pm);
  const g = document.getElementById('grid-props');
  g.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400"><div class="text-5xl mb-3">⏳</div><p>Buscando...</p></div>';
  try {
    const r = await fetch('/api/bolsa/propiedades?' + params);
    const d = await r.json();
    if (!d.ok) { toast(d.error || 'Error', 'err'); return; }
    if (!d.propiedades.length) {
      g.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400"><div class="text-5xl mb-3">🏚️</div><p>No hay propiedades publicadas</p></div>';
      return;
    }
    g.innerHTML = d.propiedades.map(p => `
      <div class="card-prop bg-white rounded-2xl shadow-sm overflow-hidden cursor-pointer" onclick="verFicha('${p.slug}')">
        <div class="h-44 bg-gray-100 relative">
          ${p.foto ? `
            <div class="prop-img-wrap">
                <img src="${p.foto}" alt="" class="img-bg-blur" loading="lazy" onerror="this.style.display='none'">
                <img src="${p.foto}" alt="${p.titulo||''}" class="img-principal" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=Sin+foto'">
            </div>` : '<div class="w-full h-full flex items-center justify-center text-4xl text-gray-300">🏠</div>'}
          <span class="absolute top-2 left-2 text-xs font-bold px-2 py-1 rounded-lg ${p.modalidad === 'venta' ? 'badge-venta' : 'badge-alquiler'}">${p.modalidad.toUpperCase()}</span>
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-gray-800 text-sm leading-snug line-clamp-2 mb-1">${p.titulo}</h3>
          <p class="text-xs text-gray-500 mb-2">📍 ${p.ciudad || p.direccion || '—'}</p>
          <p class="font-bold text-blue-700 text-base mb-3">${fmt(p.precio)}</p>
          <div class="flex gap-3 text-xs text-gray-500 mb-3">
            ${p.habitaciones ? `<span>🛏️ ${p.habitaciones}</span>` : ''}
            ${p.banos ? `<span>🚿 ${p.banos}</span>` : ''}
            ${p.m2 ? `<span>📐 ${p.m2}m²</span>` : ''}
          </div>
          <button onclick="event.stopPropagation(); abrirLead('${p.slug}')"
                  class="w-full border-2 border-blue-700 text-blue-700 rounded-xl py-2 text-xs font-semibold hover:bg-blue-50 transition">
            Me interesa
          </button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    toast('Error de conexión', 'err');
  }
}

function verFicha(slug) {
  window.location.href = '/propiedades/p/' + slug;
}

function abrirLead(slug) {
  slugLead = slug;
  document.getElementById('modal-lead').classList.remove('hidden');
}

function cerrarLead() {
  slugLead = null;
  document.getElementById('modal-lead').classList.add('hidden');
}

async function enviarLead() {
  const nombre = document.getElementById('lead-nombre').value.trim();
  const tel = document.getElementById('lead-tel').value.trim();
  const msg = document.getElementById('lead-msg').value.trim();
  if (!nombre || !tel) { toast('Nombre y teléfono requeridos', 'err'); return; }
  try {
    const r = await fetch(`/api/propiedad/${slugLead}/lead`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ nombre, telefono: tel, mensaje: msg })
    });
    const d = await r.json();
    if (d.ok) { toast('¡Mensaje enviado! Te contactarán pronto'); cerrarLead(); }
    else toast(d.error || 'Error', 'err');
  } catch(e) { toast('Error de conexión', 'err'); }
}

cargarPropiedades();
</script>
</body>
</html>
