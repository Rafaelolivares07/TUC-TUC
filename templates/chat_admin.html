<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — TUC TUC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #mensajes { scroll-behavior: smooth; }
        .msg-user { background: #f59e0b; color: #fff; }
        .msg-assistant { background: #f3f4f6; color: #1f2937; }
        .msg-assistant pre { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
        .msg-assistant code { background: #e2e8f0; color: #1e293b; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .msg-assistant pre code { background: transparent; color: inherit; padding: 0; }
        .msg-assistant p { margin-bottom: 6px; }
        .msg-assistant ul, .msg-assistant ol { padding-left: 18px; margin-bottom: 6px; }
        .msg-assistant li { margin-bottom: 2px; }
        .msg-assistant h1,.msg-assistant h2,.msg-assistant h3 { font-weight: 700; margin: 10px 0 4px; }
        .msg-assistant strong { font-weight: 600; }
        .typing span { display: inline-block; width: 7px; height: 7px; background: #9ca3af; border-radius: 50%; animation: bounce 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        #input-msg { resize: none; max-height: 140px; }
        #btn-mic { transition: all 0.2s; }
        #btn-mic.grabando { background: #ef4444; animation: pulso 1s infinite; }
        @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

<!-- Header -->
<div class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 shrink-0">
    <a href="/admin" class="text-gray-400 hover:text-gray-600 text-sm">← Admin</a>
    <div class="w-px h-4 bg-gray-200"></div>
    <div class="w-8 h-8 bg-amber-400 rounded-full flex items-center justify-center text-white font-bold text-sm">C</div>
    <div>
        <p class="font-semibold text-gray-800 text-sm leading-none">Claude</p>
        <p class="text-xs text-gray-400">Asistente TUC TUC</p>
    </div>
    <div class="ml-auto flex items-center gap-3">
        <span id="estado-bridge" class="text-xs text-gray-400">🟢 Listo</span>
        <button onclick="limpiarChat()" class="text-xs text-gray-400 hover:text-red-500 transition">Limpiar</button>
    </div>
</div>

<!-- Mensajes -->
<div id="mensajes" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3">

    {% if not mensajes %}
    <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center py-16">
        <div class="text-5xl mb-4">👋</div>
        <p class="font-semibold text-gray-700 text-lg">Hola Rafael</p>
        <p class="text-gray-400 text-sm mt-1">Soy tu asistente personal para TUC TUC.<br>Pregúntame lo que necesites sobre el proyecto.</p>
    </div>
    {% endif %}

    {% for m in mensajes %}
    <div class="flex {% if m.rol == 'user' %}justify-end{% else %}justify-start{% endif %}">
        <div class="max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed
            {% if m.rol == 'user' %}msg-user rounded-br-sm{% else %}msg-assistant rounded-bl-sm{% endif %}">
            {% if m.rol == 'assistant' %}
            <div class="prose-sm" data-markdown="{{ m.contenido | e }}"></div>
            {% else %}
            {{ m.contenido }}
            {% endif %}
        </div>
    </div>
    {% endfor %}

    <!-- Indicador typing (visible mientras Claude procesa) -->
    <div id="typing" class="hidden flex justify-start">
        <div class="msg-assistant rounded-2xl rounded-bl-sm px-4 py-3">
            <div class="typing flex gap-1 items-center h-4">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

</div>

<!-- Input — NUNCA se bloquea -->
<div class="bg-white border-t border-gray-200 px-4 py-3 shrink-0">
    <div class="flex gap-2 items-end max-w-3xl mx-auto">
        <textarea id="input-msg" rows="1"
            placeholder="Escribe tu mensaje... (puedes enviar varios mientras Claude procesa)"
            class="flex-1 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 transition"
            onkeydown="tecla(event)" oninput="autoResize(this)"></textarea>
        <button id="btn-mic" onclick="toggleMic()"
            class="hidden bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-2xl px-3 py-3 text-lg transition shrink-0"
            title="Dictar mensaje">🎤</button>
        <button onclick="enviar()" id="btn-enviar"
            class="bg-amber-500 hover:bg-amber-600 text-white rounded-2xl px-4 py-3 font-semibold text-sm transition shrink-0">
            Enviar
        </button>
    </div>
</div>

<script>
let ultimoId = {{ mensajes[-1].id if mensajes else 0 }};
let hayPendientes = false;  // hay mensajes user sin respuesta aún

// Renderizar markdown en mensajes existentes
document.querySelectorAll('[data-markdown]').forEach(el => {
    el.innerHTML = marked.parse(el.dataset.markdown);
});

// Detectar si el último mensaje visible es del user (Claude aún no respondió)
{% if mensajes %}
{% if mensajes[-1].rol == 'user' %}
hayPendientes = true;
mostrarTyping(true);
{% endif %}
{% endif %}

scrollFondo();

// Polling persistente — siempre activo, detecta respuestas de Claude
setInterval(pollRespuesta, 2500);

function scrollFondo() {
    const c = document.getElementById('mensajes');
    c.scrollTop = c.scrollHeight;
}

function tecla(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviar();
    }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function mostrarTyping(visible) {
    const t = document.getElementById('typing');
    const estado = document.getElementById('estado-bridge');
    if (visible) {
        t.classList.remove('hidden');
        estado.textContent = '🟡 Claude está pensando...';
    } else {
        t.classList.add('hidden');
        estado.textContent = '🟢 Listo';
    }
    scrollFondo();
}

async function enviar() {
    const input = document.getElementById('input-msg');
    const msg   = input.value.trim();
    if (!msg) return;

    input.value = '';
    input.style.height = 'auto';
    input.focus();

    // Ocultar empty state
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    // Mostrar burbuja usuario inmediatamente
    agregarBurbuja('user', msg);

    // Activar typing si no estaba ya
    hayPendientes = true;
    mostrarTyping(true);

    // Guardar en BD
    try {
        const r    = await fetch('/api/admin/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ mensaje: msg })
        });
        const data = await r.json();
        if (data.ok) {
            ultimoId = data.id;
        }
        // Si falla el guardado, mostrar aviso pero no bloquear
        if (!data.ok) {
            agregarBurbuja('assistant', '⚠️ No se pudo guardar el mensaje: ' + (data.error || 'error desconocido'));
        }
    } catch(e) {
        agregarBurbuja('assistant', '⚠️ Error de conexión al enviar');
    }
}

async function pollRespuesta() {
    if (!hayPendientes) return;
    try {
        const r    = await fetch('/api/admin/chat/desde/' + ultimoId);
        const data = await r.json();
        if (data.ok && data.encontrado) {
            ultimoId = data.id;
            agregarBurbuja('assistant', data.contenido);
            hayPendientes = false;
            mostrarTyping(false);
        }
    } catch(e) {}
}

function agregarBurbuja(rol, contenido) {
    const wrap = document.createElement('div');
    wrap.className = 'flex ' + (rol === 'user' ? 'justify-end' : 'justify-start');

    const burbuja = document.createElement('div');
    burbuja.className = 'max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed ' +
        (rol === 'user' ? 'msg-user rounded-br-sm' : 'msg-assistant rounded-bl-sm');

    if (rol === 'assistant') {
        burbuja.innerHTML = marked.parse(contenido);
    } else {
        burbuja.textContent = contenido;
    }

    wrap.appendChild(burbuja);
    document.getElementById('mensajes').insertBefore(wrap, document.getElementById('typing'));
    scrollFondo();
}

// ── Dictado por voz (Web Speech API) ──────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconocedor = null;
let grabando = false;

(function iniciarMic() {
    if (!SpeechRecognition) return; // navegador no soporta → botón queda oculto
    document.getElementById('btn-mic').classList.remove('hidden');

    reconocedor = new SpeechRecognition();
    reconocedor.lang = 'es';
    reconocedor.continuous = false;
    reconocedor.interimResults = false;

    reconocedor.onresult = function(e) {
        const transcripcion = e.results[0][0].transcript;
        const input = document.getElementById('input-msg');
        // Añadir al final del texto existente (con espacio si ya hay algo)
        const separador = input.value.trim() ? ' ' : '';
        input.value = input.value.trim() + separador + transcripcion;
        autoResize(input);
        input.focus();
    };

    reconocedor.onend = function() {
        grabando = false;
        const btn = document.getElementById('btn-mic');
        btn.classList.remove('grabando');
        btn.title = 'Dictar mensaje';
    };

    reconocedor.onerror = function(e) {
        grabando = false;
        const btn = document.getElementById('btn-mic');
        btn.classList.remove('grabando');
        btn.title = 'Dictar mensaje';
        if (e.error === 'network') {
            toast('Este navegador bloqueó el micrófono. Prueba en Chrome.', true);
        } else if (e.error !== 'no-speech') {
            console.warn('Speech error:', e.error);
        }
    };
})();

function toggleMic() {
    if (!reconocedor) return;
    if (grabando) {
        reconocedor.stop();
        grabando = false;
    } else {
        reconocedor.start();
        grabando = true;
        const btn = document.getElementById('btn-mic');
        btn.classList.add('grabando');
        btn.title = 'Tocá de nuevo para detener';
    }
}
// ──────────────────────────────────────────────────────────────────────────

async function limpiarChat() {
    if (!confirm('¿Borrar todo el historial del chat?')) return;
    try {
        const r = await fetch('/api/admin/chat/limpiar', { method: 'POST' });
        const d = await r.json();
        if (d.ok) location.reload();
    } catch(e) {}
}
</script>

</body>
</html>
