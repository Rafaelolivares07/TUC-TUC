{% extends "base.html" %}
{% block title %}Permisos SAR{% endblock %}

{% block content %}
<div class="container-fluid py-4" style="max-width:860px">

  <h1 class="h3 mb-4">
    <i class="bi bi-shield-lock text-primary me-2"></i>Configuración SAR
  </h1>

  <!-- Pestañas -->
  <ul class="nav nav-tabs mb-4" id="tabSar">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPermisos">
        <i class="bi bi-bar-chart-fill me-1"></i>Permisos de Reportes
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabUsuarios">
        <i class="bi bi-people-fill me-1"></i>Usuarios
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ── Tab Permisos ── -->
    <div class="tab-pane fade show active" id="tabPermisos">

      <div class="row g-3 mb-4 align-items-end">
        <div class="col-auto">
          <label class="form-label fw-semibold mb-1">Usuario</label>
          <select class="form-select" id="selUsuario" style="min-width:220px">
            <option value="">— seleccionar —</option>
          </select>
        </div>
        <div class="col-auto">
          <span id="lblEstado" class="text-muted small"></span>
        </div>
      </div>

      <div id="panelPermisos" style="display:none">

        <!-- Reportes × fuentes -->
        <div class="card shadow-sm mb-3">
          <div class="card-header fw-semibold">Reportes habilitados</div>
          <div class="card-body pb-2">
            <table class="table table-sm align-middle mb-0" style="font-size:.87rem">
              <thead class="table-light">
                <tr>
                  <th style="width:45%">Reporte</th>
                  <th class="text-muted" style="width:15%">Categoría</th>
                  <th class="text-center" style="width:20%">
                    <span class="badge" style="background:#d1e7dd;color:#0a3622">LOCAL</span>
                  </th>
                  <th class="text-center" style="width:20%">
                    <span class="badge" style="background:#cfe2ff;color:#084298">REMOTO</span>
                  </th>
                </tr>
              </thead>
              <tbody id="tblReportes"></tbody>
            </table>
          </div>
        </div>

        <!-- Agentes asignados -->
        <div class="card shadow-sm mb-3">
          <div class="card-header fw-semibold">Agentes remotos accesibles</div>
          <div class="card-body" id="panelAgentes">
            <span class="text-muted small">Cargando agentes...</span>
          </div>
        </div>

        <div class="d-flex gap-2 mb-4">
          <button class="btn btn-primary" id="btnGuardar" onclick="guardarTodo()">
            <i class="bi bi-floppy me-1"></i>Guardar
          </button>
          <span id="lblGuardado" class="align-self-center text-muted small"></span>
        </div>

      </div>
    </div>

    <!-- ── Tab Usuarios ── -->
    <div class="tab-pane fade" id="tabUsuarios">

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Usuarios SAR</div>
        <div class="card-body p-0">
          <table class="table table-sm align-middle mb-0" style="font-size:.87rem">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tblUsuarios"></tbody>
          </table>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Nuevo usuario</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-4">
              <input type="text" class="form-control form-control-sm" id="nuNombre" placeholder="Nombre completo">
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control form-control-sm" id="nuUsuario" placeholder="Usuario (login)">
            </div>
            <div class="col-md-3">
              <input type="password" class="form-control form-control-sm" id="nuPassword" placeholder="Contraseña">
            </div>
            <div class="col-md-2">
              <select class="form-select form-select-sm" id="nuRol">
                <option value="ClienteVFP">Cliente</option>
                <option value="Administrador">Admin</option>
              </select>
            </div>
            <div class="col-12">
              <button class="btn btn-sm btn-success" onclick="crearUsuario()">
                <i class="bi bi-person-plus me-1"></i>Crear
              </button>
              <span id="lblNuError" class="text-danger small ms-2"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal cambiar clave -->
<div class="modal fade" id="modalClave" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Cambiar contraseña</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="password" class="form-control form-control-sm" id="nuevaClave" placeholder="Nueva contraseña">
        <div id="lblClaveError" class="text-danger small mt-1"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-primary" onclick="guardarClave()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
const REPORTES  = {{ reportes | tojson }};
let _usuarios   = [];
let _agentes    = [];
let _uidActual  = null;
let _modalUid   = null;

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([cargarUsuarios(), cargarAgentes()]);
}

async function cargarUsuarios() {
  const d = await api('/api/admin-agent/sar-usuarios');
  if (!d.ok) return;
  _usuarios = d.usuarios;
  const sel = document.getElementById('selUsuario');
  sel.innerHTML = '<option value="">— seleccionar —</option>';
  _usuarios.forEach(u => {
    sel.innerHTML += `<option value="${u.id}">${u.nombre} (${u.usuario})</option>`;
  });
  renderTablaUsuarios();
}

async function cargarAgentes() {
  const d = await api('/api/admin-agent/agentes-activos');
  if (d.ok) _agentes = d.agentes;
}

// ── Tab Permisos ──────────────────────────────────────────────────────────────

document.getElementById('selUsuario').addEventListener('change', async function() {
  const uid = parseInt(this.value);
  _uidActual = uid || null;
  const panel = document.getElementById('panelPermisos');
  if (!uid) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('lblEstado').textContent = 'Cargando...';
  await Promise.all([cargarPermisos(uid), cargarAgentesUsuario(uid)]);
  document.getElementById('lblEstado').textContent = '';
});

async function cargarPermisos(uid) {
  const d = await api(`/api/admin-agent/reportes-permisos-u/${uid}`);
  const activos = { local: new Set(), remoto: new Set() };
  if (d.ok) d.permisos.forEach(p => activos[p.fuente]?.add(p.reporte_id));

  const tbody = document.getElementById('tblReportes');
  tbody.innerHTML = '';
  REPORTES.forEach(r => {
    tbody.innerHTML += `
    <tr>
      <td class="ps-2 fw-semibold">${r.nombre}</td>
      <td class="text-muted">${r.categoria}</td>
      <td class="text-center">
        <div class="form-check form-switch d-inline-block mb-0">
          <input class="form-check-input" type="checkbox" role="switch"
                 id="chk-${uid}-${r.id}-local" ${activos.local.has(r.id) ? 'checked' : ''}>
        </div>
      </td>
      <td class="text-center">
        <div class="form-check form-switch d-inline-block mb-0">
          <input class="form-check-input" type="checkbox" role="switch"
                 id="chk-${uid}-${r.id}-remoto" ${activos.remoto.has(r.id) ? 'checked' : ''}>
        </div>
      </td>
    </tr>`;
  });
}

async function cargarAgentesUsuario(uid) {
  const d = await api(`/api/admin-agent/usuario-agentes/${uid}`);
  const asignados = new Set(d.ok ? d.agentes : []);
  const panel = document.getElementById('panelAgentes');
  if (!_agentes.length) {
    panel.innerHTML = '<span class="text-muted small">Sin agentes registrados en los últimos 30 días.</span>';
    return;
  }
  panel.innerHTML = _agentes.map(a => `
    <div class="form-check mb-1">
      <input class="form-check-input" type="checkbox" id="ag-${uid}-${a.id}"
             ${asignados.has(a.id) ? 'checked' : ''}>
      <label class="form-check-label" for="ag-${uid}-${a.id}">
        <span class="me-1">${a.nombre}</span>
        <span class="font-monospace text-muted small">${a.id}</span>
        <span class="badge ms-1 ${a.online ? 'bg-success' : 'bg-secondary'}" style="font-size:.7rem">
          ${a.online ? 'online' : a.ultimo}
        </span>
      </label>
    </div>`).join('');
}

async function guardarTodo() {
  if (!_uidActual) return;
  const uid = _uidActual;
  const btn = document.getElementById('btnGuardar');
  const lbl = document.getElementById('lblGuardado');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
  lbl.textContent = '';

  const permisos = [];
  REPORTES.forEach(r => {
    ['local','remoto'].forEach(f => {
      const el = document.getElementById(`chk-${uid}-${r.id}-${f}`);
      if (el?.checked) permisos.push({ reporte_id: r.id, fuente: f });
    });
  });

  const agentes = _agentes
    .filter(a => document.getElementById(`ag-${uid}-${a.id}`)?.checked)
    .map(a => a.id);

  const [r1, r2] = await Promise.all([
    api(`/api/admin-agent/reportes-permisos-u/${uid}`, 'POST', { permisos }),
    api(`/api/admin-agent/usuario-agentes/${uid}`,     'POST', { agentes }),
  ]);

  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-floppy me-1"></i>Guardar';
  if (r1.ok && r2.ok) {
    lbl.className = 'align-self-center small text-success';
    lbl.textContent = 'Guardado ✓';
    setTimeout(() => { lbl.textContent = ''; }, 2500);
  } else {
    lbl.className = 'align-self-center small text-danger';
    lbl.textContent = r1.error || r2.error || 'Error al guardar';
  }
}

// ── Tab Usuarios ──────────────────────────────────────────────────────────────

function renderTablaUsuarios() {
  const tbody = document.getElementById('tblUsuarios');
  if (!_usuarios.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-muted ps-3 py-2 small">Sin usuarios</td></tr>';
    return;
  }
  tbody.innerHTML = _usuarios.map(u => `
    <tr>
      <td class="ps-3 fw-semibold">${u.nombre}</td>
      <td class="font-monospace small">${u.usuario}</td>
      <td><span class="badge ${u.rol === 'Administrador' ? 'bg-primary' : 'bg-secondary'}">${u.rol === 'Administrador' ? 'Admin' : 'Cliente'}</span></td>
      <td class="text-end pe-3">
        <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="abrirClave(${u.id})">
          <i class="bi bi-key"></i>
        </button>
        ${u.rol !== 'Administrador' ? `
        <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-1" onclick="eliminarUsuario(${u.id}, '${u.nombre}')">
          <i class="bi bi-trash"></i>
        </button>` : ''}
      </td>
    </tr>`).join('');
}

async function crearUsuario() {
  const nombre   = document.getElementById('nuNombre').value.trim();
  const usuario  = document.getElementById('nuUsuario').value.trim();
  const password = document.getElementById('nuPassword').value.trim();
  const rol      = document.getElementById('nuRol').value;
  const lbl      = document.getElementById('lblNuError');
  lbl.textContent = '';
  if (!nombre || !usuario || !password) { lbl.textContent = 'Todos los campos son requeridos'; return; }
  const d = await api('/api/admin-agent/sar-usuarios', 'POST', { nombre, usuario, password, rol });
  if (!d.ok) { lbl.textContent = d.error || 'Error'; return; }
  document.getElementById('nuNombre').value   = '';
  document.getElementById('nuUsuario').value  = '';
  document.getElementById('nuPassword').value = '';
  await cargarUsuarios();
}

function abrirClave(uid) {
  _modalUid = uid;
  document.getElementById('nuevaClave').value = '';
  document.getElementById('lblClaveError').textContent = '';
  new bootstrap.Modal(document.getElementById('modalClave')).show();
}

async function guardarClave() {
  const password = document.getElementById('nuevaClave').value.trim();
  const lbl = document.getElementById('lblClaveError');
  lbl.textContent = '';
  if (!password) { lbl.textContent = 'Ingresa una contraseña'; return; }
  const d = await api(`/api/admin-agent/sar-usuarios/${_modalUid}`, 'PATCH', { password });
  if (!d.ok) { lbl.textContent = d.error || 'Error'; return; }
  bootstrap.Modal.getInstance(document.getElementById('modalClave')).hide();
}

async function eliminarUsuario(uid, nombre) {
  if (!confirm(`¿Eliminar usuario "${nombre}"? También se borrarán sus permisos.`)) return;
  const d = await api(`/api/admin-agent/sar-usuarios/${uid}`, 'DELETE');
  if (!d.ok) { alert(d.error || 'Error al eliminar'); return; }
  await cargarUsuarios();
}

// ── Util ──────────────────────────────────────────────────────────────────────

async function api(url, method = 'GET', body = null) {
  try {
    const opts = { method, headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    return await r.json();
  } catch { return { ok: false, error: 'Error de red' }; }
}

init();
</script>
{% endblock %}
