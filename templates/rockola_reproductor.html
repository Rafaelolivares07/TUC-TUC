<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockola — Reproductor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #111; color: #fff; }
  h2 { color: #f0a500; text-align: center; margin-bottom: 20px; }
  #cancion-actual { background: #222; border-radius: 10px; padding: 20px; margin: 20px 0; text-align: center; }
  #nombre { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
  audio { width: 100%; margin-top: 10px; }
  #cola { margin-top: 20px; }
  .item-cola { background: #1e1e1e; padding: 10px 14px; border-radius: 6px; margin: 6px 0; font-size: 14px; color: #ccc; }
  #estado { text-align: center; font-size: 12px; color: #555; margin-top: 10px; }
  #btn-activar {
    display: block; width: 100%; padding: 24px;
    background: linear-gradient(135deg, #f0a500, #ff6b35);
    color: #111; border: none; border-radius: 16px;
    font-size: 22px; font-weight: 800; cursor: pointer;
    margin: 60px 0 12px;
  }
  #hint-activar { text-align: center; color: #555; font-size: 13px; }
</style>
</head>
<body>
<h2>🎵 Tuc Tuc Rockola</h2>

<div id="pantalla-activar">
  <button id="btn-activar" onclick="activar()">▶ Activar Rockola</button>
  <p id="hint-activar">Toca para empezar a reproducir</p>
</div>

<div id="pantalla-principal" style="display:none">
  <div id="cancion-actual">
    <div id="nombre">Esperando canciones...</div>
    <audio id="player" controls></audio>
  </div>
  <div id="cola"></div>
  <div id="estado">Activo ✓</div>
</div>

<script>
const player = document.getElementById('player');
const nombreEl = document.getElementById('nombre');
const colaEl = document.getElementById('cola');
const estadoEl = document.getElementById('estado');

let reproduciendo = false;
let cancionActual = null;

function activar() {
  document.getElementById('pantalla-activar').style.display = 'none';
  document.getElementById('pantalla-principal').style.display = 'block';
  // desbloquear autoplay con gesto de usuario
  player.play().catch(() => {});
  player.pause();
  setInterval(verificarCola, 2000);
  verificarCola();
}

player.addEventListener('ended', () => {
  reproduciendo = false;
  cancionActual = null;
  fetch('/rockola/siguiente', { method: 'POST' });
});

async function verificarCola() {
  try {
    const res = await fetch('/rockola/cola');
    const data = await res.json();
    const cola = data.cola || [];

    renderCola(cola);

    if (!reproduciendo && cola.length > 0) {
      const cancion = cola[0];
      if (!cancionActual || cancionActual !== cancion.id) {
        cancionActual = cancion.id;
        reproduciendo = true;
        nombreEl.textContent = cancion.nombre;
        player.src = '/rockola/archivo/' + cancion.id;
        player.load();
        player.play().catch(() => {});
      }
    }

    if (cola.length === 0 && !reproduciendo) {
      nombreEl.textContent = 'Esperando canciones...';
    }
  } catch(e) {
    estadoEl.textContent = 'Sin conexión';
  }
}

function renderCola(cola) {
  const resto = reproduciendo ? cola.slice(1) : cola;
  colaEl.innerHTML = resto.length
    ? '<b>En cola:</b>' + resto.map(c => `<div class="item-cola">🎵 ${c.nombre}</div>`).join('')
    : '';
}
</script>
</body>
</html>
