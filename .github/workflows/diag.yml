name: Diagnóstico temporal
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 18.217.231.167
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            sudo systemctl cat tuctuc | grep -i database | head -5
            cat /home/ubuntu/tuctucv2/.env 2>/dev/null | grep DATABASE | head -3
            sudo cat /etc/environment 2>/dev/null | grep DATABASE | head -3
