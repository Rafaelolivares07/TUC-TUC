<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ restaurante.nombre }} - Mesa {{ mesa_num }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #faf7f2; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px; color: white; font-weight: 600;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast-ok { background: #059669; }
        .toast-err { background: #dc2626; }
        .tipo-btn.selected { transform: scale(1.03); }
        .opcion-btn.selected { border-color: #d97706; background: #fffbeb; }
    </style>
</head>
<body class="min-h-screen">

<div id="toast" class="toast"></div>
<div class="max-w-lg mx-auto p-4">

    <!-- Header -->
    <div class="text-center mb-4">
        <h1 class="text-2xl font-extrabold text-gray-800">{{ restaurante.nombre }}</h1>
        <span class="inline-block bg-amber-100 text-amber-700 px-4 py-1 rounded-full font-bold text-sm mt-1">Mesa {{ mesa_num }}</span>
    </div>

    <!-- Nombre del cliente -->
    <div id="paso-nombre" class="mb-6">
        <div class="bg-white rounded-2xl shadow p-6 text-center">
            <p class="text-gray-500 mb-3" id="saludo-texto">¿Cómo te llamas?</p>
            <input id="input-nombre" type="text" placeholder="Tu nombre"
                class="w-full border-2 border-amber-300 rounded-xl px-4 py-3 text-xl text-center font-bold focus:outline-none focus:border-amber-500">
            <button onclick="guardarNombre()" class="mt-3 bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-xl font-bold w-full text-lg">
                Continuar
            </button>
        </div>
    </div>

    <!-- Menú (oculto hasta poner nombre) -->
    <div id="seccion-menu" class="hidden">

        <!-- Saludo -->
        <div class="mb-4">
            <p class="text-gray-600">Hola <span id="nombre-display" class="font-bold text-amber-700"></span>, ¿qué vas a pedir?</p>
        </div>

        <!-- Sin menú -->
        <div id="sin-menu" class="hidden text-center py-12">
            <p class="text-gray-400 text-lg">No hay menú disponible hoy</p>
        </div>

        <!-- Tipo de pedido -->
        <div id="sec-tipos" class="space-y-3 mb-6">
        </div>

        <!-- Opciones -->
        <div id="sec-opciones" class="hidden space-y-4 mb-6">
            <div id="sec-cli-sopa" class="hidden">
                <h3 class="font-bold text-gray-700 mb-2">Elige tu sopa</h3>
                <div id="grid-cli-sopas" class="grid grid-cols-2 gap-2"></div>
            </div>
            <div id="sec-cli-proteina" class="hidden">
                <h3 class="font-bold text-gray-700 mb-2">Elige tu proteína</h3>
                <div id="grid-cli-proteinas" class="grid grid-cols-2 gap-2"></div>
            </div>
            <div id="sec-cli-principio" class="hidden">
                <h3 class="font-bold text-gray-700 mb-2">Elige tu principio</h3>
                <div id="grid-cli-principios" class="grid grid-cols-2 gap-2"></div>
            </div>
        </div>

        <!-- Notas -->
        <div id="sec-notas" class="hidden mb-4">
            <input id="cli-notas" type="text" placeholder="Alguna nota? (sin cebolla, extra arroz...)" class="w-full border rounded-xl px-4 py-3 text-sm">
        </div>

        <!-- Botón pedir -->
        <div id="sec-pedir" class="hidden">
            <div class="bg-white rounded-2xl shadow p-4 flex items-center justify-between">
                <div>
                    <span class="text-gray-400 text-sm">Tu pedido:</span>
                    <span id="cli-precio" class="text-2xl font-extrabold text-amber-600 ml-2">$0</span>
                </div>
                <button onclick="enviarPedido()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold text-lg">
                    Pedir
                </button>
            </div>
        </div>

        <!-- Mis pedidos -->
        <div class="mt-8 border-t pt-6">
            <h2 class="font-bold text-gray-700 mb-3">Mis pedidos</h2>
            <div id="mis-pedidos" class="space-y-2">
                <p class="text-gray-400 text-center text-sm py-4">Aún no has pedido nada</p>
            </div>
        </div>
    </div>
</div>

<script>
const SLUG = '{{ restaurante.slug }}';
const MESA = {{ mesa_num }};
const TIPO_REST = '{{ restaurante.tipo_restaurante }}';
const BASE = `/api/restaurante/${SLUG}`;
const STORAGE_KEY = `cliente_nombre_${SLUG}`;

let menuHoy = null;
let opcionesHoy = [];
let cartaCatalogo = [];
let carrito = {};
let tipoSeleccionado = null;
let sopaSeleccionada = null;
let proteinaSeleccionada = null;
let principioSeleccionado = null;
let nombreCliente = '';

function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${ok ? 'toast-ok' : 'toast-err'}`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== NOMBRE =====
function guardarNombre() {
    const nombre = document.getElementById('input-nombre').value.trim();
    if (!nombre) return toast('Escribe tu nombre', false);
    nombreCliente = nombre;
    localStorage.setItem(STORAGE_KEY, nombre);
    mostrarMenu();
}

function mostrarMenu() {
    document.getElementById('paso-nombre').classList.add('hidden');
    document.getElementById('seccion-menu').classList.remove('hidden');
    document.getElementById('nombre-display').textContent = nombreCliente;
    if (TIPO_REST === 'carta') {
        cargarCartaCliente();
    } else {
        cargarMenuHoy();
    }
}

// ===== MENÚ =====
async function cargarMenuHoy() {
    try {
        const r = await fetch(`${BASE}/menu-dia`);
        const data = await r.json();
        if (!data.ok || !data.menu) {
            document.getElementById('sin-menu').classList.remove('hidden');
            document.getElementById('sec-tipos').classList.add('hidden');
            return;
        }
        menuHoy = data.menu;
        opcionesHoy = (data.opciones_activas || []).filter(o => !o.agotado);
        renderTipos();
    } catch(e) { console.error(e); }
}

function renderTipos() {
    const cont = document.getElementById('sec-tipos');
    cont.innerHTML = `
        <button onclick="seleccionarTipo('completo')" id="tipo-completo"
            class="tipo-btn w-full bg-white rounded-2xl shadow p-5 text-left border-2 border-transparent hover:border-amber-400 transition">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xl font-bold text-gray-800">Completo</span>
                    <p class="text-gray-400 text-sm">Sopa + Bandeja</p>
                </div>
                <span class="text-xl font-extrabold text-amber-600">$${Number(menuHoy.precio_completo).toLocaleString()}</span>
            </div>
        </button>
        <button onclick="seleccionarTipo('bandeja')" id="tipo-bandeja"
            class="tipo-btn w-full bg-white rounded-2xl shadow p-5 text-left border-2 border-transparent hover:border-amber-400 transition">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xl font-bold text-gray-800">Bandeja</span>
                    <p class="text-gray-400 text-sm">Proteína + Principio</p>
                </div>
                <span class="text-xl font-extrabold text-amber-600">$${Number(menuHoy.precio_bandeja).toLocaleString()}</span>
            </div>
        </button>
        <button onclick="seleccionarTipo('sopa')" id="tipo-sopa"
            class="tipo-btn w-full bg-white rounded-2xl shadow p-5 text-left border-2 border-transparent hover:border-amber-400 transition">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xl font-bold text-gray-800">Sopa</span>
                    <p class="text-gray-400 text-sm">Solo sopa o caldo</p>
                </div>
                <span class="text-xl font-extrabold text-amber-600">$${Number(menuHoy.precio_sopa).toLocaleString()}</span>
            </div>
        </button>
    `;
}

function seleccionarTipo(tipo) {
    tipoSeleccionado = tipo;
    sopaSeleccionada = null;
    proteinaSeleccionada = null;
    principioSeleccionado = null;

    // Highlight tipo seleccionado
    document.querySelectorAll('.tipo-btn').forEach(b => {
        b.classList.remove('selected', 'border-amber-500', 'bg-amber-50');
        b.classList.add('border-transparent');
    });
    const btn = document.getElementById(`tipo-${tipo}`);
    btn.classList.add('selected', 'border-amber-500', 'bg-amber-50');
    btn.classList.remove('border-transparent');

    const sopas = opcionesHoy.filter(o => o.tipo === 'sopa');
    const proteinas = opcionesHoy.filter(o => o.tipo === 'proteina');
    const principios = opcionesHoy.filter(o => o.tipo === 'principio');

    const secOpciones = document.getElementById('sec-opciones');
    const secSopa = document.getElementById('sec-cli-sopa');
    const secProteina = document.getElementById('sec-cli-proteina');
    const secPrincipio = document.getElementById('sec-cli-principio');

    secOpciones.classList.remove('hidden');
    secSopa.classList.toggle('hidden', tipo === 'bandeja');
    secProteina.classList.toggle('hidden', tipo === 'sopa');
    secPrincipio.classList.toggle('hidden', tipo === 'sopa');

    if (tipo !== 'bandeja') renderOpcionesCliente('grid-cli-sopas', sopas, 'sopa');
    if (tipo !== 'sopa') renderOpcionesCliente('grid-cli-proteinas', proteinas, 'proteina');
    if (tipo !== 'sopa') renderOpcionesCliente('grid-cli-principios', principios, 'principio');

    document.getElementById('sec-notas').classList.remove('hidden');
    document.getElementById('sec-pedir').classList.remove('hidden');
    calcularPrecio();
}

function renderOpcionesCliente(containerId, items, categoria) {
    const cont = document.getElementById(containerId);
    if (items.length === 0) {
        cont.innerHTML = '<p class="text-gray-400 col-span-2 text-center text-sm py-2">No disponible</p>';
        return;
    }
    cont.innerHTML = items.map(i => `
        <button onclick="seleccionarOpcion('${categoria}', ${i.opcion_id}, this)"
            class="opcion-btn opcion-${categoria} bg-white border-2 border-gray-200 rounded-xl p-3 text-left transition hover:border-amber-300">
            <span class="font-semibold text-gray-800">${i.nombre}</span>
            ${i.recargo > 0 ? `<span class="text-amber-500 text-xs block">+$${Number(i.recargo).toLocaleString()}</span>` : ''}
        </button>
    `).join('');
}

function seleccionarOpcion(categoria, id, btn) {
    document.querySelectorAll(`.opcion-${categoria}`).forEach(b => {
        b.classList.remove('selected', 'border-amber-500', 'bg-amber-50');
        b.classList.add('border-gray-200');
    });
    btn.classList.add('selected', 'border-amber-500', 'bg-amber-50');
    btn.classList.remove('border-gray-200');

    if (categoria === 'sopa') sopaSeleccionada = id;
    if (categoria === 'proteina') proteinaSeleccionada = id;
    if (categoria === 'principio') principioSeleccionado = id;
    calcularPrecio();
}

function calcularPrecio() {
    let precio = 0;
    if (tipoSeleccionado === 'completo') precio = menuHoy.precio_completo;
    else if (tipoSeleccionado === 'bandeja') precio = menuHoy.precio_bandeja;
    else precio = menuHoy.precio_sopa;

    if (proteinaSeleccionada) {
        const prot = opcionesHoy.find(o => o.opcion_id === proteinaSeleccionada);
        if (prot && prot.recargo > 0) precio += prot.recargo;
    }
    document.getElementById('cli-precio').textContent = `$${Number(precio).toLocaleString()}`;
}

// ===== ENVIAR PEDIDO =====
async function enviarPedido() {
    if (!tipoSeleccionado) return toast('Selecciona un tipo', false);
    if (tipoSeleccionado === 'completo') {
        if (!sopaSeleccionada) return toast('Elige una sopa', false);
        if (!proteinaSeleccionada) return toast('Elige una proteína', false);
        if (!principioSeleccionado) return toast('Elige un principio', false);
    } else if (tipoSeleccionado === 'bandeja') {
        if (!proteinaSeleccionada) return toast('Elige una proteína', false);
        if (!principioSeleccionado) return toast('Elige un principio', false);
    } else {
        if (!sopaSeleccionada) return toast('Elige una sopa', false);
    }

    try {
        const r = await fetch(`${BASE}/pedido`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mesa_num: MESA,
                tipo: tipoSeleccionado,
                sopa_id: sopaSeleccionada,
                proteina_id: proteinaSeleccionada,
                principio_id: principioSeleccionado,
                notas: document.getElementById('cli-notas').value.trim(),
                nombre_cliente: nombreCliente
            })
        });
        const data = await r.json();
        if (data.ok) {
            toast('Pedido enviado');
            // Reset
            tipoSeleccionado = null;
            sopaSeleccionada = null;
            proteinaSeleccionada = null;
            principioSeleccionado = null;
            document.getElementById('cli-notas').value = '';
            document.getElementById('sec-opciones').classList.add('hidden');
            document.getElementById('sec-notas').classList.add('hidden');
            document.getElementById('sec-pedir').classList.add('hidden');
            document.querySelectorAll('.tipo-btn').forEach(b => {
                b.classList.remove('selected', 'border-amber-500', 'bg-amber-50');
                b.classList.add('border-transparent');
            });
            cargarMisPedidos();
        } else {
            toast(data.error, false);
        }
    } catch(e) { toast('Error de conexión', false); }
}

// ===== MIS PEDIDOS =====
async function cargarMisPedidos() {
    try {
        const r = await fetch(`${BASE}/pedidos?estado=pendiente,listo`);
        const data = await r.json();
        if (!data.ok) return;

        // Filtrar por mi mesa y mi nombre
        const mios = data.pedidos.filter(p => p.mesa_num === MESA && p.nombre_cliente === nombreCliente);
        const cont = document.getElementById('mis-pedidos');

        if (mios.length === 0) {
            cont.innerHTML = '<p class="text-gray-400 text-center text-sm py-4">Aún no has pedido nada</p>';
            return;
        }

        cont.innerHTML = mios.map(p => {
            const items = p.tipo === 'carta'
                ? (p.plato ? `${p.cantidad > 1 ? p.cantidad + 'x ' : ''}${p.plato}` : '')
                : [p.sopa, p.proteina, p.principio].filter(Boolean).join(' + ');
            const esListo = p.estado === 'listo';
            const tipoLabel = p.tipo === 'carta' ? '' : p.tipo.charAt(0).toUpperCase() + p.tipo.slice(1);
            return `
                <div class="bg-white rounded-xl p-3 shadow border-l-4 ${esListo ? 'border-green-500' : 'border-amber-400'}">
                    <div class="flex justify-between items-center">
                        <div>
                            ${tipoLabel ? `<span class="font-semibold text-gray-800">${tipoLabel}</span>` : ''}
                            <span class="font-medium text-gray-800">${items}</span>
                            <span class="text-gray-400 text-xs ml-2">${p.created_at}</span>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full font-bold ${esListo ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${esListo ? 'LISTO' : 'Preparando...'}
                        </span>
                    </div>
                </div>
            `;
        }).join('');
    } catch(e) { console.error(e); }
}

// ===== CARTA CLIENTE =====
async function cargarCartaCliente() {
    try {
        const r = await fetch(`${BASE}/opciones`);
        const data = await r.json();
        if (!data.ok) return;
        cartaCatalogo = data.opciones.filter(o => o.activo);
        carrito = {};

        if (cartaCatalogo.length === 0) {
            document.getElementById('sin-menu').classList.remove('hidden');
            document.getElementById('sec-tipos').classList.add('hidden');
            return;
        }

        // Agrupar por categoría
        const grupos = {};
        cartaCatalogo.forEach(o => {
            if (!grupos[o.tipo]) grupos[o.tipo] = [];
            grupos[o.tipo].push(o);
        });

        document.getElementById('sec-tipos').innerHTML = Object.keys(grupos).map(cat => `
            <div class="mb-4">
                <h3 class="font-bold text-gray-700 text-sm uppercase tracking-wide mb-2">${cat}</h3>
                <div class="space-y-2">
                    ${grupos[cat].map(p => `
                        <div class="bg-white rounded-xl shadow p-3 flex items-center gap-3">
                            ${p.imagen
                                ? `<img src="${p.imagen}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0">`
                                : `<div class="w-16 h-16 rounded-lg bg-gray-100 flex-shrink-0 flex items-center justify-center">
                                    <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                  </div>`}
                            <div class="flex-1 min-w-0">
                                <span class="font-semibold text-gray-800 block">${p.nombre}</span>
                                <span class="text-amber-600 font-bold">$${Number(p.precio).toLocaleString()}</span>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <button onclick="cartaClienteCant(${p.id}, -1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-lg font-bold">-</button>
                                <span id="cli-cant-${p.id}" class="font-bold text-gray-800 w-6 text-center">0</span>
                                <button onclick="cartaClienteCant(${p.id}, 1)" class="bg-amber-500 hover:bg-amber-600 text-white w-8 h-8 rounded-lg font-bold">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        // Mostrar notas y botón pedir
        document.getElementById('sec-notas').classList.remove('hidden');
        document.getElementById('sec-pedir').classList.remove('hidden');
        cartaClienteTotal();
    } catch(e) { console.error(e); }
}

function cartaClienteCant(id, delta) {
    carrito[id] = (carrito[id] || 0) + delta;
    if (carrito[id] <= 0) delete carrito[id];
    const span = document.getElementById(`cli-cant-${id}`);
    if (span) span.textContent = carrito[id] || 0;
    cartaClienteTotal();
}

function cartaClienteTotal() {
    let total = 0;
    Object.keys(carrito).forEach(id => {
        const plato = cartaCatalogo.find(p => p.id === parseInt(id));
        if (plato) total += plato.precio * carrito[id];
    });
    document.getElementById('cli-precio').textContent = `$${Number(total).toLocaleString()}`;
}

// Override enviarPedido for carta
const _enviarPedidoOriginal = enviarPedido;
enviarPedido = async function() {
    if (TIPO_REST === 'carta') {
        const platos = Object.keys(carrito).map(id => ({plato_id: parseInt(id), cantidad: carrito[id]}));
        if (platos.length === 0) return toast('Agrega al menos un plato', false);
        try {
            const r = await fetch(`${BASE}/pedido`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    mesa_num: MESA,
                    platos,
                    notas: document.getElementById('cli-notas').value.trim(),
                    nombre_cliente: nombreCliente
                })
            });
            const data = await r.json();
            if (data.ok) {
                toast('Pedido enviado');
                carrito = {};
                document.getElementById('cli-notas').value = '';
                // Reset cantidades visibles
                cartaCatalogo.forEach(p => {
                    const s = document.getElementById(`cli-cant-${p.id}`);
                    if (s) s.textContent = '0';
                });
                cartaClienteTotal();
                cargarMisPedidos();
            } else {
                toast(data.error, false);
            }
        } catch(e) { toast('Error de conexión', false); }
    } else {
        return _enviarPedidoOriginal();
    }
};

// ===== INIT =====
const nombreGuardado = localStorage.getItem(STORAGE_KEY);
if (nombreGuardado) {
    nombreCliente = nombreGuardado;
    document.getElementById('input-nombre').value = nombreGuardado;
    document.getElementById('saludo-texto').innerHTML = `¡Hola de nuevo, <strong>${nombreGuardado}</strong>!`;
    // Auto-continuar o dejar que confirme
    mostrarMenu();
} else {
    document.getElementById('input-nombre').focus();
}

// Polling mis pedidos cada 10s
setInterval(cargarMisPedidos, 10000);
</script>
</body>
</html>
