<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajería — TUC TUC</title>
  <script src="/static/js/tailwind.js"></script>
</head>
<body class="bg-gray-950 flex overflow-hidden text-white" style="height:100dvh">

<!-- SIDEBAR CONVERSACIONES -->
<div id="sidebar" class="w-full md:w-80 flex-shrink-0 bg-gray-900 border-r border-gray-800 flex flex-col md:!flex">

  <!-- Header -->
  <div class="p-4 border-b border-gray-800 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div id="mi-avatar" onclick="verMiFotoGrande()"
           class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm cursor-pointer overflow-hidden flex-shrink-0 hover:opacity-80 transition" title="Ver / cambiar foto de perfil">
        R
      </div>
      <input id="inp-foto-perfil" type="file" accept="image/*" class="hidden" onchange="subirFotoPerfil(this)">
      <span class="font-semibold">TUC TUC Chat</span>
    </div>
    <button onclick="abrirNuevoInvitado()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-full transition font-medium">
      + Invitar
    </button>
  </div>

  <!-- Lista conversaciones -->
  <div id="lista-convs" class="flex-1 overflow-y-auto">
    <div class="p-4 text-gray-500 text-sm text-center">Cargando...</div>
  </div>
</div>

<!-- PANEL CHAT -->
<div id="panel-chat" class="flex-1 flex flex-col hidden md:flex">
  <div class="flex-1 flex items-center justify-center text-gray-600">
    <div class="text-center">
      <div class="text-5xl mb-3">💬</div>
      <p class="text-lg">Selecciona una conversación</p>
      <p class="text-sm mt-1">o invita a alguien nuevo</p>
    </div>
  </div>
</div>

<!-- MODAL NUEVO INVITADO -->
<div id="modal-invitado" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4">
  <div class="bg-gray-900 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
    <h2 class="text-lg font-bold mb-4">Nueva conversación</h2>
    <div class="mb-3">
      <label class="text-xs text-gray-400 mb-1 block">Nombre del contacto</label>
      <input id="inv-nombre" type="text" placeholder="ej: María" autocomplete="off"
             class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-5">
      <label class="text-xs text-gray-400 mb-1 block">Origen (opcional)</label>
      <input id="inv-origen" type="text" placeholder="ej: Tinder, WhatsApp, Restaurante..."
             class="w-full bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="flex gap-3">
      <button onclick="cerrarModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl transition text-sm">Cancelar</button>
      <button onclick="crearInvitado()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition text-sm font-medium">Crear link</button>
    </div>
  </div>
</div>

<!-- MODAL GALERÍA -->
<div id="modal-foto" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-between hidden py-6 px-4" onclick="cerrarFotoGrande()">
  <!-- Header nombre + cerrar -->
  <div class="flex items-center justify-between w-full max-w-sm" onclick="event.stopPropagation()">
    <span id="galeria-nombre" class="text-white font-semibold text-lg"></span>
    <button onclick="cerrarFotoGrande()" class="text-gray-400 hover:text-white text-2xl leading-none">×</button>
  </div>

  <!-- Foto central con flechas -->
  <div class="relative flex items-center justify-center w-full max-w-sm flex-1 py-4" onclick="event.stopPropagation()">
    <button id="btn-gal-prev" onclick="galeriaNav(-1)"
            class="absolute left-0 z-10 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center text-white text-xl hover:bg-black/80 transition hidden">‹</button>
    <div id="galeria-foto-wrap" class="w-72 h-72 rounded-2xl overflow-hidden bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-7xl font-bold text-white shadow-2xl flex-shrink-0">
    </div>
    <button id="btn-gal-next" onclick="galeriaNav(1)"
            class="absolute right-0 z-10 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center text-white text-xl hover:bg-black/80 transition hidden">›</button>
  </div>

  <!-- Dots + acciones -->
  <div class="flex flex-col items-center gap-3 w-full max-w-sm" onclick="event.stopPropagation()">
    <div id="galeria-dots" class="flex gap-1.5 min-h-[8px]"></div>
    <div class="flex gap-3">
      <button id="btn-galeria-agregar" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-full transition hidden"
              onclick="document.getElementById('inp-foto-galeria').click()">+ Agregar foto</button>
      <button id="btn-galeria-eliminar" class="bg-red-900/60 hover:bg-red-800 text-red-300 text-sm px-4 py-2 rounded-full transition hidden"
              onclick="galeriaEliminarActual()">Eliminar</button>
    </div>
    <input id="inp-foto-galeria" type="file" accept="image/*" class="hidden" onchange="galeriaSubirFoto(this)">
  </div>
</div>

<!-- MODAL LINK GENERADO -->
<div id="modal-link" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4">
  <div class="bg-gray-900 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
    <h2 class="text-lg font-bold mb-2">Link listo 🎉</h2>
    <p class="text-gray-400 text-sm mb-4">Compártelo — la persona puede escribirte o enviarte audio sin registrarse.</p>
    <div id="link-generado" class="bg-gray-800 rounded-xl p-3 text-blue-400 text-sm break-all mb-4 cursor-pointer select-all"
         onclick="copiarLink()"></div>
    <button onclick="copiarLink()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition text-sm font-medium mb-2">
      📋 Copiar link
    </button>
    <button onclick="cerrarModalLink()" class="w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-xl transition text-sm">
      Ir a conversación
    </button>
  </div>
</div>

<script>
let convActiva = null;
let tokenActivo = null;
let pollingInterval = null;
let ultimoMsgId = 0;
const idsRenderizados = new Set();
let mediaRecorder = null;
let audioChunks = [];
let grabando = false;
let miFoto = '';
let miTerceroId = null;
let convData = {}; // token → datos completos

// ---- INIT ----
cargarConversaciones();
setInterval(cargarConversaciones, 15000);
cargarMiPerfil();

// Swipe táctil en galería (delegado en el modal)
let _swipeX = null;
document.getElementById('modal-foto').addEventListener('touchstart', e => {
  _swipeX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('modal-foto').addEventListener('touchend', e => {
  if (_swipeX === null) return;
  const dx = e.changedTouches[0].clientX - _swipeX;
  if (Math.abs(dx) > 40) galeriaNav(dx < 0 ? 1 : -1);
  _swipeX = null;
});

async function cargarMiPerfil() {
  const el = document.getElementById('mi-avatar');
  const r = await fetch('/api/chat/mi-perfil').then(r => r.json()).catch(() => null);
  if (r && r.ok) {
    if (r.id) miTerceroId = r.id;
    if (r.foto) {
      miFoto = r.foto;
      localStorage.setItem('mi_foto_perfil', r.foto);
      aplicarAvatar(el, r.foto);
    } else {
      const fotoLocal = localStorage.getItem('mi_foto_perfil');
      if (fotoLocal) { miFoto = fotoLocal; aplicarAvatar(el, fotoLocal); }
    }
  }
}

function aplicarAvatar(el, url) {
  if (!url) return;
  el.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
}

// ---- GALERÍA ----
let gFotos = [];       // [{id, url, orden}, ...]
let gIndice = 0;
let gEsMia = false;
let gTerceroId = null;

async function abrirGaleria(terceroId, nombre, esMia) {
  gEsMia = esMia;
  gTerceroId = terceroId;
  document.getElementById('galeria-nombre').textContent = nombre;
  document.getElementById('modal-foto').classList.remove('hidden');
  document.getElementById('btn-galeria-agregar').classList.toggle('hidden', !esMia);

  const r = await fetch(`/api/chat/fotos/ver?tercero_id=${terceroId}`).then(r => r.json()).catch(() => null);
  gFotos = (r && r.fotos) ? r.fotos : [];

  // Si no tiene fotos en galería pero tiene foto_perfil, mostrarla como placeholder
  if (gFotos.length === 0 && esMia && miFoto) {
    gFotos = [{ id: null, url: miFoto, orden: 0 }];
  }

  gIndice = 0;
  galeriaRender();
}

function verFotoGrande(url, nombre, esMia) {
  // Compatibilidad — si viene de contacto con terceroId conocido usa galería
  // Si no, muestra la foto directamente
  gEsMia = esMia;
  gTerceroId = null;
  gFotos = url ? [{ id: null, url, orden: 0 }] : [];
  gIndice = 0;
  document.getElementById('galeria-nombre').textContent = nombre;
  document.getElementById('btn-galeria-agregar').classList.add('hidden');
  document.getElementById('btn-galeria-eliminar').classList.add('hidden');
  document.getElementById('modal-foto').classList.remove('hidden');
  galeriaRender();
}

function verMiFotoGrande() {
  if (miTerceroId) {
    abrirGaleria(miTerceroId, 'Mi galería', true);
  } else {
    // fallback: mostrar solo la foto de perfil si aún no tenemos el id
    verFotoGrande(miFoto, 'Mi perfil', true);
  }
}

function cerrarFotoGrande() {
  document.getElementById('modal-foto').classList.add('hidden');
  gFotos = [];
}

function galeriaRender() {
  const wrap = document.getElementById('galeria-foto-wrap');
  const dots = document.getElementById('galeria-dots');
  const btnPrev = document.getElementById('btn-gal-prev');
  const btnNext = document.getElementById('btn-gal-next');
  const btnElim = document.getElementById('btn-galeria-eliminar');

  if (gFotos.length === 0) {
    wrap.innerHTML = `<span>${(document.getElementById('galeria-nombre').textContent || '?')[0].toUpperCase()}</span>`;
    dots.innerHTML = '';
    btnPrev.classList.add('hidden');
    btnNext.classList.add('hidden');
    btnElim.classList.add('hidden');
    return;
  }

  const f = gFotos[gIndice];
  wrap.innerHTML = `<img src="${f.url}" class="w-full h-full object-cover">`;

  // Dots
  dots.innerHTML = gFotos.map((_, i) =>
    `<div class="w-2 h-2 rounded-full transition ${i === gIndice ? 'bg-white' : 'bg-gray-600'}"></div>`
  ).join('');

  btnPrev.classList.toggle('hidden', gFotos.length <= 1);
  btnNext.classList.toggle('hidden', gFotos.length <= 1);
  // Solo mostrar eliminar si es mía y la foto tiene id real (subida a galería, no solo perfil)
  btnElim.classList.toggle('hidden', !gEsMia || !f.id);
}

function galeriaNav(dir) {
  gIndice = (gIndice + dir + gFotos.length) % gFotos.length;
  galeriaRender();
}

async function galeriaSubirFoto(input) {
  if (!input.files[0]) return;
  const wrap = document.getElementById('galeria-foto-wrap');
  wrap.innerHTML = '<div class="text-white text-2xl animate-pulse">⏳</div>';
  const form = new FormData();
  form.append('foto', input.files[0]);
  const r = await fetch('/api/chat/fotos/agregar', { method: 'POST', body: form }).then(r => r.json()).catch(() => null);
  if (r && r.ok) {
    gFotos.push({ id: r.id, url: r.url, orden: r.orden });
    gIndice = gFotos.length - 1;
    galeriaRender();
  } else {
    wrap.innerHTML = '<span>Error</span>';
    alert('Error subiendo foto: ' + (r?.error || 'desconocido'));
  }
  input.value = '';
}

async function galeriaEliminarActual() {
  const f = gFotos[gIndice];
  if (!f || !f.id) return;
  if (!confirm('¿Eliminar esta foto?')) return;
  const r = await fetch(`/api/chat/fotos/${f.id}`, { method: 'DELETE' }).then(r => r.json()).catch(() => null);
  if (r && r.ok) {
    gFotos.splice(gIndice, 1);
    if (gIndice >= gFotos.length) gIndice = Math.max(0, gFotos.length - 1);
    galeriaRender();
  }
}

async function subirFotoPerfil(input) {
  if (!input.files[0]) return;
  const el = document.getElementById('mi-avatar');
  el.innerHTML = '⏳';
  const form = new FormData();
  form.append('foto', input.files[0]);
  const r = await fetch('/api/chat/perfil/foto', {method:'POST', body: form}).then(r => r.json()).catch(() => null);
  if (r && r.ok) {
    miFoto = r.url;
    localStorage.setItem('mi_foto_perfil', r.url);
    aplicarAvatar(el, r.url);
  } else {
    el.innerHTML = 'R';
    alert('Error subiendo foto: ' + (r?.error || 'desconocido'));
  }
}

function avatarHtml(foto, nombre, size='w-10 h-10') {
  const inicial = (nombre || '?')[0].toUpperCase();
  if (foto) return `<div class="${size} rounded-full overflow-hidden flex-shrink-0"><img src="${foto}" class="w-full h-full object-cover"></div>`;
  return `<div class="${size} rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-sm flex-shrink-0">${inicial}</div>`;
}

function cargarConversaciones() {
  fetch('/api/chat/mis-conversaciones')
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      // Guardar datos por token para acceder desde abrirConv
      d.conversaciones.forEach(c => { convData[c.token] = c; });
      const el = document.getElementById('lista-convs');
      if (!d.conversaciones.length) {
        el.innerHTML = '<div class="p-6 text-center text-gray-600 text-sm">Sin conversaciones aún.<br>Invita a alguien.</div>';
        return;
      }
      el.innerHTML = d.conversaciones.map(c => {
        const nombre = c.nombre_invitado || c.nombre_invitado_actual;
        const noLeidos = c.no_leidos > 0 ? `<span class="bg-blue-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1">${c.no_leidos}</span>` : '';
        const ultimoMsg = c.ultimo_tipo === 'audio' ? '🎵 Audio' : (c.ultimo_mensaje || '');
        const origen = c.origen ? `<span class="text-gray-600 text-xs"> · ${c.origen}</span>` : '';
        return `<div onclick="abrirConv('${c.token}', '${nombre}')"
                     class="flex items-center gap-3 px-4 py-3 hover:bg-gray-800 cursor-pointer border-b border-gray-800/50 transition ${tokenActivo === c.token ? 'bg-gray-800' : ''}">
          ${avatarHtml(c.foto_invitado, nombre)}
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="font-medium text-sm truncate">${nombre}${noLeidos}</span>
              ${origen}
            </div>
            <div class="text-gray-500 text-xs truncate mt-0.5">${ultimoMsg}</div>
          </div>
        </div>`;
      }).join('');
    });
}

function abrirConv(token, nombre) {
  // En móvil se oculta (md:!flex lo mantiene visible en desktop sin importar esta clase)
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('panel-chat').classList.remove('hidden');
  document.getElementById('panel-chat').classList.add('flex');

  tokenActivo = token;
  ultimoMsgId = 0;
  idsRenderizados.clear();
  if (pollingInterval) clearInterval(pollingInterval);

  // Obtener foto del invitado si existe
  const c = convData[token] || {};
  const fotoInv = c.foto_invitado || '';
  const avatarInvHeader = fotoInv
    ? `<img src="${fotoInv}" class="w-full h-full object-cover">`
    : `<span>${nombre[0].toUpperCase()}</span>`;

  // Renderizar panel chat
  document.getElementById('panel-chat').innerHTML = `
    <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800 bg-gray-900 flex-shrink-0">
      <button onclick="volverSidebar()" class="md:hidden text-gray-400 hover:text-white mr-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div onclick="abrirGaleria(${c.tercero_id_invitado || 0}, '${nombre}', false)"
           class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-sm flex-shrink-0 overflow-hidden cursor-pointer hover:opacity-80 transition">
        ${avatarInvHeader}
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm">${nombre}</div>
        <div class="text-xs text-gray-500">Sin registrarse</div>
      </div>
      <button onclick="copiarLinkActivo()" id="btn-compartir"
              class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 rounded-full transition flex-shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        Compartir
      </button>
      <button onclick="eliminarConv('${token}')"
              class="w-8 h-8 rounded-full bg-gray-800 hover:bg-red-900 text-gray-500 hover:text-red-400 flex items-center justify-center transition flex-shrink-0" title="Eliminar conversación">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
    <div id="mensajes-container" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <div class="p-3 border-t border-gray-800 bg-gray-900 flex-shrink-0">
      <div class="flex items-end gap-2">
        <div class="flex-1 bg-gray-800 rounded-2xl px-4 py-2.5 min-h-[44px] flex items-center">
          <textarea id="txt-mensaje" rows="1" placeholder="Escribe un mensaje..."
                    class="w-full bg-transparent text-sm text-white placeholder-gray-500 resize-none focus:outline-none max-h-24 overflow-y-auto"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarTexto()}"
                    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
        </div>
        <button id="btn-audio" onclick="toggleGrabacion()" title="Grabar audio"
                class="w-11 h-11 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center transition flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
          </svg>
        </button>
        <button onclick="enviarTexto()"
                class="w-11 h-11 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center transition flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </div>
  `;

  cargarMensajesConv();
  pollingInterval = setInterval(cargarMensajesConv, 3000);
}

function cargarMensajesConv() {
  if (!tokenActivo) return;
  fetch(`/api/chat/invitado/mensajes/${tokenActivo}?desde=${ultimoMsgId}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      const cont = document.getElementById('mensajes-container');
      if (!cont) return;
      d.mensajes.forEach(m => {
        if (idsRenderizados.has(m.id)) return;
        idsRenderizados.add(m.id);
        ultimoMsgId = Math.max(ultimoMsgId, m.id);
        const esCreador = m.remitente_tipo !== 'invitado';
        const div = document.createElement('div');
        div.className = `flex ${esCreador ? 'justify-end' : 'justify-start'}`;
        let contenido = '';
        if (m.tipo === 'audio' && m.url_archivo) {
          contenido = `<audio controls src="${m.url_archivo}" class="max-w-[200px] h-8"></audio>`;
        } else {
          contenido = `<span class="text-sm whitespace-pre-wrap">${m.mensaje}</span>`;
        }
        div.innerHTML = `
          <div class="max-w-[75%] px-3 py-2 rounded-2xl ${esCreador ? 'bg-blue-600 rounded-br-sm' : 'bg-gray-800 rounded-bl-sm'}">
            ${contenido}
            <div class="text-xs opacity-50 mt-1 ${esCreador ? 'text-right' : ''}">${new Date(m.fecha).toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit'})}</div>
          </div>`;
        cont.appendChild(div);
      });
      if (d.mensajes.length > 0) cont.scrollTop = cont.scrollHeight;
    });
}

function enviarTexto() {
  const txt = document.getElementById('txt-mensaje');
  const msg = txt.value.trim();
  if (!msg || !tokenActivo) return;
  txt.value = '';
  txt.style.height = 'auto';
  fetch('/api/chat/invitado/enviar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: tokenActivo, mensaje: msg, tipo: 'texto', es_creador: true})
  }).then(() => cargarMensajesConv());
}

async function toggleGrabacion() {
  const btn = document.getElementById('btn-audio');
  if (!grabando) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btn.textContent = '⏳';
        const blob = new Blob(audioChunks, {type: 'audio/webm'});
        console.log('Audio blob size:', blob.size);
        if (blob.size < 200) { btn.innerHTML = restoreIconMic(); return; }
        try {
          const form = new FormData();
          form.append('audio', blob, 'audio.webm');
          const r = await fetch('/api/chat/invitado/audio', {method:'POST', body: form});
          const d = await r.json();
          console.log('Upload result:', d);
          if (d.ok) {
            const rs = await fetch('/api/chat/invitado/enviar', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({token: tokenActivo, mensaje: '', tipo: 'audio', url_archivo: d.url, es_creador: true})
            });
            const ds = await rs.json();
            console.log('Enviar result:', ds);
            cargarMensajesConv();
          } else {
            alert('Error subiendo audio: ' + (d.error || 'desconocido'));
          }
        } catch(e) {
          alert('Error: ' + e.message);
        }
        btn.innerHTML = restoreIconMic();
      };
      mediaRecorder.start();
      grabando = true;
      btn.classList.replace('bg-gray-700', 'bg-red-600');
      btn.innerHTML = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    } catch(e) {
      alert('No se pudo acceder al micrófono');
    }
  } else {
    mediaRecorder.stop();
    grabando = false;
    btn.classList.replace('bg-red-600', 'bg-gray-700');
    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>';
  }
}

function copiarLinkActivo() {
  if (!tokenActivo) return;
  const link = `${location.origin}/chat/${tokenActivo}`;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById('btn-compartir');
    if (btn) {
      const orig = btn.innerHTML;
      btn.textContent = '✓ Copiado';
      setTimeout(() => btn.innerHTML = orig, 1800);
    }
  });
}

function volverSidebar() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('panel-chat').classList.add('hidden');
  if (pollingInterval) clearInterval(pollingInterval);
}

// ---- MODAL NUEVO INVITADO ----
let linkGenerado = '';

function abrirNuevoInvitado() {
  document.getElementById('inv-nombre').value = '';
  document.getElementById('inv-origen').value = '';
  document.getElementById('modal-invitado').classList.remove('hidden');
  setTimeout(() => document.getElementById('inv-nombre').focus(), 100);
}

function cerrarModal() {
  document.getElementById('modal-invitado').classList.add('hidden');
}

function crearInvitado() {
  const nombre = document.getElementById('inv-nombre').value.trim() || 'Invitado';
  const origen = document.getElementById('inv-origen').value.trim();
  fetch('/api/chat/invitar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({nombre, origen})
  }).then(r => r.json()).then(d => {
    if (!d.ok) { alert('Error: ' + d.error); return; }
    cerrarModal();
    linkGenerado = d.link;
    cargarConversaciones();
    // Abrir chat directo — graba el audio ANTES de compartir el link
    abrirConv(d.token, nombre);
  });
}

function copiarLink() {
  navigator.clipboard.writeText(linkGenerado).then(() => {
    const btn = event.target.closest('button');
    if (btn) { btn.textContent = '✓ Copiado!'; setTimeout(() => btn.textContent = '📋 Copiar link', 1500); }
  });
}

function eliminarConv(token) {
  if (!confirm('¿Eliminar esta conversación y todos sus mensajes?')) return;
  fetch(`/api/chat/eliminar/${token}`, {method: 'DELETE'})
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { alert('Error: ' + d.error); return; }
      // Volver al sidebar y recargar lista
      volverSidebar();
      tokenActivo = null;
      document.getElementById('panel-chat').innerHTML = `
        <div class="flex-1 flex items-center justify-center text-gray-600">
          <div class="text-center"><div class="text-5xl mb-3">💬</div>
          <p class="text-lg">Selecciona una conversación</p></div>
        </div>`;
      cargarConversaciones();
    });
}

function restoreIconMic() {
  return '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>';
}

function cerrarModalLink() {
  document.getElementById('modal-link').classList.add('hidden');
  if (linkGenerado) {
    const token = linkGenerado.split('/chat/')[1];
    if (token) abrirConv(token, document.getElementById('inv-nombre')?.value || 'Invitado');
  }
}
</script>
</body>
