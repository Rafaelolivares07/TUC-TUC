<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesorería: Pagos, Desembolsos y Recaudos — {{ negocio_nombre }} | TUC TUC</title>

  <script src="/static/js/tailwind.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .no-spinners::-webkit-inner-spin-button,
    .no-spinners::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .no-spinners {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Overlays base styles */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .overlay.hidden {
      display: none !important;
    }
    .modal {
      background: white;
      border-radius: 1rem;
      max-width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      padding: 1.25rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1e293b;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .toast-ok { background: #059669 !important; }
    .toast-err { background: #dc2626 !important; }
    .toast-warn { background: #d97706 !important; }
  </style>
</head>
<body class="min-h-full flex flex-col text-slate-800 bg-slate-50 selection:bg-rose-100 selection:text-rose-900">

  <!-- ================= TOPBAR CORPORATIVA OFICIAL ================= -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Identidad Corporativa Oficial: TUC TUC | Negocio | Sede -->
      <div class="flex items-center gap-3">
        <a href="/inicio" class="group flex items-center gap-2.5 text-slate-900 hover:text-rose-600 transition-colors" title="Regresar al Menú Principal">
          <span class="font-extrabold text-sm sm:text-base tracking-wider text-slate-900 group-hover:text-rose-600 transition-colors">
            TUC TUC
          </span>
          <span class="text-sm font-semibold tracking-wider text-slate-300">|</span>
          <span class="text-sm sm:text-base font-bold tracking-tight text-slate-900 group-hover:text-rose-600 transition-colors uppercase">
            {{ negocio_nombre }}
          </span>
        </a>

        {% if centro_activo %}
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          {{ centro_activo.nombre | upper }}
        </span>
        {% endif %}
      </div>

      <!-- Contexto y Navegación Dual (Inventario y Contabilidad) -->
      <div class="flex items-center gap-2">
        <span class="hidden md:inline-flex px-3 py-1 bg-slate-100 text-slate-600 font-semibold text-xs rounded-xl border border-slate-200">
          💸 Tesorería & Desembolsos
        </span>
        <a href="/inventario/{{ negocio_id }}" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all border border-slate-200 flex items-center gap-1.5" title="Ir a Inventario">
          <span>&larr;</span> <span>Inventario</span>
        </a>
        <a href="/contabilidad/{{ negocio_id }}" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all border border-slate-200 flex items-center gap-1.5" title="Ir a Contabilidad">
          <span>&larr;</span> <span>Contabilidad</span>
        </a>
        <a href="/inicio" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all border border-slate-200 flex items-center gap-1.5" title="Ir al Inicio">
          <span>Inicio</span>
        </a>
      </div>

    </div>
  </header>

  <!-- ================= CONTENEDOR PRINCIPAL ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% include "gastos_pane.html" %}
  </main>

  <!-- Toast Notificaciones -->
  <div id="toast" class="toast"></div>

  <!-- Inyección de Contexto Global y Helper Toast -->
  <script>
    const NEGOCIO_ID = {{ negocio_id }};
    const CENTRO_ACTIVO = {{ (centro_activo | tojson) if centro_activo else 'null' }};
    const CENTROS_UTILIDAD = {{ (centros_utilidad | tojson) if centros_utilidad else '[]' }};

    function toast(msg, ok = true, duracion = 3200) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      let cls = 'toast-ok';
      if (ok === false || ok === 'error') cls = 'toast-err';
      else if (ok === 'warning' || ok === 'warn' || ok === 'info') cls = 'toast-warn';
      el.className = `toast show ${cls}`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), duracion);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof inicializarModuloGastos === 'function') {
        inicializarModuloGastos();
      }
    });
  </script>
</body>
</html>
