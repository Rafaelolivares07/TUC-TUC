<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios de Transporte - TucTuc</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
</head>
<body class="bg-gray-50">

    <div class="max-w-4xl mx-auto p-4">

        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Servicios de Transporte</h1>
            <p class="text-gray-600 mt-2">Solicita tu servicio de forma rápida y segura</p>
        </div>

        <!-- Botones de Tipo de Servicio -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
            <h2 class="text-xl font-semibold mb-4">¿Qué servicio necesitas?</h2>

            <div class="grid grid-cols-2 gap-4">
                <button id="btn-transporte" class="p-6 border-2 border-blue-500 bg-blue-50 rounded-lg transition">
                    <div class="text-4xl mb-2">🚗</div>
                    <div class="font-semibold text-lg">Transporte</div>
                    <div class="text-sm text-gray-600">De un punto a otro</div>
                </button>

                <button id="btn-acompanamiento" class="p-6 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition">
                    <div class="text-4xl mb-2">🤝</div>
                    <div class="font-semibold text-lg">Acompañamiento</div>
                    <div class="text-sm text-gray-600">Con espera incluida</div>
                </button>
            </div>
        </div>

        <!-- Formulario de Transporte -->
        <div id="form-transporte" class="bg-white rounded-lg shadow-lg p-6 mb-4">
            <h2 class="text-xl font-semibold mb-4">Detalles del viaje</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <input type="text" id="input-nombre" class="w-full p-3 border rounded-lg"
                           placeholder="Tu nombre completo">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                    <input type="tel" id="input-telefono" class="w-full p-3 border rounded-lg"
                           placeholder="Ej: 3175718658">
                </div>

                <div class="relative">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Origen</label>
                    <input type="text" id="input-origen" class="w-full p-3 border rounded-lg"
                           placeholder="Ej: Calle 5 Norte 23-45" autocomplete="off">
                    <div id="autocomplete-origen" class="hidden absolute z-10 w-full bg-white border border-gray-300 rounded-lg shadow-lg mt-1 max-h-60 overflow-y-auto">
                    </div>
                    <button id="btn-usar-ubicacion" class="text-sm text-blue-600 mt-1">
                        📍 Usar mi ubicación actual
                    </button>
                </div>

                <div class="relative">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Destino</label>
                    <input type="text" id="input-destino" class="w-full p-3 border rounded-lg"
                           placeholder="Ej: Avenida 6 Norte 28-50" autocomplete="off">
                    <div id="autocomplete-destino" class="hidden absolute z-10 w-full bg-white border border-gray-300 rounded-lg shadow-lg mt-1 max-h-60 overflow-y-auto">
                    </div>
                </div>

                <button id="btn-calcular-ruta" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Calcular ruta y tarifa
                </button>
            </div>
        </div>

        <!-- Formulario de Acompañamiento -->
        <div id="form-acompanamiento" class="bg-white rounded-lg shadow-lg p-6 mb-4 hidden">
            <h2 class="text-xl font-semibold mb-4">Servicio de acompañamiento</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <input type="text" id="input-nombre-acomp" class="w-full p-3 border rounded-lg"
                           placeholder="Tu nombre completo">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                    <input type="tel" id="input-telefono-acomp" class="w-full p-3 border rounded-lg"
                           placeholder="Ej: 3175718658">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">¿Cuántas horas necesitas?</label>
                    <input type="number" id="input-horas" class="w-full p-3 border rounded-lg"
                           placeholder="Ej: 3" min="2" value="2">
                    <p class="text-sm text-gray-500 mt-1">Mínimo 2 horas</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Notas (opcional)</label>
                    <textarea id="input-notas-acomp" class="w-full p-3 border rounded-lg" rows="3"
                              placeholder="Ej: Necesito ayuda con silla de ruedas"></textarea>
                </div>

                <button id="btn-calcular-acompanamiento" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Calcular tarifa
                </button>
            </div>
        </div>

        <!-- Mapa -->
        <div id="contenedor-mapa" class="bg-white rounded-lg shadow-lg p-6 mb-4 hidden">
            <h2 class="text-xl font-semibold mb-4">Mapa del recorrido</h2>
            <div id="map" style="width: 100%; height: 400px; border-radius: 8px;"></div>
        </div>

        <!-- Resumen -->
        <div id="resumen" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <h2 class="text-xl font-semibold mb-4">Resumen del servicio</h2>

            <div class="space-y-3">
                <div id="info-distancia" class="flex justify-between hidden">
                    <span class="text-gray-600">Distancia:</span>
                    <span id="distancia" class="font-semibold">-</span>
                </div>

                <div id="info-tiempo" class="flex justify-between hidden">
                    <span class="text-gray-600">Tiempo estimado:</span>
                    <span id="tiempo" class="font-semibold">-</span>
                </div>

                <div id="info-horas" class="flex justify-between hidden">
                    <span class="text-gray-600">Horas de acompañamiento:</span>
                    <span id="horas-display" class="font-semibold">-</span>
                </div>

                <div class="flex justify-between text-xl font-bold border-t pt-3">
                    <span>Tarifa:</span>
                    <span id="tarifa" class="text-green-600">$0</span>
                </div>
            </div>

            <button id="btn-confirmar" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition mt-6">
                Confirmar solicitud
            </button>
        </div>

    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine JavaScript -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // Variables globales
        let tipoServicioActual = 'transporte';
        let map = null;
        let routeControl = null;
        let datosCalculados = {};
        let coordenadasOrigenActual = null; // Guardar coordenadas cuando se usa "ubicación actual"
        let coordenadasDestinoSeleccionado = null; // Guardar coordenadas cuando se selecciona del autocomplete
        let coordenadasOrigenSeleccionado = null; // Guardar coordenadas cuando se selecciona origen del autocomplete
        let timeoutAutocompleteDestino = null;
        let timeoutAutocompleteOrigen = null;
        let ubicacionGPSActual = null; // Guardar ubicación GPS para búsquedas por proximidad

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            configurarBotones();
        });

        function configurarBotones() {
            // Selección de tipo de servicio
            document.getElementById('btn-transporte').addEventListener('click', function() {
                seleccionarTipoServicio('transporte');
            });

            document.getElementById('btn-acompanamiento').addEventListener('click', function() {
                seleccionarTipoServicio('acompanamiento');
            });

            // Calcular ruta (transporte)
            document.getElementById('btn-calcular-ruta').addEventListener('click', function() {
                calcularRutaTransporte();
            });

            // Calcular tarifa (acompañamiento)
            document.getElementById('btn-calcular-acompanamiento').addEventListener('click', function() {
                calcularTarifaAcompanamiento();
            });

            // Confirmar solicitud
            document.getElementById('btn-confirmar').addEventListener('click', function() {
                confirmarSolicitud();
            });

            // Usar ubicación actual
            document.getElementById('btn-usar-ubicacion').addEventListener('click', function() {
                usarUbicacionActual();
            });

            // Autocomplete para origen
            document.getElementById('input-origen').addEventListener('input', function() {
                coordenadasOrigenActual = null;
                coordenadasOrigenSeleccionado = null;
                buscarDireccionesAutocompleteOrigen(this.value);
            });

            // Autocomplete para destino
            document.getElementById('input-destino').addEventListener('input', function() {
                coordenadasDestinoSeleccionado = null;
                buscarDireccionesAutocompleteDestino(this.value);
            });

            // Cerrar autocomplete si se hace clic fuera
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#input-origen') && !e.target.closest('#autocomplete-origen')) {
                    document.getElementById('autocomplete-origen').classList.add('hidden');
                }
                if (!e.target.closest('#input-destino') && !e.target.closest('#autocomplete-destino')) {
                    document.getElementById('autocomplete-destino').classList.add('hidden');
                }
            });
        }

        function seleccionarTipoServicio(tipo) {
            tipoServicioActual = tipo;

            // Actualizar UI de botones
            const btnTransporte = document.getElementById('btn-transporte');
            const btnAcompanamiento = document.getElementById('btn-acompanamiento');

            if (tipo === 'transporte') {
                btnTransporte.className = 'p-6 border-2 border-blue-500 bg-blue-50 rounded-lg transition';
                btnAcompanamiento.className = 'p-6 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition';
                document.getElementById('form-transporte').classList.remove('hidden');
                document.getElementById('form-acompanamiento').classList.add('hidden');
            } else {
                btnAcompanamiento.className = 'p-6 border-2 border-blue-500 bg-blue-50 rounded-lg transition';
                btnTransporte.className = 'p-6 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition';
                document.getElementById('form-acompanamiento').classList.remove('hidden');
                document.getElementById('form-transporte').classList.add('hidden');
            }

            // Ocultar mapa y resumen
            document.getElementById('contenedor-mapa').classList.add('hidden');
            document.getElementById('resumen').classList.add('hidden');
        }

        async function buscarDireccion(direccion) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion + '')}&countrycodes=co&limit=1`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 segundos timeout

                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: {
                        'User-Agent': 'TucTucApp/1.0'
                    }
                });

                clearTimeout(timeoutId);
                const data = await response.json();

                if (data.length > 0) {
                    const resultado = data[0];
                    return {
                        lat: parseFloat(resultado.lat),
                        lon: parseFloat(resultado.lon),
                        nombre: resultado.display_name
                    };
                } else {
                    return null;
                }
            } catch (error) {
                console.error('Error en búsqueda:', error);
                if (error.name === 'AbortError') {
                    alert('La búsqueda de dirección tardó mucho. Intenta con una dirección más específica o usa coordenadas.');
                }
                return null;
            }
        }

        function inicializarMapa() {
            if (!map) {
                map = L.map('map').setView([3.4516, -76.5320], 13);

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
            }
        }

        async function calcularRutaTransporte() {
            const origen = document.getElementById('input-origen').value.trim();
            const destino = document.getElementById('input-destino').value.trim();

            if (!origen || !destino) {
                alert('Por favor ingresa origen y destino');
                return;
            }

            alert('Buscando direcciones y calculando ruta...');

            // Si ya tenemos coordenadas del origen (de "usar mi ubicación"), usarlas directamente
            let coordsOrigen;
            if (coordenadasOrigenActual) {
                coordsOrigen = coordenadasOrigenActual;
            } else {
                coordsOrigen = await buscarDireccion(origen);
            }

            // Si ya tenemos coordenadas del destino (del autocomplete), usarlas directamente
            let coordsDestino;
            if (coordenadasDestinoSeleccionado) {
                coordsDestino = coordenadasDestinoSeleccionado;
            } else {
                // Esperar 1 segundo entre peticiones (rate limit de Nominatim)
                await new Promise(resolve => setTimeout(resolve, 1000));
                coordsDestino = await buscarDireccion(destino);
            }

            if (!coordsOrigen) {
                alert('No se encontró la dirección de origen. Intenta con una dirección más específica (ej: Calle 5 Norte 23-45)');
                return;
            }

            if (!coordsDestino) {
                alert('No se encontró la dirección de destino. Intenta con una dirección más específica');
                return;
            }

            document.getElementById('contenedor-mapa').classList.remove('hidden');
            inicializarMapa();

            if (routeControl) {
                map.removeControl(routeControl);
            }

            const origenLatLng = L.latLng(coordsOrigen.lat, coordsOrigen.lon);
            const destinoLatLng = L.latLng(coordsDestino.lat, coordsDestino.lon);

            routeControl = L.Routing.control({
                waypoints: [origenLatLng, destinoLatLng],
                routeWhileDragging: false,

                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                }),

                lineOptions: {
                    styles: [{color: '#3B82F6', weight: 6}]
                },

                createMarker: function(i, waypoint, n) {
                    const marker = L.marker(waypoint.latLng, {
                        draggable: false
                    });

                    if (i === 0) {
                        marker.bindPopup("📍 Origen");
                    } else if (i === n - 1) {
                        marker.bindPopup("🎯 Destino");
                    }

                    return marker;
                },

                show: false,
                addWaypoints: false,
                draggableWaypoints: false
            }).addTo(map);

            routeControl.on('routesfound', async function(e) {
                const routes = e.routes;
                const summary = routes[0].summary;

                const distanciaMetros = summary.totalDistance;
                const distanciaKm = parseFloat((distanciaMetros / 1000).toFixed(2));

                const tiempoSegundos = summary.totalTime;
                const tiempoMinutos = Math.round(tiempoSegundos / 60);

                const response = await fetch('/api/calcular-tarifa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo_servicio: 'transporte',
                        distancia_km: distanciaKm
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    mostrarResumen({
                        tipo: 'transporte',
                        distancia_km: distanciaKm,
                        tiempo_estimado_minutos: tiempoMinutos,
                        tarifa: data.tarifa
                    });
                } else {
                    alert('Error: ' + data.error);
                }
            });

            routeControl.on('routingerror', function(e) {
                alert('No se pudo calcular la ruta. Verifica las direcciones ingresadas.');
                console.error('Routing error:', e);
            });
        }

        async function calcularTarifaAcompanamiento() {
            const horas = parseInt(document.getElementById('input-horas').value);

            if (!horas || horas < 2) {
                alert('Mínimo 2 horas de servicio');
                return;
            }

            // Calcular tarifa
            const response = await fetch('/api/calcular-tarifa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tipo_servicio: 'acompanamiento',
                    horas_acompanamiento: horas
                })
            });

            const data = await response.json();

            if (data.ok) {
                mostrarResumen({
                    tipo: 'acompanamiento',
                    horas: horas,
                    tarifa: data.tarifa
                });
            } else {
                alert('Error: ' + data.error);
            }
        }

        function mostrarResumen(datos) {
            datosCalculados = datos;

            // Mostrar sección de resumen
            document.getElementById('resumen').classList.remove('hidden');

            if (datos.tipo === 'transporte') {
                document.getElementById('info-distancia').classList.remove('hidden');
                document.getElementById('info-tiempo').classList.remove('hidden');
                document.getElementById('info-horas').classList.add('hidden');

                document.getElementById('distancia').textContent = datos.distancia_km + ' km';
                document.getElementById('tiempo').textContent = datos.tiempo_estimado_minutos + ' min';
            } else {
                document.getElementById('info-horas').classList.remove('hidden');
                document.getElementById('info-distancia').classList.add('hidden');
                document.getElementById('info-tiempo').classList.add('hidden');

                document.getElementById('horas-display').textContent = datos.horas + ' horas';
            }

            document.getElementById('tarifa').textContent = '$' + datos.tarifa.toLocaleString();

            // Scroll al resumen
            document.getElementById('resumen').scrollIntoView({ behavior: 'smooth' });
        }

        async function confirmarSolicitud() {
            let nombre, telefono, notas, origenTexto, destinoTexto;

            if (tipoServicioActual === 'transporte') {
                nombre = document.getElementById('input-nombre').value.trim();
                telefono = document.getElementById('input-telefono').value.trim();
                origenTexto = document.getElementById('input-origen').value.trim();
                destinoTexto = document.getElementById('input-destino').value.trim();
            } else {
                nombre = document.getElementById('input-nombre-acomp').value.trim();
                telefono = document.getElementById('input-telefono-acomp').value.trim();
                notas = document.getElementById('input-notas-acomp').value.trim();
            }

            if (!nombre || !telefono) {
                alert('Por favor completa nombre y teléfono');
                return;
            }

            // Crear solicitud
            const body = {
                tipo_servicio: tipoServicioActual,
                nombre: nombre,
                telefono: telefono,
                precio: datosCalculados.tarifa
            };

            if (tipoServicioActual === 'transporte') {
                body.origen_texto = origenTexto;
                body.destino_texto = destinoTexto;
                body.distancia_km = datosCalculados.distancia_km;
                body.tiempo_estimado_minutos = datosCalculados.tiempo_estimado_minutos;
            } else {
                body.horas_acompanamiento = datosCalculados.horas;
                body.notas = notas;
            }

            const response = await fetch('/api/solicitar-servicio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (data.ok) {
                alert('¡Solicitud enviada! Te contactaremos pronto. Solicitud #' + data.solicitud_id);
                location.reload();
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function obtenerDireccionReversa(lat, lng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&countrycodes=co`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.display_name) {
                    return data.display_name;
                } else {
                    return `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                }
            } catch (error) {
                console.error('Error en búsqueda reversa:', error);
                return `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            }
        }

        function expandirAbreviaturas(texto) {
            const abreviaturas = {
                'av': 'avenida',
                'ave': 'avenida',
                'aven': 'avenida',
                'aveni': 'avenida',
                'avenid': 'avenida',
                'cl': 'calle',
                'cll': 'calle',
                'call': 'calle',
                'calle': 'calle',
                'cr': 'carrera',
                'crr': 'carrera',
                'carr': 'carrera',
                'carre': 'carrera',
                'carrer': 'carrera',
                'carrera': 'carrera',
                'dg': 'diagonal',
                'diag': 'diagonal',
                'diagonal': 'diagonal',
                'tr': 'transversal',
                'trans': 'transversal',
                'transversal': 'transversal'
            };

            const palabras = texto.toLowerCase().split(' ');
            const palabrasExpandidas = palabras.map(palabra => {
                return abreviaturas[palabra] || palabra;
            });

            return palabrasExpandidas.join(' ');
        }

        function buscarDireccionesAutocompleteDestino(texto) {
            clearTimeout(timeoutAutocompleteDestino);

            if (texto.length < 2) {
                document.getElementById('autocomplete-destino').classList.add('hidden');
                return;
            }

            timeoutAutocompleteDestino = setTimeout(async () => {
                const textoExpandido = expandirAbreviaturas(texto);
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textoExpandido)}&countrycodes=co&limit=20`;

                try {
                    const response = await fetch(url, {
                        headers: { 'User-Agent': 'TucTucApp/1.0' }
                    });
                    const resultados = await response.json();

                    mostrarSugerenciasDestino(resultados);
                } catch (error) {
                    console.error('Error en autocomplete destino:', error);
                }
            }, 500);
        }

        async function buscarDireccionesAutocompleteOrigen(texto) {
            clearTimeout(timeoutAutocompleteOrigen);

            if (texto.length < 2) {
                document.getElementById('autocomplete-origen').classList.add('hidden');
                return;
            }

            timeoutAutocompleteOrigen = setTimeout(async () => {
                // Expandir abreviaturas antes de buscar
                const textoExpandido = expandirAbreviaturas(texto);

                // Búsqueda por texto
                const urlTexto = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textoExpandido)}&countrycodes=co&limit=15`;

                try {
                    const response = await fetch(urlTexto, {
                        headers: { 'User-Agent': 'TucTucApp/1.0' }
                    });
                    let resultados = await response.json();

                    // Si tenemos ubicación GPS, agregar búsqueda por proximidad AL INICIO
                    if (ubicacionGPSActual) {
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Rate limit

                        const urlProximidad = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textoExpandido)}&countrycodes=co&lat=${ubicacionGPSActual.lat}&lon=${ubicacionGPSActual.lon}&limit=10`;

                        const responseProx = await fetch(urlProximidad, {
                            headers: { 'User-Agent': 'TucTucApp/1.0' }
                        });
                        const resultadosProx = await responseProx.json();

                        // Poner resultados de proximidad PRIMERO (cercanos al inicio)
                        const resultadosCombinados = [...resultadosProx];

                        // Agregar resultados de texto que no estén ya en proximidad
                        resultados.forEach(r => {
                            const yaExiste = resultadosProx.some(rp => rp.place_id === r.place_id);
                            if (!yaExiste) {
                                resultadosCombinados.push(r);
                            }
                        });

                        resultados = resultadosCombinados;
                    }

                    mostrarSugerenciasOrigen(resultados, texto);
                } catch (error) {
                    console.error('Error en autocomplete origen:', error);
                }
            }, 500);
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            // Fórmula de Haversine para calcular distancia en km
            const R = 6371; // Radio de la Tierra en km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function mostrarSugerenciasDestino(resultados) {
            const contenedor = document.getElementById('autocomplete-destino');

            let resultadosOrdenados = resultados;

                    const distB = calcularDistancia(

                        parseFloat(b.lat), parseFloat(b.lon)
                    );
                    return distA - distB; // Más cercanos primero

        function usarUbicacionActual() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Guardar ubicación GPS para búsquedas por proximidad
                    ubicacionGPSActual = { lat: lat, lon: lng };

                    // Guardar coordenadas para usar directamente después
                    coordenadasOrigenActual = { lat: lat, lon: lng };

                    const direccion = await obtenerDireccionReversa(lat, lng);
                    document.getElementById('input-origen').value = direccion;

                    alert('Ubicación detectada: ' + direccion);
                }, function(error) {
                    alert('No se pudo obtener tu ubicación. Verifica los permisos del navegador.');
                });
            } else {
