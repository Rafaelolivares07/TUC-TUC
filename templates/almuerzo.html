<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Almuerzo del día</title>
    <script src="/static/js/tailwind.js"></script>
    <style>
        body { background: #f8fafc; }
        .step { display: none; }
        .step.active { display: block; }
        .item-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
        .item-row .nombre { flex: 1; font-size: 0.9rem; color: #1e293b; }
        .btn-star  { font-size: 1.3rem; line-height: 1; background: none; border: none; cursor: pointer; flex-shrink: 0; transition: transform .1s; }
        .btn-star:active { transform: scale(1.3); }
        .btn-star.starred { color: #f59e0b; }
        .btn-star:not(.starred) { color: #d1d5db; }
        .btn-del   { font-size: 1rem; line-height: 1; background: none; border: none; cursor: pointer; flex-shrink: 0; color: #cbd5e1; padding: 2px 4px; }
        .btn-del:hover, .btn-del:active { color: #ef4444; }
        .bloque-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
        .bloque-label { font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; }
        .lbl-sopa      { background: #fef9c3; color: #713f12; }
        .lbl-principio { background: #dcfce7; color: #14532d; }
        .lbl-proteina  { background: #fce7f3; color: #831843; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #c7d2fe; border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #modal-id { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; align-items: flex-end; justify-content: center; }
        #modal-id.open { display: flex; }
        #modal-id-inner { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 20px 36px; width: 100%; max-width: 480px; }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-md mx-auto px-4 pt-6 pb-24">

    <!-- Header -->
    <div class="mb-5">
        <h1 class="text-2xl font-extrabold text-indigo-700 tracking-tight">🥗 Almuerzo del día</h1>
        <p class="text-sm text-gray-500 mt-1">Selecciona el restaurante y arma el menú de hoy</p>
        <div id="saludo-usuario" class="hidden mt-2 flex items-center gap-2">
            <span class="text-sm text-indigo-600 font-semibold" id="saludo-nombre"></span>
            <button onclick="resetIdentidad()" class="text-xs text-gray-400 underline">no soy yo</button>
        </div>
    </div>

    <!-- STEP 1: selección restaurante -->
    <div id="step-menu" class="step active">
        <div class="bg-white rounded-2xl shadow-sm border p-4 mb-4">
            <p class="text-xs font-semibold text-gray-500 uppercase mb-2 tracking-wide">Restaurante</p>
            <select id="sel-restaurante" class="w-full border rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option value="">Cargando...</option>
            </select>
            <div class="mt-2">
                <button onclick="mostrarNuevoRestaurante()" id="btn-toggle-nuevo"
                        class="text-sm text-indigo-600 font-semibold underline">+ Crear restaurante nuevo</button>
            </div>
            <div id="form-nuevo-rest" class="hidden mt-3 space-y-2">
                <input id="inp-rest-nombre" type="text" placeholder="Nombre del restaurante"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input id="inp-due-nombre" type="text" placeholder="Nombre del dueño (opcional)"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input id="inp-due-tel" type="tel" inputmode="numeric" placeholder="Celular del dueño (opcional)"
                       class="border rounded-xl px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
        </div>

        <button id="btn-continuar" onclick="continuar()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold text-base shadow-sm">
            Continuar →
        </button>
    </div>

    <!-- STEP 2: armar menú + seleccionar -->
    <div id="step-items" class="step">
        <div class="flex items-center gap-3 mb-3">
            <button onclick="showStep('step-menu')" class="text-xs text-indigo-600 underline">← Volver</button>
            <span class="flex-1 text-xs text-gray-400 text-right">★ lo que pido hoy</span>
        </div>

        <div id="bloques-container"></div>

        <!-- Precios -->
        <div class="mt-4 bg-white rounded-2xl border p-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-3 tracking-wide">Precios de hoy</label>
            <div class="space-y-2">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold text-yellow-700 w-24">🍲 Sopa</span>
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
                        <input type="number" inputmode="numeric" id="inp-precio-sopa" placeholder="0"
                               oninput="state.precios.sopa = parseFloat(this.value)||0"
                               class="w-full border rounded-xl pl-7 pr-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold text-pink-700 w-24">🍖 Bandeja</span>
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
                        <input type="number" inputmode="numeric" id="inp-precio-bandeja" placeholder="0"
                               oninput="state.precios.bandeja = parseFloat(this.value)||0"
                               class="w-full border rounded-xl pl-7 pr-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold text-green-700 w-24">🥘 Completo</span>
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
                        <input type="number" inputmode="numeric" id="inp-precio-completo" placeholder="0"
                               oninput="state.precios.completo = parseFloat(this.value)||0"
                               class="w-full border rounded-xl pl-7 pr-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tipo entrega -->
        <div class="mt-4 bg-white rounded-2xl border p-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-2 tracking-wide">¿Cómo lo quieres?</label>
            <div class="flex gap-2">
                <button id="btn-recoger" onclick="setEntrega('recoger')"
                        class="flex-1 py-3 rounded-xl font-semibold text-sm border-2 border-indigo-500 bg-indigo-50 text-indigo-700">
                    📍 Recoger
                </button>
                <button id="btn-domicilio" onclick="setEntrega('domicilio')"
                        class="flex-1 py-3 rounded-xl font-semibold text-sm border-2 border-gray-200 text-gray-500 hover:bg-gray-50">
                    🛵 Domicilio
                </button>
            </div>
        </div>

        <div class="mt-4 bg-white rounded-2xl border p-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1 tracking-wide">Notas (opcional)</label>
            <input id="inp-notas" type="text" placeholder="Sin cilantro, sin picante..."
                   class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <div class="mt-5 space-y-3">
            <button onclick="iniciarConfirmar()"
                    class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-2xl font-bold text-base shadow-sm">
                ¡Hacer mi pedido! 🚀
            </button>
            <button onclick="soloCompartirEnlace()"
                    class="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 py-3 rounded-2xl font-semibold text-sm">
                Enviarle el enlace al restaurante (sin pedido)
            </button>
            <button onclick="showStep('step-menu')"
                    class="w-full border border-gray-200 text-gray-500 py-2 rounded-2xl text-sm hover:bg-gray-50">
                No me convence este menú — ver otro restaurante
            </button>
        </div>
    </div>

    <!-- STEP 3: resultado -->
    <div id="step-done" class="step text-center">
        <div class="bg-white rounded-2xl shadow-sm border p-8 mt-4">
            <div class="text-5xl mb-4">✅</div>
            <h2 class="text-xl font-extrabold text-gray-800 mb-2">¡Pedido creado!</h2>
            <p id="lbl-done-nombre" class="text-sm text-gray-500 mb-5"></p>
            <a id="link-cocina" href="#" target="_blank"
               class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold text-base mb-3">
                Ver en cocina
            </a>
            <a id="link-wa-cocina" href="#" target="_blank"
               class="block w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-bold text-base mb-3">
                Enviar enlace por WhatsApp
            </a>
            <button onclick="nuevoAlmuerzo()"
                    class="w-full border border-gray-300 text-gray-600 py-3 rounded-2xl text-sm font-semibold hover:bg-gray-50">
                Pedir en otro restaurante
            </button>
        </div>
    </div>

</div>

<!-- Modal identificación -->
<div id="modal-id">
    <div id="modal-id-inner">
        <h3 class="text-lg font-extrabold text-gray-800 mb-1">¿Cómo te llamas?</h3>
        <p class="text-sm text-gray-500 mb-4">Para identificar tu pedido en cocina.</p>
        <input id="modal-nombre" type="text" placeholder="Tu nombre" maxlength="80" autofocus
               class="border rounded-xl px-4 py-3 text-base w-full focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-3">
        <input id="modal-tel" type="tel" inputmode="numeric" placeholder="Tu celular (opcional)" maxlength="15"
               class="border rounded-xl px-4 py-3 text-base w-full focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-4">
        <button onclick="confirmarConIdentidad()"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-2xl font-bold text-base">
            ¡Listo, enviar pedido!
        </button>
        <button onclick="cerrarModal()" class="mt-3 w-full text-sm text-gray-400 underline">Cancelar</button>
    </div>
</div>

<script>
const API = '/api/almuerzo';

let state = {
    tercero_id:        null,
    nombre:            '',
    telefono:          '',
    restaurante_id:    null,
    restaurante_nuevo: null,
    tipo_entrega:      'recoger',
    precios:           { sopa: 0, bandeja: 0, completo: 0 },
    bloques:           { sopa: [], principio: [], proteina: [] },
    catalogo:          { propio: [], global: [] },
};
let tempCounter = 0;

// ───── UTILS ─────
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function toast(msg, ok = true) {
    const t = document.createElement('div');
    Object.assign(t.style, {
        position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
        background: ok ? '#1e293b' : '#dc2626', color:'#fff',
        padding:'10px 20px', borderRadius:'999px', fontSize:'0.85rem',
        zIndex:'9999', whiteSpace:'nowrap'
    });
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2800);
}

function showStep(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function mostrarSaludo() {
    if (!state.nombre) return;
    document.getElementById('saludo-nombre').textContent = `Hola, ${state.nombre} 👋`;
    document.getElementById('saludo-usuario').classList.remove('hidden');
}

function resetIdentidad() {
    state.tercero_id = null; state.nombre = ''; state.telefono = '';
    ['almuerzo_tid','almuerzo_nom','almuerzo_tel'].forEach(k => localStorage.removeItem(k));
    document.getElementById('saludo-usuario').classList.add('hidden');
}

// ───── INIT ─────
async function init() {
    {% if usuario_pre %}
    state.tercero_id = {{ usuario_pre.tercero_id | tojson }};
    state.nombre     = {{ usuario_pre.nombre | tojson }};
    state.telefono   = {{ usuario_pre.telefono | tojson }};
    if (state.tercero_id) {
        lsSet('almuerzo_tid', state.tercero_id);
        lsSet('almuerzo_nom', state.nombre);
        lsSet('almuerzo_tel', state.telefono);
    }
    {% else %}
    const tid = lsGet('almuerzo_tid');
    const nom = lsGet('almuerzo_nom');
    if (tid && nom) {
        state.tercero_id = parseInt(tid);
        state.nombre     = nom;
        state.telefono   = lsGet('almuerzo_tel') || '';
    } else {
        const telGlobal = lsGet('telefono_usuario');
        const nomGlobal = lsGet('nombre_usuario');
        if (telGlobal) {
            try {
                const r = await fetch(`${API}/tercero?telefono=${telGlobal}`);
                const data = await r.json();
                if (data.ok && data.existe) {
                    state.tercero_id = data.tercero.id;
                    state.nombre     = data.tercero.nombre || nomGlobal || '';
                    state.telefono   = data.tercero.telefono || telGlobal;
                    lsSet('almuerzo_tid', state.tercero_id);
                    lsSet('almuerzo_nom', state.nombre);
                    lsSet('almuerzo_tel', state.telefono);
                } else if (nomGlobal) {
                    state.nombre   = nomGlobal;
                    state.telefono = telGlobal;
                }
            } catch(e) {}
        } else if (nomGlobal) {
            state.nombre = nomGlobal;
        }
    }
    {% endif %}
    mostrarSaludo();
    await cargarRestaurantes();
}

// ───── RESTAURANTE ─────
async function cargarRestaurantes() {
    try {
        const r = await fetch(`${API}/restaurantes`);
        const data = await r.json();
        if (!data.ok) return;
        const sel = document.getElementById('sel-restaurante');
        sel.innerHTML = '<option value="">— Selecciona un restaurante —</option>';
        data.restaurantes.forEach(rest => {
            const opt = document.createElement('option');
            opt.value = rest.id;
            opt.textContent = rest.nombre;
            sel.appendChild(opt);
        });
        sel.onchange = () => {
            state.restaurante_id    = sel.value ? parseInt(sel.value) : null;
            state.restaurante_nuevo = null;
            document.getElementById('form-nuevo-rest').classList.add('hidden');
            document.getElementById('btn-toggle-nuevo').textContent = '+ Crear restaurante nuevo';
        };
    } catch(e) {}
}

function mostrarNuevoRestaurante() {
    const form = document.getElementById('form-nuevo-rest');
    const btn  = document.getElementById('btn-toggle-nuevo');
    if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.textContent = '× Cancelar nuevo restaurante';
        document.getElementById('sel-restaurante').value = '';
        state.restaurante_id = null;
    } else {
        form.classList.add('hidden');
        btn.textContent = '+ Crear restaurante nuevo';
        state.restaurante_nuevo = null;
    }
}

// ───── CONTINUAR ─────
async function continuar() {
    const esNuevo = !document.getElementById('form-nuevo-rest').classList.contains('hidden');
    if (esNuevo) {
        const n = document.getElementById('inp-rest-nombre').value.trim();
        if (!n) { toast('Escribe el nombre del restaurante', false); return; }
        state.restaurante_nuevo = {
            nombre:         n,
            nombre_dueno:   document.getElementById('inp-due-nombre').value.trim(),
            telefono_dueno: document.getElementById('inp-due-tel').value.replace(/\D/g,''),
        };
        state.restaurante_id = null;
    } else {
        if (!state.restaurante_id) { toast('Selecciona un restaurante', false); return; }
        state.restaurante_nuevo = null;
    }

    const btn = document.getElementById('btn-continuar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Cargando...';

    try {
        const url = state.restaurante_id
            ? `${API}/catalogo?restaurante_id=${state.restaurante_id}`
            : `${API}/catalogo`;
        const r    = await fetch(url);
        const data = await r.json();
        state.catalogo = data.ok
            ? { propio: data.propio || [], global: data.global || [] }
            : { propio: [], global: [] };
    } catch(e) {
        state.catalogo = { propio: [], global: [] };
    }

    btn.disabled = false;
    btn.innerHTML = 'Continuar →';
    state.bloques = { sopa: [], principio: [], proteina: [] };
    renderBloques();
    showStep('step-items');
}

// ───── RENDER BLOQUES ─────
function renderBloques() {
    const contenedor = document.getElementById('bloques-container');
    contenedor.innerHTML = '';
    [
        { cat:'sopa',      label:'Caldos / Sopas', cls:'lbl-sopa'      },
        { cat:'principio', label:'Principios',      cls:'lbl-principio' },
        { cat:'proteina',  label:'Proteínas',       cls:'lbl-proteina'  },
    ].forEach(({ cat, label, cls }) => {
        const wrap = document.createElement('div');
        wrap.className = 'mb-4';

        // Header
        const header = document.createElement('div');
        header.className = 'bloque-header';
        header.innerHTML = `<span class="bloque-label ${cls}">${label}</span>`;
        wrap.appendChild(header);

        // Chips propio (catálogo del restaurante)
        const propio = state.catalogo.propio.filter(i => i.tipo === cat);
        if (propio.length) {
            const div = document.createElement('div');
            div.id = `chips-propio-${cat}`;
            div.className = 'flex flex-wrap gap-2 mb-2';
            propio.forEach(item => {
                const yaEsta = state.bloques[cat].some(b => b.opcion_id === item.id);
                const chip = document.createElement('button');
                chip.className = `text-sm px-3 py-2 rounded-full border-2 border-indigo-300 bg-indigo-50 text-indigo-700 font-semibold${yaEsta ? ' hidden' : ''}`;
                chip.dataset.opcionId = item.id;
                chip.textContent = item.nombre;
                chip.onclick = () => chipTap(item.nombre, cat, item.id, true, chip);
                div.appendChild(chip);
            });
            wrap.appendChild(div);
        }

        // Chips globales (sugerencias de otros restaurantes)
        const global = state.catalogo.global.filter(i => i.tipo === cat).slice(0, 12);
        if (global.length) {
            const div = document.createElement('div');
            div.id = `chips-global-${cat}`;
            div.className = 'flex flex-wrap gap-1 mb-2';
            if (propio.length) {
                const lbl = document.createElement('p');
                lbl.className = 'w-full text-xs text-gray-400 mt-1 mb-1';
                lbl.textContent = 'Sugerencias:';
                div.appendChild(lbl);
            }
            global.forEach(item => {
                const yaEsta = state.bloques[cat].some(b => b.nombre.toLowerCase() === item.nombre.toLowerCase());
                const chip = document.createElement('button');
                chip.className = `text-xs px-2 py-1 rounded-full border border-gray-300 bg-white text-gray-500${yaEsta ? ' hidden' : ''}`;
                chip.dataset.nombre = item.nombre;
                chip.textContent = item.nombre;
                chip.onclick = () => chipTap(item.nombre, cat, null, false, chip);
                div.appendChild(chip);
            });
            wrap.appendChild(div);
        }

        // Input para agregar ítem nuevo
        const inputDiv = document.createElement('div');
        inputDiv.className = 'flex gap-2 mb-2 mt-1';
        inputDiv.innerHTML = `
            <input type="text" id="inp-nuevo-${cat}" placeholder="Agregar ítem..."
                   class="flex-1 border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                   onkeydown="if(event.key==='Enter'){agregarItemManual('${cat}');event.preventDefault();}">
            <button onclick="agregarItemManual('${cat}')"
                    class="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-xl text-sm font-semibold hover:bg-indigo-200">+</button>
        `;
        wrap.appendChild(inputDiv);

        // Lista de ítems del menú de hoy
        const lista = document.createElement('div');
        lista.id = `lista-${cat}`;
        wrap.appendChild(lista);
        (state.bloques[cat] || []).forEach(item => renderItem(lista, item));

        contenedor.appendChild(wrap);
    });
}

function renderItem(lista, item) {
    if (!item.temp_id) item.temp_id = item.opcion_id ? `bd_${item.opcion_id}` : `new_${tempCounter++}`;
    item.mi_pedido = item.mi_pedido !== undefined ? item.mi_pedido : false;

    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = `row-${item.temp_id}`;
    row.innerHTML = `
        <span class="nombre">${item.nombre}</span>
        <button class="btn-star ${item.mi_pedido ? 'starred' : ''}"
                onclick="togglePedido('${item.temp_id}')">★</button>
        <button class="btn-del" onclick="eliminarItem('${item.temp_id}', '${item.tipo}')">✕</button>
    `;
    lista.appendChild(row);
}

function chipTap(nombre, cat, opcion_id, en_bd, chipEl) {
    if (state.bloques[cat].some(b => b.nombre.toLowerCase() === nombre.toLowerCase())) return;
    const item = {
        nombre, tipo: cat, en_bd: !!en_bd, opcion_id: opcion_id || null,
        temp_id: opcion_id ? `bd_${opcion_id}` : `new_${tempCounter++}`,
        en_menu: true, mi_pedido: false, _chipEl: chipEl
    };
    state.bloques[cat].push(item);
    renderItem(document.getElementById(`lista-${cat}`), item);
    chipEl.classList.add('hidden');
}

function agregarItemManual(cat) {
    const inp    = document.getElementById(`inp-nuevo-${cat}`);
    const nombre = inp.value.trim();
    if (!nombre) return;
    if (state.bloques[cat].some(b => b.nombre.toLowerCase() === nombre.toLowerCase())) {
        toast('Ya está en el menú', false); return;
    }
    const item = {
        nombre, tipo: cat, en_bd: false, opcion_id: null,
        temp_id: `new_${tempCounter++}`, en_menu: true, mi_pedido: false, _chipEl: null
    };
    state.bloques[cat].push(item);
    inp.value = '';
    renderItem(document.getElementById(`lista-${cat}`), item);
}

function eliminarItem(tid, cat) {
    const idx = state.bloques[cat].findIndex(i => String(i.temp_id) === String(tid));
    if (idx === -1) return;
    const item = state.bloques[cat][idx];
    state.bloques[cat].splice(idx, 1);
    document.getElementById(`row-${tid}`)?.remove();
    if (item._chipEl) item._chipEl.classList.remove('hidden');
}

function togglePedido(tid) {
    const item = encontrarItem(tid);
    if (!item) return;
    if (!item.mi_pedido) {
        (state.bloques[item.tipo] || []).forEach(i => {
            i.mi_pedido = false;
            const btn = document.querySelector(`#row-${i.temp_id} .btn-star`);
            if (btn) btn.classList.remove('starred');
        });
        item.mi_pedido = true;
        document.querySelector(`#row-${tid} .btn-star`)?.classList.add('starred');
    } else {
        item.mi_pedido = false;
        document.querySelector(`#row-${tid} .btn-star`)?.classList.remove('starred');
    }
}

function encontrarItem(tid) {
    for (const cat of ['sopa','principio','proteina']) {
        const f = (state.bloques[cat] || []).find(i => String(i.temp_id) === String(tid));
        if (f) return f;
    }
    return null;
}

// ───── TIPO ENTREGA ─────
function setEntrega(tipo) {
    state.tipo_entrega = tipo;
    const sel   = 'flex-1 py-3 rounded-xl font-semibold text-sm border-2 border-indigo-500 bg-indigo-50 text-indigo-700';
    const unsel = 'flex-1 py-3 rounded-xl font-semibold text-sm border-2 border-gray-200 text-gray-500 hover:bg-gray-50';
    document.getElementById('btn-recoger').className   = tipo === 'recoger'   ? sel : unsel;
    document.getElementById('btn-domicilio').className = tipo === 'domicilio' ? sel : unsel;
}

// ───── CONFIRMAR ─────
function iniciarConfirmar() {
    const todos = [...state.bloques.sopa, ...state.bloques.principio, ...state.bloques.proteina];
    if (!todos.length) { toast('Agrega al menos un ítem al menú', false); return; }
    const tieneProteina  = state.bloques.proteina.some(i => i.mi_pedido);
    const tienePrincipio = state.bloques.principio.some(i => i.mi_pedido);
    if (!tieneProteina && !tienePrincipio) {
        toast('Marca ★ en al menos una proteína y un principio', false); return;
    }
    if (!tieneProteina) { toast('Falta marcar ★ en una proteína', false); return; }
    if (!tienePrincipio) { toast('Falta marcar ★ en un principio', false); return; }

    if (state.tercero_id) {
        enviarPedido();
    } else if (state.nombre) {
        crearTerceroSilencioso().then(() => {
            if (state.tercero_id) enviarPedido();
            else toast('No se pudo registrar el usuario', false);
        });
    } else {
        if (state.telefono) document.getElementById('modal-tel').value = state.telefono;
        document.getElementById('modal-id').classList.add('open');
        setTimeout(() => document.getElementById('modal-nombre').focus(), 100);
    }
}

async function crearTerceroSilencioso() {
    try {
        const r = await fetch(`${API}/tercero`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nombre: state.nombre, telefono: state.telefono || '' })
        });
        const data = await r.json();
        if (data.ok) {
            state.tercero_id = data.tercero_id;
            lsSet('almuerzo_tid', state.tercero_id);
            lsSet('almuerzo_nom', state.nombre);
            if (state.telefono) lsSet('almuerzo_tel', state.telefono);
        }
    } catch(e) {}
}

function cerrarModal() {
    document.getElementById('modal-id').classList.remove('open');
}

async function confirmarConIdentidad() {
    const nombre = document.getElementById('modal-nombre').value.trim();
    const tel    = document.getElementById('modal-tel').value.replace(/\D/g,'') || '';
    if (!nombre) { toast('Escribe tu nombre', false); return; }

    const btn = document.querySelector('#modal-id-inner button[onclick="confirmarConIdentidad()"]');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creando...';

    try {
        const r = await fetch(`${API}/tercero`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nombre, telefono: tel })
        });
        const data = await r.json();
        btn.disabled = false; btn.innerHTML = '¡Listo, enviar pedido!';
        if (!data.ok) { toast(data.error, false); return; }

        state.tercero_id = data.tercero_id;
        state.nombre     = data.nombre;
        state.telefono   = data.telefono || '';
        lsSet('almuerzo_tid', state.tercero_id);
        lsSet('almuerzo_nom', state.nombre);
        lsSet('almuerzo_tel', state.telefono);

        cerrarModal();
        mostrarSaludo();
        await enviarPedido();
    } catch(e) {
        btn.disabled = false; btn.innerHTML = '¡Listo, enviar pedido!';
        toast('Error de conexión', false);
    }
}

async function enviarPedido() {
    const todos = [...state.bloques.sopa, ...state.bloques.principio, ...state.bloques.proteina];
    const payload = {
        tercero_id:        state.tercero_id,
        restaurante_id:    state.restaurante_nuevo ? null : state.restaurante_id,
        restaurante_nuevo: state.restaurante_nuevo || null,
        items:             todos,
        notas:             document.getElementById('inp-notas').value.trim() || null,
        tipo_entrega:      state.tipo_entrega,
        precios:           state.precios,
    };

    const btn = document.querySelector('#step-items button[onclick="iniciarConfirmar()"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...'; }

    try {
        const r = await fetch(`${API}/confirmar`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await r.json();
        if (btn) { btn.disabled = false; btn.innerHTML = '¡Hacer mi pedido! 🚀'; }
        if (!data.ok) { toast(data.error, false); return; }

        const url = window.location.origin + data.cocina_url;
        document.getElementById('link-cocina').href = url;
        document.getElementById('link-wa-cocina').href =
            `https://wa.me/?text=${encodeURIComponent(`¡Hola! Te hice el pedido de hoy por acá: ${encodeURI(url)}`)}`;
        document.getElementById('lbl-done-nombre').textContent =
            `Pedido de ${state.nombre} — el restaurante ya lo ve en cocina.`;
        showStep('step-done');
    } catch(e) {
        if (btn) { btn.disabled = false; btn.innerHTML = '¡Hacer mi pedido! 🚀'; }
        toast('Error de conexión', false);
    }
}

async function soloCompartirEnlace() {
    const todos = [...state.bloques.sopa, ...state.bloques.principio, ...state.bloques.proteina];
    if (!todos.length) { toast('Agrega al menos un ítem al menú', false); return; }

    const payload = {
        tercero_id:        state.tercero_id || null,
        restaurante_id:    state.restaurante_nuevo ? null : state.restaurante_id,
        restaurante_nuevo: state.restaurante_nuevo || null,
        items:             todos,
        solo_enlace:       true,
    };

    const btn = document.querySelector('#step-items button[onclick="soloCompartirEnlace()"]');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparando...';

    try {
        const r = await fetch(`${API}/confirmar`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await r.json();
        btn.disabled = false; btn.innerHTML = 'Enviarle el enlace al restaurante (sin pedido)';
        if (!data.ok) { toast(data.error, false); return; }

        const url = window.location.origin + data.cocina_url;
        document.getElementById('link-cocina').href = url;
        document.getElementById('link-wa-cocina').href =
            `https://wa.me/?text=${encodeURIComponent(`Hola, mira cómo quedarían tus pedidos acá: ${encodeURI(url)}`)}`;
        document.getElementById('lbl-done-nombre').textContent =
            'Menú del día cargado — comparte el enlace con el restaurante.';
        showStep('step-done');
    } catch(e) {
        btn.disabled = false; btn.innerHTML = 'Enviarle el enlace al restaurante (sin pedido)';
        toast('Error de conexión', false);
    }
}

function nuevoAlmuerzo() {
    state.bloques          = { sopa: [], principio: [], proteina: [] };
    state.catalogo         = { propio: [], global: [] };
    state.restaurante_nuevo = null;
    state.precios          = { sopa: 0, bandeja: 0, completo: 0 };
    document.getElementById('inp-notas').value = '';
    ['inp-precio-sopa','inp-precio-bandeja','inp-precio-completo'].forEach(id => {
        document.getElementById(id).value = '';
    });
    showStep('step-menu');
}

init();
</script>
</body>
