<!DOCTYPE html>
<html>
<head>
    <title>Setup Tabla Solicitudes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-4">Crear Tabla Solicitudes</h1>
        <button id="ejecutar" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
            Ejecutar Creación de Tabla
        </button>
        <div id="resultado" class="mt-4 p-4 rounded hidden"></div>
    </div>

    <script>
        document.getElementById('ejecutar').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Ejecutando...';

            try {
                const response = await fetch('/api/setup-solicitudes-table-temp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({confirmar: 'CREAR_TABLA_SOLICITUDES'})
                });

                const data = await response.json();
                const resultado = document.getElementById('resultado');
                resultado.classList.remove('hidden');

                if (data.ok) {
                    resultado.className = 'mt-4 p-4 rounded bg-green-100 text-green-800';
                    resultado.innerHTML = `
                        <p class="font-bold">✓ ${data.mensaje}</p>
                        <p class="mt-2 text-sm">${data.nota}</p>
                    `;
                } else {
                    resultado.className = 'mt-4 p-4 rounded bg-red-100 text-red-800';
                    resultado.textContent = '✗ Error: ' + data.error;
                }
            } catch (error) {
                const resultado = document.getElementById('resultado');
                resultado.classList.remove('hidden');
                resultado.className = 'mt-4 p-4 rounded bg-red-100 text-red-800';
                resultado.textContent = '✗ Error: ' + error.message;
            }

            btn.disabled = false;
            btn.textContent = 'Ejecutar Creación de Tabla';
        });
    </script>
</body>
</html>
