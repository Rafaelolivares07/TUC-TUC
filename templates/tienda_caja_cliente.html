<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu compra - {{ tienda.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-gray-900">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col bg-white">
        <header class="border-b border-gray-100 px-5 py-5">
            <div class="flex items-center gap-3">
                {% if tienda.imagen_header %}
                <img src="{{ tienda.imagen_header }}" class="h-12 w-12 rounded-xl object-cover" alt="">
                {% endif %}
                <div class="min-w-0">
                    <p class="truncate text-sm font-semibold text-gray-500">{{ tienda.nombre }}</p>
                    <h1 class="text-xl font-black">Tu compra en caja</h1>
                </div>
            </div>
            <div id="estado" class="mt-4 rounded-xl bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700">
                Conectando con la caja...
            </div>
        </header>

        <section class="flex-1 px-5 py-4">
            <div id="items" class="space-y-3"></div>
            <div id="vacio" class="flex h-64 flex-col items-center justify-center text-center">
                <div class="mb-3 flex h-16 w-16 items-center justify-center rounded-2xl bg-gray-100 text-3xl">🛒</div>
                <p class="text-lg font-bold">Esperando productos</p>
                <p class="mt-1 text-sm text-gray-500">Los items apareceran aqui cuando el cajero los agregue.</p>
            </div>
        </section>

        <footer class="sticky bottom-0 border-t border-gray-100 bg-white px-5 py-4 shadow-[0_-10px_30px_rgba(15,23,42,0.06)]">
            <div id="iva" class="mb-1 hidden text-right text-xs font-semibold text-gray-500"></div>
            <div class="flex items-end justify-between">
                <span class="text-sm font-bold uppercase tracking-wide text-gray-500">Total</span>
                <span id="total" class="text-4xl font-black text-blue-700">$0</span>
            </div>
        </footer>
    </main>

    <script>
    const SLUG = '{{ slug }}';
    const TOKEN = '{{ token }}';
    const itemsEl = document.getElementById('items');
    const vacioEl = document.getElementById('vacio');
    const estadoEl = document.getElementById('estado');
    const totalEl = document.getElementById('total');
    const ivaEl = document.getElementById('iva');

    function money(value) {
        return `$${Number(value || 0).toLocaleString('es-CO')}`;
    }

    function render(data) {
        const items = data.items || [];
        totalEl.textContent = money(data.total);

        if (data.iva > 0) {
            ivaEl.textContent = `IVA incluido: ${money(Math.round(data.iva))}`;
            ivaEl.classList.remove('hidden');
        } else {
            ivaEl.classList.add('hidden');
        }

        if (data.estado === 'cobrada') {
            estadoEl.textContent = 'Venta registrada. Gracias por tu compra.';
            estadoEl.className = 'mt-4 rounded-xl bg-green-50 px-4 py-3 text-sm font-semibold text-green-700';
        } else {
            estadoEl.textContent = 'Conectado. Revisa tus items antes de pagar.';
            estadoEl.className = 'mt-4 rounded-xl bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700';
        }

        vacioEl.classList.toggle('hidden', items.length > 0);
        itemsEl.innerHTML = items.map(item => `
            <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="font-bold leading-tight">${item.nombre}</p>
                        <p class="mt-1 text-sm text-gray-500">${item.cantidad} x ${money(item.precio)}</p>
                    </div>
                    <p class="shrink-0 text-lg font-black">${money(item.precio * item.cantidad)}</p>
                </div>
            </div>
        `).join('');
    }

    async function poll() {
        try {
            const r = await fetch(`/api/tienda/${SLUG}/caja/sesion/${TOKEN}`, {cache: 'no-store'});
            const data = await r.json();
            if (!data.ok) throw new Error(data.error || 'Sesion no encontrada');
            render(data);
        } catch (e) {
            estadoEl.textContent = 'Esta sesion ya no esta disponible.';
            estadoEl.className = 'mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700';
        }
    }

    poll();
    setInterval(poll, 1500);
    </script>
</body>
</html>
