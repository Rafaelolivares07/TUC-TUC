<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mis Propiedades — TUC TUC</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#f3f4f6; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           padding:10px 20px; border-radius:8px; color:#fff; font-size:14px;
           z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; min-width:200px; text-align:center;}
  .toast.show { opacity:1; }
  .toast-ok  { background:#059669; }
  .toast-err { background:#dc2626; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- PANTALLA: LOGIN -->
<div id="pantalla-login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🏠</div>
      <h1 class="text-xl font-bold text-gray-800">Mis Propiedades</h1>
      <p class="text-sm text-gray-500 mt-1">Publica y gestiona tus propiedades en TUC TUC</p>
    </div>
    <div class="space-y-3">
      <input id="inp-tel" type="tel" placeholder="Tu teléfono (3001234567)"
             class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <div id="inp-nombre-wrap" class="hidden">
        <input id="inp-nombre" type="text" placeholder="Tu nombre"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button onclick="login()" class="w-full bg-blue-700 text-white rounded-xl py-3 font-semibold text-sm">
        Entrar
      </button>
    </div>
    <p class="text-xs text-gray-400 text-center mt-4">Tu número identifica tu cuenta. Sin contraseña.</p>
  </div>
</div>

<!-- PANTALLA: DASHBOARD -->
<div id="pantalla-dashboard" class="hidden">
  <!-- Header -->
  <div class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-gray-800 text-base">Mis Propiedades</h1>
        <p id="txt-usuario" class="text-xs text-gray-500"></p>
      </div>
      <button onclick="nuevaPropiedad()" class="bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl">
        + Nueva
      </button>
    </div>
  </div>

  <!-- Lista -->
  <div class="max-w-3xl mx-auto px-4 py-4">
    <div id="lista-props" class="space-y-3">
      <div class="text-center py-16 text-gray-400">
        <div class="text-5xl mb-3">🏚️</div>
        <p>Aún no tienes propiedades publicadas</p>
        <button onclick="nuevaPropiedad()" class="mt-4 bg-blue-700 text-white px-6 py-2 rounded-xl text-sm font-semibold">
          Publicar mi primera propiedad
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: NUEVA/EDITAR PROPIEDAD -->
<div id="modal-prop" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden overflow-y-auto">
  <div class="bg-white rounded-t-2xl w-full max-w-lg p-6 mt-10" style="max-height:90vh; overflow-y:auto;">
    <div class="flex items-center justify-between mb-4">
      <h2 id="modal-titulo" class="font-bold text-gray-800 text-lg">Nueva propiedad</h2>
      <button onclick="cerrarModal()" class="text-gray-400 text-2xl leading-none">×</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-medium text-gray-500 mb-1 block">Título *</label>
        <input id="f-titulo" type="text" placeholder="Ej: Apartamento amplio en el centro" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Modalidad</label>
          <select id="f-modalidad" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="venta">Venta</option>
            <option value="alquiler">Alquiler</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Precio (COP)</label>
          <input id="f-precio" type="number" placeholder="Ej: 250000000" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Ciudad</label>
          <input id="f-ciudad" type="text" placeholder="Ej: Bogotá" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Dirección</label>
          <input id="f-direccion" type="text" placeholder="Ej: Calle 10 #5-20" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Habitaciones</label>
          <input id="f-hab" type="number" placeholder="0" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Baños</label>
          <input id="f-banos" type="number" placeholder="0" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Área (m²)</label>
          <input id="f-m2" type="number" placeholder="0" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Estrato (1–6)</label>
          <input id="f-estrato" type="number" placeholder="Ej: 3" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Parqueaderos</label>
          <input id="f-parqueadero" type="number" min="0" max="10" placeholder="0 = ninguno" class="w-full border border-gray-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div>
        <label class="text-xs font-medium text-gray-500 mb-1 block">Descripción</label>
        <textarea id="f-desc" rows="3" placeholder="Describe la propiedad: características, estado, puntos de interés cercanos..."
                  class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
      </div>
      <div class="bg-blue-50 rounded-xl p-4 space-y-2">
        <p class="text-xs font-semibold text-blue-800">Visibilidad</p>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="f-bolsa" type="checkbox" class="accent-blue-700">
          <span class="text-sm text-gray-700">Publicar en la bolsa pública de TUC TUC</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="f-inmobiliarias" type="checkbox" class="accent-blue-700">
          <span class="text-sm text-gray-700">Permitir que inmobiliarias la publiquen</span>
        </label>
      </div>
      <div class="flex gap-3 pt-2">
        <button onclick="cerrarModal()" class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium">Cancelar</button>
        <button id="btn-guardar" onclick="guardarPropiedad()" class="flex-1 bg-blue-700 text-white rounded-xl py-3 text-sm font-semibold">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: FOTOS -->
<div id="modal-fotos" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden overflow-y-auto">
  <div class="bg-white rounded-t-2xl w-full max-w-lg p-6 mt-10" style="max-height:90vh; overflow-y:auto;">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-gray-800 text-lg">Fotos de la propiedad</h2>
      <button onclick="cerrarModalFotos()" class="text-gray-400 text-2xl leading-none">×</button>
    </div>

    <!-- Grid de fotos actuales -->
    <div id="grid-fotos" class="grid grid-cols-3 gap-2 mb-4"></div>

    <!-- Subir nueva foto -->
    <label class="block w-full border-2 border-dashed border-gray-300 rounded-xl py-3 text-sm text-gray-400 hover:border-blue-400 hover:text-blue-600 transition font-semibold text-center cursor-pointer">
      + Agregar fotos
      <input id="inp-foto" type="file" accept="image/*" multiple class="hidden" onchange="subirFoto(this)">
    </label>
    <label class="flex items-center gap-2 cursor-pointer mt-2">
      <input id="chk-principal" type="checkbox" class="accent-blue-700">
      <span class="text-sm text-gray-700">Primera foto como principal</span>
    </label>
  </div>
</div>

<script>
let propiedadEditandoId = null;
let propiedadFotosId = null;
let propiedadesCache = {};

function toast(msg, tipo='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo === 'ok' ? 'toast-ok' : 'toast-err');
  setTimeout(() => t.className = 'toast', 3500);
}

async function login() {
  const tel = document.getElementById('inp-tel').value.trim();
  const nombre = document.getElementById('inp-nombre').value.trim();
  if (!tel) { toast('Ingresa tu teléfono', 'err'); return; }
  try {
    const r = await fetch('/api/inmobiliaria/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ telefono: tel, nombre })
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('txt-usuario').textContent = d.nombre;
      document.getElementById('pantalla-login').classList.add('hidden');
      document.getElementById('pantalla-dashboard').classList.remove('hidden');
      cargarPropiedades();
    } else if (d.error === 'nombre_requerido') {
      document.getElementById('inp-nombre-wrap').classList.remove('hidden');
      toast('Ingresa tu nombre para registrarte', 'err');
    } else {
      toast(d.error || 'Error', 'err');
    }
  } catch(e) { toast('Error de conexión', 'err'); }
}

async function cargarPropiedades() {
  try {
    const r = await fetch('/api/mis-propiedades');
    const d = await r.json();
    if (!d.ok) { if (d.error === 'sin_sesion') mostrarLogin(); return; }
    propiedadesCache = {};
    d.propiedades.forEach(p => { propiedadesCache[p.id] = p; });
    const lista = document.getElementById('lista-props');
    if (!d.propiedades.length) {
      lista.innerHTML = `<div class="text-center py-16 text-gray-400">
        <div class="text-5xl mb-3">🏚️</div>
        <p>Aún no tienes propiedades</p>
        <button onclick="nuevaPropiedad()" class="mt-4 bg-blue-700 text-white px-6 py-2 rounded-xl text-sm font-semibold">Publicar la primera</button>
      </div>`;
      return;
    }
    lista.innerHTML = d.propiedades.map(p => `
      <div class="bg-white rounded-2xl shadow-sm p-4 flex gap-4">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0 cursor-pointer" onclick="abrirFotos(${p.id})">
          ${p.foto_principal
            ? `<img src="${p.foto_principal}" class="w-full h-full object-cover">`
            : '<div class="w-full h-full flex items-center justify-center text-2xl text-gray-300">🏠</div>'}
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-800 text-sm truncate">${p.titulo}</p>
          <p class="text-xs text-gray-500">${p.ciudad || ''} · ${p.modalidad}</p>
          <p class="text-blue-700 font-bold text-sm">${p.precio ? '$' + Number(p.precio).toLocaleString('es-CO') : 'Consultar'}</p>
          <div class="flex flex-wrap gap-1.5 mt-2">
            ${p.publicar_en_bolsa ? '<span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-lg font-medium">Bolsa</span>' : ''}
            ${p.disponible_inmobiliarias ? '<span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-lg font-medium">Inmobiliarias</span>' : ''}
            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-lg">${p.num_leads} contactos</span>
            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-lg">${p.num_fotos} fotos</span>
          </div>
        </div>
        <div class="flex flex-col gap-1.5 flex-shrink-0">
          <button onclick="editarProp(${p.id})" class="text-xs border border-gray-300 rounded-lg px-3 py-1.5 text-gray-600">Editar</button>
          <button onclick="abrirFotos(${p.id})" class="text-xs border border-blue-300 rounded-lg px-3 py-1.5 text-blue-700">Fotos</button>
          <a href="/propiedades/p/${p.slug}" target="_blank" class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 text-gray-500 text-center">Ver</a>
          <button onclick="eliminarProp(${p.id}, '${p.titulo.replace(/'/g, "\\'")}')" class="text-xs border border-orange-200 rounded-lg px-3 py-1.5 text-orange-500">Pausar</button>
          <button onclick="eliminarPropPermanente(${p.id}, '${p.titulo.replace(/'/g, "\\'")}')" class="text-xs border border-red-400 rounded-lg px-3 py-1.5 text-red-600 font-semibold">Eliminar</button>
        </div>
      </div>
    `).join('');
  } catch(e) { toast('Error de conexión', 'err'); }
}

function mostrarLogin() {
  document.getElementById('pantalla-login').classList.remove('hidden');
  document.getElementById('pantalla-dashboard').classList.add('hidden');
}

function nuevaPropiedad() {
  propiedadEditandoId = null;
  document.getElementById('modal-titulo').textContent = 'Nueva propiedad';
  ['f-titulo','f-precio','f-ciudad','f-direccion','f-hab','f-banos','f-m2','f-estrato','f-desc'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f-modalidad').value = 'venta';
  document.getElementById('f-parqueadero').value = '';
  document.getElementById('f-bolsa').checked = false;
  document.getElementById('f-inmobiliarias').checked = false;
  document.getElementById('modal-prop').classList.remove('hidden');
}

function cerrarModal() {
  document.getElementById('modal-prop').classList.add('hidden');
}

function editarProp(id) {
  const p = propiedadesCache[id];
  if (!p) { toast('No se encontraron los datos', 'err'); return; }
  propiedadEditandoId = id;
  document.getElementById('modal-titulo').textContent = 'Editar propiedad';
  document.getElementById('f-titulo').value = p.titulo || '';
  document.getElementById('f-modalidad').value = p.modalidad || 'venta';
  document.getElementById('f-precio').value = p.precio || '';
  document.getElementById('f-ciudad').value = p.ciudad || '';
  document.getElementById('f-direccion').value = p.direccion || '';
  document.getElementById('f-hab').value = p.habitaciones || '';
  document.getElementById('f-banos').value = p.banos || '';
  document.getElementById('f-m2').value = p.m2 || '';
  document.getElementById('f-estrato').value = p.estrato || '';
  document.getElementById('f-parqueadero').value = p.parqueadero || 0;
  document.getElementById('f-desc').value = p.descripcion || '';
  document.getElementById('f-bolsa').checked = !!p.publicar_en_bolsa;
  document.getElementById('f-inmobiliarias').checked = !!p.disponible_inmobiliarias;
  document.getElementById('modal-prop').classList.remove('hidden');
}

async function guardarPropiedad() {
  const datos = {
    titulo: document.getElementById('f-titulo').value.trim(),
    modalidad: document.getElementById('f-modalidad').value,
    precio: document.getElementById('f-precio').value || null,
    ciudad: document.getElementById('f-ciudad').value.trim(),
    direccion: document.getElementById('f-direccion').value.trim(),
    habitaciones: document.getElementById('f-hab').value || null,
    banos: document.getElementById('f-banos').value || null,
    m2: document.getElementById('f-m2').value || null,
    estrato: document.getElementById('f-estrato').value || null,
    parqueadero: parseInt(document.getElementById('f-parqueadero').value) || 0,
    descripcion: document.getElementById('f-desc').value.trim(),
    publicar_en_bolsa: document.getElementById('f-bolsa').checked,
    disponible_inmobiliarias: document.getElementById('f-inmobiliarias').checked,
  };
  if (!datos.titulo) { toast('El título es requerido', 'err'); return; }
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try {
    const url = propiedadEditandoId
      ? `/api/mis-propiedades/${propiedadEditandoId}/editar`
      : '/api/mis-propiedades/crear';
    const r = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(datos) });
    const d = await r.json();
    if (d.ok) { toast('Propiedad guardada'); cerrarModal(); cargarPropiedades(); }
    else toast(d.error || 'Error', 'err');
  } catch(e) { toast('Error de conexión', 'err'); }
  finally { btn.disabled = false; btn.textContent = 'Guardar'; }
}

async function eliminarProp(id, titulo) {
  if (!confirm(`¿Pausar "${titulo}"?\n\nLa propiedad dejará de mostrarse en la bolsa pero no se elimina.`)) return;
  try {
    const r = await fetch(`/api/mis-propiedades/${id}`, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) { toast('Propiedad pausada'); cargarPropiedades(); }
    else toast(d.error || 'Error', 'err');
  } catch(e) { toast('Error de conexión', 'err'); }
}

async function eliminarPropPermanente(id, titulo) {
  if (!confirm(`¿Eliminar "${titulo}"?\n\nEsta acción es PERMANENTE y borrará la propiedad y todas sus fotos. No se puede deshacer.`)) return;
  if (!confirm(`Confirma de nuevo: ¿eliminar permanentemente "${titulo}"?`)) return;
  try {
    const r = await fetch(`/api/mis-propiedades/${id}/eliminar`, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) { toast('Propiedad eliminada'); cargarPropiedades(); }
    else toast(d.error || 'Error', 'err');
  } catch(e) { toast('Error de conexión', 'err'); }
}

/* ── FOTOS ── */
async function abrirFotos(id) {
  propiedadFotosId = id;
  document.getElementById('grid-fotos').innerHTML = '<p class="col-span-3 text-sm text-gray-400 text-center py-4">Cargando…</p>';
  document.getElementById('inp-foto').value = '';
  document.getElementById('chk-principal').checked = false;
  document.getElementById('modal-fotos').classList.remove('hidden');
  await cargarFotos(id);
}

function cerrarModalFotos() {
  document.getElementById('modal-fotos').classList.add('hidden');
  propiedadFotosId = null;
}

async function cargarFotos(pid) {
  try {
    const r = await fetch(`/api/mis-propiedades/${pid}/fotos`);
    const d = await r.json();
    const grid = document.getElementById('grid-fotos');
    if (!d.ok) { grid.innerHTML = `<p class="col-span-3 text-sm text-red-500 text-center">${d.error}</p>`; return; }
    if (!d.fotos.length) {
      grid.innerHTML = '<p class="col-span-3 text-sm text-gray-400 text-center py-4">Sin fotos aún</p>';
      return;
    }
    grid.innerHTML = d.fotos.map(f => `
      <div class="relative group rounded-xl overflow-hidden bg-gray-100" style="aspect-ratio:1">
        <img src="${f.url}" class="w-full h-full object-cover">
        ${f.es_principal ? '<span class="absolute top-1 left-1 bg-blue-700 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Principal</span>' : ''}
        <button onclick="eliminarFoto(${f.id})"
          class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold leading-none opacity-0 group-hover:opacity-100 transition-opacity">×</button>
      </div>
    `).join('');
  } catch(e) { toast('Error cargando fotos', 'err'); }
}

async function subirFoto(input) {
  const files = Array.from(input.files);
  if (!files.length || !propiedadFotosId) return;
  const esPrincipal = document.getElementById('chk-principal').checked;
  let subidas = 0, errores = 0;
  for (let i = 0; i < files.length; i++) {
    await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const r = await fetch(`/api/mis-propiedades/${propiedadFotosId}/fotos`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ imagen: e.target.result, es_principal: esPrincipal && i === 0 })
          });
          const d = await r.json();
          if (d.ok) subidas++;
          else errores++;
        } catch(e) { errores++; }
        resolve();
      };
      reader.readAsDataURL(files[i]);
    });
  }
  input.value = '';
  document.getElementById('chk-principal').checked = false;
  await cargarFotos(propiedadFotosId);
  cargarPropiedades();
  if (errores === 0) toast(subidas === 1 ? 'Foto subida' : `${subidas} fotos subidas`);
  else toast(`${subidas} subidas, ${errores} fallaron`, 'err');
}

async function eliminarFoto(fid) {
  if (!confirm('¿Eliminar esta foto?')) return;
  try {
    const r = await fetch(`/api/mis-propiedades/${propiedadFotosId}/fotos/${fid}`, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) { toast('Foto eliminada'); await cargarFotos(propiedadFotosId); cargarPropiedades(); }
    else toast(d.error || 'Error', 'err');
  } catch(e) { toast('Error de conexión', 'err'); }
}

// Verificar sesión al cargar
(async () => {
  try {
    const r = await fetch('/api/mis-propiedades');
    const d = await r.json();
    if (d.ok) {
      document.getElementById('pantalla-login').classList.add('hidden');
      document.getElementById('pantalla-dashboard').classList.remove('hidden');
      cargarPropiedades();
    }
  } catch(e) {}
})();
</script>
</body>
</html>
