        async function cargarLugaresFrecuentes() {
            const panel = document.getElementById('panel-lugares-frecuentes');
            const chips = document.getElementById('chips-lugares');
            try {
                const r = await fetch('/api/mis-lugares');
                if (!r.ok) { panel.style.display = 'none'; return; }
                const data = await r.json();
                if (!data.ok || !data.lugares || data.lugares.length === 0) {
                    panel.style.display = 'none';
                    return;
                }
                chips.innerHTML = '';
                data.lugares.forEach(lugar => {
                    const btn = document.createElement('button');
                    btn.className = 'chip-lugar';
                    const icono = ICONOS_SVG[lugar.icono] || ICONOS_SVG['default'];
                    btn.innerHTML = `<span class="chip-icono">${icono}</span><span class="chip-nombre">${lugar.nombre}</span>`;
                    btn.onclick = () => seleccionarDestino(parseFloat(lugar.lat), parseFloat(lugar.lon), lugar.nombre);
                    chips.appendChild(btn);
                });
                panel.style.display = 'block';
            } catch(e) {
                panel.style.display = 'none';
            }
        }

        let infoViajeColapsado = false;
        function toggleInfoViaje() {
            const el = document.getElementById('info-viaje');
            const btn = document.getElementById('btn-toggle-info-viaje');
            infoViajeColapsado = !infoViajeColapsado;
            if (infoViajeColapsado) {
                el.classList.add('colapsado');
                btn.innerHTML = '&#x2304;'; // chevron abajo = expandir
            } else {
                el.classList.remove('colapsado');
                btn.innerHTML = '&#x2303;'; // chevron arriba = colapsar
            }
        }

        function cerrarPanelBusqueda() {
            document.getElementById('panel-busqueda').style.display = 'none';
            if (!viajeActivo) {
                document.getElementById('barra-vamos-a').style.display = 'block';
            }
            desactivarSeleccionMapa();
        }

        // Event listener para el input de búsqueda
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('input-destino-conductor');
            if (input) {
                input.addEventListener('input', function() {
                    buscarDestinoAutocomplete(this.value);
                });
            }
        });

        function buscarDestinoAutocomplete(texto) {
            clearTimeout(timeoutBusqueda);

            if (texto.length < 2) {
                document.getElementById('autocomplete-conductor').style.display = 'none';
                return;
            }

            timeoutBusqueda = setTimeout(async () => {
                const latParam = ubicacionActual ? ubicacionActual.lat : '';
                const lonParam = ubicacionActual ? ubicacionActual.lon : '';

                try {
                    const res = await fetch('/api/buscar_interseccion?q=' + encodeURIComponent(texto) + '&lat=' + latParam + '&lon=' + lonParam);
                    const data = await res.json();

                    if (data.ok && data.resultados && data.resultados.length > 0) {
                        mostrarSugerencias(data.resultados);
                    } else {
                        document.getElementById('autocomplete-conductor').style.display = 'none';
                    }
                } catch (e) {
                    console.error('Error buscando destino:', e);
                }
            }, 500);
        }

        function mostrarSugerencias(resultados) {
            const contenedor = document.getElementById('autocomplete-conductor');
            contenedor.innerHTML = '';

            resultados.forEach(r => {
                const item = document.createElement('div');
                item.className = 'sugerencia-item';

                const nombre = document.createElement('span');
                nombre.className = 'sugerencia-nombre';
                nombre.textContent = r.display_name || 'Sin nombre';

                const dist = document.createElement('span');
                dist.className = 'sugerencia-distancia';
                dist.textContent = r.distancia_texto || '';

                item.appendChild(nombre);
                item.appendChild(dist);

                item.addEventListener('click', function() {
                    seleccionarDestino(r.lat, r.lon, r.display_name || 'Destino');
                });

                contenedor.appendChild(item);
            });

            contenedor.style.display = 'block';
        }

        async function seleccionarDestino(lat, lon, texto) {
            // Verificar GPS antes de cerrar el panel
            if (!ubicacionActual) {
                mostrarErrorVamosA('GPS no listo. Espera unos segundos.');
                return;
            }

            // Mostrar que está procesando
            const input = document.getElementById('input-destino-conductor');
            input.value = 'Calculando ruta...';
            input.disabled = true;
            document.getElementById('autocomplete-conductor').style.display = 'none';

            try {
                const res = await fetch('/api/conductor/viaje-personal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        destino_lat: lat,
                        destino_lon: lon,
                        destino_texto: texto,
                        origen_lat: ubicacionActual.lat,
                        origen_lon: ubicacionActual.lon,
                        origen_texto: 'Mi ubicación'
                    })
                });
                const data = await res.json();

                if (data.ok && data.viaje) {
                    // Éxito: cerrar panel y mostrar viaje
                    cerrarPanelBusqueda();
                    viajeActivo = data.viaje;
                    document.getElementById('barra-vamos-a').style.display = 'none';
                    mostrarInfoViaje();
                    await cargarRutaViajeActivo();
                    if (!intervalRutaActiva) {
                        intervalRutaActiva = setInterval(() => {
                            if (viajeActivo) cargarRutaViajeActivo();
                        }, 30000);
                    }
                } else {
                    input.value = '';
                    input.disabled = false;
                    mostrarErrorVamosA('API: ' + (data.error || 'Sin detalle'));
                }
            } catch (e) {
                input.value = '';
                input.disabled = false;
                mostrarErrorVamosA('Conexión: ' + e.message);
            }
        }

        function mostrarErrorVamosA(msg) {
            const toast = document.getElementById('toast-pantalla');
            toast.textContent = msg;
            toast.style.display = 'block';
            toast.style.background = 'rgba(239, 68, 68, 0.95)';
            toast.style.color = '#fff';
            setTimeout(() => {
                toast.style.display = 'none';
                toast.style.background = '';
                toast.style.color = '';
            }, 8000);
        }

        function activarSeleccionMapa() {
            modoSeleccionMapa = true;
            cerrarPanelBusqueda();
            mapa.getCanvas().style.cursor = 'crosshair';

            // Entrar en modo libre para poder navegar el mapa
            if (!modoLibre) {
                entrarModoLibre();
            }
        }

        function desactivarSeleccionMapa() {
            if (!modoSeleccionMapa) return;
            modoSeleccionMapa = false;
            mapa.getCanvas().style.cursor = '';
            if (marcadorDestinoTemp) {
                marcadorDestinoTemp.remove();
                marcadorDestinoTemp = null;
            }
        }

        // Click en mapa para seleccionar destino
        document.addEventListener('DOMContentLoaded', function() {
            // Se ejecuta después de inicializarMapa, así que usamos un interval corto
            const esperarMapa = setInterval(() => {
                if (mapa) {
                    mapa.on('click', handleClickMapa);
                    clearInterval(esperarMapa);
                }
            }, 200);
        });

        async function handleClickMapa(e) {
            if (!modoSeleccionMapa) return;

            const lat = e.lngLat.lat;
            const lon = e.lngLat.lng;

            // Poner marcador temporal
            if (marcadorDestinoTemp) marcadorDestinoTemp.remove();

            const el = document.createElement('div');
            el.className = 'marcador-destino-seleccion';
            marcadorDestinoTemp = new maplibregl.Marker({ element: el })
                .setLngLat([lon, lat])
                .addTo(mapa);

            // Obtener dirección reversa
            let textoDestino = 'Lat: ' + lat.toFixed(4) + ', Lon: ' + lon.toFixed(4);
            try {
                const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&countrycodes=co', {
                    headers: { 'User-Agent': 'TucTucApp/1.0' }
                });
                const data = await res.json();
                if (data.display_name) {
                    textoDestino = data.display_name;
                }
            } catch (e) {
                // Usar coordenadas como fallback
            }

            desactivarSeleccionMapa();
            volverAConduccion();
            await seleccionarDestino(lat, lon, textoDestino);
        }

        async function finalizarViajePersonal() {
            if (!viajeActivo) return;

            try {
                await fetch('/api/conductor/finalizar-viaje/' + viajeActivo.id, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metodo_pago: 'na' })
                });
            } catch (e) {
                // Silencioso
            }

            // Misma limpieza que cancelar, sin redirigir
            limpiarViajePersonal();
        }

        async function cancelarViajePersonal() {
            if (!viajeActivo) return;

            try {
                await fetch('/api/conductor/cancelar-viaje/' + viajeActivo.id, { method: 'POST' });
            } catch (e) {
                // Silencioso
            }

            limpiarViajePersonal();
        }

        function limpiarViajePersonal() {
            if (intervalRutaActiva) {
                clearInterval(intervalRutaActiva);
                intervalRutaActiva = null;
            }
            llegadaDetectada = false;
            document.getElementById('toast-llegada').style.display = 'none';
            viajeActivo = null;
            geometriaRutaActiva = null;
            camarasEnRuta = [];
            girosDetectados = [];
            marcadoresViaje.forEach(m => m.remove());
            marcadoresViaje = [];

            if (mapaListo) {
                mapa.getSource(FUENTES.RUTA_RECOGIDA).setData(LINEA_VACIA);
                mapa.getSource(FUENTES.RUTA_DESTINO).setData(LINEA_VACIA);
                mapa.getSource(FUENTES.RUTA_NUEVA).setData(LINEA_VACIA);
            }

            actualizarCamarasEnMapa();
            document.getElementById('fuente-ruta').textContent = '';
            document.getElementById('viaje-distancia-tiempo').textContent = '';
            document.getElementById('info-viaje').style.display = 'none';
            document.getElementById('barra-vamos-a').style.display = 'block';
        }

        // ==========================================
        // CONTROLES DEL CONDUCTOR
        // ==========================================

        function toggleVista() {
            nivelVista = (nivelVista + 1) % NIVELES_VISTA.length;
            const pitch = NIVELES_VISTA[nivelVista];
            mapa.easeTo({ pitch, duration: 500 });
            localStorage.setItem('tuctuc_nivelVista', nivelVista);
            const btn = document.getElementById('btn-vista');
            btn.textContent = nivelVista === 0 ? '2D' : nivelVista + '/3';
        }

        function toggleEstilo() {
            estiloOscuro = !estiloOscuro;
            document.body.setAttribute('data-dark', estiloOscuro ? 'true' : 'false');
            const flavor = estiloOscuro ? 'dark' : 'light';

            // Guardar estado actual
            const center = mapa.getCenter();
            const zoom = mapa.getZoom();
            const pitch = mapa.getPitch();
            const bearing = mapa.getBearing();

            mapa.setStyle(crearEstilo(flavor));

            mapa.once('style.load', () => {
                // Re-agregar fuentes y capas de rutas
                mapa.addSource(FUENTES.RUTA_RECOGIDA, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_DESTINO, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_NUEVA, { type: 'geojson', data: LINEA_VACIA });

                mapa.addLayer({
                    id: 'layer-ruta-recogida', type: 'line', source: FUENTES.RUTA_RECOGIDA,
                    paint: { 'line-color': '#f97316', 'line-width': 6, 'line-opacity': 0.85, 'line-dasharray': [2, 1.5] }
                });
                mapa.addLayer({
                    id: 'layer-ruta-destino', type: 'line', source: FUENTES.RUTA_DESTINO,
                    paint: { 'line-color': '#22c55e', 'line-width': 8, 'line-opacity': 0.9 }
                });
                mapa.addLayer({
                    id: 'layer-ruta-nueva', type: 'line', source: FUENTES.RUTA_NUEVA,
                    paint: { 'line-color': '#f59e0b', 'line-width': 5, 'line-opacity': 0.8, 'line-dasharray': [2, 2] }
                });

                mapa.jumpTo({ center, zoom, pitch, bearing });

                // Recargar ruta activa
                if (viajeActivo) cargarRutaViajeActivo();
            });

            document.getElementById('btn-estilo').textContent = estiloOscuro ? '\uD83C\uDF19' : '\u2600\uFE0F';
        }

        async function recalcularRuta() {
            if (!viajeActivo) return;
            const btn = document.getElementById('btn-recalcular');
            btn.disabled = true;
            btn.style.opacity = '0.4';
            try {
                await cargarRutaViajeActivo(true);
            } finally {
                btn.disabled = false;
                btn.style.opacity = '';
            }
        }

        function toggleModoLibre() {
            if (modoLibre) {
                volverAConduccion();
            } else {
                entrarModoLibre();
            }
        }

        function entrarModoLibre() {
            modoLibre = true;
            document.getElementById('btn-volver-conduccion').style.display = 'block';
            document.getElementById('btn-explorar').style.background = '#3b82f6';

            // Si hay viaje activo, hacer zoom para ver toda la ruta
            if (viajeActivo && geometriaRutaActiva && geometriaRutaActiva.length >= 2) {
                const bounds = new maplibregl.LngLatBounds();
                geometriaRutaActiva.forEach(p => bounds.extend([p[1], p[0]]));
                // Incluir posición del conductor
                if (ubicacionActual) {
                    bounds.extend([ubicacionActual.lon, ubicacionActual.lat]);
                }
                mapa.fitBounds(bounds, { padding: 60, pitch: 0, bearing: 0, duration: 800 });
            } else {
                // Sin viaje: solo liberar el mapa, quitar pitch y bearing
                mapa.easeTo({ pitch: 0, bearing: 0, duration: 500 });
            }
        }

        function volverAConduccion() {
            modoLibre = false;
            document.getElementById('btn-volver-conduccion').style.display = 'none';
            document.getElementById('btn-explorar').style.background = 'rgba(0, 0, 0, 0.5)';

            // Volver a centrar en conductor con pitch y bearing
            if (ubicacionActual) {
                mapa.easeTo({
                    center: [ubicacionActual.lon, ubicacionActual.lat],
                    zoom: CONFIG.ZOOM_DEFAULT,
                    pitch: NIVELES_VISTA[nivelVista],
                    bearing: headingActual || 0,
                    offset: [0, 120],
                    duration: 800
                });
            }
        }

        function salir() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
            window.location.href = '/conductor';
        }

        // Wake Lock con fallback
        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                } else {
                    mostrarToastPantalla();
                }
            } catch (e) {
                mostrarToastPantalla();
            }
        }

        function mostrarToastPantalla() {
            const toast = document.getElementById('toast-pantalla');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }
    </script>
