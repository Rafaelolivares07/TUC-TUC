<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conducción Asistida</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Contenedor del mapa con rotación */
        #mapa-container {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            transition: transform 0.3s ease-out;
        }

        #mapa {
            width: 100%;
            height: 100%;
        }

        /* Wrapper del HUD: flechas + bloque central */
        #hud-wrapper {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Flechas de giro (gris de fondo + amarilla encima) */
        .flecha-giro {
            display: none;
            position: relative;
            transition: font-size 0.3s ease;
            font-size: 36px;
        }

        .flecha-giro.visible {
            display: block;
        }

        .flecha-base {
            color: #4b5563;
        }

        .flecha-activa {
            position: absolute;
            top: 0;
            left: 0;
            color: #facc15;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
            opacity: 0;
        }

        .flecha-giro.parpadeo-lento .flecha-activa {
            animation: parpadeo-flecha 1s infinite;
        }

        .flecha-giro.parpadeo-medio .flecha-activa {
            animation: parpadeo-flecha 0.5s infinite;
        }

        .flecha-giro.parpadeo-rapido .flecha-activa {
            animation: parpadeo-flecha 0.25s infinite;
        }

        @keyframes parpadeo-flecha {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* HUD unificado: cámara + velocímetro apilados */
        #hud-superior {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 18px;
            padding: 10px 20px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.4s ease;
            border: 3px solid transparent;
            min-width: 90px;
        }

        /* Velocímetro */
        #hud-velocidad {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }

        #velocidad-actual {
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
            transition: font-size 0.4s ease;
        }

        #velocidad-unidad {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 2px;
            transition: font-size 0.4s ease;
        }

        /* Cámara (oculta por defecto, aparece encima del velocímetro) */
        #hud-camara {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s ease;
            transform-origin: center bottom;
        }

        #hud-camara.visible {
            display: flex;
        }

        #camara-icono {
            line-height: 1;
            transition: font-size 0.4s ease;
        }

        #camara-distancia {
            font-weight: 700;
            transition: font-size 0.4s ease;
        }

        #camara-limite {
            opacity: 0.85;
            transition: font-size 0.4s ease;
        }

        /* Mensaje de asistencia inteligente */
        #hud-asistencia {
            display: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding: 4px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 2px 0;
        }

        #hud-asistencia.visible {
            display: block;
        }

        #hud-asistencia.accion-bien {
            color: #22c55e;
            font-size: 16px;
        }

        #hud-asistencia.accion-suelta {
            color: #facc15;
            font-size: 20px;
        }

        #hud-asistencia.accion-reduce {
            color: #f97316;
            font-size: 24px;
        }

        #hud-asistencia.accion-frena {
            color: #ef4444;
            font-size: 28px;
            animation: parpadeo-frena 0.5s infinite;
        }

        @keyframes parpadeo-frena {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Bordes de alerta según proximidad */
        #hud-superior.alerta-lejos {
            border-color: #22c55e;
        }

        #hud-superior.alerta-medio {
            border-color: #f59e0b;
        }

        #hud-superior.alerta-cerca {
            border-color: #ef4444;
            animation: pulse-hud 1s infinite;
        }

        #hud-superior.alerta-exceso {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.25);
            animation: pulse-hud 0.6s infinite;
        }

        @keyframes pulse-hud {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* Botón salir - pegado a la esquina */
        #btn-salir {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Toggle sonido - arriba derecha */
        #btn-sonido {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        #btn-sonido.muted {
            opacity: 0.5;
        }

        /* Info de viaje activo - franja horizontal abajo */
        #info-viaje {
            position: absolute;
            bottom: 32px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 14px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
            display: none;
            border-top: 3px solid #22c55e;
            font-size: 12px;
        }

        #info-viaje-contenido {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #info-viaje-datos {
            flex: 1;
            min-width: 0;
        }

        #info-viaje .viaje-pasajero {
            font-weight: 600;
            font-size: 13px;
        }

        #info-viaje .viaje-detalle {
            opacity: 0.8;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #info-viaje .viaje-tarifa {
            font-weight: 700;
            font-size: 16px;
            color: #22c55e;
            white-space: nowrap;
        }

        #info-viaje .btn-accion-viaje {
            display: block;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            color: #000;
        }

        #info-viaje .btn-llegue { background: #eab308; }
        #info-viaje .btn-iniciar { background: #22c55e; }
        #info-viaje .btn-finalizar { background: #ef4444; color: #fff; }

        /* Colores de velocidad */
        .velocidad-ok { color: #22c55e; }
        .velocidad-cerca { color: #f59e0b; }
        .velocidad-exceso { color: #ef4444; }

        /* Franja inferior unificada: brújula + GPS + leyenda */
        #barra-inferior {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            padding: 7px 15px;
            font-size: 10px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #barra-inferior .brujula-inline {
            font-size: 16px;
            transition: transform 0.3s;
            display: inline-block;
        }

        #barra-inferior .gps-inline {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #gps-indicador {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #gps-indicador.error {
            background: #ef4444;
            animation: none;
        }

        .separador-barra {
            width: 1px;
            height: 14px;
            background: rgba(255, 255, 255, 0.2);
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leyenda-linea {
            width: 18px;
            height: 3px;
            border-radius: 2px;
        }

        /* Toast de pantalla */
        #toast-pantalla {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(245, 158, 11, 0.95);
            color: #000;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .alerta-advertencia {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: white !important;
        }

    </style>
</head>
<body>
    <!-- Contenedor del mapa con rotación -->
    <div id="mapa-container">
        <div id="mapa"></div>
    </div>

    <!-- Botón salir (esquina sup izq) -->
    <button id="btn-salir" onclick="salir()">✕</button>

    <!-- Toggle sonido (esquina sup der) -->
    <button id="btn-sonido" onclick="toggleSonido()">🔊</button>

    <!-- HUD unificado: cámara + asistencia + velocímetro + flechas de giro -->
    <div id="hud-wrapper">
        <div id="flecha-izquierda" class="flecha-giro">
            <span class="flecha-base">◀</span>
            <span class="flecha-activa">◀</span>
        </div>
        <div id="hud-superior">
            <div id="hud-camara">
                <div id="camara-icono">📷</div>
                <div id="camara-distancia"></div>
                <div id="camara-limite"></div>
            </div>
            <div id="hud-asistencia"></div>
            <div id="hud-velocidad">
                <div id="velocidad-actual" class="velocidad-ok">0</div>
                <div id="velocidad-unidad">km/h</div>
            </div>
        </div>
        <div id="flecha-derecha" class="flecha-giro">
            <span class="flecha-base">▶</span>
            <span class="flecha-activa">▶</span>
        </div>
    </div>

    <!-- Info viaje activo - franja horizontal -->
    <div id="info-viaje">
        <div id="info-viaje-contenido">
            <div id="info-viaje-datos">
                <div class="viaje-pasajero" id="viaje-pasajero"></div>
                <div class="viaje-detalle" id="viaje-origen"></div>
                <div class="viaje-detalle" id="viaje-destino"></div>
            </div>
            <div class="viaje-tarifa" id="viaje-tarifa"></div>
        </div>
        <div id="viaje-acciones"></div>
    </div>

    <!-- Franja inferior: brújula + GPS + leyenda -->
    <div id="barra-inferior">
        <span class="brujula-inline" id="brujula">🧭</span>
        <div class="gps-inline">
            <div id="gps-indicador"></div>
            <span id="gps-texto">GPS...</span>
        </div>
        <div class="separador-barra"></div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: rgba(100, 150, 255, 0.6);"></div>
            <span>Conocidas</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: transparent; border-top: 3px dashed #f97316;"></div>
            <span>Recogida</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: #22c55e;"></div>
            <span>Destino</span>
        </div>
        <div class="separador-barra"></div>
        <span id="fuente-ruta" style="opacity: 0.5; font-style: italic;"></span>
    </div>

    <!-- Toast pantalla -->
    <div id="toast-pantalla">⚠️ Mantén la pantalla encendida en Ajustes</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Variables globales
        let mapa = null;
        let marcadorConductor = null;
        let watchId = null;
        let ubicacionActual = null;
        let ubicacionAnterior = null;
        let velocidadActual = 0;
        let headingActual = 0;
        let camarasCercanas = [];
        let camarasEnMapa = [];
        let camarasEnRuta = [];  // Cámaras detectadas en la ruta activa
        let viajeActivo = null;
        let geometriaRutaActiva = null;  // Geometría de la ruta para detección de cámaras

        // Capas de rutas
        let capaRutasConocidas = null;
        let capaViajeActivo = null;
        let capaHaciaRecogida = null;
        let capaRutaNueva = null;
        let puntosRutaNueva = [];
        let marcadoresViaje = [];
        let intervalRutaActiva = null;

        // Configuración
        const CONFIG = {
            DISTANCIA_ALERTA_CAMARA: 500,
            DISTANCIA_PELIGRO_CAMARA: 200,
            INTERVALO_BUSCAR_CAMARAS: 5000,
            INTERVALO_CARGAR_SEGMENTOS: 10000,
            ZOOM_DEFAULT: 18,
            DISTANCIA_MIN_NUEVO_PUNTO: 10 // metros mínimos para registrar nuevo punto
        };

        // Inicialización
        document.addEventListener('DOMContentLoaded', async function() {
            await inicializarMapa();
            iniciarWatchPosition();
            await verificarViajeActivo();
            await cargarSegmentosConocidos();

            // Intervalos
            setInterval(buscarCamarasCercanas, CONFIG.INTERVALO_BUSCAR_CAMARAS);
            setInterval(cargarSegmentosConocidos, CONFIG.INTERVALO_CARGAR_SEGMENTOS);

            // Intentar Wake Lock
            solicitarWakeLock();

            // Inicializar audio al primer toque (requisito móviles)
            document.addEventListener('touchstart', () => inicializarAudio(), { once: true });
            document.addEventListener('click', () => inicializarAudio(), { once: true });
        });

        async function inicializarMapa() {
            mapa = L.map('mapa', {
                zoomControl: false,
                attributionControl: false,
                rotate: true,
                rotateControl: false
            }).setView([3.4516, -76.5320], CONFIG.ZOOM_DEFAULT);

            // Tema más visible (CartoDB Voyager - colores suaves)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(mapa);

            // Crear capas para rutas
            capaRutasConocidas = L.layerGroup().addTo(mapa);
            capaHaciaRecogida = L.layerGroup().addTo(mapa);
            capaViajeActivo = L.layerGroup().addTo(mapa);
            capaRutaNueva = L.layerGroup().addTo(mapa);

            // Marcador del conductor (triángulo apuntando arriba)
            actualizarMarcadorConductor();
        }

        function actualizarMarcadorConductor(contraRotacion = 0) {
            // Flecha menos puntiaguda (más ancha) que contra-rota para siempre apuntar arriba
            const iconoConductor = L.divIcon({
                className: 'conductor-marker',
                html: `<div id="flecha-conductor" style="
                    width: 0;
                    height: 0;
                    border-left: 18px solid transparent;
                    border-right: 18px solid transparent;
                    border-bottom: 28px solid #3b82f6;
                    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
                    transform: rotate(${contraRotacion}deg);
                    transition: transform 0.3s ease-out;
                "></div>`,
                iconSize: [36, 28],
                iconAnchor: [18, 28]
            });

            if (marcadorConductor) {
                mapa.removeLayer(marcadorConductor);
            }

            marcadorConductor = L.marker([3.4516, -76.5320], {
                icon: iconoConductor,
                zIndexOffset: 1000
            }).addTo(mapa);
        }

        function iniciarWatchPosition() {
            if (!navigator.geolocation) {
                mostrarErrorGPS('GPS no disponible');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                posicionActualizada,
                errorGPS,
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        function posicionActualizada(position) {
            const { latitude, longitude, speed, heading, accuracy } = position.coords;

            const esPrimeraUbicacion = !ubicacionActual;
            ubicacionAnterior = ubicacionActual;
            ubicacionActual = { lat: latitude, lon: longitude };
            velocidadActual = speed ? Math.round(speed * 3.6) : 0;
            headingActual = heading || 0;

            // Actualizar UI
            actualizarMarcador(latitude, longitude);
            rotarMapa(heading);
            actualizarVelocimetro(velocidadActual);
            actualizarEstadoGPS(accuracy);
            actualizarBrujula(heading);

            // Primera ubicación: buscar cámaras y segmentos inmediatamente
            if (esPrimeraUbicacion) {
                buscarCamarasCercanas();
                cargarSegmentosConocidos();
            }

            // Verificar alertas y asistencia inteligente
            verificarAlertaCamaras();
            analizarCamino();

            // Registrar nuevo segmento si se movió suficiente
            registrarNuevoSegmento();

            // Enviar ubicación al servidor
            enviarUbicacionServidor(latitude, longitude, velocidadActual, headingActual);
        }

        function actualizarMarcador(lat, lon) {
            marcadorConductor.setLatLng([lat, lon]);
            mapa.setView([lat, lon], mapa.getZoom(), { animate: true, duration: 0.3 });
        }

        function rotarMapa(heading) {
            if (heading === null || heading === undefined) return;

            const container = document.getElementById('mapa-container');
            // Rotar el contenedor del mapa para que el heading apunte arriba
            container.style.transform = `rotate(${-heading}deg)`;

            // Contra-rotar la flecha del conductor para que siempre apunte arriba
            actualizarMarcadorConductor(heading);

            // Actualizar brújula para mostrar el norte
            document.getElementById('brujula').style.transform = `rotate(${heading}deg)`;
        }

        function actualizarBrujula(heading) {
            // La brújula ya se actualiza en rotarMapa
        }

        function actualizarVelocimetro(velocidad) {
            const elem = document.getElementById('velocidad-actual');
            elem.textContent = velocidad;

            const limite = obtenerLimiteCercano();
            if (limite) {
                if (velocidad > limite) {
                    elem.className = 'velocidad-exceso';
                } else if (velocidad > limite - 10) {
                    elem.className = 'velocidad-cerca';
                } else {
                    elem.className = 'velocidad-ok';
                }
            } else {
                elem.className = 'velocidad-ok';
            }
        }

        function obtenerLimiteCercano() {
            // Priorizar cámaras en ruta, luego perimetrales
            const todas = [...camarasEnRuta, ...camarasCercanas];
            if (todas.length === 0) return null;

            let masCercana = null;
            let distMin = Infinity;
            todas.forEach(cam => {
                if (ubicacionActual) {
                    const dist = calcularDistancia(ubicacionActual.lat, ubicacionActual.lon, cam.lat, cam.lon);
                    if (dist < distMin) {
                        distMin = dist;
                        masCercana = cam;
                    }
                }
            });

            return masCercana ? (masCercana.velocidad_maxima || 60) : null;
        }

        function actualizarEstadoGPS(accuracy) {
            const indicador = document.getElementById('gps-indicador');
            const texto = document.getElementById('gps-texto');

            indicador.classList.remove('error');

            if (accuracy < 10) {
                texto.textContent = 'GPS preciso';
            } else if (accuracy < 30) {
                texto.textContent = 'GPS bueno';
            } else {
                texto.textContent = `GPS ±${Math.round(accuracy)}m`;
            }
        }

        function errorGPS(error) {
            mostrarErrorGPS(error.message);
        }

        function mostrarErrorGPS(mensaje) {
            const indicador = document.getElementById('gps-indicador');
            const texto = document.getElementById('gps-texto');

            indicador.classList.add('error');
            texto.textContent = mensaje;
        }

        // ==========================================
        // SEGMENTOS Y RUTAS
        // ==========================================

        async function cargarSegmentosConocidos() {
            if (!ubicacionActual) return;

            try {
                const res = await fetch(`/api/segmentos-cercanos?lat=${ubicacionActual.lat}&lon=${ubicacionActual.lon}&radio=500`);
                const data = await res.json();

                if (data.ok && data.segmentos) {
                    dibujarSegmentosConocidos(data.segmentos);
                }
            } catch (e) {
                console.error('Error cargando segmentos:', e);
            }
        }

        function dibujarSegmentosConocidos(segmentos) {
            capaRutasConocidas.clearLayers();

            segmentos.forEach(seg => {
                const polyline = L.polyline([
                    [seg.origen_lat, seg.origen_lon],
                    [seg.destino_lat, seg.destino_lon]
                ], {
                    color: 'rgba(100, 150, 255, 0.6)',
                    weight: 6,
                    opacity: 0.7
                });

                capaRutasConocidas.addLayer(polyline);
            });
        }

        async function cargarRutaViajeActivo() {
            if (!viajeActivo) return;

            try {
                const res = await fetch(`/api/viaje/${viajeActivo.id}/ruta`);
                const data = await res.json();

                if (data.ok) {
                    dibujarRutaDosTramos(data);
                    // Guardar geometría combinada para detección de cámaras
                    geometriaRutaActiva = [];
                    if (data.leg1 && data.leg1.geometria) {
                        geometriaRutaActiva = geometriaRutaActiva.concat(data.leg1.geometria);
                    }
                    if (data.leg2 && data.leg2.geometria) {
                        geometriaRutaActiva = geometriaRutaActiva.concat(data.leg2.geometria);
                    }
                    // Detectar giros en la geometría de la ruta
                    detectarGirosEnRuta();

                    // Usar cámaras del response directamente
                    if (data.camaras && data.camaras.length > 0) {
                        camarasEnRuta = data.camaras;

        async function buscarCamarasCercanas() {
            if (!ubicacionActual) return;

            // Si hay ruta activa, las cámaras ya se detectaron en buscarCamarasEnRuta
            // Aquí solo buscamos cámaras cercanas para conducción libre

            try {
                const res = await fetch(`/api/camaras-cercanas?lat=${ubicacionActual.lat}&lon=${ubicacionActual.lon}&radio=1000`);
                const data = await res.json();

                if (data.ok) {
                    let todasCamaras = data.camaras || [];

                    // Si NO hay ruta activa, filtrar por bearing (solo mostrar cámaras adelante)
                    if (!geometriaRutaActiva && headingActual !== null) {
                        camarasCercanas = todasCamaras.filter(cam => {
                            const bearingACamara = calcularBearing(
                                ubicacionActual.lat, ubicacionActual.lon,
                                cam.lat, cam.lon
                            );
                            let diff = Math.abs(bearingACamara - headingActual);
                            if (diff > 180) diff = 360 - diff;
                            return diff <= 60;  // ±60° del rumbo actual
                        });
                    } else {
                        camarasCercanas = todasCamaras;
                    }

                    actualizarCamarasEnMapa();
                }
            } catch (e) {
                console.error('Error buscando cámaras:', e);
            }
        }

        function calcularBearing(lat1, lon1, lat2, lon2) {
            const toRad = x => x * Math.PI / 180;
            const toDeg = x => x * 180 / Math.PI;

            const dLon = toRad(lon2 - lon1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            let bearing = toDeg(Math.atan2(y, x));
            return (bearing + 360) % 360;
        }

        function actualizarCamarasEnMapa() {
            camarasEnMapa.forEach(m => mapa.removeLayer(m));
            camarasEnMapa = [];

            // Combinar cámaras en ruta (prioridad) y cercanas
            const camarasIds = new Set();
            const todasCamaras = [];

            // Primero las de la ruta (verde = están en tu camino)
            camarasEnRuta.forEach(cam => {
                camarasIds.add(cam.id);
                todasCamaras.push({ ...cam, enRuta: true });
            });

            // Luego las cercanas que no estén ya en ruta (rojo = perimetral)
            camarasCercanas.forEach(cam => {
                if (!camarasIds.has(cam.id)) {
                    todasCamaras.push({ ...cam, enRuta: false });
                }
            });

            todasCamaras.forEach(cam => {
                const esEnRuta = cam.enRuta;
                const icono = L.divIcon({
                    className: 'camara-marker',
                    html: `<div style="
                        background: ${esEnRuta ? '#dc2626' : '#6b7280'};

                        ${esEnRuta ? 'animation: pulse 1.5s infinite;' : ''}
                    ">📷</div>`,

                    iconAnchor: [esEnRuta ? 20 : 16, esEnRuta ? 20 : 16]
                });

                const marker = L.marker([cam.lat, cam.lon], { icon: icono }).addTo(mapa);
                marker.bindPopup(`
                    <strong>${cam.nombre || 'Cámara'}</strong><br>

        function verificarAlertaCamaras() {

            // Buscar la cámara más cercana de TODAS (ruta + cercanas)
            const todasCamaras = [...camarasEnRuta, ...camarasCercanas];
            const idsVistos = new Set();
            let camaraProxima = null;
            let distanciaProxima = Infinity;

            todasCamaras.forEach(cam => {
                if (idsVistos.has(cam.id)) return;
                idsVistos.add(cam.id);

                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,

            if (camaraProxima && distanciaProxima < CONFIG.DISTANCIA_ALERTA_CAMARA) {

        // HUD unificado: escala cámara y velocímetro según proximidad
        function actualizarHudCamara(camara, distancia) {
            const hud = document.getElementById('hud-superior');
            const hudCamara = document.getElementById('hud-camara');
            const iconoEl = document.getElementById('camara-icono');
            const distanciaEl = document.getElementById('camara-distancia');
            const limiteEl = document.getElementById('camara-limite');
            const velocidadEl = document.getElementById('velocidad-actual');
            const unidadEl = document.getElementById('velocidad-unidad');

            // Factor: 0 (lejos, 500m) → 1 (encima, 0m)
            const factor = Math.max(0, Math.min(1, 1 - (distancia / CONFIG.DISTANCIA_ALERTA_CAMARA)));

            // Mostrar cámara
            hudCamara.classList.add('visible');

            // Texto de distancia
            const textoDistancia = distancia < 1000 ? `${Math.round(distancia)}m` : `${(distancia/1000).toFixed(1)}km`;
            distanciaEl.textContent = textoDistancia;

            // Límite
            const limite = camara.velocidad_maxima || 60;
            limiteEl.textContent = `Límite: ${limite} km/h`;

            // Escalado progresivo de cámara (pequeña → grande)
            const iconoSize = 18 + (factor * 22);       // 18px → 40px
            const distanciaSize = 14 + (factor * 12);    // 14px → 26px
            const limiteSize = 11 + (factor * 4);        // 11px → 15px

            iconoEl.style.fontSize = `${iconoSize}px`;
            distanciaEl.style.fontSize = `${distanciaSize}px`;
            limiteEl.style.fontSize = `${limiteSize}px`;

            // Reducir velocímetro proporcionalmente
            const velSize = 52 - (factor * 24);          // 52px → 28px
            const unidadSize = 14 - (factor * 4);        // 14px → 10px

            velocidadEl.style.fontSize = `${velSize}px`;
            unidadEl.style.fontSize = `${unidadSize}px`;

            // Borde según proximidad y exceso
            hud.classList.remove('alerta-lejos', 'alerta-medio', 'alerta-cerca', 'alerta-exceso');

            const exceso = velocidadActual > limite;

            if (exceso && distancia < CONFIG.DISTANCIA_PELIGRO_CAMARA) {
                hud.classList.add('alerta-exceso');
            } else if (distancia < CONFIG.DISTANCIA_PELIGRO_CAMARA) {
                hud.classList.add('alerta-cerca');
            } else if (distancia < 300) {
                hud.classList.add('alerta-medio');
            } else {
                hud.classList.add('alerta-lejos');
            }
        }

        function ocultarHudCamara() {
            const hud = document.getElementById('hud-superior');
            const hudCamara = document.getElementById('hud-camara');
            const velocidadEl = document.getElementById('velocidad-actual');

            hudCamara.classList.remove('visible');

        }

        // ==========================================
        // ASISTENCIA INTELIGENTE DE CONDUCCIÓN
        // ==========================================

        // Contexto de audio para sonidos
        let audioCtx = null;
        let sonidoActivo = true;          // Toggle de sonido
        let ultimaAccion = null;          // Para no repetir sonido
        let ultimoSonidoTimestamp = 0;    // Cooldown entre sonidos

        const ASISTENCIA = {
            DESACELERACION_COSTEO: 1.5,   // km/h por segundo costeando (inercia)
            DESACELERACION_FRENO: 5,      // km/h por segundo frenando suave
            COOLDOWN_SONIDO: 3000,        // ms entre sonidos
        };

        function inicializarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Función principal: analiza qué hay adelante y qué hacer
        function analizarCamino() {
            if (!ubicacionActual) return;

            // Actualizar flechas de giro
            actualizarFlechasGiro();

            const eventos = obtenerEventosAdelante();

            if (eventos.length === 0) {
                ocultarAsistencia();
                return;
            }

            // Tomar el evento más urgente (el más cercano que requiere acción)
            const eventoUrgente = eventos[0];
            const accion = calcularAccion(eventoUrgente.velocidadObjetivo, eventoUrgente.distancia, velocidadActual);

            mostrarAsistencia(accion);
        }

        // Busca todos los eventos adelante que requieren atención
        function obtenerEventosAdelante() {
            const eventos = [];

            // Cámaras (en ruta + cercanas filtradas por bearing)
            const todasCamaras = [...camarasEnRuta, ...camarasCercanas];
            const idsVistos = new Set();

            todasCamaras.forEach(cam => {
                if (idsVistos.has(cam.id)) return;
                idsVistos.add(cam.id);

                if (!ubicacionActual) return;

                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    cam.lat, cam.lon
                );

                if (dist < CONFIG.DISTANCIA_ALERTA_CAMARA) {
                    eventos.push({
                        tipo: 'camara',
                        distancia: dist,
                        velocidadObjetivo: cam.velocidad_maxima || 60,
                        nombre: cam.nombre || 'Cámara'
                    });
                }
            });

            // Giros en la ruta (max 160m)
            girosDetectados.forEach(giro => {
                if (!ubicacionActual) return;

                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    giro.lat, giro.lon
                );

                if (dist < 160) {
                    eventos.push({
                        tipo: 'giro',
                        distancia: dist,
                        velocidadObjetivo: giro.velocidadSugerida,
                        direccion: giro.direccion,
                        angulo: giro.anguloAbs
                    });
                }
            });

            // Ordenar por distancia (el más cercano primero)
            eventos.sort((a, b) => a.distancia - b.distancia);

            return eventos;
        }

        // Calcula qué acción tomar dados: velocidad objetivo, distancia, velocidad actual
        function calcularAccion(velocidadObjetivo, distancia, velocidadActualKmh) {
            // Ya voy bien
            if (velocidadActualKmh <= velocidadObjetivo) {
                return { nivel: 'bien', texto: 'Vas bien' };
            }

            const exceso = velocidadActualKmh - velocidadObjetivo;  // km/h que sobran

            // Tiempo disponible en segundos (distancia / velocidad en m/s)
            const velocidadMs = velocidadActualKmh / 3.6;
            const tiempoDisponible = velocidadMs > 0 ? distancia / velocidadMs : 999;

            // Tiempo que tarda costeando (soltar acelerador)
            const tiempoCosteo = exceso / ASISTENCIA.DESACELERACION_COSTEO;

            // Tiempo que tarda frenando suave
            const tiempoFrenado = exceso / ASISTENCIA.DESACELERACION_FRENO;

            if (tiempoCosteo <= tiempoDisponible * 0.85) {
                // Alcanza costeando con margen
                return { nivel: 'suelta', texto: 'Suelta' };
            } else if (tiempoCosteo <= tiempoDisponible) {
                // Alcanza costeando pero justo
                return { nivel: 'reduce', texto: 'Reduce' };
            } else if (tiempoFrenado <= tiempoDisponible) {
                // Necesita frenar suave
                return { nivel: 'reduce', texto: 'Reduce' };
            } else {
                // Urgente, frena ya
                return { nivel: 'frena', texto: 'Frena' };
            }
        }

        function mostrarAsistencia(accion) {
            const el = document.getElementById('hud-asistencia');

            // Reset clases y aplicar nuevas
            el.className = '';
            el.id = 'hud-asistencia';
            el.classList.add('visible', `accion-${accion.nivel}`);
            el.textContent = accion.texto;

            // Sonido si cambió la acción
            const ahora = Date.now();
            if (accion.nivel !== ultimaAccion && accion.nivel !== 'bien' &&
                ahora - ultimoSonidoTimestamp > ASISTENCIA.COOLDOWN_SONIDO) {
                reproducirSonido(accion.nivel);
                ultimoSonidoTimestamp = ahora;
            }
            ultimaAccion = accion.nivel;
        }

        function ocultarAsistencia() {
            const el = document.getElementById('hud-asistencia');
            el.classList.remove('visible');
            ultimaAccion = null;
        }

        function toggleSonido() {
            sonidoActivo = !sonidoActivo;
            const btn = document.getElementById('btn-sonido');
            btn.textContent = sonidoActivo ? '🔊' : '🔇';
            btn.classList.toggle('muted', !sonidoActivo);
            inicializarAudio();
        }

        // Sonidos con Web Audio API
        function reproducirSonido(nivel) {
            if (!sonidoActivo) return;
            inicializarAudio();
            if (!audioCtx) return;

            switch (nivel) {
                case 'suelta':
                    // Ding suave - tono agradable
                    tocarTono(880, 0.15, 'sine', 0.3);
                    break;
                case 'reduce':
                    // Dos tonos alertantes
                    tocarTono(660, 0.15, 'triangle', 0.4);
                    setTimeout(() => tocarTono(880, 0.15, 'triangle', 0.4), 200);
                    break;
                case 'frena':
                    // Tono urgente repetitivo
                    tocarTono(1000, 0.12, 'square', 0.3);
                    setTimeout(() => tocarTono(1200, 0.12, 'square', 0.3), 150);
                    setTimeout(() => tocarTono(1000, 0.12, 'square', 0.3), 300);
                    break;
            }
        }

        function tocarTono(frecuencia, duracion, tipo, volumen) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.value = volumen;

            // Fade out para evitar clicks
            gain.gain.setValueAtTime(volumen, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        // ==========================================
        // DETECCIÓN DE CURVAS EN RUTA
        // ==========================================

        let girosDetectados = [];  // Cache de giros detectados en la ruta

        // Detecta giros en la geometría de la ruta activa
        function detectarGirosEnRuta() {
            girosDetectados = [];
            if (!geometriaRutaActiva || geometriaRutaActiva.length < 3) return;

            for (let i = 1; i < geometriaRutaActiva.length - 1; i++) {
                const pAnterior = geometriaRutaActiva[i - 1];
                const pActual = geometriaRutaActiva[i];
                const pSiguiente = geometriaRutaActiva[i + 1];

                const bearingEntrada = calcularBearing(pAnterior[0], pAnterior[1], pActual[0], pActual[1]);
                const bearingSalida = calcularBearing(pActual[0], pActual[1], pSiguiente[0], pSiguiente[1]);

                // Diferencia de ángulo (-180 a 180)
                let angulo = bearingSalida - bearingEntrada;
                if (angulo > 180) angulo -= 360;
                if (angulo < -180) angulo += 360;

                const anguloAbs = Math.abs(angulo);

                // Solo giros significativos (> 25°)
                if (anguloAbs > 25) {
                    const direccion = angulo > 0 ? 'derecha' : 'izquierda';

                    // Velocidad sugerida según lo cerrado del giro
                    let velocidadSugerida;
                    if (anguloAbs > 90) {
                        velocidadSugerida = 15;  // Giro muy cerrado
                    } else if (anguloAbs > 60) {
                        velocidadSugerida = 25;  // Giro fuerte
                    } else if (anguloAbs > 40) {
                        velocidadSugerida = 35;  // Giro moderado
                    } else {
                        velocidadSugerida = 40;  // Curva suave
                    }

                    girosDetectados.push({
                        lat: pActual[0],
                        lon: pActual[1],
                        angulo: angulo,
                        anguloAbs: anguloAbs,
                        direccion: direccion,
                        velocidadSugerida: velocidadSugerida
                    });
                }
            }

            console.log(`🔄 ${girosDetectados.length} giros detectados en la ruta`);
        }

        // Actualiza las flechas de giro según proximidad
        function actualizarFlechasGiro() {
            const flechaIzq = document.getElementById('flecha-izquierda');
            const flechaDer = document.getElementById('flecha-derecha');

            if (!ubicacionActual || girosDetectados.length === 0) {
                flechaIzq.className = 'flecha-giro';
                flechaDer.className = 'flecha-giro';
                return;
            }

            // Buscar el giro más cercano adelante
            let giroCercano = null;
            let distGiro = Infinity;

            girosDetectados.forEach(giro => {
                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    giro.lat, giro.lon
                );
                if (dist < distGiro && dist < 160) {
                    distGiro = dist;
                    giroCercano = giro;
                }
            });

            if (!giroCercano) {
                flechaIzq.className = 'flecha-giro';
                flechaDer.className = 'flecha-giro';
                return;
            }

            // Determinar flecha activa y nivel de parpadeo
            const flechaActiva = giroCercano.direccion === 'izquierda' ? flechaIzq : flechaDer;
            const flechaInactiva = giroCercano.direccion === 'izquierda' ? flechaDer : flechaIzq;

            // Inactiva se oculta
            flechaInactiva.className = 'flecha-giro';

            // Tamaño crece con proximidad (max 160m)
            const DIST_MAX_GIRO = 160;
            const factor = Math.max(0, Math.min(1, 1 - (distGiro / DIST_MAX_GIRO)));
            const tamano = 36 + (factor * 24);  // 36px → 60px
            flechaActiva.style.fontSize = `${tamano}px`;

            // Nivel de parpadeo según distancia
            let claseParpadeo = '';
            if (distGiro < 40) {
                claseParpadeo = 'parpadeo-rapido';
            } else if (distGiro < 80) {
                claseParpadeo = 'parpadeo-medio';
            } else if (distGiro < 120) {
                claseParpadeo = 'parpadeo-lento';
            }
            // 120-160m: visible fija gris (sin parpadeo)

            flechaActiva.className = `flecha-giro visible ${claseParpadeo}`;
        }

        // ==========================================
        // UTILIDADES
        // ==========================================

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function enviarUbicacionServidor(lat, lon, velocidad, heading) {
            try {
                await fetch('/api/conductor/actualizar-ubicacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lon, velocidad, heading })
                });
            } catch (e) {
                // Silencioso
            }
        }

        function salir() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
            window.location.href = '/conductor';
        }

        // Wake Lock con fallback
        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                } else {
                    mostrarToastPantalla();
                }
            } catch (e) {
                mostrarToastPantalla();
            }
        }

        function mostrarToastPantalla() {
            const toast = document.getElementById('toast-pantalla');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }
    </script>
