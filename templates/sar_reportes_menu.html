<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reportes SAR — Panel Móvil</title>
    <script src="/static/js/tailwind.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tap-highlight { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased selection:bg-indigo-500 selection:text-white pb-16">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/admin/area" class="text-indigo-200 hover:text-white transition flex items-center gap-1.5 text-sm font-semibold tap-highlight">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Panel Admin</span>
                </a>
                <span class="text-indigo-400 font-light">|</span>
                <h1 class="text-base font-bold truncate">📊 Reportes SAR</h1>
            </div>
            <div class="flex items-center gap-2">
                <a href="/admin/area" class="text-xs bg-indigo-800/80 hover:bg-indigo-600 text-indigo-100 font-medium px-2.5 py-1.5 rounded-lg border border-indigo-500/50 transition">
                    Inicio
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-5 space-y-6">

        <!-- Selector de Agente Activo -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl flex-shrink-0">
                    <i class="bi bi-hdd-network"></i>
                </div>
                <div>
                    <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">Equipo / Agente Conectado</label>
                    <span id="label-agente-activo" class="text-sm font-bold text-slate-800">
                        {% if agentes %}{{ agentes[0].nombre }}{% else %}Conectando...{% endif %}
                    </span>
                </div>
            </div>
            <div class="w-full sm:w-64">
                <select id="sel-agente-menu" onchange="onAgenteMenuChange()"
                        class="w-full appearance-none bg-slate-50 border border-slate-300 text-slate-800 text-xs sm:text-sm font-semibold py-2 px-3 pr-8 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                    {% for a in agentes %}
                    <option value="{{ a.id }}" {% if a.online %}selected{% endif %}>
                        {{ '🟢' if a.online else '⚪' }} {{ a.nombre }} ({{ a.ultimo }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Categorías y Reportes -->
        {% for cat_nombre, items in categorias.items() %}
        <div class="space-y-3">
            <div class="flex items-center gap-2 border-b border-slate-200 pb-2">
                <span class="text-xs font-black uppercase tracking-wider text-indigo-700">{{ cat_nombre }}</span>
                <span class="text-[10px] bg-indigo-50 text-indigo-600 font-bold px-2 py-0.5 rounded-full">{{ items|length }} reportes</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                {% for r in items %}
                <a href="/admin/reportes/{{ r.id }}" onclick="guardarAgenteYIr(event, '/admin/reportes/{{ r.id }}')"
                   class="tap-highlight group block bg-white hover:bg-indigo-50/50 p-4 rounded-2xl shadow-sm hover:shadow-md border border-slate-200/80 hover:border-indigo-300 transition duration-150">
                    <div class="flex items-start gap-3.5">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 group-hover:bg-indigo-600 text-indigo-600 group-hover:text-white flex items-center justify-center text-lg flex-shrink-0 transition-colors shadow-inner">
                            <i class="bi {{ r.icono }}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-1 mb-1">
                                <h3 class="text-sm font-bold text-slate-800 group-hover:text-indigo-700 truncate transition-colors">{{ r.nombre }}</h3>
                                <svg class="w-4 h-4 text-slate-400 group-hover:text-indigo-600 group-hover:translate-x-0.5 transition-transform flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">{{ r.descripcion }}</p>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

    </main>

    <script>
        function getAgenteMenu() {
            const sel = document.getElementById('sel-agente-menu');
            return sel ? sel.value : (localStorage.getItem('sar_agente_favorito') || '');
        }

        function onAgenteMenuChange() {
            const sel = document.getElementById('sel-agente-menu');
            if (sel && sel.value) {
                localStorage.setItem('sar_agente_favorito', sel.value);
                const opt = sel.options[sel.selectedIndex];
                document.getElementById('label-agente-activo').textContent = opt ? opt.text : sel.value;
            }
        }

        function guardarAgenteYIr(e, url) {
            e.preventDefault();
            const ag = getAgenteMenu();
            if (ag) {
                localStorage.setItem('sar_agente_favorito', ag);
                window.location.href = url + '?agente=' + encodeURIComponent(ag);
            } else {
                window.location.href = url;
            }
        }

        (function initAgenteMenu() {
            const sel = document.getElementById('sel-agente-menu');
            const fav = localStorage.getItem('sar_agente_favorito');
            if (fav && sel) {
                for (let i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === fav) {
                        sel.selectedIndex = i;
                        break;
                    }
                }
            }
            if (sel && sel.selectedIndex >= 0) {
                const opt = sel.options[sel.selectedIndex];
                document.getElementById('label-agente-activo').textContent = opt ? opt.text : sel.value;
            }
        })();
    </script>
</body>
</html>
