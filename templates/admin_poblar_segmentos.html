<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poblar Segmentos de Ruta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #mapa { height: 400px; border-radius: 12px; }
        .log-entry { font-family: monospace; font-size: 12px; padding: 2px 0; border-bottom: 1px solid #1f2937; }
        .log-ok { color: #22c55e; }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <div class="bg-gradient-to-r from-teal-800 to-cyan-900 p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/admin" class="text-gray-300 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-xl font-bold">Poblar Segmentos de Ruta</h1>
            </div>
            <div id="stats-header" class="text-sm text-gray-300">
                Cargando estadísticas...
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 space-y-4">
        <!-- Mapa -->
        <div class="bg-gray-800 rounded-xl p-4">
            <div id="mapa"></div>
        </div>

        <!-- Controles -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Configuración del cuadrante -->
            <div class="bg-gray-800 rounded-xl p-4">
                <h3 class="font-bold mb-3 text-teal-400">Cuadrante de la Ciudad</h3>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div>
                        <label class="block text-gray-400 mb-1">NW Lat (norte)</label>
                        <input type="number" id="nw-lat" value="3.52" step="0.01" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">NW Lon (oeste)</label>
                        <input type="number" id="nw-lon" value="-76.58" step="0.01" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">SE Lat (sur)</label>
                        <input type="number" id="se-lat" value="3.34" step="0.01" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">SE Lon (este)</label>
                        <input type="number" id="se-lon" value="-76.48" step="0.01" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                </div>

                <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                    <div>
                        <label class="block text-gray-400 mb-1">POIs por borde</label>
                        <input type="number" id="por-borde" value="5" min="2" max="10" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Delay entre viajes (seg)</label>
                        <input type="number" id="delay" value="1.5" min="0.5" max="5" step="0.5" class="w-full bg-gray-700 rounded p-2 text-white">
                    </div>
                </div>

                <div class="mt-4 flex gap-2">
                    <button onclick="cargarPoisPerimetrales()" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg">
                        Previsualizar POIs
                    </button>
                    <button onclick="dibujarCuadrante()" class="bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-lg">
                        Ver cuadrante
                    </button>
                </div>
            </div>

            <!-- Ejecución -->
            <div class="bg-gray-800 rounded-xl p-4">
                <h3 class="font-bold mb-3 text-teal-400">Ejecución</h3>

                <div id="resumen-pois" class="text-sm text-gray-400 mb-3">
                    Primero previsualiza los POIs perimetrales.
                </div>

                <!-- Barra de progreso -->
                <div class="w-full bg-gray-700 rounded-full h-4 mb-2 overflow-hidden" id="barra-container" style="display:none;">
                    <div id="barra-progreso" class="bg-teal-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="progreso-texto" class="text-sm text-gray-400 mb-3"></div>

                <!-- Contadores -->
                <div class="grid grid-cols-3 gap-2 text-center mb-4">
                    <div class="bg-gray-700 rounded-lg p-2">
                        <div id="cont-viajes" class="text-xl font-bold text-teal-400">0</div>
                        <div class="text-xs text-gray-400">Viajes</div>
                    </div>
                    <div class="bg-gray-700 rounded-lg p-2">
                        <div id="cont-nuevos" class="text-xl font-bold text-green-400">0</div>
                        <div class="text-xs text-gray-400">Nuevos</div>
                    </div>
                    <div class="bg-gray-700 rounded-lg p-2">
                        <div id="cont-actualizados" class="text-xl font-bold text-yellow-400">0</div>
                        <div class="text-xs text-gray-400">Actualizados</div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="btn-iniciar" onclick="iniciarPoblacion()" disabled
                            class="flex-1 bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-2 px-4 rounded-lg">
                        Iniciar Población
                    </button>
                    <button id="btn-detener" onclick="detenerPoblacion()" style="display:none;"
                            class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">
                        Detener
                    </button>
                </div>
            </div>
        </div>

        <!-- Log -->
        <div class="bg-gray-800 rounded-xl p-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-teal-400">Log</h3>
                <button onclick="limpiarLog()" class="text-xs text-gray-500 hover:text-gray-300">Limpiar</button>
            </div>
            <div id="log" class="h-48 overflow-y-auto bg-gray-900 rounded-lg p-3 text-xs"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapa = null;
        let capaCuadrante = null;
        let capaPois = null;
        let capaRutas = null;
        let poisCargados = null;
        let viajesGenerados = [];
        let ejecutando = false;
        let detenido = false;

        // Contadores
        let totalViajes = 0;
        let totalNuevos = 0;
        let totalActualizados = 0;

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            mapa = L.map('mapa').setView([3.43, -76.53], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(mapa);

            capaCuadrante = L.layerGroup().addTo(mapa);
            capaPois = L.layerGroup().addTo(mapa);
            capaRutas = L.layerGroup().addTo(mapa);

            cargarEstadisticas();
            dibujarCuadrante();
        });

        async function cargarEstadisticas() {
            try {
                const res = await fetch('/api/admin/estadisticas-grafo');
                const data = await res.json();
                if (data.ok) {
                    const s = data.stats;
                    const fuentes = Object.entries(s.por_fuente || {}).map(([k,v]) => `${k}: ${v}`).join(' | ');
                    document.getElementById('stats-header').innerHTML =
                        `Segmentos: <strong>${s.total.toLocaleString()}</strong> | ${fuentes} | Prom. transitado: ${s.promedio_transitado}`;
                }
            } catch(e) {
                document.getElementById('stats-header').textContent = 'Error cargando estadísticas';
            }
        }

        function getConfig() {
            return {
                nw_lat: parseFloat(document.getElementById('nw-lat').value),
                nw_lon: parseFloat(document.getElementById('nw-lon').value),
                se_lat: parseFloat(document.getElementById('se-lat').value),
                se_lon: parseFloat(document.getElementById('se-lon').value),
                por_borde: parseInt(document.getElementById('por-borde').value),
                delay: parseFloat(document.getElementById('delay').value)
            };
        }

        function dibujarCuadrante() {
            capaCuadrante.clearLayers();
            const c = getConfig();

            const bounds = [
                [c.nw_lat, c.nw_lon],
                [c.nw_lat, c.se_lon],
                [c.se_lat, c.se_lon],
                [c.se_lat, c.nw_lon]
            ];

            L.polygon(bounds, {
                color: '#14b8a6',
                weight: 2,
                fillOpacity: 0.05,
                dashArray: '8, 4'
            }).addTo(capaCuadrante);

            mapa.fitBounds(bounds, { padding: [20, 20] });
        }

        async function cargarPoisPerimetrales() {
            const c = getConfig();
            capaPois.clearLayers();
            capaRutas.clearLayers();

            log('Buscando POIs perimetrales...', 'info');

            try {
                const res = await fetch(`/api/admin/pois-perimetrales?nw_lat=${c.nw_lat}&nw_lon=${c.nw_lon}&se_lat=${c.se_lat}&se_lon=${c.se_lon}&por_borde=${c.por_borde}`);
                const data = await res.json();

                if (!data.ok) {
                    log(`Error: ${data.error}`, 'error');
                    return;
                }

                poisCargados = data.pois;
                const colores = { norte: '#ef4444', sur: '#3b82f6', este: '#f59e0b', oeste: '#22c55e' };

                let totalPois = 0;
                for (const [borde, pois] of Object.entries(poisCargados)) {
                    pois.forEach(poi => {
                        const marker = L.circleMarker([parseFloat(poi.lat), parseFloat(poi.lon)], {
                            radius: 8,
                            color: colores[borde],
                            fillColor: colores[borde],
                            fillOpacity: 0.8
                        }).addTo(capaPois);
                        marker.bindPopup(`<strong>${poi.nombre}</strong><br>${borde.toUpperCase()}<br>${poi.categoria || ''}`);
                        totalPois++;
                    });
                }

                // Generar viajes (barrido)
                generarViajes();

                const totalV = viajesGenerados.length;
                document.getElementById('resumen-pois').innerHTML =
                    `<strong>${totalPois}</strong> POIs encontrados | <strong>${totalV}</strong> viajes a simular | ` +
                    `Tiempo estimado: ~${Math.ceil(totalV * c.delay / 60)} min`;

                document.getElementById('btn-iniciar').disabled = false;

                log(`${totalPois} POIs cargados: N=${poisCargados.norte.length} S=${poisCargados.sur.length} E=${poisCargados.este.length} O=${poisCargados.oeste.length}`, 'ok');
                log(`${totalV} viajes de barrido generados`, 'ok');

                // Previsualizar rutas como líneas rectas
                viajesGenerados.forEach(v => {
                    L.polyline([[v.origen_lat, v.origen_lon], [v.destino_lat, v.destino_lon]], {
                        color: '#ffffff',
                        weight: 1,
                        opacity: 0.15
                    }).addTo(capaRutas);
                });

            } catch(e) {
                log(`Error: ${e.message}`, 'error');
            }
        }

        function generarViajes() {
            viajesGenerados = [];
            if (!poisCargados) return;

            const opuestos = [
                ['norte', 'sur'],
                ['este', 'oeste'],
                ['norte', 'este'],
                ['norte', 'oeste'],
                ['sur', 'este'],
                ['sur', 'oeste']
            ];

            opuestos.forEach(([bordeA, bordeB]) => {
                const poisA = poisCargados[bordeA] || [];
                const poisB = poisCargados[bordeB] || [];

                poisA.forEach(poiA => {
                    poisB.forEach(poiB => {
                        // Ida
                        viajesGenerados.push({
                            origen_lat: parseFloat(poiA.lat),
                            origen_lon: parseFloat(poiA.lon),
                            destino_lat: parseFloat(poiB.lat),
                            destino_lon: parseFloat(poiB.lon),
                            origen_nombre: poiA.nombre,
                            destino_nombre: poiB.nombre
                        });
                        // Vuelta (ruta puede ser diferente)
                        viajesGenerados.push({
                            origen_lat: parseFloat(poiB.lat),
                            origen_lon: parseFloat(poiB.lon),
                            destino_lat: parseFloat(poiA.lat),
                            destino_lon: parseFloat(poiA.lon),
                            origen_nombre: poiB.nombre,
                            destino_nombre: poiA.nombre
                        });
                    });
                });
            });
        }

        async function iniciarPoblacion() {
            if (ejecutando) return;
            ejecutando = true;
            detenido = false;

            totalViajes = 0;
            totalNuevos = 0;
            totalActualizados = 0;

            const c = getConfig();
            const total = viajesGenerados.length;

            document.getElementById('btn-iniciar').style.display = 'none';
            document.getElementById('btn-detener').style.display = 'block';
            document.getElementById('barra-container').style.display = 'block';

            log(`Iniciando población: ${total} viajes, delay ${c.delay}s`, 'info');
            const inicio = Date.now();

            for (let i = 0; i < total; i++) {
                if (detenido) {
                    log('Detenido por el usuario', 'error');
                    break;
                }

                const viaje = viajesGenerados[i];
                const progreso = Math.round(((i + 1) / total) * 100);

                document.getElementById('barra-progreso').style.width = `${progreso}%`;
                document.getElementById('progreso-texto').textContent =
                    `Viaje ${i + 1} de ${total} (${progreso}%)`;

                try {
                    const res = await fetch('/api/admin/simular-viaje', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(viaje)
                    });
                    const data = await res.json();

                    if (data.ok) {
                        totalViajes++;
                        totalNuevos += data.segmentos_nuevos;
                        totalActualizados += data.segmentos_actualizados;

                        actualizarContadores();

                        if (data.segmentos_nuevos > 0) {
                            log(`${i+1}/${total} ${viaje.origen_nombre} → ${viaje.destino_nombre} | ${data.distancia_km}km | +${data.segmentos_nuevos} nuevos, ${data.segmentos_actualizados} act.`, 'ok');
                        }
                    } else {
                        log(`${i+1}/${total} Error: ${data.error}`, 'error');
                    }
                } catch(e) {
                    log(`${i+1}/${total} Error de red: ${e.message}`, 'error');
                }

                // Delay entre requests
                if (i < total - 1 && !detenido) {
                    await new Promise(r => setTimeout(r, c.delay * 1000));
                }
            }

            const duracion = Math.round((Date.now() - inicio) / 1000);
            log(`Completado en ${duracion}s | Viajes: ${totalViajes} | Nuevos: ${totalNuevos} | Actualizados: ${totalActualizados}`, 'info');

            ejecutando = false;
            document.getElementById('btn-iniciar').style.display = 'block';
            document.getElementById('btn-detener').style.display = 'none';

            cargarEstadisticas();
        }

        function detenerPoblacion() {
            detenido = true;
        }

        function actualizarContadores() {
            document.getElementById('cont-viajes').textContent = totalViajes;
            document.getElementById('cont-nuevos').textContent = totalNuevos.toLocaleString();
            document.getElementById('cont-actualizados').textContent = totalActualizados.toLocaleString();
        }

        function log(mensaje, tipo = 'info') {
            const logEl = document.getElementById('log');
            const clase = tipo === 'ok' ? 'log-ok' : tipo === 'error' ? 'log-error' : 'log-info';
            const hora = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div class="log-entry ${clase}">[${hora}] ${mensaje}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function limpiarLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
