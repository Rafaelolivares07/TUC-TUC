<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domótica — TUC TUC</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           padding:10px 22px; border-radius:10px; color:#fff; font-size:14px;
           z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .toast-ok  { background:#059669; }
  .toast-err { background:#dc2626; }
  .masked { font-family: monospace; letter-spacing:2px; color:#6b7280; }
  .field-sensible input[type=text] { font-family:monospace; font-size:13px; }
  .bat-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
              border-radius:20px; font-size:12px; font-weight:700; }
  .bat-alto  { background:#dcfce7; color:#166534; }
  .bat-medio { background:#fef9c3; color:#854d0e; }
  .bat-bajo  { background:#fee2e2; color:#991b1b; }
  .toggle-btn { position:relative; display:inline-flex; width:44px; height:24px;
                background:#d1d5db; border-radius:12px; cursor:pointer; transition:background .2s; }
  .toggle-btn.on { background:#059669; }
  .toggle-btn::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px;
                       background:white; border-radius:50%; transition:left .2s; }
  .toggle-btn.on::after { left:23px; }
  .card { background:white; border-radius:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .sub-card { background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .bat-bar-wrap { background:#e5e7eb; border-radius:99px; height:10px; overflow:hidden; }
  .bat-bar { height:10px; border-radius:99px; width:0%; transition:width 1.2s cubic-bezier(.4,0,.2,1); }
  .bat-bar.alto  { background:linear-gradient(90deg,#34d399,#059669); }
  .bat-bar.medio { background:linear-gradient(90deg,#fbbf24,#d97706); }
  .bat-bar.bajo  { background:linear-gradient(90deg,#f87171,#dc2626); }
  .log-row { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:start; padding:6px 0; border-bottom:1px solid #f1f5f9; }
  .log-row:last-child { border-bottom:none; }
  .log-fuente-laptop    { background:#dbeafe; color:#1d4ed8; }
  .log-fuente-scheduler { background:#f3e8ff; color:#7c3aed; }
  .log-fuente-manual    { background:#fef3c7; color:#92400e; }
  .log-accion-encendido { color:#059669; font-weight:700; }
  .log-accion-apagado   { color:#6b7280; }
</style>
</head>
<body class="min-h-screen">
<div id="toast" class="toast"></div>

<!-- HEADER -->
<div class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="/admin" class="text-gray-400 hover:text-gray-600">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-extrabold text-gray-800 text-lg leading-tight">Domótica</h1>
      <p class="text-xs text-gray-400">Dispositivos inteligentes TUC TUC</p>
    </div>
  </div>
</div>

<div class="max-w-4xl mx-auto px-4 py-6 space-y-6">

  <!-- SELECTOR PROPIEDAD -->
  <div class="card p-4">
    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide block mb-2">Propiedad</label>
    <div class="flex gap-3 items-center">
      <select id="sel-propiedad" onchange="cargarDispositivos()"
              class="flex-1 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="">Seleccionar propiedad...</option>
      </select>
      <button onclick="abrirModalDispositivo()"
              class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Nuevo dispositivo
      </button>
    </div>
  </div>

  <!-- LISTA DISPOSITIVOS -->
  <div id="lista-dispositivos" class="space-y-4"></div>

</div>


<!-- ═══════ MODAL: NUEVO / EDITAR DISPOSITIVO ═══════ -->
<div id="modal-dispositivo" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-6 space-y-4">
    <h2 id="modal-disp-titulo" class="font-bold text-gray-800 text-lg">Nuevo dispositivo</h2>
    <input type="hidden" id="disp-edit-id">
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Nombre *</label>
      <input id="disp-nombre" type="text" placeholder="Laptop Rafael"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Tipo *</label>
      <select id="disp-tipo" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="laptop">Laptop / Computador</option>
        <option value="nevera">Nevera</option>
        <option value="televisor">Televisor</option>
        <option value="abanico">Abanico / Ventilador</option>
        <option value="aire">Aire acondicionado</option>
        <option value="lavadora">Lavadora</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Descripción</label>
      <input id="disp-descripcion" type="text" placeholder="Descripción opcional"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">MAC Address <span class="font-normal text-gray-400">(opcional, referencia)</span></label>
      <input id="disp-mac" type="text" placeholder="AA:BB:CC:DD:EE:FF"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="flex gap-3 pt-2">
      <button onclick="cerrarModal('modal-dispositivo')"
              class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium">Cancelar</button>
      <button onclick="guardarDispositivo()"
              class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 text-sm font-semibold transition">Guardar</button>
    </div>
  </div>
</div>


<!-- ═══════ MODAL: NUEVO / EDITAR SWITCH ═══════ -->
<div id="modal-switch" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-6 space-y-4">
    <h2 id="modal-sw-titulo" class="font-bold text-gray-800 text-lg">Nuevo switch</h2>
    <input type="hidden" id="sw-edit-id">
    <input type="hidden" id="sw-dispositivo-id">
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Nombre *</label>
      <input id="sw-nombre" type="text" placeholder="Enchufe cargador"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="field-sensible">
      <label class="text-xs font-semibold text-gray-500 block mb-1">
        Tuya Device ID <span class="font-normal text-gray-400 text-xs">(sensible)</span>
      </label>
      <input id="sw-tuya-id" type="text" placeholder="ebe4f458f0427bc8a08lgy"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="flex gap-3 pt-2">
      <button onclick="cerrarModal('modal-switch')"
              class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium">Cancelar</button>
      <button onclick="guardarSwitch()"
              class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 text-sm font-semibold transition">Guardar</button>
    </div>
  </div>
</div>


<!-- ═══════ MODAL: NUEVA / EDITAR AUTOMATIZACIÓN ═══════ -->
<div id="modal-auto" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-6 space-y-4">
    <h2 id="modal-auto-titulo" class="font-bold text-gray-800 text-lg">Nueva automatización</h2>
    <input type="hidden" id="auto-edit-id">
    <input type="hidden" id="auto-switch-id">
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Descripción</label>
      <input id="auto-descripcion" type="text" placeholder="Carga solar pico"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Hora inicio (0-23)</label>
        <input id="auto-hora-ini" type="number" min="0" max="23" value="9"
               class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Hora fin (0-23)</label>
        <input id="auto-hora-fin" type="number" min="0" max="23" value="16"
               class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">% mínimo en PICO</label>
        <input id="auto-bat-pico" type="number" min="1" max="99" value="90"
               class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">% mínimo FUERA PICO</label>
        <input id="auto-bat-fuera" type="number" min="1" max="99" value="40"
               class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">% objetivo de carga</label>
      <input id="auto-bat-objetivo" type="number" min="50" max="100" value="100"
             class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="flex gap-3 pt-2">
      <button onclick="cerrarModal('modal-auto')"
              class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium">Cancelar</button>
      <button onclick="guardarAutomatizacion()"
              class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 text-sm font-semibold transition">Guardar</button>
    </div>
  </div>
</div>


<script>
const BASE = '';

function toast(msg, tipo='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo === 'ok' ? 'toast-ok' : 'toast-err');
  setTimeout(() => t.className = 'toast', 3000);
}

function cerrarModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function copiar(texto) {
  navigator.clipboard.writeText(texto).then(() => toast('Copiado'));
}

function batClass(pct) {
  if (pct === null || pct === undefined) return '';
  if (pct >= 80) return 'bat-alto';
  if (pct >= 40) return 'bat-medio';
  return 'bat-bajo';
}

function iconoTipo(tipo) {
  const m = {laptop:'💻', nevera:'🧊', televisor:'📺', abanico:'🌀', aire:'❄️', lavadora:'🫧', otro:'🔌'};
  return m[tipo] || '🔌';
}

// ─── CARGAR PROPIEDADES ───
async function cargarPropiedades() {
  try {
    const r = await fetch('/api/domotica/propiedades');
    const d = await r.json();
    if (!d.ok) { toast(d.error, 'err'); return; }
    const sel = document.getElementById('sel-propiedad');
    sel.innerHTML = '<option value="">Seleccionar propiedad...</option>';
    d.propiedades.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.titulo + (p.ciudad ? ` — ${p.ciudad}` : '');
      sel.appendChild(opt);
    });
  } catch(e) { toast('Error cargando propiedades', 'err'); }
}

// ─── CARGAR DISPOSITIVOS ───
async function cargarDispositivos() {
  const pid = document.getElementById('sel-propiedad').value;
  const cont = document.getElementById('lista-dispositivos');
  if (!pid) { cont.innerHTML = ''; return; }
  cont.innerHTML = '<div class="text-center py-8 text-gray-400">Cargando...</div>';
  try {
    const r = await fetch(`/api/domotica/propiedad/${pid}/dispositivos`);
    const d = await r.json();
    if (!d.ok) { toast(d.error, 'err'); return; }
    if (!d.dispositivos.length) {
      cont.innerHTML = '<div class="text-center py-10 text-gray-400"><div class="text-4xl mb-2">📦</div><p>Sin dispositivos. Agrega uno.</p></div>';
      return;
    }
    cont.innerHTML = d.dispositivos.map(dev => renderDispositivo(dev)).join('');
    animarBarras();
  } catch(e) { toast('Error cargando dispositivos', 'err'); }
}

function barClass(pct) {
  if (pct >= 80) return 'alto';
  if (pct >= 40) return 'medio';
  return 'bajo';
}

function renderDispositivo(dev) {
  const bat = dev.ultimo_bat_pct;
  const esLaptop = (dev.tipo === 'laptop' || dev.tipo === 'computador');
  const batHtml = esLaptop && bat !== null
    ? `<span class="bat-pill ${batClass(bat)}">🔋 ${bat}%${dev.bat_cargando ? ' ⚡' : ''}</span>`
    : '';
  const batBarHtml = esLaptop && bat !== null ? `
    <div class="mt-3">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>Carga de batería</span>
        <span class="font-semibold">${bat}%${dev.bat_cargando ? ' ⚡ cargando' : ''}</span>
      </div>
      <div class="bat-bar-wrap">
        <div class="bat-bar ${barClass(bat)}" data-target="${bat}" id="bat-bar-${dev.id}"></div>
      </div>
    </div>` : '';
  const lecturaHtml = dev.ultima_lectura
    ? `<span class="text-xs text-gray-400">última lectura: ${new Date(dev.ultima_lectura).toLocaleString('es-CO')}</span>`
    : '<span class="text-xs text-gray-400">sin lecturas aún</span>';

  const tokenHtml = `
    <div class="flex items-center gap-2 mt-2">
      <span class="text-xs text-gray-500 font-medium">Device Token:</span>
      <span class="masked text-xs">●●●●●●●●●●●●</span>
      <button onclick="copiarToken(${dev.id})" data-token="${dev.device_token}"
              class="text-xs text-indigo-600 hover:underline">📋 Copiar</button>
      <button onclick="regenerarToken(${dev.id})"
              class="text-xs text-orange-500 hover:underline">↻ Regenerar</button>
    </div>`;

  const macHtml = dev.mac_address
    ? `<span class="text-xs text-gray-400 font-mono">MAC: ${dev.mac_address}</span>`
    : '';

  const switchesHtml = dev.switches.length
    ? dev.switches.map(sw => renderSwitch(sw)).join('')
    : '<p class="text-xs text-gray-400 py-2">Sin switches. Agrega uno.</p>';

  return `
  <div class="card p-5" id="dev-${dev.id}">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-2xl">${iconoTipo(dev.tipo)}</span>
        <div>
          <span class="font-bold text-gray-800">${dev.nombre}</span>
          <span class="text-xs text-gray-400 ml-1">${dev.tipo}</span>
          ${dev.activo ? '' : '<span class="text-xs bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded-full ml-1">Inactivo</span>'}
        </div>
        ${batHtml}
      </div>
      <button onclick="abrirModalEditarDispositivo(${JSON.stringify(dev).replace(/"/g,'&quot;')})"
              class="text-xs text-gray-400 hover:text-indigo-600 shrink-0">✏️ Editar</button>
    </div>
    <div class="flex flex-wrap items-center gap-3 mb-3">
      ${lecturaHtml}
      ${macHtml}
    </div>
    ${tokenHtml}
    ${batBarHtml}
    ${(dev.tipo === 'laptop' || dev.tipo === 'computador') ? `
    <div class="mt-3 flex items-center gap-2">
      <button onclick="descargarScript(${dev.id})"
              class="inline-flex items-center gap-1.5 bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-2 rounded-xl transition">
        📥 Instalar monitoreo en esta PC
      </button>
      <span class="text-xs text-gray-400">Doble clic en el .bat descargado — listo</span>
    </div>` : ''}

    <!-- SWITCHES -->
    <div class="mt-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Switches</span>
        <button onclick="abrirModalSwitch(${dev.id})"
                class="text-xs text-indigo-600 hover:underline font-semibold">+ Nuevo switch</button>
      </div>
      <div class="space-y-3" id="switches-${dev.id}">
        ${switchesHtml}
      </div>
    </div>

    <!-- ACTIVIDAD -->
    <details class="mt-4" onToggle="if(this.open) cargarLogs(${dev.id})">
      <summary class="flex items-center justify-between select-none">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Actividad reciente</span>
        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </summary>
      <div id="logs-${dev.id}" class="mt-3 text-xs text-gray-400">Abrí para cargar...</div>
    </details>
  </div>`;
}

function renderSwitch(sw) {
  const estadoClass = sw.estado_actual ? 'on' : '';
  const autoHtml = sw.automatizaciones.length
    ? sw.automatizaciones.map(a => renderAuto(a)).join('')
    : '<p class="text-xs text-gray-400">Sin reglas. Agrega una.</p>';

  const tuyaHtml = sw.tuya_device_id
    ? `<div class="flex items-center gap-2 mt-1">
         <span class="text-xs text-gray-500">Tuya ID:</span>
         <span class="masked text-xs">●●●●●●●●●●●●</span>
         <button onclick="copiar('${sw.tuya_device_id}')" class="text-xs text-indigo-600 hover:underline">📋 Copiar</button>
       </div>`
    : '<span class="text-xs text-orange-500">Sin Tuya Device ID</span>';

  return `
  <div class="sub-card p-4" id="sw-${sw.id}">
    <div class="flex items-center justify-between gap-3 mb-2">
      <div class="flex items-center gap-2">
        <span class="text-lg">⚡</span>
        <span class="font-semibold text-gray-700 text-sm">${sw.nombre}</span>
        ${sw.activo ? '' : '<span class="text-xs text-red-500">Inactivo</span>'}
      </div>
      <div class="flex items-center gap-3">
        <button onclick="abrirModalEditarSwitch(${JSON.stringify(sw).replace(/"/g,'&quot;')})"
                class="text-xs text-gray-400 hover:text-indigo-600">✏️</button>
        <div class="toggle-btn ${estadoClass}" onclick="toggleSwitch(${sw.id}, ${!sw.estado_actual})" title="${sw.estado_actual ? 'Apagar' : 'Encender'}"></div>
      </div>
    </div>
    ${tuyaHtml}
    <!-- AUTOMATIZACIONES -->
    <details class="mt-3">
      <summary class="flex items-center justify-between cursor-pointer">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Automatizaciones (${sw.automatizaciones.length})</span>
        <button onclick="event.preventDefault(); abrirModalAuto(${sw.id})"
                class="text-xs text-indigo-600 hover:underline font-semibold">+ Nueva regla</button>
      </summary>
      <div class="mt-2 space-y-2" id="autos-${sw.id}">
        ${autoHtml}
      </div>
    </details>
  </div>`;
}

function renderAuto(a) {
  const activaClass = a.activa ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500';
  return `
  <div class="bg-white border border-gray-200 rounded-xl p-3 flex items-start justify-between gap-2" id="auto-${a.id}">
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-gray-700">${a.descripcion || 'Sin descripción'}</p>
      <div class="flex flex-wrap gap-2 mt-1 text-xs text-gray-500">
        <span>🕐 ${a.hora_inicio}h–${a.hora_fin}h</span>
        <span>☀️ pico: <b>${a.bat_minimo_pico}%</b></span>
        <span>🌙 fuera: <b>${a.bat_minimo_fuera_pico}%</b></span>
        <span>🎯 objetivo: <b>${a.bat_objetivo}%</b></span>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-xs font-bold px-2 py-1 rounded-full ${activaClass}">${a.activa ? 'Activa' : 'Inactiva'}</span>
      <button onclick="abrirModalEditarAuto(${JSON.stringify(a).replace(/"/g,'&quot;')})"
              class="text-xs text-gray-400 hover:text-indigo-600">✏️</button>
      <button onclick="eliminarAuto(${a.id})"
              class="text-xs text-gray-400 hover:text-red-600">🗑️</button>
    </div>
  </div>`;
}

// ─── DISPOSITIVO ───
function abrirModalDispositivo() {
  const pid = document.getElementById('sel-propiedad').value;
  if (!pid) { toast('Selecciona una propiedad primero', 'err'); return; }
  document.getElementById('modal-disp-titulo').textContent = 'Nuevo dispositivo';
  document.getElementById('disp-edit-id').value = '';
  document.getElementById('disp-nombre').value = '';
  document.getElementById('disp-tipo').value = 'laptop';
  document.getElementById('disp-descripcion').value = '';
  document.getElementById('disp-mac').value = '';
  document.getElementById('modal-dispositivo').classList.remove('hidden');
}

function abrirModalEditarDispositivo(dev) {
  document.getElementById('modal-disp-titulo').textContent = 'Editar dispositivo';
  document.getElementById('disp-edit-id').value = dev.id;
  document.getElementById('disp-nombre').value = dev.nombre;
  document.getElementById('disp-tipo').value = dev.tipo;
  document.getElementById('disp-descripcion').value = dev.descripcion || '';
  document.getElementById('disp-mac').value = dev.mac_address || '';
  document.getElementById('modal-dispositivo').classList.remove('hidden');
}

async function guardarDispositivo() {
  const editId = document.getElementById('disp-edit-id').value;
  const pid = document.getElementById('sel-propiedad').value;
  const nombre = document.getElementById('disp-nombre').value.trim();
  const tipo = document.getElementById('disp-tipo').value;
  const descripcion = document.getElementById('disp-descripcion').value.trim();
  const mac_address = document.getElementById('disp-mac').value.trim();
  if (!nombre) { toast('El nombre es requerido', 'err'); return; }
  try {
    let url, body;
    if (editId) {
      url = `/api/domotica/dispositivo/${editId}/editar`;
      body = { nombre, tipo, descripcion, mac_address };
    } else {
      url = '/api/domotica/dispositivo/crear';
      body = { nombre, tipo, descripcion, mac_address, id_propiedad: parseInt(pid) };
    }
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (d.ok) {
      toast(editId ? 'Dispositivo actualizado' : 'Dispositivo creado');
      cerrarModal('modal-dispositivo');
      await cargarDispositivos();
    } else { toast(d.error || 'Error', 'err'); }
  } catch(e) { toast('Error de conexión', 'err'); }
}

function copiarToken(devId) {
  const btn = document.querySelector(`[onclick="copiarToken(${devId})"]`);
  const token = btn.dataset.token;
  copiar(token);
}

async function regenerarToken(devId) {
  if (!confirm('¿Regenerar token? El script local dejará de funcionar hasta que lo actualices.')) return;
  try {
    const r = await fetch(`/api/domotica/dispositivo/${devId}/token/regenerar`, { method:'POST' });
    const d = await r.json();
    if (d.ok) {
      toast('Token regenerado');
      const btn = document.querySelector(`[onclick="copiarToken(${devId})"]`);
      if (btn) { btn.dataset.token = d.device_token; }
      await cargarDispositivos();
    } else { toast(d.error || 'Error', 'err'); }
  } catch(e) { toast('Error de conexión', 'err'); }
}

// ─── ANIMAR BARRAS DE BATERÍA ───
function animarBarras() {
  document.querySelectorAll('.bat-bar[data-target]').forEach(bar => {
    const target = parseInt(bar.dataset.target);
    requestAnimationFrame(() => {
      setTimeout(() => { bar.style.width = target + '%'; }, 80);
    });
  });
}

// ─── LOGS DE ACTIVIDAD ───
async function cargarLogs(devId) {
  const cont = document.getElementById(`logs-${devId}`);
  if (!cont) return;
  cont.innerHTML = '<span class="text-gray-300">Cargando...</span>';
  try {
    const r = await fetch(`/api/domotica/dispositivo/${devId}/logs`);
    const d = await r.json();
    if (!d.ok) { cont.innerHTML = `<span class="text-red-400">${d.error}</span>`; return; }
    if (!d.logs.length) {
      cont.innerHTML = '<span class="text-gray-400">Sin actividad registrada aún.</span>';
      return;
    }
    cont.innerHTML = d.logs.map(l => {
      const fuente = l.fuente || 'laptop';
      const hora = l.created_at ? new Date(l.created_at).toLocaleString('es-CO', {dateStyle:'short', timeStyle:'short'}) : '';
      const batTag = l.bat_pct !== null && l.bat_pct !== undefined ? `<span class="text-gray-400">${l.bat_pct}%</span>` : '';
      const switchTag = l.switch_nombre ? `<span class="font-semibold text-gray-600">${l.switch_nombre}</span> ` : '';
      return `<div class="log-row">
        <span class="text-xs font-bold px-2 py-0.5 rounded-full log-fuente-${fuente}">${fuente}</span>
        <div>
          ${switchTag}<span class="log-accion-${l.accion}">${l.accion}</span>
          ${batTag}
          <p class="text-gray-400 mt-0.5">${l.razon || ''}</p>
        </div>
        <span class="text-gray-400 whitespace-nowrap">${hora}</span>
      </div>`;
    }).join('');
  } catch(e) { cont.innerHTML = '<span class="text-red-400">Error cargando logs</span>'; }
}

// ─── INIT ───
cargarPropiedades();
// Auto-refresh del estado de batería cada 30 segundos
setInterval(async () => {
  const pid = document.getElementById('sel-propiedad').value;
  if (!pid) return;
  await cargarDispositivos();
  animarBarras();
  // Refrescar logs de paneles abiertos
  document.querySelectorAll('details[open]').forEach(det => {
    const logsDiv = det.querySelector('[id^="logs-"]');
    if (logsDiv) {
      const devId = logsDiv.id.replace('logs-', '');
      cargarLogs(parseInt(devId));
    }
  });
}, 30000);

// Animar barras tras carga inicial
document.addEventListener('DOMContentLoaded', () => setTimeout(animarBarras, 200));
</script>
