<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Infrastructure Monitor</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #dfe4ea;
      --text: #17202a;
      --muted: #667085;
      --green: #147d64;
      --green-soft: #e8f5f1;
      --amber: #a15c00;
      --amber-soft: #fff4df;
      --red: #b42318;
      --red-soft: #ffebe9;
      --blue: #175cd3;
      --blue-soft: #eaf1ff;
      --ink: #263238;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    .shell { max-width: 1440px; margin: 0 auto; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .trm-container { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .trm-input-wrap { display: flex; align-items: center; gap: 6px; }
    .rate-label { font-size: 11px; font-weight: 700; color: var(--muted); }
    .trm-input-wrap input { width: 96px; height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font-size: 13px; font-weight: 700; background: var(--surface); color: var(--text); text-align: right; }
    .trm-input-wrap input:focus { border-color: var(--blue); outline: none; }
    .btn-trm-sync { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
    .btn-trm-sync:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
    .trm-meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; }
    .trm-link { color: var(--blue); text-decoration: none; font-weight: 600; }
    .trm-link:hover { text-decoration: underline; }
    .trm-status-text { color: var(--muted); font-size: 10px; }
    .sep { color: var(--line); }

    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .banner { display: none; padding: 12px 14px; margin-bottom: 14px; border-radius: 6px; font-size: 13px; border: 1px solid; }
    .banner.show { display: block; }
    .banner.warning { color: var(--amber); background: var(--amber-soft); border-color: #f4c36a; }
    .banner.error { color: var(--red); background: var(--red-soft); border-color: #f2a9a2; }
    .banner.info { color: var(--blue); background: var(--blue-soft); border-color: #adc6f3; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 15px; min-height: 118px; }
    .metric-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .metric-value { font-size: 25px; font-weight: 750; margin: 11px 0 5px; }
    .metric-note { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .money-cop { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 3px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, .8fr); gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 16px; margin-bottom: 16px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .tag.essential, .tag.healthy, .tag.ok, .tag.in_use, .tag.active { background: var(--green-soft); color: var(--green); }
    .tag.review, .tag.warning, .tag.cost { background: var(--amber-soft); color: var(--amber); }
    .tag.critical { background: var(--red-soft); color: var(--red); }
    .tag.unknown { background: #eef0f2; color: var(--muted); }
    .capacity-row { display: grid; grid-template-columns: 125px minmax(100px, 1fr) 115px; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid #edf0f2; }
    .capacity-row:last-child { border-bottom: 0; }
    .capacity-name { font-size: 13px; font-weight: 700; }
    .bar { height: 9px; border-radius: 4px; background: #e8ecef; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--green); }
    .bar > span.warning { background: #e49b26; }
    .bar > span.critical { background: var(--red); }
    .capacity-number { text-align: right; color: var(--muted); font-size: 12px; }
    .apps { width: 100%; border-collapse: collapse; }
    .apps th, .apps td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #edf0f2; font-size: 12px; }
    .apps th { color: var(--muted); font-weight: 700; }
    .apps td:last-child, .apps th:last-child { text-align: right; }
    
    .rec-item { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eef0f2; background: #fdfdfd; }
    .rec-item.active-opt { border-left: 4px solid var(--green); background: #fafdfc; }
    .rec-item.pending-opt { border-left: 4px solid var(--amber); background: #fffdf9; }
    .rec-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .rec-title { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
    .rec-item p { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; }

    .financial { display: grid; gap: 9px; }
    .financial-row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid #edf0f2; font-size: 12px; }
    .financial-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .financial-row > span { color: var(--muted); }
    .financial-row > strong { text-align: right; }
    details { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; margin-bottom: 10px; }
    summary { cursor: pointer; padding: 13px 15px; font-size: 13px; font-weight: 750; }
    .table-wrap { overflow-x: auto; padding: 0 14px 14px; }
    table.inventory { width: 100%; border-collapse: collapse; min-width: 720px; }
    .inventory th, .inventory td { text-align: left; padding: 9px 7px; border-bottom: 1px solid #edf0f2; font-size: 12px; }
    .inventory th { color: var(--muted); }
    code { font-family: Consolas, monospace; font-size: 11px; }
    .footer { color: var(--muted); text-align: center; font-size: 11px; padding: 6px 0 20px; }
    .loading { min-height: 70vh; display: grid; place-items: center; color: var(--muted); }
    .btn-action { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; text-decoration: none; }
    .btn-action:hover { border-color: var(--blue); color: var(--blue); }
    .btn-action:disabled { opacity: .5; cursor: wait; }
    .btn-action svg { width: 15px; height: 15px; }

    .diff-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .diff-badge.down { background: var(--green-soft); color: var(--green); }
    .diff-badge.up { background: var(--red-soft); color: var(--red); }
    .diff-badge.neutral { background: #eef0f2; color: var(--muted); }

    .storage-multi-bar { display: flex; height: 16px; border-radius: 6px; overflow: hidden; background: #e8ecef; margin: 10px 0 14px; }
    .storage-multi-bar > div { height: 100%; transition: width .3s ease; }
    .seg-tuctuc { background: #175cd3; }
    .seg-snap { background: #7c3aed; }
    .seg-logs { background: #ea580c; }
    .seg-postgres { background: #0284c7; }
    .seg-lopez { background: #0891b2; }
    .seg-cache { background: #d97706; }
    .seg-other { background: #64748b; }
    .seg-free { background: #147d64; }

    .storage-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 11px; margin-bottom: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-color { width: 10px; height: 10px; border-radius: 2px; }

    .opportunity-card { background: #fbfcfe; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .opportunity-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12px; font-weight: 700; }
    .opportunity-card p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .opportunity-action { margin-top: 6px; padding: 4px 8px; background: var(--green-soft); color: var(--green); border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }

    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #edf0f2; font-size: 12px; }
    .history-table th { color: var(--muted); font-weight: 700; }
    .history-table td:last-child, .history-table th:last-child { text-align: right; }
    .history-table tr.current-month { background: #f8fafc; font-weight: 600; }

    @media (max-width: 950px) { .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); } .layout { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .shell { padding: 13px; } header { align-items: flex-start; } .header-actions { flex-direction: column-reverse; align-items: flex-end; } .metrics { grid-template-columns: 1fr; } .capacity-row { grid-template-columns: 95px 1fr; } .capacity-number { grid-column: 2; text-align: left; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>AWS Infrastructure Monitor</h1>
        <p class="subtitle">Auditoría en vivo de costos, capacidad y optimizaciones activas</p>
      </div>
      <div class="header-actions">
        <div class="trm-container">
          <div class="trm-input-wrap">
            <label for="exchange-rate" class="rate-label">USD/COP</label>
            <input id="exchange-rate" type="number" min="1" step="1" title="Editar valor de TRM para recalcular en COP" oninput="updateExchangeRate(this.value)" onchange="updateExchangeRate(this.value)">
            <button type="button" class="btn-trm-sync" onclick="fetchLiveTRM()" title="Consultar tasa de cambio en vivo"><i data-lucide="refresh-cw" width="13"></i></button>
          </div>
          <div class="trm-meta">
            <span id="trm-status" class="trm-status-text">Cargando TRM...</span>
            <span class="sep">|</span>
            <a href="https://www.google.com/finance/quote/USD-COP" target="_blank" rel="noopener noreferrer" class="trm-link" title="Ver cotización de USD/COP en Google Finance">Google Finance ↗</a>
            <span class="sep">·</span>
            <a href="https://www.banrep.gov.co/es/estadisticas/trm" target="_blank" rel="noopener noreferrer" class="trm-link" title="Ver TRM oficial certificada Banco de la República">BanRep ↗</a>
          </div>
        </div>
        <button id="refresh" class="btn-action" onclick="loadAudit(true, false)" title="Actualizar telemetría de servidor y disco en vivo"><i data-lucide="refresh-cw"></i> Refrescar Servidor</button>
        <button id="refresh-costs" class="btn-action" onclick="loadAudit(true, true)" title="Sincronizar historial con AWS Cost Explorer"><i data-lucide="dollar-sign"></i> Sincronizar Costos</button>
      </div>
    </header>

    <div id="root-warning" class="banner warning"></div>
    <div id="errors" class="banner error"></div>
    <div id="cache-note" class="banner info"></div>

    <main id="content" class="loading">Consultando AWS de forma segura...</main>
    <div id="footer" class="footer"></div>
  </div>

  <script>
    let currentAuditData = null;
    let exchangeRate = Number(localStorage.getItem('aws-monitor-exchange-rate') || 4000);

    const money = value => {
      const usd = Number(value || 0);
      const cop = Math.round(usd * exchangeRate).toLocaleString('es-CO');
      return `$${usd.toFixed(2)} USD<span class="money-cop">~$${cop} COP</span>`;
    };

    function updateExchangeRate(value, fromApi=false) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed) || parsed <= 0) return;
      exchangeRate = parsed;
      const input = document.getElementById('exchange-rate');
      if (input && Number(input.value) !== parsed) input.value = parsed;
      if (!fromApi) {
        localStorage.setItem('aws-monitor-exchange-rate', String(parsed));
        const status = document.getElementById('trm-status');
        if (status) status.textContent = `TRM manual: $${parsed.toLocaleString('es-CO')}`;
      }
      if (currentAuditData) render(currentAuditData);
    }

    async function fetchLiveTRM() {
      const status = document.getElementById('trm-status');
      if (status) status.textContent = 'Consultando TRM...';
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
          const json = await res.json();
          const rate = json.rates && json.rates.COP;
          if (rate && rate > 1000) {
            updateExchangeRate(Math.round(rate), true);
            if (status) status.textContent = `TRM en vivo: $${Math.round(rate).toLocaleString('es-CO')}`;
            return;
          }
        }
      } catch (err) {
        console.warn('API primaria de TRM no disponible, probando alternativa...', err);
      }
      try {
        const res2 = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
        if (res2.ok) {
          const json2 = await res2.json();
          const rate = json2.usd && json2.usd.cop;
          if (rate && rate > 1000) {
            updateExchangeRate(Math.round(rate), true);
            if (status) status.textContent = `TRM en vivo: $${Math.round(rate).toLocaleString('es-CO')}`;
            return;
          }
        }
      } catch (err2) {
        console.error('Error obteniendo TRM en vivo:', err2);
        if (status) status.textContent = `TRM actual: $${exchangeRate.toLocaleString('es-CO')}`;
      }
    }

    const bytes = value => {
      if (value === null || value === undefined) return 'Compartido';
      const units = ['B','KB','MB','GB','TB'];
      let n = Number(value || 0), i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i < 2 ? 0 : 1)} ${units[i]}`;
    };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct = value => Math.max(0, Math.min(100, Number(value || 0)));
    const usedPct = available => Math.max(0, 100 - Number(available || 0));
    const barClass = available => Number(available) < 20 ? 'critical' : Number(available) < 35 ? 'warning' : '';
    const tag = (level, label) => `<span class="tag ${esc(level || 'unknown')}">${esc(label || 'Sin clasificar')}</span>`;

    function diffBadge(pct) {
      if (pct === null || pct === undefined) return '<span class="diff-badge neutral">Base</span>';
      if (pct < 0) return `<span class="diff-badge down"><i data-lucide="trending-down" width="12"></i> ${pct}%</span>`;
      if (pct > 0) return `<span class="diff-badge up"><i data-lucide="trending-up" width="12"></i> +${pct}%</span>`;
      return '<span class="diff-badge neutral">0%</span>';
    }

    async function loadAudit(force=false, forceCosts=false) {
      const btnTele = document.getElementById('refresh');
      const btnCost = document.getElementById('refresh-costs');
      if (btnTele) btnTele.disabled = true;
      if (btnCost) btnCost.disabled = true;
      try {
        let url = '/api/audit';
        const params = [];
        if (force) params.push('refresh=1');
        if (forceCosts) params.push('refresh_costs=1');
        if (params.length) url += '?' + params.join('&');
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        render(data);
      } catch (error) {
        document.getElementById('content').className = 'panel';
        document.getElementById('content').innerHTML = `<h2>No se pudo completar la auditoría</h2><p class="subtitle">${esc(error.message)}</p>`;
      } finally {
        if (btnTele) btnTele.disabled = false;
        if (btnCost) btnCost.disabled = false;
        lucide.createIcons();
      }
    }

    function render(data) {
      currentAuditData = data;
      document.getElementById('exchange-rate').value = exchangeRate;
      const root = document.getElementById('root-warning');
      root.className = 'banner' + (data.identity?.root_warning ? ' warning show' : '');
      root.textContent = data.identity?.root_warning
        ? 'Seguridad: AWS CLI está autenticado con perfil raíz. Se recomienda perfil IAM de solo lectura para producción.'
        : '';
      const errors = document.getElementById('errors');
      errors.className = 'banner' + (data.errors?.length ? ' error show' : '');
      errors.textContent = data.errors?.join(' | ') || '';
      const cacheNote = document.getElementById('cache-note');
      cacheNote.className = 'banner info show';
      cacheNote.textContent = data.costs_cached_at
        ? `Historial de costos en caché (${new Date(data.costs_cached_at).toLocaleString('es-CO')}). "Refrescar Servidor" actualiza telemetría en vivo gratis. "Sincronizar Costos" consulta Cost Explorer.`
        : 'La telemetría del servidor se actualiza en vivo sin costo adicional.';

      const current = Number(data.cost_current?.total || 0);
      const previous = Number(data.cost_previous?.total || 0);
      const peak = data.cost_peak || {};
      const proj = data.projections || {};
      const optProjected = proj.optimized_projected || (current * 1.5);
      const linearProjected = proj.linear_projected || (current * 2);
      const steadyState = proj.steady_state_monthly || 14.17;
      const savingsVsPrev = proj.monthly_savings_vs_previous || (previous - steadyState);

      const capacity = data.capacity || {};
      const cloud = data.cloudwatch || {};
      const status = data.capacity_status || {};
      const memAvailable = Number(capacity.memory_available_pct || 0);
      const diskAvailable = Number(capacity.disk_available_pct || 0);

      // Storage breakdown calculations
      const totalDisk = Number(capacity.disk_total || 8132173824);
      const freeDisk = Number(capacity.disk_available || 0);
      const tuctucDisk = Number(capacity.tuctuc_disk || 0);
      const snapDisk = Number(capacity.snap_disk || 0);
      const logsDisk = Number(capacity.logs_disk || 0);
      const postgresDisk = Number(capacity.postgres_disk || 0);
      const lopezDisk = Number(capacity.lopez_disk || 0);
      const cacheDisk = Number(capacity.cache_disk || 0);
      const remoteDisk = Number(capacity.remote_disk || 0);
      const identifiedUsed = tuctucDisk + snapDisk + logsDisk + postgresDisk + lopezDisk + cacheDisk + remoteDisk;
      const otherDisk = Math.max(0, (totalDisk - freeDisk) - identifiedUsed);

      const pTucTuc = (tuctucDisk * 100 / totalDisk).toFixed(1);
      const pSnap = (snapDisk * 100 / totalDisk).toFixed(1);
      const pLogs = (logsDisk * 100 / totalDisk).toFixed(1);
      const pPostgres = (postgresDisk * 100 / totalDisk).toFixed(1);
      const pLopez = (lopezDisk * 100 / totalDisk).toFixed(1);
      const pCache = (cacheDisk * 100 / totalDisk).toFixed(1);
      const pOther = (otherDisk * 100 / totalDisk).toFixed(1);
      const pFree = (freeDisk * 100 / totalDisk).toFixed(1);

      // Recommendations separation
      const allRecs = data.recommendations || [];
      const activeRecs = allRecs.filter(r => r.level === 'ok');
      const pendingRecs = allRecs.filter(r => r.level !== 'ok');

      document.getElementById('content').className = '';
      document.getElementById('content').innerHTML = `
        <section class="metrics">
          ${metric('receipt-text', `Mes en curso (${esc(data.cost_current?.short_label || 'Actual')})`, money(current), `<strong>Proyección con ahorro: ${money(optProjected)}</strong><span class="money-cop" style="font-size:10.5px">Sin ahorro: ${money(linearProjected)} · Mes completo: ${money(steadyState)}</span>`)}
          ${metric('calendar-range', `Último mes cerrado (${esc(data.cost_previous?.short_label || 'Anterior')})`, money(previous), `Tarifa anterior sin Savings Plan. Nuevo mes completo proyectado: <strong>${money(steadyState)}</strong>`)}
          ${metric('trending-down', `Ahorro mensual asegurado`, `<span style="color:var(--green)">-${money(savingsVsPrev)}/mes</span>`, `Ahorro anual asegurado: <strong style="color:var(--green)">-${money(savingsVsPrev * 12)}/año</strong>`)}
          ${metric('hard-drive', 'Margen de disco (8 GB gp3)', `${diskAvailable.toFixed(1)}% disponible`, `${bytes(freeDisk)} libres · ${tag(status.level, status.label)}`)}
        </section>

        <section class="layout">
          <div>
            <!-- Panel 1: Telemetría del Servidor en Vivo -->
            <div class="panel">
              <div class="panel-head"><h2>Capacidad del servidor actual (t3.small en us-east-2)</h2>${tag(status.level, status.label)}</div>
              ${capacityRow('CPU promedio', 100 - Number(cloud.cpu_average || 0), `${Number(cloud.cpu_average || 0).toFixed(1)}% usado · pico ${Number(cloud.cpu_peak || 0).toFixed(1)}%`)}
              ${capacityRow('Memoria RAM', memAvailable, `${bytes(capacity.mem_available)} libres de ${bytes(capacity.mem_total)}`)}
              ${capacityRow('Disco raíz gp3', diskAvailable, `${bytes(capacity.disk_available)} libres de ${bytes(capacity.disk_total)}`)}
              ${capacityRow('Red 7 días', 100, `${Number(cloud.network_in_gb || 0).toFixed(2)} GB entrada · ${Number(cloud.network_out_gb || 0).toFixed(2)} GB salida`)}
              <p class="metric-note" style="margin-top:12px">Telemetría en vivo vía AWS Systems Manager (SSM) sin costo de consulta.</p>
            </div>

            <!-- Panel 2: Auditoría Detallada de Almacenamiento -->
            <div class="panel">
              <div class="panel-head">
                <h2>Auditoría detallada de disco (8 GB EBS gp3)</h2>
                <span class="tag healthy">${diskAvailable.toFixed(1)}% libre · Margen Saludable</span>
              </div>
              <p class="metric-note">Distribución física del almacenamiento en el disco raíz del servidor:</p>
              
              <div class="storage-multi-bar" title="Distribución de disco">
                <div class="seg-tuctuc" style="width:${pTucTuc}%" title="TUC TUC: ${pTucTuc}% (${bytes(tuctucDisk)})"></div>
                <div class="seg-snap" style="width:${pSnap}%" title="Snap: ${pSnap}% (${bytes(snapDisk)})"></div>
                <div class="seg-logs" style="width:${pLogs}%" title="Logs: ${pLogs}% (${bytes(logsDisk)})"></div>
                <div class="seg-postgres" style="width:${pPostgres}%" title="PostgreSQL: ${pPostgres}% (${bytes(postgresDisk)})"></div>
                <div class="seg-lopez" style="width:${pLopez}%" title="López: ${pLopez}% (${bytes(lopezDisk)})"></div>
                <div class="seg-cache" style="width:${pCache}%" title="Caché: ${pCache}% (${bytes(cacheDisk)})"></div>
                <div class="seg-other" style="width:${pOther}%" title="SO/Otros: ${pOther}% (${bytes(otherDisk)})"></div>
                <div class="seg-free" style="width:${pFree}%" title="Libre: ${pFree}% (${bytes(freeDisk)})"></div>
              </div>

              <div class="storage-legend">
                <span class="legend-item"><span class="legend-color seg-tuctuc"></span> TUC TUC (${bytes(tuctucDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-snap"></span> Paquetes Snap (${bytes(snapDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-logs"></span> Logs del sistema (${bytes(logsDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-postgres"></span> PostgreSQL (${bytes(postgresDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-lopez"></span> López Ref. (${bytes(lopezDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-cache"></span> Caché APT (${bytes(cacheDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-other"></span> Sistema base (${bytes(otherDisk)})</span>
                <span class="legend-item"><span class="legend-color seg-free"></span> <strong>Libre (${bytes(freeDisk)})</strong></span>
              </div>

              <table class="apps">
                <thead><tr><th>Componente</th><th>Ruta en servidor</th><th>Tamaño</th><th>% Disco</th><th>Estado y Mantenimiento</th></tr></thead>
                <tbody>
                  <tr><td><strong>TUC TUC</strong></td><td><code>/home/ubuntu/tuctucv2</code></td><td>${bytes(tuctucDisk)}</td><td>${pTucTuc}%</td><td>${tag('essential','App activa')}</td></tr>
                  <tr><td><strong>Paquetes Snap</strong></td><td><code>/var/lib/snapd</code></td><td>${bytes(snapDisk)}</td><td>${pSnap}%</td><td>${tag('ok','Retención limitada a 2')}</td></tr>
                  <tr><td><strong>Logs del sistema</strong></td><td><code>/var/log</code></td><td>${bytes(logsDisk)}</td><td>${pLogs}%</td><td>${tag('ok','Journald topado a 50M')}</td></tr>
                  <tr><td><strong>PostgreSQL</strong></td><td><code>/var/lib/postgresql</code></td><td>${bytes(postgresDisk)}</td><td>${pPostgres}%</td><td>${tag('essential','Base de datos')}</td></tr>
                  <tr><td><strong>López Refrigeration</strong></td><td><code>/var/www/html</code></td><td>${bytes(lopezDisk)}</td><td>${pLopez}%</td><td>${tag('essential','Web')}</td></tr>
                  <tr><td><strong>Caché del sistema</strong></td><td><code>/var/cache</code></td><td>${bytes(cacheDisk)}</td><td>${pCache}%</td><td>${tag('ok','Cron diario de purga')}</td></tr>
                  <tr style="background:#f4fbf8"><td><strong>Espacio Disponible</strong></td><td><code>/dev/root</code></td><td><strong>${bytes(freeDisk)}</strong></td><td><strong>${pFree}%</strong></td><td>${tag('healthy','Margen saludable')}</td></tr>
                </tbody>
              </table>
              <p class="metric-note" style="margin-top:10px">Mantenimiento automático activo: cron diario en <code>/etc/cron.daily/tuctuc-disk-maintenance</code> previene acumulaciones de logs y paquetes.</p>
            </div>

            <!-- Panel 3: Consumo por Aplicación -->
            <div class="panel">
              <div class="panel-head"><h2>Consumo por aplicación en memoria y disco</h2><span class="metric-note">Procesos en vivo</span></div>
              <table class="apps">
                <thead><tr><th>Aplicación</th><th>Memoria RAM</th><th>Disco asignado</th><th>Protección</th></tr></thead>
                <tbody>${(capacity.applications || []).map(app => `<tr><td><strong>${esc(app.name)}</strong></td><td>${bytes(app.memory_bytes)}</td><td>${bytes(app.disk_bytes)}</td><td>${tag('essential','Esencial')}</td></tr>`).join('') || '<tr><td colspan="4">Sin telemetría interna</td></tr>'}</tbody>
              </table>
            </div>

            <!-- Panel 4: Historial de Costos Últimos 6 Meses -->
            <div class="panel">
              <div class="panel-head">
                <h2>Historial de costos AWS (Últimos 6 Meses)</h2>
                <span class="metric-note">Datos de AWS Cost Explorer</span>
              </div>
              <table class="history-table">
                <thead><tr><th>Mes / Periodo</th><th>Total Facturado</th><th>Variación</th><th>Servicios Principales</th><th>Estado</th></tr></thead>
                <tbody>
                  ${(data.cost_history || []).map(m => `
                    <tr class="${m.estimated ? 'current-month' : ''}">
                      <td><strong>${esc(m.label)}</strong></td>
                      <td>${money(m.total)}</td>
                      <td>${diffBadge(m.diff_pct)}</td>
                      <td><span class="metric-note">${(m.services || []).slice(0, 3).map(s => `${esc(s.service.replace('Amazon Elastic Compute Cloud - Compute','EC2 Cómputo').replace('Amazon Virtual Private Cloud','VPC / IP').replace('EC2 - Other','EBS'))}: $${s.cost}`).join(' · ')}</span></td>
                      <td>${m.estimated ? tag('review', 'En curso') : tag('ok', 'Cerrado')}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="5">Sin historial disponible</td></tr>'}
                </tbody>
              </table>
            </div>

            <!-- Panel 5: Inventario de Recursos -->
            ${inventory(data)}
          </div>

          <aside>
            <!-- Panel A: Desglose de Cobros y Qué Podemos Bajar -->
            <div class="panel">
              <h2>Desglose de factura y palancas de ahorro</h2>
              <p class="metric-note" style="margin-bottom:12px">Distribución del gasto y estado de las optimizaciones aprobadas:</p>
              
              ${(data.usage_breakdown || []).map(item => `
                <div class="opportunity-card">
                  <div class="opportunity-card-head">
                    <span>${esc(item.category)}</span>
                    <strong>${money(item.cost)} <span style="font-size:11px;color:var(--muted)">(${item.pct}%)</span></strong>
                  </div>
                  <p>${esc(item.detail)}</p>
                  <span class="opportunity-action"><i data-lucide="check" width="12"></i> ${esc(item.action)}</span>
                </div>
              `).join('')}

              <div style="background:#e8f5f1;border:1px solid #c2e7dc;border-radius:6px;padding:12px;margin-top:10px;">
                <div style="font-size:12px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px;">
                  <i data-lucide="check-circle-2" width="15"></i> Cambios aprobados 1 y 3 100% ACTIVOS
                </div>
                <div style="font-size:11.5px;color:var(--text);margin-top:4px">
                  • <strong>Savings Plan:</strong> Tarifa reducida a $0.013/h (~$9.67 USD/mes). Ahorro de <strong>-$5.81 USD/mes</strong>.<br>
                  • <strong>EBS gp3:</strong> Modernizado a 3,000 IOPS base, mayor velocidad y 20% menor tarifa.<br>
                  • <strong>Ahorro anual asegurado:</strong> <strong>-$71.64 USD/año</strong>.
                </div>
                <div style="font-size:11px;color:var(--amber);margin-top:7px;border-top:1px dashed #b9e3d6;padding-top:6px;">
                  ⏳ <strong>Opción 2 pendiente:</strong> Ahorro adicional de <strong>$3.72 USD/mes</strong> si se implementa Cloudflare Tunnel (eliminando IPv4 pública).
                </div>
              </div>
            </div>

            <!-- Panel B: Resumen Financiero Dinámico -->
            <div class="panel">
              <h2>Resumen financiero</h2>
              <div class="financial">
                ${financialRow(`Acumulado mes en curso (día ${proj.current_day || 9} de ${proj.days_in_month || 30})`, money(current))}
                ${financialRow('Proyección fin de mes (con Savings Plan y gp3)', `<strong style="color:var(--green)">${money(optProjected)}</strong>`)}
                ${financialRow('Proyección lineal sin optimizaciones', `<span style="text-decoration:line-through;color:var(--muted)">${money(linearProjected)}</span>`)}
                ${financialRow('Nuevo costo mensual completo (octubre en adelante)', `<strong style="color:var(--blue)">${money(steadyState)}/mes</strong>`)}
                ${financialRow('Último mes cerrado (Agosto)', money(previous))}
                ${financialRow(`Pico histórico (${esc(peak.short_label || 'Mayo 2026')})`, money(peak.total || 42.35))}
                ${financialRow('Ahorro mensual asegurado (vs Agosto)', `<strong style="color:var(--green)">-${money(savingsVsPrev)}/mes</strong>`)}
                ${financialRow('Ahorro anual asegurado', `<strong style="color:var(--green)">-${money(savingsVsPrev * 12)}/año</strong>`)}
                ${financialRow('Ahorro adicional pendiente (IPv4)', `<span style="color:var(--amber)">-$3.72 USD/mes (~$${Math.round(3.72 * exchangeRate).toLocaleString('es-CO')} COP)</span>`)}
              </div>
            </div>

            <!-- Panel C: Optimizaciones Activas vs Pendientes -->
            <div class="panel">
              <div class="panel-head"><h2>Optimizaciones implementadas y activas</h2><span class="tag ok">Ahorro activo</span></div>
              ${activeRecs.map(item => `
                <div class="rec-item active-opt">
                  <div class="rec-header">
                    <div class="rec-title"><i data-lucide="check-circle" width="14" style="color:var(--green)"></i> ${esc(item.title)}</div>
                    ${tag('ok', 'Activo')}
                  </div>
                  <p>${esc(item.detail)}</p>
                </div>
              `).join('')}

              <div class="panel-head" style="margin-top:16px; margin-bottom:8px;">
                <h2>Recomendaciones pendientes</h2>
                <span class="tag cost">Por decidir</span>
              </div>
              ${pendingRecs.map(item => `
                <div class="rec-item pending-opt">
                  <div class="rec-header">
                    <div class="rec-title"><i data-lucide="clock" width="14" style="color:var(--amber)"></i> ${esc(item.title)}</div>
                    ${tag(item.level, item.level === 'cost' ? 'Oportunidad' : 'Revisión')}
                  </div>
                  <p>${esc(item.detail)}</p>
                </div>
              `).join('')}
            </div>

            <!-- Panel D: Alcance y Seguridad -->
            <div class="panel">
              <h2>Alcance y seguridad</h2>
              <p class="metric-note">Regiones auditadas: ${esc((data.regions || []).join(', '))}</p>
              <p class="metric-note" style="margin-top:8px">Instancia protegida: <code>i-07469a5fa21d5b167</code></p>
              <p class="metric-note" style="margin-top:8px">Operación segura: El monitor es 100% de solo lectura y no altera recursos.</p>
            </div>
          </aside>
        </section>`;
      document.getElementById('footer').textContent = `Última auditoría: ${new Date(data.timestamp).toLocaleString('es-CO')} · perfil ${data.identity?.arn || 'N/D'} · caché de infraestructura ${data.cache_seconds}s`;
      lucide.createIcons();
    }

    function metric(icon, label, value, note) {
      return `<div class="metric"><div class="metric-label"><i data-lucide="${icon}" width="16"></i>${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;
    }

    function financialRow(label, value) {
      return `<div class="financial-row"><span>${label}</span><strong>${value}</strong></div>`;
    }

    function capacityRow(name, available, detail) {
      const free = pct(available);
      return `<div class="capacity-row"><div class="capacity-name">${name}</div><div class="bar"><span class="${barClass(free)}" style="width:${usedPct(free)}%"></span></div><div class="capacity-number">${free.toFixed(1)}% disponible<br>${detail}</div></div>`;
    }

    function inventory(data) {
      return `
        ${detailsTable('Savings Plans (Planes de Ahorro)', data.savings_plans || [], item => [
          'Global (us-east-2)',
          item.description || 'EC2 Instance Savings Plan',
          `<code>${esc(item.id)}</code>`,
          `Compromiso: $${item.commitment}/h`,
          `Inicio: ${(item.start || '').slice(0, 10)} · Fin: ${(item.end || '').slice(0, 10)}`,
          tag('ok', (item.state || 'activo').toUpperCase())
        ])}
        ${detailsTable('Servidores EC2', data.instances, item => [item.region, item.name || 'Sin nombre', `<code>${esc(item.id)}</code>`, item.type, item.state, tag(item.protection?.level, item.protection?.label)])}
        ${detailsTable('Volúmenes EBS', data.volumes, item => [item.region, item.name || 'Sin nombre', `<code>${esc(item.id)}</code>`, `${item.size_gb} GB ${esc(item.type)}`, item.attached_to ? `<code>${esc(item.attached_to)}</code>` : 'No asociado', tag(item.protection?.level, item.protection?.label)])}
        ${detailsTable('IPs elásticas', data.elastic_ips, item => [item.region, `<code>${esc(item.public_ip)}</code>`, `<code>${esc(item.allocation_id)}</code>`, item.instance_id ? `<code>${esc(item.instance_id)}</code>` : (item.network_interface_id ? `<code>${esc(item.network_interface_id)}</code>` : 'No asociada'), '', tag(item.protection?.level, item.protection?.label)])}
        ${detailsTable('NAT Gateways', data.nat_gateways, item => [item.region, item.id, item.vpc_id, item.state, '', tag(item.protection?.level, item.protection?.label)])}
        ${detailsTable('Snapshots', data.snapshots, item => [item.region, item.id, `${item.size_gb} GB`, item.start_time || '', esc(item.description), tag(item.protection?.level, item.protection?.label)])}`;
    }

    function detailsTable(title, rows, mapper) {
      const body = (rows || []).map(item => `<tr>${mapper(item).map(cell => `<td>${cell ?? ''}</td>`).join('')}</tr>`).join('');
      return `<details><summary>${esc(title)} · ${(rows || []).length}</summary><div class="table-wrap"><table class="inventory"><thead><tr><th>Región</th><th>Nombre / ID</th><th>Identificador</th><th>Detalle</th><th>Asociación / Fechas</th><th>Clasificación</th></tr></thead><tbody>${body || '<tr><td colspan="6">Sin recursos</td></tr>'}</tbody></table></div></details>`;
    }

    document.getElementById('exchange-rate').value = exchangeRate;
    lucide.createIcons();
    fetchLiveTRM();
    loadAudit(false);
  </script>
</body>
</html>
