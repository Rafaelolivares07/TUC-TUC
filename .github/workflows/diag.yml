name: Diagnóstico temporal
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 18.217.231.167
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            sudo journalctl -u tuctuc -n 50 --no-pager
