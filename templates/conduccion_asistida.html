<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conducción Asistida</title>
    <script src="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Wrapper del HUD: flechas + bloque central */
        #hud-wrapper {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Flechas de giro (gris de fondo + amarilla encima) */
        .flecha-giro {
            display: none;
            position: relative;
            transition: font-size 0.3s ease;
            font-size: 36px;
        }

        .flecha-giro.visible {
            display: block;
        }

        .flecha-base {
            color: #4b5563;
        }

        .flecha-activa {
            position: absolute;
            top: 0;
            left: 0;
            color: #facc15;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
            opacity: 0;
        }

        .flecha-giro.parpadeo-lento .flecha-activa {
            animation: parpadeo-flecha 1s infinite;
        }

        .flecha-giro.parpadeo-medio .flecha-activa {
            animation: parpadeo-flecha 0.5s infinite;
        }

        .flecha-giro.parpadeo-rapido .flecha-activa {
            animation: parpadeo-flecha 0.25s infinite;
        }

        @keyframes parpadeo-flecha {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* HUD unificado: cámara + velocímetro apilados */
        #hud-superior {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 18px;
            padding: 10px 20px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.4s ease;
            border: 3px solid transparent;
            min-width: 90px;
        }

        /* Velocímetro */
        #hud-velocidad {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }

        #velocidad-actual {
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
            transition: font-size 0.4s ease;
        }

        #velocidad-unidad {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 2px;
            transition: font-size 0.4s ease;
        }

        /* Cámara (oculta por defecto, aparece encima del velocímetro) */
        #hud-camara {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s ease;
            transform-origin: center bottom;
        }

        #hud-camara.visible {
            display: flex;
        }

        #camara-icono {
            line-height: 1;
            transition: font-size 0.4s ease;
        }

        #camara-distancia {
            font-weight: 700;
            transition: font-size 0.4s ease;
        }

        #camara-limite {
            opacity: 0.85;
            transition: font-size 0.4s ease;
        }

        /* Mensaje de asistencia inteligente */
        #hud-asistencia {
            display: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding: 4px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 2px 0;
        }

        #hud-asistencia.visible {
            display: block;
        }

        #hud-asistencia.accion-bien {
            color: #22c55e;
            font-size: 16px;
        }

        #hud-asistencia.accion-suelta {
            color: #facc15;
            font-size: 20px;
        }

        #hud-asistencia.accion-reduce {
            color: #f97316;
            font-size: 24px;
        }

        #hud-asistencia.accion-frena {
            color: #ef4444;
            font-size: 28px;
            animation: parpadeo-frena 0.5s infinite;
        }

        @keyframes parpadeo-frena {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Bordes de alerta según proximidad */
        #hud-superior.alerta-lejos {
            border-color: #22c55e;
        }

        #hud-superior.alerta-medio {
            border-color: #f59e0b;
        }

        #hud-superior.alerta-cerca {
            border-color: #ef4444;
            animation: pulse-hud 1s infinite;
        }

        #hud-superior.alerta-exceso {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.25);
            animation: pulse-hud 0.6s infinite;
        }

        @keyframes pulse-hud {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* Botón salir - pegado a la esquina */
        #btn-salir {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Columna derecha de botones */
        #columna-derecha {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #columna-derecha button {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        #btn-vista {
            font-size: 13px;
            font-weight: 700;
        }

        #btn-sonido.muted {
            opacity: 0.5;
        }

        /* Botón volver a conducción */
        #btn-volver-conduccion {
            display: none;
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
        }

        /* Info de viaje activo - franja horizontal abajo */
        #info-viaje {
            position: absolute;
            bottom: 32px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 14px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
            display: none;
            border-top: 3px solid #22c55e;
            font-size: 12px;
        }

        #info-viaje-contenido {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #info-viaje-datos {
            flex: 1;
            min-width: 0;
        }

        #info-viaje .viaje-pasajero {
            font-weight: 600;
            font-size: 13px;
        }

        #info-viaje .viaje-detalle {
            opacity: 0.8;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #info-viaje .viaje-tarifa {
            font-weight: 700;
            font-size: 16px;
            color: #22c55e;
            white-space: nowrap;
        }

        #info-viaje .btn-accion-viaje {
            display: block;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            color: #000;
        }

        #info-viaje .btn-llegue { background: #eab308; }
        #info-viaje .btn-iniciar { background: #22c55e; }
        #info-viaje .btn-finalizar { background: #ef4444; color: #fff; }

        /* Colores de velocidad */
        .velocidad-ok { color: #22c55e; }
        .velocidad-cerca { color: #f59e0b; }
        .velocidad-exceso { color: #ef4444; }

        /* Franja inferior unificada: brújula + GPS + leyenda */
        #barra-inferior {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            padding: 7px 15px;
            font-size: 10px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #barra-inferior .brujula-inline {
            font-size: 16px;
            transition: transform 0.3s;
            display: inline-block;
        }

        #barra-inferior .gps-inline {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #gps-indicador {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #gps-indicador.error {
            background: #ef4444;
            animation: none;
        }

        .separador-barra {
            width: 1px;
            height: 14px;
            background: rgba(255, 255, 255, 0.2);
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leyenda-linea {
            width: 18px;
            height: 3px;
            border-radius: 2px;
        }

        /* Toast de pantalla */
        #toast-pantalla {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(245, 158, 11, 0.95);
            color: #000;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .alerta-advertencia {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: white !important;
        }

        /* Ocultar controles de MapLibre que no necesitamos */
        .maplibregl-ctrl-bottom-left,
        .maplibregl-ctrl-bottom-right {
            display: none;
        }

    </style>
</head>
<body>
    <!-- Mapa -->
    <div id="mapa"></div>

    <!-- Botón salir (esquina sup izq) -->
    <button id="btn-salir" onclick="salir()">&#x2715;</button>

    <!-- Columna derecha: sonido, vista, estilo, explorar -->
    <div id="columna-derecha">
        <button id="btn-sonido" onclick="toggleSonido()">&#x1F50A;</button>
        <button id="btn-vista" onclick="toggleVista()">3D</button>
        <button id="btn-estilo" onclick="toggleEstilo()">&#x1F319;</button>
        <button id="btn-explorar" onclick="toggleModoLibre()">&#x1F5FA;</button>
    </div>

    <!-- Botón volver a conducción (solo visible en modo libre) -->
    <button id="btn-volver-conduccion" onclick="volverAConduccion()">&#x1F3AF; Volver a conducción</button>

    <!-- HUD unificado: cámara + asistencia + velocímetro + flechas de giro -->
    <div id="hud-wrapper">
        <div id="flecha-izquierda" class="flecha-giro">
            <span class="flecha-base">&#x25C0;</span>
            <span class="flecha-activa">&#x25C0;</span>
        </div>
        <div id="hud-superior">
            <div id="hud-camara">
                <div id="camara-icono">&#x1F4F7;</div>
                <div id="camara-distancia"></div>
                <div id="camara-limite"></div>
            </div>
            <div id="hud-asistencia"></div>
            <div id="hud-velocidad">
                <div id="velocidad-actual" class="velocidad-ok">0</div>
                <div id="velocidad-unidad">km/h</div>
            </div>
        </div>
        <div id="flecha-derecha" class="flecha-giro">
            <span class="flecha-base">&#x25B6;</span>
            <span class="flecha-activa">&#x25B6;</span>
        </div>
    </div>

    <!-- Info viaje activo - franja horizontal -->
    <div id="info-viaje">
        <div id="info-viaje-contenido">
            <div id="info-viaje-datos">
                <div class="viaje-pasajero" id="viaje-pasajero"></div>
                <div class="viaje-detalle" id="viaje-origen"></div>
                <div class="viaje-detalle" id="viaje-destino"></div>
            </div>
            <div class="viaje-tarifa" id="viaje-tarifa"></div>
        </div>
        <div id="viaje-acciones"></div>
    </div>

    <!-- Franja inferior: brújula + GPS + leyenda -->
    <div id="barra-inferior">
        <span class="brujula-inline" id="brujula">&#x1F9ED;</span>
        <div class="gps-inline">
            <div id="gps-indicador"></div>
            <span id="gps-texto">GPS...</span>
        </div>
        <div class="separador-barra"></div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: rgba(100, 150, 255, 0.6);"></div>
            <span>Conocidas</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: transparent; border-top: 3px dashed #f97316;"></div>
            <span>Recogida</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-linea" style="background: #22c55e;"></div>
            <span>Destino</span>
        </div>
        <div class="separador-barra"></div>
        <span id="fuente-ruta" style="opacity: 0.5; font-style: italic;"></span>
    </div>

    <!-- Toast pantalla -->
    <div id="toast-pantalla">&#x26A0;&#xFE0F; Mantén la pantalla encendida en Ajustes</div>

    <script>
        // Variables globales
        let mapa = null;
        let marcadorConductor = null;
        let watchId = null;
        let ubicacionActual = null;
        let modoLibre = false;
        let estiloOscuro = true;
        let vista3D = true;
        let ubicacionAnterior = null;
        let velocidadActual = 0;
        let headingActual = 0;
        let camarasCercanas = [];
        let camarasEnMapa = [];
        let camarasEnRuta = [];
        let viajeActivo = null;
        let geometriaRutaActiva = null;
        let marcadoresViaje = [];
        let intervalRutaActiva = null;
        let puntosRutaNueva = [];
        let mapaListo = false;

        // GeoJSON vacíos para inicializar fuentes
        const GEOJSON_VACIO = { type: 'FeatureCollection', features: [] };
        const LINEA_VACIA = { type: 'Feature', geometry: { type: 'LineString', coordinates: [] }, properties: {} };

        // Nombres de fuentes y capas
        const FUENTES = {
            SEGMENTOS: 'segmentos-conocidos',
            RUTA_RECOGIDA: 'ruta-recogida',
            RUTA_DESTINO: 'ruta-destino',
            RUTA_NUEVA: 'ruta-nueva'
        };

        // Configuración
        const CONFIG = {
            DISTANCIA_ALERTA_CAMARA: 500,
            DISTANCIA_PELIGRO_CAMARA: 200,
            INTERVALO_BUSCAR_CAMARAS: 5000,
            INTERVALO_CARGAR_SEGMENTOS: 10000,
            ZOOM_DEFAULT: 18,
            DISTANCIA_MIN_NUEVO_PUNTO: 10
        };

        function crearEstilo(flavor) {
            return {
                version: 8,
                glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
                sprite: 'https://protomaps.github.io/basemaps-assets/sprites/v4/' + flavor,
                sources: {
                    protomaps: {
                        type: 'vector',
                        url: 'pmtiles:///static/maps/cali.pmtiles',
                        attribution: '&copy; OpenStreetMap'
                    }
                },
                layers: basemaps.layers("protomaps", basemaps.namedFlavor(flavor), { lang: "es" })
            };
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', async function() {
            await inicializarMapa();
            iniciarWatchPosition();
            await verificarViajeActivo();

            // Intervalos
            setInterval(buscarCamarasCercanas, CONFIG.INTERVALO_BUSCAR_CAMARAS);
            setInterval(cargarSegmentosConocidos, CONFIG.INTERVALO_CARGAR_SEGMENTOS);

            // Wake Lock
            solicitarWakeLock();

            // Inicializar audio al primer toque
            document.addEventListener('touchstart', () => inicializarAudio(), { once: true });
            document.addEventListener('click', () => inicializarAudio(), { once: true });
        });

        async function inicializarMapa() {
            // Registrar protocolo PMTiles
            const protocol = new pmtiles.Protocol();
            maplibregl.addProtocol('pmtiles', protocol.tile);

            mapa = new maplibregl.Map({
                container: 'mapa',
                style: crearEstilo('dark'),
                center: [-76.5320, 3.4516],
                zoom: CONFIG.ZOOM_DEFAULT,
                pitch: 50,
                bearing: 0,
                maxPitch: 85,
                attributionControl: false
            });

            mapa.on('load', () => {
                // Fuentes GeoJSON para rutas y segmentos
                mapa.addSource(FUENTES.SEGMENTOS, { type: 'geojson', data: GEOJSON_VACIO });
                mapa.addSource(FUENTES.RUTA_RECOGIDA, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_DESTINO, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_NUEVA, { type: 'geojson', data: LINEA_VACIA });

                // Capa: segmentos conocidos (azul)
                mapa.addLayer({
                    id: 'layer-segmentos',
                    type: 'line',
                    source: FUENTES.SEGMENTOS,
                    paint: {
                        'line-color': 'rgba(100, 150, 255, 0.6)',
                        'line-width': 6,
                        'line-opacity': 0.7
                    }
                });

                // Capa: ruta a recogida (naranja punteado)
                mapa.addLayer({
                    id: 'layer-ruta-recogida',
                    type: 'line',
                    source: FUENTES.RUTA_RECOGIDA,
                    paint: {
                        'line-color': '#f97316',
                        'line-width': 6,
                        'line-opacity': 0.85,
                        'line-dasharray': [2, 1.5]
                    }
                });

                // Capa: ruta al destino (verde sólido)
                mapa.addLayer({
                    id: 'layer-ruta-destino',
                    type: 'line',
                    source: FUENTES.RUTA_DESTINO,
                    paint: {
                        'line-color': '#22c55e',
                        'line-width': 8,
                        'line-opacity': 0.9
                    }
                });

                // Capa: ruta nueva (amarillo punteado)
                mapa.addLayer({
                    id: 'layer-ruta-nueva',
                    type: 'line',
                    source: FUENTES.RUTA_NUEVA,
                    paint: {
                        'line-color': '#f59e0b',
                        'line-width': 5,
                        'line-opacity': 0.8,
                        'line-dasharray': [2, 2]
                    }
                });

                // Marcador del conductor
                crearMarcadorConductor();

                mapaListo = true;

                // Cargar segmentos si ya tenemos ubicación
                if (ubicacionActual) {
                    cargarSegmentosConocidos();
                }
            });
        }

        function crearMarcadorConductor() {
            const el = document.createElement('div');
            el.innerHTML = '<div style="' +
                'width: 0; height: 0;' +
                'border-left: 18px solid transparent;' +
                'border-right: 18px solid transparent;' +
                'border-bottom: 28px solid #3b82f6;' +
                'filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));' +
                '"></div>';

            marcadorConductor = new maplibregl.Marker({
                element: el,
                rotationAlignment: 'viewport',
                pitchAlignment: 'viewport'
            })
            .setLngLat([-76.5320, 3.4516])
            .addTo(mapa);
        }

        function iniciarWatchPosition() {
            if (!navigator.geolocation) {
                mostrarErrorGPS('GPS no disponible');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                posicionActualizada,
                errorGPS,
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        function posicionActualizada(position) {
            const { latitude, longitude, speed, heading, accuracy } = position.coords;

            const esPrimeraUbicacion = !ubicacionActual;
            ubicacionAnterior = ubicacionActual;
            ubicacionActual = { lat: latitude, lon: longitude };
            velocidadActual = speed ? Math.round(speed * 3.6) : 0;
            headingActual = heading || 0;

            // Actualizar UI
            actualizarMarcador(latitude, longitude);
            rotarMapa(heading);
            actualizarVelocimetro(velocidadActual);
            actualizarEstadoGPS(accuracy);
            actualizarBrujula(heading);

            // Primera ubicación
            if (esPrimeraUbicacion) {
                buscarCamarasCercanas();
                cargarSegmentosConocidos();
            }

            // Verificar alertas y asistencia
            verificarAlertaCamaras();
            analizarCamino();

            // Registrar nuevo segmento
            registrarNuevoSegmento();

            // Enviar ubicación al servidor
            enviarUbicacionServidor(latitude, longitude, velocidadActual, headingActual);
        }

        function actualizarMarcador(lat, lon) {
            if (!marcadorConductor) return;
            marcadorConductor.setLngLat([lon, lat]);
            // En modo libre no seguir al conductor
            if (!modoLibre) {
                mapa.easeTo({ center: [lon, lat], duration: 300 });
            }
        }

        function rotarMapa(heading) {
            if (heading === null || heading === undefined) return;
            // En modo libre no rotar el mapa
            if (!modoLibre) {
                mapa.easeTo({ bearing: heading, duration: 300 });
            }
            // Brújula siempre se actualiza
            document.getElementById('brujula').style.transform = 'rotate(' + heading + 'deg)';
        }

        function actualizarBrujula(heading) {
            // Ya se actualiza en rotarMapa
        }

        function actualizarVelocimetro(velocidad) {
            const elem = document.getElementById('velocidad-actual');
            elem.textContent = velocidad;

            const limite = obtenerLimiteCercano();
            if (limite) {

                    elem.className = 'velocidad-cerca';

            } else {
                elem.className = 'velocidad-ok';
            }

        function obtenerLimiteCercano() {
            const todas = [...camarasEnRuta, ...camarasCercanas];
            if (todas.length === 0) return null;

            todas.forEach(cam => {
                if (ubicacionActual) {
                    const dist = calcularDistancia(ubicacionActual.lat, ubicacionActual.lon, cam.lat, cam.lon);
                    if (dist < distMin) {
                        distMin = dist;
                        masCercana = cam;
                    }
                }
            });

            return masCercana ? (masCercana.velocidad_maxima || 60) : null;

        async function buscarCamarasCercanas() {
            if (!ubicacionActual) return;

            try {
                const res = await fetch('/api/camaras-cercanas?lat=' + ubicacionActual.lat + '&lon=' + ubicacionActual.lon + '&radio=1000');
                const data = await res.json();

                if (data.ok) {
                    let todasCamaras = data.camaras || [];

                    if (!geometriaRutaActiva && headingActual !== null) {
                        camarasCercanas = todasCamaras.filter(cam => {
                            const bearingACamara = calcularBearing(
                                ubicacionActual.lat, ubicacionActual.lon,
                                cam.lat, cam.lon
                            );
                            let diff = Math.abs(bearingACamara - headingActual);
                            if (diff > 180) diff = 360 - diff;
                            return diff <= 60;
                        });
                    } else {
                        camarasCercanas = todasCamaras;
                    }

                    actualizarCamarasEnMapa();
                }
            } catch (e) {
                console.error('Error buscando cámaras:', e);
            }
        }

        function calcularBearing(lat1, lon1, lat2, lon2) {
            const toRad = x => x * Math.PI / 180;
            const toDeg = x => x * 180 / Math.PI;

            const dLon = toRad(lon2 - lon1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            let bearing = toDeg(Math.atan2(y, x));
            return (bearing + 360) % 360;
        }

            distanciaEl.style.fontSize = distanciaSize + 'px';

        let audioCtx = null;
        let sonidoActivo = true;
        let ultimaAccion = null;
        let ultimoSonidoTimestamp = 0;

        const ASISTENCIA = {
            DESACELERACION_COSTEO: 1.5,
            DESACELERACION_FRENO: 5,
            COOLDOWN_SONIDO: 3000,
        };

        function inicializarAudio() {
            if (!audioCtx) {

        function analizarCamino() {
            if (!ubicacionActual) return;

            actualizarFlechasGiro();

            const eventos = obtenerEventosAdelante();

            if (eventos.length === 0) {
                ocultarAsistencia();
                return;
            }

            const eventoUrgente = eventos[0];
            const accion = calcularAccion(eventoUrgente.velocidadObjetivo, eventoUrgente.distancia, velocidadActual);

            mostrarAsistencia(accion);
        }

        function obtenerEventosAdelante() {
            const eventos = [];

            const todasCamaras = [...camarasEnRuta, ...camarasCercanas];
            const idsVistos = new Set();

            todasCamaras.forEach(cam => {
                if (idsVistos.has(cam.id)) return;
                idsVistos.add(cam.id);

                if (!ubicacionActual) return;

                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    cam.lat, cam.lon
                );

                if (dist < CONFIG.DISTANCIA_ALERTA_CAMARA) {
                    eventos.push({
                        tipo: 'camara',
                        distancia: dist,
                        velocidadObjetivo: cam.velocidad_maxima || 60,
                        nombre: cam.nombre || 'Cámara'
                    });
                }
            });

            girosDetectados.forEach(giro => {
                if (!ubicacionActual) return;

                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    giro.lat, giro.lon
                );

                if (dist < 160) {
                    eventos.push({
                        tipo: 'giro',
                        distancia: dist,
                        velocidadObjetivo: giro.velocidadSugerida,
                        direccion: giro.direccion,
                        angulo: giro.anguloAbs
                    });
                }
            });

            eventos.sort((a, b) => a.distancia - b.distancia);

            return eventos;
        }

        function calcularAccion(velocidadObjetivo, distancia, velocidadActualKmh) {
            if (velocidadActualKmh <= velocidadObjetivo) {
                return { nivel: 'bien', texto: 'Vas bien' };
            }

            const exceso = velocidadActualKmh - velocidadObjetivo;

            const velocidadMs = velocidadActualKmh / 3.6;
            const tiempoDisponible = velocidadMs > 0 ? distancia / velocidadMs : 999;

            const tiempoCosteo = exceso / ASISTENCIA.DESACELERACION_COSTEO;

            const tiempoFrenado = exceso / ASISTENCIA.DESACELERACION_FRENO;

            if (tiempoCosteo <= tiempoDisponible * 0.85) {
                return { nivel: 'suelta', texto: 'Suelta' };
            } else if (tiempoCosteo <= tiempoDisponible) {
                return { nivel: 'reduce', texto: 'Reduce' };
            } else if (tiempoFrenado <= tiempoDisponible) {
                return { nivel: 'reduce', texto: 'Reduce' };
            } else {
                return { nivel: 'frena', texto: 'Frena' };
            }
        }

        function mostrarAsistencia(accion) {
            const el = document.getElementById('hud-asistencia');

            el.className = '';
            el.id = 'hud-asistencia';
            el.classList.add('visible', 'accion-' + accion.nivel);
            el.textContent = accion.texto;

            const ahora = Date.now();
            if (accion.nivel !== ultimaAccion && accion.nivel !== 'bien' &&
                ahora - ultimoSonidoTimestamp > ASISTENCIA.COOLDOWN_SONIDO) {
                reproducirSonido(accion.nivel);
                ultimoSonidoTimestamp = ahora;
            }
            ultimaAccion = accion.nivel;
        }

        function ocultarAsistencia() {
            const el = document.getElementById('hud-asistencia');
            el.classList.remove('visible');
            ultimaAccion = null;
        }

        function toggleSonido() {
            sonidoActivo = !sonidoActivo;
            const btn = document.getElementById('btn-sonido');
            btn.textContent = sonidoActivo ? '\uD83D\uDD0A' : '\uD83D\uDD07';
            btn.classList.toggle('muted', !sonidoActivo);
            inicializarAudio();
        }

        function reproducirSonido(nivel) {
            if (!sonidoActivo) return;
            inicializarAudio();
            if (!audioCtx) return;

            switch (nivel) {
                case 'suelta':
                    tocarTono(880, 0.15, 'sine', 0.3);
                    break;
                case 'reduce':
                    tocarTono(660, 0.15, 'triangle', 0.4);
                    setTimeout(() => tocarTono(880, 0.15, 'triangle', 0.4), 200);
                    break;
                case 'frena':
                    tocarTono(1000, 0.12, 'square', 0.3);
                    setTimeout(() => tocarTono(1200, 0.12, 'square', 0.3), 150);
                    setTimeout(() => tocarTono(1000, 0.12, 'square', 0.3), 300);
                    break;
            }
        }

        function tocarTono(frecuencia, duracion, tipo, volumen) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.value = volumen;

            gain.gain.setValueAtTime(volumen, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        // ==========================================
        // DETECCIÓN DE CURVAS EN RUTA
        // ==========================================

        let girosDetectados = [];

        function detectarGirosEnRuta() {
            girosDetectados = [];
            if (!geometriaRutaActiva || geometriaRutaActiva.length < 3) return;

            for (let i = 1; i < geometriaRutaActiva.length - 1; i++) {
                const pAnterior = geometriaRutaActiva[i - 1];
                const pActual = geometriaRutaActiva[i];
                const pSiguiente = geometriaRutaActiva[i + 1];

                const bearingEntrada = calcularBearing(pAnterior[0], pAnterior[1], pActual[0], pActual[1]);
                const bearingSalida = calcularBearing(pActual[0], pActual[1], pSiguiente[0], pSiguiente[1]);

                let angulo = bearingSalida - bearingEntrada;
                if (angulo > 180) angulo -= 360;
                if (angulo < -180) angulo += 360;

                const anguloAbs = Math.abs(angulo);

                if (anguloAbs > 25) {
                    const direccion = angulo > 0 ? 'derecha' : 'izquierda';

                    let velocidadSugerida;
                    if (anguloAbs > 90) {
                        velocidadSugerida = 15;
                    } else if (anguloAbs > 60) {
                        velocidadSugerida = 25;
                    } else if (anguloAbs > 40) {
                        velocidadSugerida = 35;
                    } else {
                        velocidadSugerida = 40;
                    }

                    girosDetectados.push({
                        lat: pActual[0],
                        lon: pActual[1],
                        angulo: angulo,
                        anguloAbs: anguloAbs,
                        direccion: direccion,
                        velocidadSugerida: velocidadSugerida
                    });
                }
            }

            console.log('\uD83D\uDD04 ' + girosDetectados.length + ' giros detectados en la ruta');
        }

        function actualizarFlechasGiro() {
            const flechaIzq = document.getElementById('flecha-izquierda');
            const flechaDer = document.getElementById('flecha-derecha');

            if (!ubicacionActual || girosDetectados.length === 0) {
                flechaIzq.className = 'flecha-giro';
                flechaDer.className = 'flecha-giro';
                return;
            }

            let giroCercano = null;
            let distGiro = Infinity;

            girosDetectados.forEach(giro => {
                const dist = calcularDistancia(
                    ubicacionActual.lat, ubicacionActual.lon,
                    giro.lat, giro.lon
                );
                if (dist < distGiro && dist < 160) {
                    distGiro = dist;
                    giroCercano = giro;
                }
            });

            if (!giroCercano) {
                flechaIzq.className = 'flecha-giro';
                flechaDer.className = 'flecha-giro';
                return;
            }

            const flechaActiva = giroCercano.direccion === 'izquierda' ? flechaIzq : flechaDer;
            const flechaInactiva = giroCercano.direccion === 'izquierda' ? flechaDer : flechaIzq;

            flechaInactiva.className = 'flecha-giro';

            const DIST_MAX_GIRO = 160;
            const factor = Math.max(0, Math.min(1, 1 - (distGiro / DIST_MAX_GIRO)));
            const tamano = 36 + (factor * 24);
            flechaActiva.style.fontSize = tamano + 'px';

            let claseParpadeo = '';
            if (distGiro < 40) {
                claseParpadeo = 'parpadeo-rapido';
            } else if (distGiro < 80) {
                claseParpadeo = 'parpadeo-medio';
            } else if (distGiro < 120) {
                claseParpadeo = 'parpadeo-lento';
            }

            flechaActiva.className = 'flecha-giro visible ' + claseParpadeo;
        }

        // ==========================================
        // UTILIDADES
        // ==========================================

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        async function enviarUbicacionServidor(lat, lon, velocidad, heading) {
            try {
                await fetch('/api/conductor/actualizar-ubicacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lon, velocidad, heading })
                });
            } catch (e) {
                // Silencioso
            }
        }

        // ==========================================
        // CONTROLES DEL CONDUCTOR
        // ==========================================

        function toggleVista() {
            vista3D = !vista3D;
            mapa.easeTo({ pitch: vista3D ? 50 : 0, duration: 500 });
            document.getElementById('btn-vista').textContent = vista3D ? '3D' : '2D';
        }

        function toggleEstilo() {
            estiloOscuro = !estiloOscuro;
            const flavor = estiloOscuro ? 'dark' : 'light';

            // Guardar estado actual
            const center = mapa.getCenter();
            const zoom = mapa.getZoom();
            const pitch = mapa.getPitch();
            const bearing = mapa.getBearing();

            mapa.setStyle(crearEstilo(flavor));

            mapa.once('style.load', () => {
                // Re-agregar fuentes y capas
                mapa.addSource(FUENTES.SEGMENTOS, { type: 'geojson', data: GEOJSON_VACIO });
                mapa.addSource(FUENTES.RUTA_RECOGIDA, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_DESTINO, { type: 'geojson', data: LINEA_VACIA });
                mapa.addSource(FUENTES.RUTA_NUEVA, { type: 'geojson', data: LINEA_VACIA });

                mapa.addLayer({
                    id: 'layer-segmentos', type: 'line', source: FUENTES.SEGMENTOS,
                    paint: { 'line-color': 'rgba(100, 150, 255, 0.6)', 'line-width': 6, 'line-opacity': 0.7 }
                });
                mapa.addLayer({
                    id: 'layer-ruta-recogida', type: 'line', source: FUENTES.RUTA_RECOGIDA,
                    paint: { 'line-color': '#f97316', 'line-width': 6, 'line-opacity': 0.85, 'line-dasharray': [2, 1.5] }
                });
                mapa.addLayer({
                    id: 'layer-ruta-destino', type: 'line', source: FUENTES.RUTA_DESTINO,
                    paint: { 'line-color': '#22c55e', 'line-width': 8, 'line-opacity': 0.9 }
                });
                mapa.addLayer({
                    id: 'layer-ruta-nueva', type: 'line', source: FUENTES.RUTA_NUEVA,
                    paint: { 'line-color': '#f59e0b', 'line-width': 5, 'line-opacity': 0.8, 'line-dasharray': [2, 2] }
                });

                mapa.jumpTo({ center, zoom, pitch, bearing });

                // Recargar segmentos y ruta
                if (ubicacionActual) cargarSegmentosConocidos();
                if (viajeActivo) cargarRutaViajeActivo();
            });

            document.getElementById('btn-estilo').textContent = estiloOscuro ? '\uD83C\uDF19' : '\u2600\uFE0F';
        }

        function toggleModoLibre() {
            if (modoLibre) {
                volverAConduccion();
            } else {
                entrarModoLibre();
            }
        }

        function entrarModoLibre() {
            modoLibre = true;
            document.getElementById('btn-volver-conduccion').style.display = 'block';
            document.getElementById('btn-explorar').style.background = '#3b82f6';

            // Si hay viaje activo, hacer zoom para ver toda la ruta
            if (viajeActivo && geometriaRutaActiva && geometriaRutaActiva.length >= 2) {
                const bounds = new maplibregl.LngLatBounds();
                geometriaRutaActiva.forEach(p => bounds.extend([p[1], p[0]]));
                // Incluir posición del conductor
                if (ubicacionActual) {
                    bounds.extend([ubicacionActual.lon, ubicacionActual.lat]);
                }
                mapa.fitBounds(bounds, { padding: 60, pitch: 0, bearing: 0, duration: 800 });
            } else {
                // Sin viaje: solo liberar el mapa, quitar pitch y bearing
                mapa.easeTo({ pitch: 0, bearing: 0, duration: 500 });
            }
        }

        function volverAConduccion() {
            modoLibre = false;
            document.getElementById('btn-volver-conduccion').style.display = 'none';
            document.getElementById('btn-explorar').style.background = 'rgba(0, 0, 0, 0.5)';

            // Volver a centrar en conductor con pitch y bearing
            if (ubicacionActual) {
                mapa.easeTo({
                    center: [ubicacionActual.lon, ubicacionActual.lat],
                    zoom: CONFIG.ZOOM_DEFAULT,
                    pitch: vista3D ? 50 : 0,
                    bearing: headingActual || 0,
                    duration: 800
                });
            }
        }

        function salir() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
            window.location.href = '/conductor';
        }

        // Wake Lock con fallback
        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                } else {
                    mostrarToastPantalla();
                }
            } catch (e) {
                mostrarToastPantalla();
            }
        }

        function mostrarToastPantalla() {
            const toast = document.getElementById('toast-pantalla');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }
    </script>
