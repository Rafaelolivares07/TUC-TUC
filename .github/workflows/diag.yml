name: Diagnóstico temporal
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 18.217.231.167
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            sudo systemctl show tuctuc --property=Environment 2>/dev/null | grep -o 'DATABASE_URL=[^ ]*' | sed 's/postgresql:\/\/[^:]*:[^@]*@/postgresql:\/\/USER:PASS@/'
            cat /home/ubuntu/tuctucv2/.env 2>/dev/null | grep DATABASE | sed 's/:[^:@]*@/:PASS@/'
